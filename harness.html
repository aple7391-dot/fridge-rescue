<!doctype html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>390×844 확인용 하네스</title>
<style>
  body{margin:0;background:#17181C;display:flex;gap:28px;padding:20px;flex-wrap:wrap}
  .frame{position:relative}
  .frame p{color:#E5E8EB;font:13px/1 sans-serif;margin:0 0 8px 2px}
  .frame iframe{border:0;background:#fff;border-radius:26px;box-shadow:0 0 0 1px #3A3D44}
</style>
</head>
<body>
  <div class="frame">
    <p>390×844 (iPhone 12/13/14)</p>
    <iframe id="f1" width="390" height="844" src="index.html" title="390x844"></iframe>
  </div>
  <div class="frame">
    <p>375×667 (작은 화면)</p>
    <iframe id="f2" width="375" height="667" src="index.html?v=small" title="375x667"></iframe>
  </div>
</body>
</html>
