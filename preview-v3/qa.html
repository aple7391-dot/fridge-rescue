<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>냉장고 구조대 · 390px 미리보기</title>
<style>
  html,body{margin:0;padding:0;background:#DDE1E6}
  iframe{width:390px;border:0;display:block;background:#fff;height:844px}
</style>
</head>
<body>
<iframe src="./index.html" title="냉장고 구조대 390px 미리보기"></iframe>
<script>
  /* 캡처용 harness — ?h=2400 처럼 앱을 한 번에 그릴 높이를 정한다 */
  (function () {
    var h = parseInt((new URLSearchParams(location.search)).get('h') || '0', 10);
    if (h > 0) document.querySelector('iframe').style.height = h + 'px';
  })();
</script>
</body>
</html>
