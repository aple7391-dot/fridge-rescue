<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>냉장고 구조대 · 390px 미리보기</title>
<style>
  html,body{margin:0;padding:0;background:#DDE1E6}
  iframe{width:390px;border:0;display:block;background:#fff;height:844px}
</style>
</head>
<body>
<iframe src="./index.html" title="냉장고 구조대 390px 미리보기"></iframe>
<script>
  /* 캡처용 harness — ?h=2400 이면 앱을 그 높이로 한 번에 그리고, 항상 최신 파일을 읽게 캐시를 비튼다 */
  (function () {
    var q = new URLSearchParams(location.search);
    var h = parseInt(q.get('h') || '0', 10);
    var f = document.querySelector('iframe');
    if (h > 0) f.style.height = h + 'px';
    f.src = './index.html?v=' + Date.now();
  })();
</script>
</body>
</html>
