  listEl.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var id = btn.getAttribute('data-id');
    var act = btn.getAttribute('data-act');

    /* 개수 스테퍼: 2개 → 1개 → 소량 → 다 씀, 숫자를 누르면 반 개(소량) 표시를 켜고 끈다 */
    if (act === 'dec' || act === 'inc' || act === 'part') {
      var cit = byId(id);
      if (!cit || !isCountable(cit)) return;
      var cem = emojiOf(cit), cnm = cit.name, cun = unitOf(cit);
      var chalf = hasPartial(cit);

      if (act === 'part') {
        if (cit.done) return;
        if (chalf) {
          if (cit.count <= 0.5) {
            cit.count = 1;
            toast(cem + ' ' + cnm + ' 1' + cun + roParticle(cun) + ' 되돌렸어요');
          } else {
            cit.count = Math.round((cit.count - 0.5) * 2) / 2;
            toast(cem + ' ' + cnm + ' ' + amountText(cit.count, cun) + ' 남음 · 소량 표시를 뺐어요');
          }
        } else {
          cit.count = Math.round((cit.count + 0.5) * 2) / 2;
          toast(cem + ' ' + cnm + ' ' + amountText(cit.count, cun) + ' 남음 · 반 ' + cun + '까지 표시했어요');
        }
      } else if (act === 'dec') {
        if (cit.done || cit.count <= 0) return;
        if (chalf) {
          cit.count = Math.round((cit.count - 0.5) * 2) / 2;
          if (cit.count <= 0) {
            cit.count = 0;
            cit.done = true;
            toast(cem + ' ' + cnm + ' 다 씀 · 처리 완료');
          } else {
            toast(cem + ' ' + cnm + ' ' + amountText(cit.count, cun) + ' 남음');
          }
        } else if (cit.count > 1) {
          cit.count -= 1;
          toast(cem + ' ' + cnm + ' 1' + cun + ' 차감 · ' + amountText(cit.count, cun) + ' 남음');
        } else {
          cit.count = 0.5;
          toast(cem + ' ' + cnm + ' 소량 남음 · 한 번 더 − 하면 다 씀');
        }
      } else {
        if (chalf) {
          cit.count = Math.round((cit.count + 0.5) * 2) / 2;
          toast(cem + ' ' + cnm + ' ' + amountText(cit.count, cun) + ' 남았어요');
        } else if (cit.done || cit.count <= 0) {
          cit.count = 1;
          cit.done = false;
          toast(cem + ' ' + cnm + ' 다시 ' + amountText(1, cun) + ' 남았어요');
        } else {
          cit.count += 1;
          toast(cem + ' ' + cnm + ' +1 · ' + amountText(cit.count, cun) + ' 남음');
        }
      }
      save();
      renderDash();
      renderLeftover();
      renderList();
      renderMeals();
      return;
    }

    if (act === 'finish') {
      /* 소량 → 다 먹음(소진) */
      var fit = byId(id);
      if (!fit) return;
      var fem = emojiOf(fit), fnm = fit.name;
      fit.done = true;
      fit.used = 0;
      if (isCountable(fit)) { fit.count = 0; fit.partial = false; }
      var fres = swapOutIngredient(fit.id);
      save();
      renderAll();
      if (fres.swapped) toast(fem + ' ' + fnm + ' 소진 완료! 안 먹은 끼니 ' + fres.swapped + '개를 다른 메뉴로 바꿨어요');
      else toast(fem + ' ' + fnm + ' 소진 완료로 옮겼어요');
      return;
    }

    if (act === 'toggle') {
      var it = byId(id);
      if (!it) return;
      it.done = !it.done;
      save();
      renderDash();
      renderList();
      renderMeals();
      if (it.done) toast(emojiOf(it) + ' ' + it.name + ' 처리 완료');
      return;
    }
    if (act === 'edit') openEditor('edit', id);
  });

  /* 먹음 시트 개수 재료 줄 — 고른 양(0.5 단위)을 화면에 반영 */
  function paintEatRow(id) {
    var it = byId(id);
    if (!it || !isCountable(it)) return;
    var qty = eatQty[id] == null ? 0 : eatQty[id];
    var row = eatList.querySelector('[data-eatrow="' + id + '"]');
    if (!row) return;
    var half = Math.abs(qty - Math.round(qty)) > 0.001;
    var isPart = qty > 0 && qty < 1;
    var num = row.querySelector('[data-eatnum="' + id + '"]');
    if (num) {
      num.innerHTML = qty <= 0
        ? '0'
        : (isPart ? '소량' : Math.floor(qty + 0.001) + '<small>' + esc(unitOf(it)) + '</small>' + (half ? ' 반' : ''));
      num.classList.toggle('is-partial', qty > 0 && (isPart || half));
    }
    var step = row.querySelector('.step');
    if (step) step.classList.toggle('is-partial', qty > 0 && (isPart || half));
    var some = row.querySelector('[data-eat="some"]');
    if (some) some.classList.toggle('is-on', Math.abs(qty - 0.5) < 0.001);
    var all = row.querySelector('[data-eat="all"]');
    if (all) all.classList.toggle('is-on', Math.abs(qty - it.count) < 0.001);
    row.classList.toggle('is-done', qty <= 0);
    var sub = row.querySelector('[data-eatstate="' + id + '"]');
    if (sub) {
      var left = Math.round((it.count - qty) * 2) / 2;
      sub.textContent = countText(it) + ' 남음 → ' + (left > 0 ? amountText(left, unitOf(it)) + ' 남아요' : '다 씀');
    }
  }

  /* 먹음 시트 안의 조금 먹음/다 먹음/안 씀 선택과 개수 스테퍼 */
  eatList.addEventListener('click', function (e) {
    var m = e.target.closest('[data-emode]');
    if (m) {
      setEatMode(m.getAttribute('data-id'), m.getAttribute('data-emode'));
      return;
    }

    var b = e.target.closest('[data-eat]');
    if (!b) return;
    var id = b.getAttribute('data-id');
    var it = byId(id);
    if (!it || !isCountable(it)) return;
    var act = b.getAttribute('data-eat');

    /* 다 먹음 → 남은 양 전부 소진 */
    if (act === 'all') {
      eatQty[id] = it.count;
      paintEatRow(id);
      toast(emojiOf(it) + ' ' + it.name + ' ' + amountText(it.count, unitOf(it)) + ' 전부 소진으로 잡았어요');
      return;
    }

    var cur = eatQty[id] == null ? 1 : eatQty[id];
    var next;
    if (act === 'some') {
      next = 0.5;
    } else if (act === 'inc') {
      next = cur < 1 ? 1 : cur + 1;
    } else {
      if (cur <= 0.5) next = 0;
      else if (cur <= 1) next = 0.5;
      else if (Math.abs(cur - Math.round(cur)) > 0.001) next = Math.floor(cur);
      else next = cur - 1;
    }
    next = Math.max(0, Math.min(Math.round(next * 2) / 2, it.count));
    eatQty[id] = next;
    paintEatRow(id);
  });

  /* 아직 많이 남았나요? 카드 */
  function onLeftoverClick(e) {
    var b = e.target.closest('[data-left]');
    if (!b) return;
    var it = byId(b.getAttribute('data-id'));
    if (!it) return;
    if (b.getAttribute('data-left') === 'keep') {

      save();
      renderAll();
      toast(emojiOf(it) + ' ' + it.name + ' · 먹음 횟수를 다시 셀게요');
    } else {
      it.done = true;
      it.used = 0;
      if (isCountable(it)) { it.count = 0; it.partial = false; }
      save();
      renderAll();
      toast(emojiOf(it) + ' ' + it.name + ' 소진 완료로 옮겼어요');
    }
  }
  leftoverCard.addEventListener('click', onLeftoverClick);
  leftoverCardMeals.addEventListener('click', onLeftoverClick);

  mealsEl.addEventListener('click', function (e) {
    if (e.target.closest('#replanBtn')) { replanAll(); return; }

    if (e.target.closest('[data-act="goalopen"]')) { openGoal(); return; }

    var sug = e.target.closest('[data-suggest]');
    if (sug) {
      addUseToMeal(sug.getAttribute('data-day'), sug.getAttribute('data-meal'), sug.getAttribute('data-suggest'));
      return;
    }

    /* 더 챙기면 좋은 비율 → 남은 재료 칩을 그 날 다음 끼니에 더하기 */
    var gapAdd = e.target.closest('[data-gapadd]');
    if (gapAdd) {
      var gapDay = gapAdd.getAttribute('data-gapday');
      var gapMeal = gapAdd.getAttribute('data-gapmeal');
      if (!gapMeal) {
        toast('이 날 두 끼는 이미 먹었어요 · 재료는 소진 체크에서 정리해요');
        return;
      }
      addUseToMeal(gapDay, gapMeal, gapAdd.getAttribute('data-gapadd'));
      return;
    }

    var dt = e.target.closest('[data-daytab]');
    if (dt) {
      ui.day = dt.getAttribute('data-daytab') === 'tomorrow' ? 'tomorrow' : 'today';
      renderMeals();
      return;
    }

    var uc = e.target.closest('[data-uc]');
    if (uc) {
      ui.filter = 'urgent';
      ui.hideDone = false;
      setTab('pantry');
      renderFilters();
      renderList();
      var urow = listEl.querySelector('[data-row="' + uc.getAttribute('data-uc') + '"]');
      if (urow) {
        urow.scrollIntoView({ behavior: 'smooth', block: 'center' });
        urow.classList.add('flash');
        setTimeout(function () { urow.classList.remove('flash'); }, 1200);
      }
      return;
    }

    var snack = e.target.closest('[data-snack]');
    if (snack) {
      var day = snack.getAttribute('data-snackday');
      var sid = snack.getAttribute('data-snack');
      var dk = dateKey(snack.getAttribute('data-snackday'));
      var arr = state.snacks[dk] || [];
      var idx = arr.indexOf(sid);
      if (idx === -1) arr.push(sid); else arr.splice(idx, 1);
      state.snacks[dk] = arr;
      save();
      renderMeals();
      return;
    }

    var chip = e.target.closest('[data-chipdel]');
    if (chip) {
      var ccard = chip.closest('.meal-card');
      if (!ccard) return;
      openDeplete(ccard.getAttribute('data-day'), ccard.getAttribute('data-meal'), chip.getAttribute('data-chipdel'));
      return;
    }

    var actBtn = e.target.closest('[data-act]');
    if (!actBtn) return;
    var card = actBtn.closest('.meal-card');
    if (!card) return;
    var d = card.getAttribute('data-day');
    var m = card.getAttribute('data-meal');
    var k = slotKey(d, m);
    var act = actBtn.getAttribute('data-act');

    if (act === 'warn') {
      var wbox = actBtn.closest('[data-wsum]');
      if (!wbox) return;
      var wOpen = !(ui.warnOpen[k]);
      ui.warnOpen[k] = wOpen;
      wbox.classList.toggle('is-open', wOpen);
      actBtn.setAttribute('aria-expanded', wOpen ? 'true' : 'false');
      var wDet = wbox.querySelector('.wsum-detail');
      if (wDet) wDet.hidden = !wOpen;
      var wTxt = wbox.querySelector('.wsum-more-txt');
      if (wTxt) wTxt.textContent = wOpen ? '접기' : '자세히';
      return;
    }
    if (act === 'expand') {
      ui.openMeal[k] = !ui.openMeal[k];
      renderMeals();
      return;
    }
    if (act === 'swap') {
      if (customMeal(d, m)) delete state.customMeals[k];
      swapMeal(d, m);
    }
    else if (act === 'recipe') openRecipe(d, m);
    else if (act === 'addIng') openPick(d, m);
    else if (act === 'trimGone') trimGoneFrom(d, m);
    else if (act === 'fixGone') {
      var rep = pickReplacement(d, m);
      if (!rep) { toast('소진된 재료 없이 만들 수 있는 메뉴가 없어요'); return; }
      planOf(d)[m] = rep.id;
      clearMealUses(d, m);
      save();
      renderAll();
      toast('소진된 재료 없이 만드는 메뉴로 바꿨어요');
    }
    else if (act === 'custom' || act === 'editCustom') openCustom(d, m);
    else if (act === 'skip') {
      state.skips[k] = true;
      delete state.eaten[k];
      save(); renderAll();
      toast('이 끼니는 배달·외식으로 표시했어요');
    } else if (act === 'unskip') {
      delete state.skips[k];
      save(); renderAll();
      toast('스킵을 되돌렸어요');
    } else if (act === 'eat') {
      openEat(d, m);
    } else if (act === 'uneat') {
      delete state.eaten[k];
      save(); renderAll();
      toast('먹은 기록을 되돌렸어요 · 재료 체크는 소진 탭에서 조정');
    }
  });

  /* ── 지난 기록 탭 ── */
  histEl.addEventListener('click', function (e) {
    var hv = e.target.closest('[data-hview]');
    if (hv) {
      histUI.view = hv.getAttribute('data-hview') === 'list' ? 'list' : 'calendar';
      renderHistory();
      return;
    }
    if (e.target.closest('[data-act="goalopen"]')) { openGoal(); return; }

    var nav = e.target.closest('[data-calnav]');
    if (nav) {
      var step = +nav.getAttribute('data-calnav') || 0;
      var p = String(histUI.month).split('-');
      var d = new Date(+p[0], +p[1] - 1 + step, 1);
      var mk = d.getFullYear() + '-' + pad2(d.getMonth() + 1);
      if (mk <= todayKey().slice(0, 7)) {
        histUI.month = mk;
        histUI.day = null;
        renderHistory();
      }
      return;
    }

    var cell = e.target.closest('[data-calday]');
    if (cell) {
      histUI.day = cell.getAttribute('data-calday');
      renderHistory();
      var hd = histEl.querySelector('.hd');
      if (hd && hd.scrollIntoView) hd.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    var he = e.target.closest('[data-histeat]');
    if (he) { markPastMeal(he.getAttribute('data-histeat'), true); return; }
    var hs = e.target.closest('[data-histskip]');
    if (hs) { markPastMeal(hs.getAttribute('data-histskip'), false); return; }
  });

  /* 지난 날 끼니를 늦게 표시 — 재고는 건드리지 않고 기록만 남긴다 */
  function markPastMeal(slug, eaten) {
    var k = String(slug || '');
    if (!/^\d{4}-\d{2}-\d{2}-(lunch|dinner)$/.test(k)) return;
    if (k.slice(0, 10) >= todayKey()) return;
    if (eaten) { state.eaten[k] = true; delete state.skips[k]; }
    else { state.skips[k] = true; delete state.eaten[k]; }
    save();
    renderDash();
    renderMeals();
    renderHistory();
    toast(eaten ? '그 끼니를 먹은 걸로 기록했어요' : '그 끼니를 외식으로 기록했어요');
  }

  if (goalSheet) {
    $('goalSave').addEventListener('click', saveGoal);
    $('goalCancel').addEventListener('click', function () { closeSheets(); });
    [gKcal, gC, gP, gF].forEach(function (el) { el.addEventListener('input', goalSheetCalc); });
    gPreset.addEventListener('click', function (e) {
      var b = e.target.closest('[data-preset]');
      if (!b) return;
      var v = b.getAttribute('data-preset').split(',');
      gKcal.value = v[0];
      gC.value = v[1];
      gP.value = v[2];
      gF.value = v[3];
      goalSheetCalc();
    });
  }

  $('fabAdd').addEventListener('click', function () { openEditor('add'); });

  /* 시트 내부 */
  segLoc.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-val]');
    if (!b) return;
    editor.loc = b.getAttribute('data-val');
    segSet(segLoc, editor.loc);
  });

  segUrg.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-val]');
    if (!b) return;
    editor.urg = b.getAttribute('data-val');
    segSet(segUrg, editor.urg);
  });

  quickAdd.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-quick]');
    if (!b) return;
    fName.value = b.getAttribute('data-quick');
    fName.focus();
  });

  ingSave.addEventListener('click', saveEditor);
  $('ingCancel').addEventListener('click', function () { closeSheets(); });
  ingDelete.addEventListener('click', deleteEditor);
  fName.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); saveEditor(); } });
  fName.addEventListener('input', function () { if (!editor.emoji) renderEmoPick(); });

  fEmo.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-emo]');
    if (!b) return;
    var emo = b.getAttribute('data-emo');
    editor.emoji = emo === emojiFor(fName.value.trim()) ? null : emo;
    renderEmoPick();
  });

  eatConfirm.addEventListener('click', confirmEat);
  $('eatCancel').addEventListener('click', function () { closeSheets(); });

  cList.addEventListener('change', function (e) {
    var box = e.target;
    if (!box || box.type !== 'checkbox') return;
    customSel[box.value] = box.checked;
    updateCustomCount();
    renderSelBar();
  });

  /* 선택 태그 ✕ → 바로 해제 */
  cTags.addEventListener('click', function (e) {
    var t = e.target.closest('[data-unsel]');
    if (!t) return;
    toggleCustomSel(t.getAttribute('data-unsel'), false);
  });

  /* 추천 칩 → 즉시 추가 */
  cRecs.addEventListener('click', function (e) {
    var c = e.target.closest('[data-pick]');
    if (!c) return;
    toggleCustomSel(c.getAttribute('data-pick'), true);
  });

  cSearch.addEventListener('input', renderCustomList);
  $('customSave').addEventListener('click', saveCustom);
  $('customCancel').addEventListener('click', function () { closeSheets(); });
  cName.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); saveCustom(); } });

  /* ── 끼니 재료 추가 시트 ── */
  pList.addEventListener('change', function (e) {
    var box = e.target;
    if (!box || box.type !== 'checkbox') return;
    if (pickTarget && pickTarget.base.indexOf(box.value) !== -1) return;
    pickSel[box.value] = box.checked;
    renderPickBar();
  });

  pTags.addEventListener('click', function (e) {
    var t = e.target.closest('[data-punsel]');
    if (!t) return;
    togglePick(t.getAttribute('data-punsel'), false);
  });

  pRecs.addEventListener('click', function (e) {
    var c = e.target.closest('[data-ppick]');
    if (!c) return;
    togglePick(c.getAttribute('data-ppick'), true);
  });

  pSearch.addEventListener('input', renderPickList);
  $('pickSave').addEventListener('click', savePick);
  $('pickCancel').addEventListener('click', function () {
    pickTarget = null;
    pickSel = {};
    closeSheets();
  });

  /* ── 소진 확인 모달 ── */
  depYes.addEventListener('click', confirmDeplete);
  depNo.addEventListener('click', removeFromMealOnly);
  $('depClose').addEventListener('click', closeDeplete);
  depModal.addEventListener('click', function (e) {
    if (e.target === depModal) closeDeplete();
  });

  $('menuBtn').addEventListener('click', function () { openSheet(menuSheet); });

  $('menuReplan').addEventListener('click', function () { closeSheets(); replanAll(); });

  $('menuGoPantry').addEventListener('click', function () {
    closeSheets();
    setTab('pantry');
  });

  $('menuReset').addEventListener('click', function () {
    var btn = $('menuReset');
    if (!resetArmed) {
      resetArmed = true;
      btn.innerHTML = '⚠️ 정말 초기화할까요?<em>한 번 더 누르면 처음 상태로 돌아가요</em>';
      return;
    }
    resetArmed = false;
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    state = freshState();
    save();
    closeSheets();
    ui.filter = 'all';
    ui.hideDone = false;
    ui.day = 'today';
    histUI.view = 'calendar';
    histUI.month = null;
    histUI.day = null;
    setTab('pantry');
    renderAll();
    toast('처음 상태로 초기화했어요');
  });

  scrim.addEventListener('click', function () { closeSheets(); });

  recipeBody.addEventListener('click', function (e) {
    if (e.target.closest('[data-rclose]')) closeSheets();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeSheets(); closeDeplete(); }
  });

  /* 다른 탭·창에서 상태가 바뀌면 다시 그리기 */
  window.addEventListener('storage', function (e) {
    if (e.key === STORE_KEY) {
      state = loadState();
      syncDay();
      ensurePlans();
      renderAll();
    }
  });

  /* 위젯 커맨드(reset / replan) 수신 */
  window.addEventListener('message', function (e) {
    var cmd = '';
    if (typeof e.data === 'string') cmd = e.data.trim();
    else if (e.data && typeof e.data.command === 'string') cmd = e.data.command.trim();
    if (cmd === 'reset') window.fridgeRescue.reset();
    else if (cmd === 'replan') window.fridgeRescue.replan();
  });

  function ensurePlan() {
    ensurePlans();
    save();
  }

  /* =========================================================
     시작
     ========================================================= */
  quickAdd.innerHTML = '<span class="quick-label">장 본 재료 빠르게 담기</span>' +
    QUICK_ADD.map(function (q) {
      return '<button type="button" data-quick="' + esc(q) + '">' + esc(q) + '</button>';
    }).join('');

  syncDay();
  ensurePlans();
  renderAll();
  save();

  /* 앱을 켜 둔 채 자정이 지나거나, 다음 날 다시 열었을 때
     오늘/내일 탭이 그 날짜로 넘어가고 어제 기록은 지난 기록으로 자동 이동 */
  setInterval(function () {
    if (!syncDay()) return;
    ensurePlans();
    renderAll();
    save();
  }, 30000);

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (syncDay()) {
      ensurePlans();
      renderAll();
      save();
      toast('날짜가 바뀌었어요 · 어제 기록은 📅 지난 기록에 쌓였어요');
    }
  });

  /* 위젯 커맨드 훅 (reset / replan) */
  window.fridgeRescue = {
    reset: function () {
      try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      state = freshState();
      save();
      ui.filter = 'all';
      ui.hideDone = false;
      ui.day = 'today';
      histUI.view = 'calendar';
      histUI.month = null;
      histUI.day = null;
      renderAll();
      toast('처음 상태로 초기화했어요');
    },
    replan: function () { replanAll(); }
  };
})();
</script>
</body>
</html>
