<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>390 프리뷰 하네스</title>
<style>
  html,body{margin:0;background:#DFE2E7;font-family:-apple-system,system-ui,sans-serif}
  .phone{
    width:390px;height:844px;margin:16px auto;background:#fff;
    box-shadow:0 8px 30px rgba(0,0,0,.18);overflow:hidden;position:relative;
  }
  .phone iframe{width:390px;height:844px;border:0;display:block}
</style>
</head>
<body>
<div class="phone"><iframe id="f" src="./index.html" title="타임 트래커 390px 프리뷰"></iframe></div>
<script>
  window.__scrollApp = function(y){ document.getElementById('f').contentWindow.scrollTo(0,y); };
  window.__appWin = function(){ return document.getElementById('f').contentWindow; };
</script>
</body>
</html>
