<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="한 줄로 적으면 날짜·시간·소요를 읽어 주간 캘린더와 하루 타임블록, 할 일 체크리스트에 담아주는 화이트 모드 타임 트래커.">
<title>타임 트래커</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ============================================================
   DESIGN TOKENS
   구조·역할: SEED(당근) role-based color / type scale / radius / spacing
   명도·시맨틱: KT Seamless Flow gray scale + text·border·surface 역할
   화이트 모드 — 순백 카드, 쿨그레이 바탕, 헤어라인 보더
   ============================================================ */
:root{
  --font-sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Roboto,sans-serif;

  --fs-10:.625rem;   /* 10 */
  --fs-11:.6875rem;  /* 11 */
  --fs-12:.75rem;    /* 12 */
  --fs-13:.8125rem;  /* 13 */
  --fs-14:.875rem;   /* 14 */
  --fs-16:1rem;      /* 16 */
  --fs-18:1.125rem;  /* 18 */
  --fs-20:1.25rem;   /* 20 */
  --fw-r:400; --fw-m:500; --fw-sb:600; --fw-b:700;
  --tr-tight:-.018em; --tr-tighter:-.032em;

  --white:#FFFFFF;
  --gray-25:#F7F8FA;
  --gray-50:#F3F4F6;
  --gray-75:#EEEFF2;
  --gray-100:#E9EAEE;
  --gray-150:#D5D8DD;
  --gray-200:#C7CAD1;
  --gray-300:#ADB1B9;
  --gray-400:#8B8F97;
  --gray-500:#6F737B;
  --gray-600:#55585D;
  --gray-700:#3D3F43;
  --gray-900:#191A1B;
  --ink:#131415;

  --bg:var(--gray-25);
  --surface:var(--white);
  --surface-cool:var(--gray-25);
  --surface-sunken:var(--gray-50);
  --border-hair:var(--gray-100);
  --border-strong:var(--gray-150);
  --border-focus:var(--ink);
  --text-1:#1A1B1D;
  --text-2:var(--gray-600);
  --text-3:var(--gray-500);
  --text-4:#A9AEB6;
  --text-inverse:var(--white);

  --brand:#FF5A36;
  --brand-strong:#E8431F;
  --brand-weak:#FFF1EC;
  --now:#FF5A36;

  --c-work:#2E5FE8;      --c-work-w:#EDF2FE;
  --c-side:#6B46D6;      --c-side-w:#F2EEFE;
  --c-errand:#96630A;    --c-errand-w:#FDF4E1;
  --c-study:#0B7C74;     --c-study-w:#E4F5F3;
  --c-promise:#C23A6C;   --c-promise-w:#FDECF2;

  --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:22px; --r-full:999px;

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px;
  --gutter:14px;

  --tl-gutter:26px;   /* compact timeline hour gutter */
  --gap-h:20px;       /* compressed empty-hours row */
  --kb:0px;           /* keyboard offset */
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text-1);
  font-family:var(--font-sans);font-size:var(--fs-16);line-height:1.5;
  letter-spacing:var(--tr-tight);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  word-break:keep-all;
}
button,textarea,input{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
::selection{background:var(--brand-weak);color:var(--brand-strong)}

/* ── Top bar ─────────────────────────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(247,248,250,.88);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);
  backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--border-hair);
}
.topbar-in{
  max-width:520px;margin:0 auto;padding:9px var(--gutter);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.logo{display:flex;align-items:center;gap:7px;min-width:0}
.logo-mark{width:17px;height:17px;border-radius:5px;flex:none;background:var(--ink);position:relative;overflow:hidden}
.logo-mark::before,.logo-mark::after{content:"";position:absolute;left:4px;border-radius:2px;background:var(--white)}
.logo-mark::before{top:4px;width:9px;height:2.5px}
.logo-mark::after{top:8.5px;width:5px;height:2.5px;background:var(--brand)}
.logo-text{font-size:var(--fs-13);font-weight:var(--fw-b);letter-spacing:var(--tr-tighter)}
.today-btn{
  height:28px;padding:0 11px;border-radius:var(--r-full);
  border:1px solid var(--border-strong);background:var(--white);
  font-size:var(--fs-12);font-weight:var(--fw-m);color:var(--text-2);white-space:nowrap;
}
.today-btn:active{background:var(--surface-sunken)}

/* ── Layout ──────────────────────────────────────────────── */
.wrap{max-width:520px;margin:0 auto;padding:10px var(--gutter) 88px;
  display:flex;flex-direction:column;gap:8px}
.card{
  border:1px solid var(--border-hair);border-radius:var(--r-lg);
  background:var(--surface);padding:11px 10px 11px;
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}

/* ── Composer (1-line quick bar) ─────────────────────────── */
.quick{
  border:1px solid var(--border-hair);border-radius:var(--r-lg);
  background:var(--surface);padding:4px 5px 4px 11px;
  transition:border-color .14s,box-shadow .14s;
}
.quick.is-open{border-color:var(--ink);box-shadow:0 2px 10px rgba(19,20,21,.06)}
.quick-row{display:flex;align-items:center;gap:7px;min-height:42px}
.quick-ico{
  width:16px;height:16px;flex:none;color:var(--text-4);
  display:grid;place-items:center;font-size:15px;line-height:1;font-weight:var(--fw-m);
}
.quick-input{
  flex:1;min-width:0;height:40px;border:0;background:transparent;outline:none;
  font-size:var(--fs-16);line-height:1.35;padding:0;
  overflow:hidden;text-overflow:ellipsis;
}
.quick-input::placeholder{color:var(--text-4);font-size:var(--fs-14)}
.quick-add{
  flex:none;height:34px;padding:0 13px;border-radius:var(--r-full);
  background:var(--ink);color:var(--text-inverse);
  font-size:var(--fs-12);font-weight:var(--fw-b);letter-spacing:var(--tr-tighter);
  transition:opacity .14s,transform .14s;
}
.quick-add[disabled]{background:var(--gray-75);color:var(--text-4);cursor:default}
.quick-add:not([disabled]):active{transform:scale(.96);opacity:.86}

/* parse preview */
.preview{margin:2px 0 3px;padding:9px 0 3px;border-top:1px dashed var(--border-strong)}
.preview-title{font-size:var(--fs-14);font-weight:var(--fw-b);letter-spacing:var(--tr-tighter);line-height:1.35}
.preview-note{font-size:var(--fs-11);color:var(--text-3);margin-top:2px;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.p-chip{
  display:inline-flex;align-items:center;gap:3px;height:25px;padding:0 9px;
  border-radius:var(--r-full);border:1px solid var(--border-hair);
  background:var(--surface-cool);font-size:var(--fs-11);color:var(--text-2);
  font-variant-numeric:tabular-nums;
}
.p-chip b{font-weight:var(--fw-m);color:var(--text-1)}
.p-chip .caret{font-size:8px;color:var(--text-4);line-height:1}
.p-chip[aria-expanded="true"]{border-color:var(--ink);background:var(--white)}
.p-chip.is-flex{border-style:dashed;color:var(--text-3)}
.chip-opts{display:flex;gap:5px;margin-top:7px;padding-bottom:2px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.chip-opts::-webkit-scrollbar{display:none}
.opt{
  flex:none;height:27px;padding:0 10px;border-radius:var(--r-full);
  border:1px solid var(--border-hair);background:var(--white);
  font-size:var(--fs-11);color:var(--text-2);font-variant-numeric:tabular-nums;
}
.opt.is-on{background:var(--ink);border-color:var(--ink);color:var(--white)}

/* ── Calendar: week strip + month view ───────────────────── */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.week-nav{display:flex;align-items:center;gap:2px;min-width:0}
.cal-title{
  font-size:var(--fs-13);font-weight:var(--fw-b);letter-spacing:var(--tr-tighter);
  padding:0 2px;white-space:nowrap;font-variant-numeric:tabular-nums;
}
.icon-btn{width:26px;height:26px;border-radius:var(--r-full);display:grid;place-items:center;
  font-size:15px;line-height:1;color:var(--text-3)}
.icon-btn:active{background:var(--surface-sunken)}
.toggle{
  flex:none;height:26px;padding:0 9px;border-radius:var(--r-full);
  border:1px solid var(--border-hair);background:var(--white);
  font-size:var(--fs-11);color:var(--text-2);
  display:inline-flex;align-items:center;gap:3px;white-space:nowrap;
}
.toggle:active{background:var(--surface-sunken)}
.toggle .caret{font-size:8px;color:var(--text-4);line-height:1}
.toggle.is-on{background:var(--ink);border-color:var(--ink);color:var(--white)}
.toggle.is-on .caret{color:rgba(255,255,255,.7)}

.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px}
.day{
  display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:4px 0 5px;border-radius:12px;background:transparent;min-width:0;
  transition:background .12s;
}
.day:active{background:var(--surface-sunken)}
.day-w{font-size:var(--fs-10);font-weight:var(--fw-m);color:var(--text-3);line-height:1.1}
.day-n{
  width:27px;height:27px;border-radius:var(--r-full);display:grid;place-items:center;
  font-size:var(--fs-14);font-weight:var(--fw-b);letter-spacing:var(--tr-tighter);
  font-variant-numeric:tabular-nums;color:var(--text-1);
}
.day.is-sun .day-w{color:#C0492F}
.day.is-sat .day-w{color:#3358A8}
.day.is-sun .day-n{color:#C0492F}
.day.is-sat .day-n{color:#3358A8}
.day.is-today .day-n{box-shadow:inset 0 0 0 1.5px var(--brand)}
.day.is-sel{background:var(--ink)}
.day.is-sel .day-w{color:rgba(255,255,255,.62)}
.day.is-sel .day-n,.day.is-sel.is-sun .day-n,.day.is-sel.is-sat .day-n{color:var(--white);box-shadow:none}
.day-dots{display:flex;align-items:center;gap:2px;height:4px;margin-top:1px}
.day-dots i{display:block;width:4px;height:4px;border-radius:50%}
.day.is-sel .day-dots i{box-shadow:0 0 0 1px rgba(255,255,255,.55)}

.month-view{margin-top:2px}
.sum-stats{display:flex;gap:5px;margin-bottom:9px}
.stat{flex:1;padding:7px 9px;border-radius:var(--r-sm);background:var(--surface-cool);display:flex;flex-direction:column;gap:0;min-width:0}
.stat-k{font-size:var(--fs-10);color:var(--text-3);line-height:1.3}
.stat-v{font-size:var(--fs-13);font-weight:var(--fw-b);letter-spacing:var(--tr-tighter);
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum-dist{display:flex;height:6px;border-radius:var(--r-full);overflow:hidden;background:var(--gray-75)}
.sum-dist span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:2px 10px;margin:7px 0 0;padding:0}
.legend li{list-style:none;display:flex;align-items:center;gap:4px;font-size:var(--fs-10);color:var(--text-3)}
.legend .swatch{width:6px;height:6px;border-radius:2px;flex:none}
.legend b{font-weight:var(--fw-m);color:var(--text-2);font-variant-numeric:tabular-nums}

.cal-week{display:grid;grid-template-columns:repeat(7,1fr);margin:8px 0 2px}
.cal-week span{text-align:center;font-size:var(--fs-10);font-weight:var(--fw-m);color:var(--text-3);padding-bottom:2px}
.cal-week span:first-child{color:#C0492F}
.cal-week span:last-child{color:#3358A8}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal-cell{
  position:relative;height:52px;min-width:0;overflow:hidden;padding:3px 2px;border-radius:var(--r-xs);
  border:1px solid transparent;text-align:left;display:flex;flex-direction:column;gap:1px;background:transparent;
}
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:2px;min-height:17px}
.cal-count{font-size:8px;color:var(--text-4);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cal-cell.is-out{opacity:.28;pointer-events:none}
.cal-cell.is-sel{border-color:var(--ink);background:var(--white)}
.cal-cell.is-today .cal-num{background:var(--ink);color:var(--white)}
.cal-cell:not(.is-sel):active{background:var(--surface-cool)}
.cal-num{
  min-width:17px;height:17px;padding:0 3px;border-radius:var(--r-full);
  display:grid;place-items:center;font-size:var(--fs-10);font-weight:var(--fw-m);
  color:var(--text-2);font-variant-numeric:tabular-nums;line-height:1;
}
.cal-cell.is-sun .cal-num{color:#C0492F}
.cal-cell.is-sat .cal-num{color:#3358A8}
.cal-cell.is-today .cal-num,.cal-cell.is-today.is-sun .cal-num,.cal-cell.is-today.is-sat .cal-num{color:var(--white)}
.ev{
  display:block;width:100%;max-width:100%;min-width:0;overflow:hidden;
  font-size:7.5px;line-height:9.5px;max-height:19px;padding:0 2px;border-radius:3px;
  background:var(--w);color:var(--c);border-left:2px solid var(--c);
  white-space:normal;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:-.03em;
}
.ev.is-done{opacity:.5;text-decoration:line-through}

/* ── Day card: timeline + todo, side by side ─────────────── */
.day-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:2px}
.day-title{font-size:var(--fs-14);font-weight:var(--fw-b);letter-spacing:var(--tr-tighter);line-height:1.3}
.day-sub{font-size:var(--fs-11);color:var(--text-3);margin-top:1px;font-variant-numeric:tabular-nums}

.split{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(0,1fr);gap:8px;margin-top:7px}
.split-l{min-width:0}
.split-r{min-width:0;border-left:1px solid var(--border-hair);padding-left:9px}

/* timeline (compact) */
.tl{position:relative;min-height:2px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.tl-row{position:absolute;left:0;right:0;border-top:1px solid #F1F2F4}
.tl-row>i{
  position:absolute;left:0;top:-6px;width:var(--tl-gutter);
  font-size:9px;font-style:normal;color:var(--gray-300);line-height:12px;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;background:var(--white);
}
.tl-gap{position:absolute;left:var(--tl-gutter);right:0;display:flex;align-items:center;gap:4px}
.tl-gap::after{content:"";flex:1;border-top:1px dashed var(--gray-150)}
.tl-gap span{font-size:8.5px;color:var(--text-4);font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1}
.tl-block{
  position:absolute;left:var(--tl-gutter);right:0;border-radius:7px;
  padding:2px 3px 2px 5px;background:var(--w);
  box-shadow:inset 3px 0 0 var(--c);
  overflow:hidden;isolation:isolate;display:flex;flex-direction:column;justify-content:center;
  text-align:left;
}
.tl-block.is-flex{
  background:repeating-linear-gradient(135deg,rgba(19,20,21,.03) 0 5px,transparent 5px 10px),var(--w);
  box-shadow:inset 3px 0 0 var(--c),inset 0 0 0 1px rgba(19,20,21,.09);
}
.tl-block.is-done{opacity:.55}
.tl-block.is-done .tl-title{text-decoration:line-through}
.tl-title{
  font-size:10.5px;font-weight:var(--fw-sb);line-height:1.18;color:var(--text-1);
  letter-spacing:-.03em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.tl-meta{
  font-size:8.5px;color:var(--text-3);line-height:1.15;margin-top:1px;
  font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tl-block.is-compact .tl-meta{display:none}
.tl-block.is-tiny .tl-meta{display:none}
.tl-block.is-tiny .tl-title{-webkit-line-clamp:1}
.tl-flex-label{color:var(--brand-strong)}
.grip{
  position:absolute;right:0;top:0;bottom:0;width:13px;cursor:grab;touch-action:none;
  display:grid;place-items:center;opacity:.22;color:var(--c);font-size:9px;
  -webkit-user-select:none;user-select:none;
}
.grip::before{content:"⠿"}
.grip:active{opacity:.65}
.tl-now{position:absolute;left:calc(var(--tl-gutter) - 4px);right:0;height:0;border-top:2px solid var(--now);z-index:5;pointer-events:none}
.tl-now::before{content:"";position:absolute;left:0;top:-4px;width:7px;height:7px;border-radius:50%;background:var(--now)}
.tl-empty{
  display:flex;flex-direction:column;justify-content:center;gap:2px;
  min-height:96px;padding:10px 6px 10px 2px;
  font-size:var(--fs-11);color:var(--text-4);line-height:1.45;
}

/* day todo column */
.dt-head{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:3px}
.dt-head b{font-size:var(--fs-11);font-weight:var(--fw-b);letter-spacing:var(--tr-tighter)}
.dt-head span{font-size:var(--fs-10);color:var(--text-4);font-variant-numeric:tabular-nums}
.dtr{
  display:flex;gap:6px;width:100%;padding:6px 0;border-top:1px solid var(--border-hair);
  align-items:flex-start;text-align:left;
}
.dtr:first-of-type{border-top:0;padding-top:2px}
.dtc{
  width:17px;height:17px;flex:none;margin-top:0;border-radius:var(--r-full);
  border:1.5px solid var(--gray-200);display:grid;place-items:center;background:var(--white);
  transition:background .12s,border-color .12s;
}
.dtc svg{width:9px;height:9px;opacity:0;transform:scale(.6);transition:opacity .12s,transform .12s}
.dtr.is-done .dtc{background:var(--c);border-color:var(--c)}
.dtr.is-done .dtc svg{opacity:1;transform:scale(1)}
.dtm-wrap{flex:1;min-width:0}
.dtt{
  font-size:11px;font-weight:var(--fw-m);line-height:1.25;letter-spacing:-.03em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.dtr.is-done .dtt{color:var(--text-4);text-decoration:line-through}
.dtm{
  display:flex;align-items:center;gap:3px;margin-top:1px;
  font-size:9px;color:var(--text-3);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dtm .dot{width:4px;height:4px;border-radius:50%;flex:none;background:var(--c)}
.dtm .flex{color:var(--brand-strong)}
.dt-empty{padding:12px 2px;font-size:var(--fs-11);color:var(--text-4);line-height:1.45}
.dt-more{
  display:block;width:100%;margin-top:4px;padding:5px 0 0;border-top:1px solid var(--border-hair);
  font-size:var(--fs-10);color:var(--text-3);text-align:left;
}

/* ── All tasks ───────────────────────────────────────────── */
.list-title{font-size:var(--fs-13);font-weight:var(--fw-b);letter-spacing:var(--tr-tighter)}
.panel-note{font-size:var(--fs-10);color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;flex-wrap:nowrap;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.chips::-webkit-scrollbar{display:none}
.chips + .chips{margin-top:5px}
.chip{
  flex:none;height:26px;padding:0 9px;border-radius:var(--r-full);
  border:1px solid var(--border-hair);background:var(--white);
  font-size:var(--fs-11);color:var(--text-2);white-space:nowrap;
  display:inline-flex;align-items:center;gap:4px;
}
.chip .dot{width:6px;height:6px;border-radius:50%;flex:none}
.chip.is-on{background:var(--ink);border-color:var(--ink);color:var(--white)}
.chip.is-on .dot{box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.chip:active{opacity:.7}

/* ── Toast ───────────────────────────────────────────────── */

<header class="topbar">
  <div class="topbar-in">

      <span class="logo-mark" aria-hidden="true"></span>
      <span class="logo-text">타임 트래커</span>
    </div>
    <button class="today-btn" data-act="today">오늘</button>
  </div>
</header>

<main class="wrap">

  <!-- 한 줄 빠른 입력 -->
  <section class="quick" id="quickBar" aria-label="빠른 입력">
    <div class="quick-row">
      <span class="quick-ico" aria-hidden="true">＋</span>
      <input id="quickInput" class="quick-input" type="text" autocomplete="off" enterkeyhint="done"
        placeholder="일요일 저녁 회의 2시간…" aria-label="일정을 한 줄로 적기">
      <button class="quick-add" id="addBtn" disabled>담기</button>
    </div>
    <div id="preview" class="preview" hidden></div>
  </section>

  <!-- 캘린더: 주간 스트립 ↔ 월간 전체 -->
  <section class="card" aria-label="캘린더">
    <div class="cal-head">

        <span class="cal-title" id="calTitle"></span>

      <button class="toggle" id="monthToggle" data-act="toggle-month" aria-expanded="false">
        월간 전체<span class="caret" aria-hidden="true">▾</span>
      </button>
    </div>
    <div class="strip" id="strip" role="group" aria-label="이번 주"></div>
    <div class="month-view" id="monthView" hidden>
      <div id="summary"></div>
      <div class="cal-week" id="calWeek" aria-hidden="true"></div>
      <div class="cal-grid" id="calGrid" role="grid" aria-label="월간 캘린더"></div>
    </div>
  </section>

  <!-- 하루: 타임블록 + 할 일 -->

      <div>
        <h2 class="day-title" id="dayTitle"></h2>

      </div>

      <h2 class="list-title">모든 할 일</h2>

    <div class="chips" id="catChips" aria-label="카테고리 필터"></div>

  <p class="foot-note">모든 변경은 이 기기에만 저장돼요 · <button data-act="reset">처음 상태로</button></p>
</main>

<div class="sheet-wrap" id="sheetWrap" aria-hidden="true">
  <div class="sheet-dim" data-act="sheet-cancel"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="일정 조정"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';

/* ============================================================
   0. Constants
   ============================================================ */
var LS_KEY = 'time-tracker.v1';
var WD = ['일','월','화','수','목','금','토'];
var START_HOUR = 9, END_HOUR = 24;
var HOUR_C = 34;   /* compact hour height (px) */
var HOUR_F = 40;   /* full-day hour height (px) */
var GAP_H = 20;    /* compressed empty-hours row (px) */

var CATS = [
  {id:'work',    name:'업무·협업',       hex:'#2E5FE8', weak:'#EDF2FE'},
  {id:'side',    name:'사이드프로젝트',  hex:'#6B46D6', weak:'#F2EEFE'},
  {id:'errand',  name:'일상·볼일',       hex:'#96630A', weak:'#FDF4E1'},
  {id:'study',   name:'공부',            hex:'#0B7C74', weak:'#E4F5F3'},
  {id:'promise', name:'약속',            hex:'#C23A6C', weak:'#FDECF2'}
];
var CAT = {};
CATS.forEach(function(c){ CAT[c.id] = c; });

var DUR_FILTERS = [
  {id:'all',  label:'전체'},
  {id:'s',    label:'30분'},
  {id:'h',    label:'1시간'},
  {id:'l',    label:'2시간+'},
  {id:'none', label:'미정'}
];

/* ============================================================
   1. Utilities
   ============================================================ */
var $ = function(sel, root){ return (root || document).querySelector(sel); };
var pad2 = function(n){ return String(n).padStart(2,'0'); };
var ymd = function(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); };
var fromYmd = function(s){ var p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); };
var addDays = function(d, n){ var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; };
var toMin = function(t){ var p = t.split(':').map(Number); return p[0]*60 + p[1]; };
var toHHMM = function(m){ return pad2(Math.floor(m/60)) + ':' + pad2(((m%60)+60)%60); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
}); };
var uid = function(){ return 'i' + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); };
var clamp = function(n, a, b){ return Math.max(a, Math.min(b, n)); };

function fmtDur(m){
  if (m == null || isNaN(m)) return '미정';
  var h = Math.floor(m/60), mm = m%60;
  if (h && mm) return h + '시간 ' + mm + '분';
  if (h) return h + '시간';
  return mm + '분';
}
function fmtDurChip(m){
  if (m == null) return '미정';
  if (m < 60) return m + '분';
  var h = Math.floor(m/60), mm = m%60;
  if (mm) return h + '시간 ' + mm + '분';
  return h + '시간';
}
function mdLabel(s){ var d = fromYmd(s); return (d.getMonth()+1) + '/' + d.getDate(); }
function dayLabel(s){ var d = fromYmd(s); return WD[d.getDay()] + ' ' + mdLabel(s); }
function todayStr(){ return ymd(new Date()); }
function byTime(a, b){
  var am = a.start ? toMin(a.start) : 25*60, bm = b.start ? toMin(b.start) : 25*60;
  return am - bm;
}

/* ============================================================
   2. Natural-language parser
   ============================================================ */
var KNUM = {'한':1,'두':2,'세':3,'네':4,'다섯':5,'여섯':6};

var PERIODS = [
  ['점심 이후', 13*60+30], ['점심 후', 13*60+30], ['점심때', 12*60], ['점심', 12*60],
  ['아침', 8*60+30], ['오전', 10*60], ['오후', 14*60],
  ['저녁', 19*60], ['밤', 21*60], ['새벽', 5*60], ['낮', 12*60+30]
];

var CAT_RULES = [
  ['side',    ['요아정','클로드코드','클로드 코드','사이드','사이드프로젝트','개인프로젝트','냉장고 구조대','웹앱','토이','앱 개편']],
  ['study',   ['공부','강의','스터디','인강','웨비나','세미나','책','독서','읽기','학습','자격증','노트필기','특강']],
  ['promise', ['약속','모임','데이트','친구','만나기','생일','파티','동창','가족']],
  ['work',    ['회의','미팅','협업','목업','잔업','커피챗','대표님','업무','보고','디자인시스템','디자인 시스템','서버','스프린트','기획','리뷰','발표','면접','포트폴리오','이력서','외주','납품','시안']],
  ['errand',  ['동사무소','주민센터','행정복지센터','병원','약국','은행','장보기','청소','배송','민원','관리비','수거','방문','볼일','택배','세탁','미용실','마트','이사','정리']]
];

var META_TAIL = /(소요될\s*예정|소요\s*예정|소요|예정|걸릴\s*예정|진행\s*예정|필요함|필요|하기|해야\s*함|해야함|함)$/;

function parseSentence(raw, base){
  base = base || new Date();
  var src = String(raw || '').replace(/\s+/g,' ').trim();
  if (!src) return null;

  var memo = '', checks = [], note = '';

  /* 제목과 메모 분리: "메모:" 또는 " / " */
  var mm = src.match(/메모\s*[:：]\s*([\s\S]+)$/);
  if (mm){ memo = mm[1].trim(); src = src.slice(0, mm.index); }
  var parts = src.split(/\s+\/\s+|\s*\/\s*/);
  if (parts.length > 1){
    src = parts[0];
    var tail = parts.slice(1).join(' / ').replace(/^메모\s*[:：]\s*/,'').trim();
    if (tail) memo = memo ? (tail + ' / ' + memo) : tail;
  }

  /* 체크 항목 */
  var cm = src.match(/(?:^|\s)\(?\s*체크\s*[:：]\s*([^)]+?)\s*\)?\s*$/);
  if (cm){ checks.push({text: cm[1].trim(), done:false}); src = src.slice(0, cm.index); }

  var rest = ' ' + src + ' ';
  function take(re){
    var m = rest.match(re);
    if (!m) return null;
    rest = rest.replace(m[0], ' ');
    return m;
  }

  /* ── 날짜 ─────────────────────────────────────────────── */
  var date = null, dateSet = false;

  var d1 = take(/(오늘|금일|내일|명일|모레|글피)/);
  if (d1){
    var k = d1[1], n = (k === '오늘' || k === '금일') ? 0 : (k === '내일' || k === '명일') ? 1 : (k === '모레') ? 2 : 3;
    date = ymd(addDays(base, n)); dateSet = true;
  }
  if (!dateSet){
    var d2 = take(/(이틀|사흘|나흘|\d{1,2})\s*일?\s*(뒤|후|이따가?|있다가)/);
    if (d2){
      var n2 = d2[1] === '이틀' ? 2 : d2[1] === '사흘' ? 3 : d2[1] === '나흘' ? 4 : parseInt(d2[1], 10);
      date = ymd(addDays(base, n2)); dateSet = true;
    }
  }
  if (!dateSet){
    var d3 = take(/(?:(다음\s*주|다음주|담주|이번\s*주|이번주)\s*)?([일월화수목금토])\s*(?:요일|욜)/);
    if (d3){
      var ti = WD.indexOf(d3[2]);
      var delta = (ti - base.getDay() + 7) % 7;
      if (/다음\s*주|담주/.test(d3[1] || '')) delta += 7;
      date = ymd(addDays(base, delta)); dateSet = true;
    }
  }
  if (!dateSet){
    var d4 = take(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
    if (d4){
      var yy = base.getFullYear();
      var cand = new Date(yy, parseInt(d4[1],10)-1, parseInt(d4[2],10));
      if (cand < new Date(yy, base.getMonth(), base.getDate())) cand = new Date(yy+1, parseInt(d4[1],10)-1, parseInt(d4[2],10));
      date = ymd(cand); dateSet = true;
    }
  }
  if (!dateSet){
    var d5 = take(/(^|[\s,·])(\d{1,2})\s*[\/.]\s*(\d{1,2})(?![\d:])/);
    if (d5){
      var yy2 = base.getFullYear();
      var c2 = new Date(yy2, parseInt(d5[2],10)-1, parseInt(d5[3],10));
      if (c2 < new Date(yy2, base.getMonth(), base.getDate())) c2 = new Date(yy2+1, parseInt(d5[2],10)-1, parseInt(d5[3],10));
      date = ymd(c2); dateSet = true;
    }
  }
  if (!dateSet){
    var d6 = take(/(\d{1,2})\s*일(?!\s*(?:뒤|후|분|시간|정도))/);
    if (d6){
      var day = parseInt(d6[1], 10);
      if (day >= 1 && day <= 31){
        var y3 = base.getFullYear(), m3 = base.getMonth();
        var c3 = new Date(y3, m3, day);
        if (c3 < new Date(y3, m3, base.getDate())) c3 = new Date(y3, m3+1, day);
        date = ymd(c3); dateSet = true;
      }
    }
  }
  if (!dateSet) date = ymd(base);

  /* ── 소요 시간 ────────────────────────────────────────── */
  var dur = null;
  var dm = take(/(\d+(?:\.\d+)?)\s*시간\s*(?:(\d{1,2})\s*분|(반))?/);
  if (dm){
    dur = Math.round(parseFloat(dm[1]) * 60);
    if (dm[2]) dur += parseInt(dm[2], 10);
    if (dm[3]) dur += 30;
  }
  if (dur == null){
    var dk = take(/(한|두|세|네|다섯|여섯)\s*시간\s*(?:(\d{1,2})\s*분|(반))?/);
    if (dk){
      dur = KNUM[dk[1]] * 60;
      if (dk[2]) dur += parseInt(dk[2], 10);
      if (dk[3]) dur += 30;
    }
  }
  if (dur == null){
    var dh = take(/(반)\s*시간/);
    if (dh) dur = 30;
  }
  if (dur == null){
    var dmin = take(/(\d{1,3})\s*분/);
    if (dmin) dur = parseInt(dmin[1], 10);
  }
  if (dur == null){
    var db = take(/(반나절|종일)/);
    if (db) dur = db[1] === '종일' ? 480 : 180;
  }

  /* ── 시간 ─────────────────────────────────────────────── */
  var start = null, vague = false, whenLabel = '';

  var clock = take(/(오전|오후|아침|점심|저녁|밤|새벽|낮)?\s*(\d{1,2})\s*시(?!간)\s*(?:(\d{1,2})\s*분)?/);
  if (!clock) clock = take(/(오전|오후)?\s*(\d{1,2})\s*:\s*(\d{2})/);
  if (clock){
    var h = parseInt(clock[2], 10), mi = clock[3] ? parseInt(clock[3], 10) : 0;
    var p = clock[1] || '';
    if (/오후|저녁|밤/.test(p) && h < 12) h += 12;
    if (/오전|아침|새벽/.test(p) && h === 12) h = 0;
    if (h >= 0 && h <= 23) start = h*60 + clamp(mi, 0, 59);
  }

  if (start == null){
    for (var i = 0; i < PERIODS.length; i++){
      var kw = PERIODS[i][0].replace(' ', '\\s*');
      var pm = take(new RegExp('(' + kw + ')\\s*(쯤|쯤에|께|무렵|까지|에는|에)?'));
      if (pm){
        whenLabel = pm[1];
        if (/쯤|께|무렵/.test(pm[2] || '')){ vague = true; whenLabel = pm[1] + pm[2]; }
        else start = PERIODS[i][1];
        break;
      }
    }
  }

  /* ── 미정 여부 ────────────────────────────────────────── */
  var unc = take(/(시간\s*미정|시간미정|미정|틈틈이|틈틈히|비는\s*시간|남는\s*시간|자투리)/);
  var uncertain = !!unc || start == null || vague;
  if (unc && /틈틈/.test(unc[1])) whenLabel = '틈틈이';

  /* ── 카테고리 ─────────────────────────────────────────── */
  var cat = null;
  var scan = (src + ' ' + memo);
  for (var ci = 0; ci < CAT_RULES.length; ci++){
    var kws = CAT_RULES[ci][1];
    for (var ki = 0; ki < kws.length; ki++){
      if (scan.indexOf(kws[ki]) >= 0){ cat = CAT_RULES[ci][0]; break; }
    }
    if (cat) break;
  }
  if (!cat) cat = 'errand';

  /* ── 제목 정리 ────────────────────────────────────────── */
  var sents = rest.split(/\s*[.。!?]\s*|\s{2,}/).map(function(s){ return s.trim(); }).filter(Boolean);
  var title = '';
  for (var si = 0; si < sents.length; si++){
    var s = sents[si]
      .replace(/[()（）\[\]]/g, ' ')
      .replace(/정도/g, ' ')
      .replace(/(^|\s)약\s/g, ' ')
      .replace(/^(에|에는|쯤|부터|까지)\s*/,'')
      .replace(/\s+/g, ' ')
      .trim();
    for (var t = 0; t < 3; t++) s = s.replace(META_TAIL, '').replace(/\s+/g,' ').trim();
    s = s.replace(/^[,.·\-–—\s]+|[,.·\-–—\s]+$/g, '');
    if (s.length >= 2 && !/^(소요|예정|시간|분)$/.test(s)){ title = s; break; }
  }
  if (!title){
    title = sents.join(' ').replace(/\s+/g,' ').trim().slice(0, 60) || src.slice(0, 60);
  }
  title = title.replace(/\s+/g,' ').trim().slice(0, 80);

  return {
    title: title,
    date: date,
    start: start == null ? null : toHHMM(start),
    dur: dur,
    cat: cat,
    uncertain: uncertain,
    vague: vague,
    whenLabel: whenLabel,
    memo: memo.replace(/\s+/g,' ').trim(),
    checks: checks,
    note: note
  };
}

/* ============================================================
   3. State

  '민지님과 회의':'work',
  '동사무소 방문해서 폐보조배터리 수거요청':'errand',
  '포트폴리오 이력서 정리해서 been님께 전달':'work',

  'been님 & 대표님 커피챗':'work',
  '클로드코드 비는 시간동안 요아정 작업 틈틈히 진행 필요':'side'
};

function loadState(){
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw){
      var o = JSON.parse(raw);
      if (o && Array.isArray(o.items)) return o;
    }
  } catch(e){}
  return null;
}

var state = loadState() || {
  version: 2,
  items: seedItems(),
  cursor: null,
  selected: null,
  view: 'week',
  fullDay: false,
  catFilter: 'all',
  durFilter: 'all'
};
if (!state.catFilter) state.catFilter = 'all';
if (!state.durFilter) state.durFilter = 'all';
if (state.view !== 'month') state.view = 'week';
state.fullDay = !!state.fullDay;

function save(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
}

/* 저장된 상태의 태그를 한 번 정정 */
function migrate(){
  var changed = false;
  if (!(state.version >= 2)){
    state.items.forEach(function(it){
      var want = CAT_FIX[String(it.title || '').trim()];
      if (want && CAT[want] && it.cat !== want){ it.cat = want; changed = true; }
    });
    state.version = 2;
    changed = true;
  }
  if (changed) save();
}

function itemById(id){
  for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i];
  return null;
}
function itemsOn(dateStr){
  return state.items.filter(function(it){ return it.date === dateStr; });
}

/* ============================================================
   4. Placement (fixed + 어림 배치)
   ============================================================ */
function placementsFor(dateStr){
  var items = itemsOn(dateStr);
  var out = [], occ = [];

  items.forEach(function(it){
    if (it.start != null){
      var s = toMin(it.start), d = it.dur || 60;
      out.push({it:it, s:s, e:s+d, suggested:false});
      occ.push({s:s, e:s+d});
    }
  });

  var flex = items.filter(function(it){ return it.start == null; })
    .sort(function(a,b){ return (b.dur || 60) - (a.dur || 60); });

  flex.forEach(function(it){
    var d = it.dur || 60, s = null, t = 19*60;
    while (t + d <= END_HOUR*60){
      var clash = occ.some(function(o){ return t < o.e && t + d > o.s; });
      if (!clash){ s = t; break; }
      t += 30;
    }
    if (s == null) s = 19*60;
    occ.push({s:s, e:s+d});
    out.push({it:it, s:s, e:s+d, suggested:true});
  });

  return out.sort(function(a,b){ return a.s - b.s || b.e - a.e; });
}

function layout(placed){
  var clusters = [], cur = null;
  placed.forEach(function(p){
    if (!cur || p.s >= cur.end){ cur = {items:[], end:p.e}; clusters.push(cur); }
    cur.items.push(p);
    cur.end = Math.max(cur.end, p.e);
  });
  clusters.forEach(function(c){
    c.items.forEach(function(p, i){ p.lane = i; p.lanes = c.items.length; });
  });
  return placed;
}

  if (monthMode){
    var cur = state.cursor || (state.selected || todayStr()).slice(0,7);
    var y = parseInt(cur.slice(0,4), 10), m = parseInt(cur.slice(5,7), 10);

function renderStrip(ws){
  var cells = '';
  for (var i = 0; i < 7; i++){
    var d = addDays(ws, i), ds = ymd(d), dow = d.getDay();
    var list = itemsOn(ds);
    var seen = [], dots = '';
    list.forEach(function(it){ if (seen.indexOf(it.cat) < 0) seen.push(it.cat); });
    seen.slice(0, 3).forEach(function(cid){
      var c = CAT[cid] || CATS[0];
      dots += '<i style="background:' + c.hex + '"></i>';
    });
    var cls = 'day';
    if (dow === 0) cls += ' is-sun';
    if (dow === 6) cls += ' is-sat';
    if (ds === todayStr()) cls += ' is-today';
    if (ds === state.selected) cls += ' is-sel';
    var label = (dow === 0 ? '일' : WD[dow]) + ' ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일';

      '<span class="day-w">' + WD[dow] + '</span>' +
      '<span class="day-n">' + d.getDate() + '</span>' +
      '<span class="day-dots">' + dots + '</span>' +
    '</button>';
  }
  $('#strip').innerHTML = cells;
}

      '<div class="stat"><span class="stat-k">완료</span><span class="stat-v">' + (done ? fmtDur(done) : '0분') + '</span></div>' +

  items.forEach(function(it){ (byDate[it.date] = byDate[it.date] || []).push(it); });

  var rows = Math.ceil((startIdx + daysInMonth) / 7);
  for (var i = 0; i < rows * 7; i++){
    var dayNum, dateStr = null, out = false;
    if (i < startIdx){ dayNum = prevDays - startIdx + 1 + i; out = true; }
    else if (i >= startIdx + daysInMonth){ dayNum = i - startIdx - daysInMonth + 1; out = true; }
    else { dayNum = i - startIdx + 1; dateStr = y + '-' + pad2(m) + '-' + pad2(dayNum); }

    var dObj = addDays(first, i - startIdx);
    var dow = dObj.getDay();
    var cls = 'cal-cell';
    if (out) cls += ' is-out';
    if (dow === 0) cls += ' is-sun';
    if (dow === 6) cls += ' is-sat';
    if (!out && dateStr === todayStr()) cls += ' is-today';
    if (!out && dateStr === state.selected) cls += ' is-sel';

    var evs = '';
    if (!out){
      var list = (byDate[dateStr] || []).slice().sort(byTime);
      list.slice(0, 2).forEach(function(it){
        var c = CAT[it.cat] || CATS[0];
        evs += '<span class="ev' + (it.done ? ' is-done' : '') + '" style="--c:' + c.hex + ';--w:' + c.weak + '">' +
          esc(it.title) + '</span>';
      });
    }

    cells.push(
      '<button class="' + cls + '" role="gridcell"' +
        (out ? ' tabindex="-1"' : ' data-act="pick-day" data-date="' + dateStr + '"') +
        ' aria-label="' + (out ? '' : dayNum + '일, ' + ((byDate[dateStr] || []).length) + '건') + '">' +

    );
  }
  $('#calGrid').innerHTML = cells.join('');
}

/* ============================================================
   6. Timeline geometry (compact with collapsed empty hours)
   ============================================================ */
function tlLayout(placed, fullDay){
  var H = fullDay ? HOUR_F : HOUR_C;

  var lo = START_HOUR, hi = END_HOUR;
  if (!fullDay && placed.length){
    var minS = Infinity, maxE = -Infinity;
    placed.forEach(function(p){ if (p.s < minS) minS = p.s; if (p.e > maxE) maxE = p.e; });
    lo = Math.min(START_HOUR, Math.floor(minS/60));
    hi = Math.max(22, Math.ceil(maxE/60));
    hi = Math.min(24, Math.max(hi, Math.ceil(maxE/60)));
  }

  var occ = {};
  placed.forEach(function(p){
    for (var h = Math.floor(p.s/60); h < Math.ceil(p.e/60); h++){
      if (h >= lo && h < hi) occ[h] = true;
    }
  });

  var rows = [], y = 0, h = lo;
  while (h < hi){
    if (fullDay || occ[h]){ rows.push({t:'h', h:h, y:y, hgt:H}); y += H; h++; }
    else {
      var a = h;
      while (h < hi && !occ[h]) h++;
      rows.push({t:'g', a:a, b:h, y:y, hgt:GAP_H}); y += GAP_H;
    }
  }

  var byHour = {};
  rows.forEach(function(r){ if (r.t === 'h') byHour[r.h] = r; });

  function yFor(min){
    if (min <= lo*60) return 0;
    for (var i = 0; i < rows.length; i++){
      var r = rows[i];
      var t0 = (r.t === 'h' ? r.h : r.a) * 60;
      var t1 = (r.t === 'h' ? r.h + 1 : r.b) * 60;
      if (min >= t0 && min < t1) return r.y + ((min - t0)/(t1 - t0)) * r.hgt;
    }
    return y;
  }
  function minForY(py){
    for (var i = 0; i < rows.length; i++){
      var r = rows[i];
      if (py < r.y + r.hgt){
        if (r.t === 'h') return r.h*60 + ((py - r.y)/r.hgt)*60;
        return r.a*60;
      }
    }
    return END_HOUR*60;
  }
  return {rows:rows, yFor:yFor, minForY:minForY, total:y, lo:lo, hi:hi};
}

/* ============================================================
   7. Render — day (timeline + todo)
   ============================================================ */
function renderDay(){
  var ds = state.selected;
  var d = fromYmd(ds);
  var isToday = ds === todayStr();
  $('#dayTitle').textContent = (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + WD[d.getDay()] + '요일' + (isToday ? ' · 오늘' : '');

  var items = itemsOn(ds).slice().sort(byTime);
  var total = items.reduce(function(a, it){ return a + (it.dur || 0); }, 0);
  var unfixed = items.filter(function(it){ return it.uncertain && !it.confirmed; }).length;

  var sub = items.length
    ? items.length + '건 · ' + (total ? fmtDur(total) : '소요 미정') + (unfixed ? ' · 어림 ' + unfixed : '')
    : '아직 잡힌 일정이 없어요';
  $('#daySub').textContent = sub;

  var rt = $('#rangeToggle');
  rt.style.visibility = items.length ? 'visible' : 'hidden';
  rt.setAttribute('aria-expanded', state.fullDay ? 'true' : 'false');
  rt.innerHTML = (state.fullDay ? '압축해서' : '전체 시간') +
    '<span class="caret" aria-hidden="true">' + (state.fullDay ? '▴' : '▾') + '</span>';

  renderTimeline(items, ds, isToday);
  renderDayTodos(items);
}

function renderTimeline(items, ds, isToday){
  var tl = $('#timeline');

  if (!items.length){
    tl.style.height = 'auto';
    tl.innerHTML = '<div class="tl-empty"><b style="color:var(--text-3);font-weight:600">이 날은 비어 있어요</b>' +
      '위에 한 줄로 적으면<br>시간표와 할 일이 같이 잡혀요.</div>';
    return;
  }

  var placed = layout(placementsFor(ds));
  var L = tlLayout(placed, state.fullDay);
  if (state.fullDay && L.total > 360){
    tl.style.height = '360px';
    tl.style.overflowY = 'auto';
  } else {
    tl.style.height = L.total + 'px';
    tl.style.overflowY = 'visible';
  }

  var grid = '';
  L.rows.forEach(function(r){
    if (r.t === 'h'){
      grid += '<div class="tl-row" style="top:' + r.y + 'px"><i>' + pad2(r.h) + '</i></div>';
    } else {
      grid += '<div class="tl-gap" style="top:' + (r.y + r.hgt/2) + 'px"><span>' + pad2(r.a) + '–' + pad2(r.b) + '</span></div>';
    }
  });

  var blocks = placed.map(function(p){
    var it = p.it, c = CAT[it.cat] || CATS[0];
    var top = L.yFor(p.s), bot = L.yFor(p.e);
    if (top == null) top = 0;
    if (bot == null) bot = top + 24;
    var height = Math.max(bot - top, 21);
    var flex = it.uncertain && !it.confirmed;
    var tiny = height < 30;
    var compact = !tiny && height < 47;
    var cls = 'tl-block' + (flex ? ' is-flex' : '') + (it.done ? ' is-done' : '') +
      (tiny ? ' is-tiny' : compact ? ' is-compact' : '');
    var meta = toHHMM(p.s) + '–' + toHHMM(p.e) +
      (flex ? '<span class="tl-flex-label"> · ' + (it.whenLabel && it.whenLabel.indexOf('틈틈') >= 0 ? '틈틈이' : '어림') + '</span>' : '');
    var leftPct = (p.lane / p.lanes) * 100;
    var widthPct = (1 / p.lanes) * 100;
    var leftStyle = leftPct === 0 ? 'var(--tl-gutter)'
      : 'calc(var(--tl-gutter) + (100% - var(--tl-gutter)) * ' + (leftPct/100).toFixed(4) + ')';
    var widthStyle = p.lanes > 1
      ? 'calc((100% - var(--tl-gutter)) * ' + (widthPct/100).toFixed(4) + ' - 2px)'
      : 'auto';
    return '<button class="' + cls + '" data-act="open-item" data-id="' + it.id + '"' +
        ' data-start="' + p.s + '" data-dur="' + (it.dur || 60) + '"' +
        ' style="--c:' + c.hex + ';--w:' + c.weak + ';top:' + top.toFixed(1) + 'px;height:' + height.toFixed(1) +
        'px;left:' + leftStyle + ';right:' + (p.lanes > 1 ? 'auto' : '0') + ';width:' + widthStyle + '">' +
        '<span class="tl-title">' + esc(it.title) + '</span>' +
        '<span class="tl-meta">' + meta + '</span>' +
        '<span class="grip" data-grip="1" role="button" aria-label="끌어서 시간 옮기기"></span>' +
      '</button>';
  }).join('');

  var nowHTML = '';
  if (isToday){
    var now = new Date();
    var nowMin = now.getHours()*60 + now.getMinutes();
    var ny = L.yFor(nowMin);
    if (ny != null && nowMin >= L.lo*60 && nowMin <= L.hi*60){
      nowHTML = '<div class="tl-now" style="top:' + ny.toFixed(1) + 'px"></div>';
    }
  }

  tl.innerHTML = grid + blocks + nowHTML;
  attachDrag(tl, L);
}

function renderDayTodos(items){
  var el = $('#dayTodos');
  var undated = state.items.filter(function(it){ return !it.date; });

  var doneN = items.filter(function(it){ return it.done; }).length;
  var html = '<div class="dt-head"><b>할 일</b><span>' + (items.length ? doneN + '/' + items.length : '') + '</span></div>';

  if (!items.length){
    html += '<div class="dt-empty">아직 없어요.<br>한 줄로 적으면 여기에 쌓여요.</div>';
  } else {
    html += items.map(function(it){ return todoRowHTML(it, false); }).join('');
  }

  if (undated.length){
    html += '<div class="dt-head" style="margin-top:8px"><b style="color:var(--text-3)">날짜 미정</b><span>' + undated.length + '</span></div>' +
      undated.map(function(it){ return todoRowHTML(it, true); }).join('');
  }

  el.innerHTML = html;
}

function todoRowHTML(it, undated){
  var c = CAT[it.cat] || CATS[0];
  var flex = it.uncertain && !it.confirmed;
  var meta = '';
  if (undated) meta = '날짜 미정';
  else if (it.start) meta = it.start + '–' + toHHMM(toMin(it.start) + (it.dur || 60));
  else meta = flex ? '시간 미정' : '시간 미정';
  var icon = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  return '<div class="dtr' + (it.done ? ' is-done' : '') + '" style="--c:' + c.hex + '">' +
      '<button class="dtc" data-act="toggle-done" data-id="' + it.id + '" aria-pressed="' + (it.done ? 'true':'false') + '" aria-label="' + (it.done ? '완료 취소' : '완료로 표시') + '">' + icon + '</button>' +
      '<button class="dtm-wrap" data-act="open-item" data-id="' + it.id + '" aria-label="' + esc(it.title) + ' 조정">' +
        '<span class="dtt">' + esc(it.title) + '</span>' +
        '<span class="dtm"><span class="dot"></span>' + meta +
          (flex ? ' <span class="flex">· 어림</span>' : '') +
        '</span>' +
      '</button>' +
    '</div>';
}

/* ── drag ─────────────────────────────────────────────── */
var suppressClickUntil = 0;
function attachDrag(root, L){
  root.querySelectorAll('.grip').forEach(function(grip){
    grip.addEventListener('pointerdown', function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      var block = grip.closest('.tl-block');
      if (!block) return;
      var id = block.getAttribute('data-id');
      var it = itemById(id);
      if (!it) return;
      var origStart = parseInt(block.getAttribute('data-start'), 10);
      var dur = parseInt(block.getAttribute('data-dur'), 10) || 60;
      var startY = ev.clientY, moved = false, lastMin = origStart;
      var scrollTop = root.scrollTop || 0;
      var metaEl = block.querySelector('.tl-meta');
      if (grip.setPointerCapture) { try { grip.setPointerCapture(ev.pointerId); } catch(e){} }

      function move(e){
        var dy = e.clientY - startY;
        if (Math.abs(dy) > 2) moved = true;
        var at = L.minForY(L.yFor(origStart) + scrollTop + dy);
        var s = clamp(Math.round(at/15)*15, 0, END_HOUR*60 - dur);
        lastMin = s;
        var y = L.yFor(s);
        if (y != null) block.style.top = y.toFixed(1) + 'px';
        if (metaEl) metaEl.textContent = toHHMM(s) + '–' + toHHMM(s+dur);
      }
      function end(){
        grip.removeEventListener('pointermove', move);
        grip.removeEventListener('pointerup', end);
        grip.removeEventListener('pointercancel', end);
        if (moved){
          it.start = toHHMM(lastMin);
          it.uncertain = false;
          save();
          suppressClickUntil = Date.now() + 400;
          renderAll();
          toast('시간을 ' + toHHMM(lastMin) + '로 옮겼어요');
        }
      }
      grip.addEventListener('pointermove', move);
      grip.addEventListener('pointerup', end);
      grip.addEventListener('pointercancel', end);
    });
  });
}

/* ============================================================
   8. Render — all-task list
   ============================================================ */
function matchDur(it, f){
  if (f === 'all') return true;
  if (f === 'none') return !!it.uncertain || it.dur == null;
  if (it.dur == null) return false;
  if (f === 's') return it.dur <= 30;
  if (f === 'h') return it.dur > 30 && it.dur < 120;
  if (f === 'l') return it.dur >= 120;
  return true;
}

function renderFilters(){
  $('#durChips').innerHTML = DUR_FILTERS.map(function(f){
    return '<button class="chip' + (state.durFilter === f.id ? ' is-on' : '') + '" data-act="dur-filter" data-val="' + f.id + '">' +
      f.label + '</button>';
  }).join('');

  var catChips = [{id:'all', name:'전체', hex:null}].concat(CATS);
  $('#catChips').innerHTML = catChips.map(function(c){
    var on = state.catFilter === c.id;
    return '<button class="chip' + (on ? ' is-on' : '') + '" data-act="cat-filter" data-val="' + c.id + '">' +
      (c.hex ? '<span class="dot" style="background:' + c.hex + '"></span>' : '') + esc(c.name) + '</button>';
  }).join('');
}

function renderList(){
  var arr = state.items.slice();
  if (state.catFilter !== 'all') arr = arr.filter(function(it){ return it.cat === state.catFilter; });
  if (state.durFilter !== 'all') arr = arr.filter(function(it){ return matchDur(it, state.durFilter); });

  arr.sort(function(a,b){
    var ad = a.date || '9999-99-99', bd = b.date || '9999-99-99';
    if (ad !== bd) return ad < bd ? -1 : 1;
    return byTime(a, b);
  });

  var doneAll = state.items.filter(function(it){ return it.done; }).length;
  $('#doneCount').textContent = doneAll + ' / ' + state.items.length + ' 완료';

  if (!arr.length){
    $('#rows').innerHTML = '<div class="empty">이 조건에 맞는 일정이 없어요.<br>필터를 바꾸거나 새로 적어보세요.</div>';
    return;
  }

  var checkSvg = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  $('#rows').innerHTML = arr.map(function(it){
    var c = CAT[it.cat] || CATS[0];
    var flex = it.uncertain && !it.confirmed;
    var when;
    if (!it.date) when = '날짜 미정';
    else if (it.start) when = dayLabel(it.date) + ' · ' + it.start + '–' + toHHMM(toMin(it.start) + (it.dur || 60));
    else when = dayLabel(it.date) + ' · 시간 미정';

    var durTxt = it.dur != null ? fmtDurChip(it.dur) : '소요 미정';
    var sub = it.checks && it.checks.length
      ? '<div class="row-sub' + (it.checks.every(function(x){ return x.done; }) ? ' is-done' : '') + '">' +
          it.checks.map(function(ch, idx){
            return '<button class="mini-check" data-act="toggle-check" data-id="' + it.id + '" data-idx="' + idx + '" aria-pressed="' + (ch.done ? 'true':'false') + '">' +
              '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
              '<span>' + esc(ch.text) + '</span>';
          }).join(' ') +
        '</div>'
      : '';

    return '<div class="row' + (it.done ? ' is-done' : '') + '" style="--c:' + c.hex + '">' +
        '<button class="check" data-act="toggle-done" data-id="' + it.id + '" aria-pressed="' + (it.done ? 'true':'false') + '" aria-label="' + (it.done ? '완료 취소' : '완료') + '">' + checkSvg + '</button>' +
        '<div class="row-main" data-act="open-item" data-id="' + it.id + '" role="button" tabindex="0">' +
          '<div class="row-title">' + esc(it.title) + '</div>' +
          '<div class="row-meta">' +
            '<span class="dot"></span>' + esc(c.name) +
            '<span class="sep">·</span>' + when +
            '<span class="sep">·</span>' + durTxt +
            (flex ? '<span class="sep">·</span><span style="color:var(--brand-strong)">어림</span>' : '') +
          '</div>' + sub +
        '</div>' +
      '</div>';
  }).join('');
}

/* ============================================================
   9. Render — composer preview
   ============================================================ */
var draft = null;
var openChipDim = null;

function chipLabel(dim){
  if (!draft) return '';
  if (dim === 'date'){
    if (draft.date === todayStr()) return '오늘 ' + mdLabel(draft.date);
    if (draft.date === ymd(addDays(new Date(),1))) return '내일 ' + mdLabel(draft.date);
    return dayLabel(draft.date);
  }
  if (dim === 'time') return draft.start ? draft.start : '시간 미정';
  if (dim === 'dur') return fmtDurChip(draft.dur);
  if (dim === 'cat') return (CAT[draft.cat] || CATS[0]).name;
  return '';
}

function chipOptions(dim){
  var opts = [];
  if (dim === 'date'){
    var base = new Date();
    opts.push({v: todayStr(), l: '오늘'});
    opts.push({v: ymd(addDays(base,1)), l: '내일'});
    opts.push({v: ymd(addDays(base,2)), l: '모레'});
    for (var i = 3; i < 10; i++){
      var d = addDays(base, i);
      opts.push({v: ymd(d), l: WD[d.getDay()] + ' ' + (d.getMonth()+1) + '/' + d.getDate()});
    }
  } else if (dim === 'time'){
    opts.push({v: '', l: '미정'});
    for (var h = 9; h <= 23; h++) opts.push({v: pad2(h) + ':00', l: pad2(h) + ':00'});
  } else if (dim === 'dur'){
    opts.push({v: '', l: '미정'});
    [15,30,45,60,90,120,180,240].forEach(function(mn){ opts.push({v: String(mn), l: fmtDurChip(mn)}); });
  } else if (dim === 'cat'){
    CATS.forEach(function(c){ opts.push({v: c.id, l: c.name}); });
  }
  return opts;
}

function renderPreview(){
  var pv = $('#preview');
  var addBtn = $('#addBtn');
  var raw = $('#quickInput').value;

  if (!raw.trim()){
    pv.hidden = true; pv.innerHTML = '';
    draft = null; addBtn.disabled = true;
    openChipDim = null;
    $('#quickBar').classList.remove('is-open');
    return;
  }

  draft = parseSentence(raw);
  if (!draft || !draft.title){
    pv.hidden = true; addBtn.disabled = true;
    return;
  }

  pv.hidden = false;
  addBtn.disabled = false;
  $('#quickBar').classList.add('is-open');

  var flex = draft.uncertain && !draft.start;

  var chips = '';
  chips += chipHTML('date', chipLabel('date'), false);
  chips += chipHTML('time', chipLabel('time'), !draft.start);
  chips += chipHTML('dur', chipLabel('dur'), draft.dur == null);
  chips += chipHTML('cat', chipLabel('cat'), false);

  var optsHTML = '';
  if (openChipDim){
    var opts = chipOptions(openChipDim);
    optsHTML = '<div class="chip-opts" role="group" aria-label="' + openChipDim + ' 선택">' +
      opts.map(function(o){
        var on = String(o.v) === String(openChipDim === 'date' ? draft.date : openChipDim === 'time' ? (draft.start || '') : openChipDim === 'dur' ? (draft.dur == null ? '' : draft.dur) : draft.cat);
        return '<button class="opt' + (on ? ' is-on' : '') + '" data-act="chip-pick" data-dim="' + openChipDim + '" data-val="' + esc(o.v) + '">' + esc(o.l) + '</button>';
      }).join('') + '</div>';
  }

  pv.innerHTML =
    '<div class="preview-title">' + esc(draft.title) + '</div>' +
    (draft.memo ? '<div class="preview-note">메모 · ' + esc(draft.memo) + '</div>' : '') +
    (draft.checks.length ? '<div class="preview-note">체크 · ' + esc(draft.checks.map(function(x){return x.text;}).join(', ')) + '</div>' : '') +
    '<div class="p-chips">' + chips +
      (flex ? '<span class="p-chip is-flex">어림 배치</span>' : '') +
    '</div>' + optsHTML;
}

function chipHTML(dim, label, isFlex){
  return '<button class="p-chip' + (isFlex ? ' is-flex' : '') + '" data-act="chip-open" data-dim="' + dim + '" aria-expanded="' + (openChipDim === dim) + '">' +
    '<b>' + esc(label) + '</b><span class="caret">▾</span></button>';
}

/* ============================================================
   10. Sheet (draft edit · fixed head / fixed action bar)
   ============================================================ */
var sheetId = null;
var shDraft = null;
var shFocus = null;

function openSheet(id){
  var it = itemById(id);
  if (!it) return;
  sheetId = id;
  shDraft = JSON.parse(JSON.stringify(it));
  shDraft.date = it.date;
  shFocus = null;
  renderSheet();
  var w = $('#sheetWrap');
  w.classList.add('is-open');
  w.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  var b = $('#shBody');
  if (b) b.scrollTop = 0;
  var t = $('#shTitle');
  if (t){ t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 52) + 'px'; }
}

function closeSheet(){
  sheetId = null;
  shDraft = null;
  shFocus = null;
  var w = $('#sheetWrap');
  w.classList.remove('is-open');
  w.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  renderAll();
}

function saveSheet(){
  var it = itemById(sheetId);
  if (!it || !shDraft) return;
  var prev = JSON.parse(JSON.stringify(it));
  var id = sheetId;

  ['title','start','dur','cat','uncertain','confirmed','memo','checks','whenLabel','date'].forEach(function(k){
    if (typeof shDraft[k] !== 'undefined') it[k] = shDraft[k];
  });
  if (!it.title || !String(it.title).trim()) it.title = prev.title;
  it.title = String(it.title).trim();

  state.selected = it.date;
  state.cursor = it.date.slice(0,7);
  save();
  closeSheet();
  toast('저장했어요', '되돌리기', function(){
    var cur = itemById(id);
    if (!cur) return;
    Object.keys(prev).forEach(function(k){ cur[k] = prev[k]; });
    save(); renderAll();
  });
}

function sheetBaseStart(){
  if (shDraft.start != null) return toMin(shDraft.start);
  var pl = placementsFor(shDraft.date).filter(function(p){ return p.it.id === sheetId; })[0];
  return pl ? pl.s : 19*60;
}

function renderSheet(){
  if (!shDraft) return;
  var it = shDraft;
  var c = CAT[it.cat] || CATS[0];
  var flex = it.uncertain && !it.confirmed;
  var s = sheetBaseStart();
  var e = s + (it.dur || 60);

  var bodyScroll = 0;
  var oldBody = $('#shBody');
  if (oldBody) bodyScroll = oldBody.scrollTop;

  var catsHTML = '<div class="cats">' + CATS.map(function(cc){
    return '<button class="cat-chip' + (it.cat === cc.id ? ' is-on' : '') + '" data-act="sheet-cat" data-val="' + cc.id + '" aria-pressed="' + (it.cat === cc.id ? 'true' : 'false') + '">' +
      '<span class="dot" style="background:' + cc.hex + '"></span>' + cc.name + '</button>';
  }).join('') + '</div>';

  var timeChips = '<div class="chips is-scroll">';
  timeChips += '<button class="chip' + (it.start == null ? ' is-on' : '') + '" data-act="sheet-time" data-val="">미정</button>';
  for (var h = 9; h <= 23; h++){
    var v = pad2(h) + ':00';
    timeChips += '<button class="chip' + (it.start === v ? ' is-on' : '') + '" data-act="sheet-time" data-val="' + v + '">' + v + '</button>';
  }
  timeChips += '</div>';

  var subs = (it.checks || []).map(function(ch, idx){
    return '<div class="sub-row' + (ch.done ? ' is-done' : '') + '">' +
      '<button class="mini-check" data-act="sheet-check" data-idx="' + idx + '" aria-pressed="' + (ch.done ? 'true':'false') + '">' +
        '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
      '<span>' + esc(ch.text) + '</span>' +
      '<button class="del" data-act="del-check" data-idx="' + idx + '">삭제</button>' +
    '</div>';
  }).join('');

  $('#sheet').innerHTML =
    '<div class="sh-head">' +
      '<div class="sh-grab" aria-hidden="true"></div>' +
      '<div class="sh-top">' +
        '<span class="sh-cat" style="--c:' + c.hex + ';--w:' + c.weak + '"><span class="dot"></span>' + esc(c.name) + '</span>' +
        '<button class="sh-x" data-act="sheet-cancel">닫기</button>' +
      '</div>' +
      '<textarea class="sh-title" id="shTitle" rows="1" aria-label="일정 제목">' + esc(it.title) + '</textarea>' +
    '</div>' +

    '<div class="sh-body" id="shBody">' +
      '<div class="sh-sec">' +
        '<div class="sh-label">카테고리<span class="hint">태그를 눌러 바로 바꿔요</span></div>' +
        catsHTML +
      '</div>' +

      '<div class="sh-sec">' +
        '<div class="sh-label">시간' + (flex ? '<span class="hint">지금은 어림 배치</span>' : '') + '</div>' +
        '<div class="sh-time">' +
          '<button class="nudge-lg" data-act="sheet-nudge" data-dir="-1">▲ 30분 앞</button>' +
          '<span class="sh-time-v">' + toHHMM(s) + '–' + toHHMM(e) + '</span>' +
          '<button class="nudge-lg" data-act="sheet-nudge" data-dir="1">▼ 30분 뒤</button>' +
        '</div>' +
        timeChips +
        '<button class="switch" data-act="sheet-confirm" aria-pressed="' + (it.confirmed ? 'true':'false') + '">' +
          '<span>' + (it.confirmed ? '확정된 시간이에요' : '아직 어림 시간이에요') + '</span>' +
          '<span class="knob" aria-hidden="true"></span>' +
        '</button>' +
      '</div>' +

      '<div class="sh-sec">' +
        '<div class="sh-label">메모</div>' +
        '<textarea class="sh-memo" id="shMemo" placeholder="메모를 남겨두세요">' + esc(it.memo || '') + '</textarea>' +
      '</div>' +

      '<div class="sh-sec">' +
        '<div class="sh-label">체크</div>' +
        '<div class="sub-list">' + subs + '</div>' +
        '<div class="sub-add">' +
          '<input id="subInput" placeholder="체크할 일 (예: 가기 전 전화)" aria-label="체크할 일 추가">' +
          '<button data-act="add-check">추가</button>' +
        '</div>' +
      '</div>' +

      '<div class="sh-extra">' +
        '<button class="btn-ghost" data-act="sheet-today">' + (it.date === todayStr() ? '오늘 일정이에요' : '오늘로 옮기기') + '</button>' +
        '<button class="btn-ghost is-danger" data-act="sheet-del">삭제</button>' +
      '</div>' +
    '</div>' +

    '<div class="sh-foot">' +
      '<button class="btn-cancel" data-act="sheet-cancel">취소</button>' +
      '<button class="btn-save" data-act="sheet-save">저장</button>' +
    '</div>';

  /* 제목 */
  var t = $('#shTitle');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 52) + 'px';
  t.addEventListener('input', function(){
    var v = this.value.replace(/\n/g, ' ');
    if (shDraft) shDraft.title = v;
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 52) + 'px';
  });
  t.addEventListener('focus', function(){ shFocus = 'title'; });
  t.addEventListener('blur', function(){ if (this.value.trim() && shDraft) shDraft.title = this.value; });

  /* 메모 */
  var memoEl = $('#shMemo');
  memoEl.addEventListener('input', function(){ if (shDraft) shDraft.memo = this.value; });
  memoEl.addEventListener('focus', function(){ shFocus = 'memo'; });

  /* 체크 추가 */
  var subInput = $('#subInput');
  subInput.addEventListener('focus', function(){ shFocus = 'sub'; });
  subInput.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter'){ ev.preventDefault(); addCheck(); }
  });

  /* 스크롤 위치·포커스 복원 */
  var nb = $('#shBody');
  if (nb) nb.scrollTop = bodyScroll;
  if (shFocus === 'title'){
    t.focus();
    var tl = t.value.length;
    try { t.setSelectionRange(tl, tl); } catch(e){}
  } else if (shFocus === 'memo'){
    memoEl.focus();
    var ml = memoEl.value.length;
    try { memoEl.setSelectionRange(ml, ml); } catch(e){}
  } else if (shFocus === 'sub'){
    var si = $('#subInput');
    if (si) si.focus();
  }
}

function addCheck(){
  var input = $('#subInput');
  if (!shDraft || !input) return;
  var v = input.value.trim();
  if (!v) return;
  shDraft.checks = shDraft.checks || [];
  shDraft.checks.push({text: v, done: false});
  shFocus = 'sub';
  renderSheet();
  var ni = $('#subInput');
  if (ni){ ni.value = ''; ni.focus(); }
}

/* ============================================================
   11. Toast
   ============================================================ */
var toastTimer = null;
function toast(msg, actionLabel, actionFn){
  var el = $('#toast');
  el.innerHTML = '<span>' + esc(msg) + '</span>' +
    (actionLabel ? '<button type="button" id="toastAct">' + esc(actionLabel) + '</button>' : '');
  el.hidden = false;
  requestAnimationFrame(function(){ el.classList.add('is-on'); });
  if (actionLabel && actionFn){
    var b = $('#toastAct');
    b.addEventListener('click', function(){
      hideToast();
      actionFn();
    });
  }
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, actionLabel ? 4200 : 2000);
}
function hideToast(){
  var el = $('#toast');
  el.classList.remove('is-on');
  setTimeout(function(){ el.hidden = true; }, 200);
}

/* ============================================================
   12. Render all
   ============================================================ */
function renderAll(){
  renderCalendar();
  renderDay();
  renderFilters();
  renderList();
}

/* ============================================================
   13. Actions (event delegation)
   ============================================================ */
document.addEventListener('click', function(ev){
  if (Date.now() < suppressClickUntil) return;
  var el = ev.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');
  var id = el.getAttribute('data-id');

  /* ---- calendar nav ---- */
  if (act === 'cal-prev' || act === 'cal-next'){
    var dir = (act === 'cal-next') ? 1 : -1;
    if (state.view === 'month'){
      var cur = state.cursor || (state.selected || todayStr()).slice(0,7);
      var y = parseInt(cur.slice(0,4),10), m = parseInt(cur.slice(5,7),10);
      var d = new Date(y, m-1 + dir, 1);
      state.cursor = ymd(d).slice(0,7);
      save(); renderCalendar();
    } else {
      var nd = addDays(fromYmd(state.selected || todayStr()), dir * 7);
      state.selected = ymd(nd);
      state.cursor = state.selected.slice(0,7);
      save(); renderAll();
    }
    return;
  }

  /* ---- view toggles ---- */
  if (act === 'toggle-month'){
    state.view = (state.view === 'month') ? 'week' : 'month';
    if (state.view === 'month') state.cursor = (state.selected || todayStr()).slice(0,7);
    save(); renderCalendar();
    return;
  }
  if (act === 'toggle-range'){
    state.fullDay = !state.fullDay;
    save(); renderDay();
    return;
  }

  /* ---- pick day ---- */
  if (act === 'pick-day'){
    var ds = el.getAttribute('data-date');
    if (!ds) return;
    state.selected = ds;
    if (ds.slice(0,7) !== state.cursor) state.cursor = ds.slice(0,7);
    save(); renderAll();
    return;
  }

  /* ---- today ---- */
  if (act === 'today'){
    var t = todayStr();
    state.selected = t;
    state.cursor = t.slice(0,7);
    save(); renderAll();
    toast(dayLabel(t) + '로 왔어요');
    return;
  }

  /* ---- open item ---- */
  if (act === 'open-item'){
    openSheet(id);
    return;
  }

  /* ---- toggle done ---- */
  if (act === 'toggle-done'){
    var ti = itemById(id);
    if (!ti) return;
    ti.done = !ti.done;
    save(); renderAll();
    if (ti.done) toast('완료로 표시했어요', '되돌리기', function(){ ti.done = false; save(); renderAll(); });
    return;
  }

  /* ---- toggle sub check (list) ---- */
  if (act === 'toggle-check'){
    var ci = itemById(id);
    var idx = parseInt(el.getAttribute('data-idx'), 10);
    if (!ci || !ci.checks || !ci.checks[idx]) return;
    ci.checks[idx].done = !ci.checks[idx].done;
    save(); renderAll();
    return;
  }

  /* ---- filters ---- */
  if (act === 'dur-filter'){
    state.durFilter = el.getAttribute('data-val');
    save(); renderFilters(); renderList();
    return;
  }
  if (act === 'cat-filter'){
    state.catFilter = el.getAttribute('data-val');
    save(); renderFilters(); renderList();
    return;
  }

  /* ---- composer chips ---- */
  if (act === 'chip-open'){
    var dim = el.getAttribute('data-dim');
    openChipDim = (openChipDim === dim) ? null : dim;
    renderPreview();
    return;
  }
  if (act === 'chip-pick'){
    if (!draft) return;
    var dim2 = el.getAttribute('data-dim');
    var val = el.getAttribute('data-val');
    if (dim2 === 'date') draft.date = val;
    if (dim2 === 'time'){ draft.start = val || null; draft.uncertain = !val; }
    if (dim2 === 'dur') draft.dur = val ? parseInt(val, 10) : null;
    if (dim2 === 'cat') draft.cat = val;
    openChipDim = null;
    renderPreview();
    return;
  }

  /* ---- sheet ---- */
  if (act === 'sheet-close'){ closeSheet(); return; }
  if (act === 'sheet-cancel'){ closeSheet(); return; }
  if (act === 'sheet-save'){ saveSheet(); return; }

  if (act === 'sheet-nudge'){
    if (!shDraft) return;
    var dir2 = parseInt(el.getAttribute('data-dir'), 10);
    var nd2 = shDraft.dur || 60;
    shDraft.start = toHHMM(clamp(sheetBaseStart() + dir2*30, 0, END_HOUR*60 - nd2));
    if (shDraft.confirmed) shDraft.uncertain = false;
    renderSheet();
    return;
  }

  if (act === 'sheet-time'){
    if (!shDraft) return;
    var v2 = el.getAttribute('data-val');
    shDraft.start = v2 || null;
    if (!v2) shDraft.confirmed = false;
    else shDraft.uncertain = false;
    renderSheet();
    return;
  }

  if (act === 'sheet-confirm'){
    if (!shDraft) return;
    if (!shDraft.confirmed && shDraft.start == null) shDraft.start = toHHMM(sheetBaseStart());
    shDraft.confirmed = !shDraft.confirmed;
    if (shDraft.confirmed) shDraft.uncertain = false;
    renderSheet();
    return;
  }

  if (act === 'sheet-cat'){
    if (!shDraft) return;
    shDraft.cat = el.getAttribute('data-val');
    renderSheet();
    return;
  }

  if (act === 'sheet-check'){
    if (!shDraft || !shDraft.checks) return;
    var ii = parseInt(el.getAttribute('data-idx'), 10);
    if (!shDraft.checks[ii]) return;
    shDraft.checks[ii].done = !shDraft.checks[ii].done;
    renderSheet();
    return;
  }

  if (act === 'add-check'){ addCheck(); return; }

  if (act === 'del-check'){
    if (!shDraft || !shDraft.checks) return;
    var dix = parseInt(el.getAttribute('data-idx'), 10);
    shDraft.checks.splice(dix, 1);
    renderSheet();
    return;
  }

  if (act === 'sheet-today'){
    if (!shDraft) return;
    shDraft.date = todayStr();
    renderSheet();
    return;
  }

  if (act === 'sheet-del'){
    var dd = itemById(sheetId);
    if (!dd) return;
    var backup = JSON.parse(JSON.stringify(dd));
    state.items = state.items.filter(function(x){ return x.id !== dd.id; });
    save();
    closeSheet();
    toast('삭제했어요', '되돌리기', function(){
      state.items.push(backup);
      save(); renderAll();
    });
    return;
  }

  if (act === 'reset'){
    if (!window.confirm('저장된 일정을 모두 지우고 처음 상태로 돌아갈까요?')) return;
    state = {version:2, items:seedItems(), cursor:null, selected:null, view:'week', fullDay:false, catFilter:'all', durFilter:'all'};
    initCursor();
    save(); renderAll();
    toast('처음 상태로 돌아왔어요');
    return;
  }
});

/* keyboard */
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape' && sheetId){ closeSheet(); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('.row-main[data-act]')){
    ev.preventDefault();
    openSheet(ev.target.getAttribute('data-id'));
  }
});

/* ============================================================
   14. Composer wiring
   ============================================================ */
var inputTimer = null;
$('#quickInput').addEventListener('input', function(){
  clearTimeout(inputTimer);
  inputTimer = setTimeout(renderPreview, 160);
});
$('#quickInput').addEventListener('keydown', function(ev){
  if (ev.key === 'Enter'){
    ev.preventDefault();
    if (!draft) renderPreview();
    if (draft && draft.title) addFromComposer();
  }
});
$('#quickInput').addEventListener('focus', function(){
  if (this.value.trim()) $('#quickBar').classList.add('is-open');
});
$('#quickInput').addEventListener('blur', function(){
  if (!this.value.trim()) $('#quickBar').classList.remove('is-open');
});

function addFromComposer(){
  if (!draft || !draft.title) return;
  var it = {
    id: uid(),
    title: draft.title,
    date: draft.date,
    start: draft.start,
    dur: draft.dur,
    cat: draft.cat,
    uncertain: !!draft.uncertain,
    confirmed: false,
    whenLabel: draft.whenLabel || '',
    memo: draft.memo || '',
    checks: (draft.checks || []).slice(),
    done: false,
    createdAt: Date.now()
  };
  state.items.push(it);
  state.selected = it.date;
  state.cursor = it.date.slice(0,7);
  save();

  var qi = $('#quickInput');
  qi.value = '';
  $('#preview').hidden = true;
  $('#preview').innerHTML = '';
  $('#quickBar').classList.remove('is-open');
  draft = null;
  openChipDim = null;
  $('#addBtn').disabled = true;
  renderAll();

  var when = it.start ? (mdLabel(it.date) + ' ' + it.start) : (mdLabel(it.date) + ' · 어림 배치');
  toast(when + ' · ' + fmtDurChip(it.dur) + '으로 담았어요', '되돌리기', function(){
    state.items = state.items.filter(function(x){ return x.id !== it.id; });
    save(); renderAll();
  });
}

$('#addBtn').addEventListener('click', function(){ if (!draft) renderPreview(); addFromComposer(); });

/* keyboard offset (iOS): keep sheet + save bar above the keyboard */
(function(){
  var vv = window.visualViewport;
  if (!vv) return;
  function apply(){
    var kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
    document.documentElement.style.setProperty('--kb', (kb > 80 ? kb : 0) + 'px');
  }
  vv.addEventListener('resize', apply);
  vv.addEventListener('scroll', apply);
})();

/* ============================================================
   15. Init
   ============================================================ */
function initCursor(){
  var t = todayStr();
  var monthHasItems = state.items.some(function(it){ return it.date && it.date.slice(0,7) === t.slice(0,7); });
  if (!state.cursor){
    if (monthHasItems || !state.items.length){
      state.cursor = t.slice(0,7);
    } else {
      var dates = state.items.map(function(it){ return it.date; }).filter(Boolean).sort();
      state.cursor = dates.length ? dates[0].slice(0,7) : t.slice(0,7);
    }
  }
  if (!state.selected){
    if (state.items.some(function(it){ return it.date === t; })){
      state.selected = t;
    } else {
      var upcoming = state.items.map(function(it){ return it.date; }).filter(function(ds){ return ds && ds >= t; }).sort()[0];
      state.selected = upcoming || t;
    }
  }
}

migrate();
initCursor();
renderAll();

/* 날짜가 바뀌면(자정·복귀) 다시 그림 */
var lastToday = todayStr();
setInterval(function(){
  var t = todayStr();
  if (t !== lastToday){ lastToday = t; renderAll(); }
}, 30000);
document.addEventListener('visibilitychange', function(){
  if (!document.hidden){
    var t = todayStr();
    if (t !== lastToday){ lastToday = t; renderAll(); }
    else { renderDay(); }
  }
});

/* 노출: 문장 파싱·상태 확인용 (읽기 전용 사용) */
window.__tt = {
  parse: parseSentence,
  state: function(){ return state; },
  placements: placementsFor,
  save: save
};

})();
