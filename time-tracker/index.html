<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="한 줄로 적으면 날짜·시간·소요를 읽어 월간 캘린더와 일별 타임테이블에 담아주는 화이트 모드 타임 트래커.">
<title>타임 트래커</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ============================================================
   DESIGN TOKENS
   구조·역할: SEED(당근) role-based color / type scale / radius / spacing
   명도·시맨틱: KT Seamless Flow gray scale + text·border·surface 역할
   화이트 모드 전용 — 순백 배경, 쿨화이트 서피스, 헤어라인 보더
   ============================================================ */
:root{
  /* ── Font ────────────────────────────────────────────── */
  --font-sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',Roboto,sans-serif;

  /* ── Type scale (SEED t1–t11) ─────────────────────────── */
  --fs-11:.6875rem;  /* 11 */
  --fs-12:.75rem;    /* 12 */
  --fs-13:.8125rem;  /* 13 */
  --fs-14:.875rem;   /* 14 */
  --fs-16:1rem;      /* 16 */
  --fs-18:1.125rem;  /* 18 */
  --fs-20:1.25rem;   /* 20 */
  --fs-22:1.375rem;  /* 22 */
  --fs-24:1.5rem;    /* 24 */
  --fs-28:1.75rem;   /* 28 */
  --fw-r:400; --fw-m:500; --fw-b:700;
  --tr-tight:-.018em; --tr-tighter:-.032em;

  /* ── Color primitives: neutral (KT gray scale) ────────── */
  --white:#FFFFFF;
  --gray-25:#F8F9FA;
  --gray-50:#F3F4F6;
  --gray-75:#EEEFF2;
  --gray-100:#E9EAEE;
  --gray-150:#D5D8DD;
  --gray-200:#C7CAD1;
  --gray-300:#ADB1B9;
  --gray-400:#8B8F97;
  --gray-500:#6F737B;
  --gray-600:#55585D;
  --gray-700:#3D3F43;
  --gray-900:#191A1B;
  --ink:#131415;

  /* ── Color: semantic roles ────────────────────────────── */
  --bg:var(--white);
  --surface:var(--white);
  --surface-cool:var(--gray-25);
  --surface-sunken:var(--gray-50);
  --surface-active:var(--gray-900);
  --border-hair:var(--gray-100);
  --border-strong:var(--gray-150);
  --border-focus:var(--ink);
  --text-1:#1A1B1D;          /* 본문·제목 (gray 900+) */
  --text-2:var(--gray-600);  /* 보조 */
  --text-3:var(--gray-500);  /* 3차 */
  --text-4:#A9AEB6;          /* placeholder·disabled */
  --text-inverse:var(--white);

  /* ── Brand accent ─────────────────────────────────────── */
  --brand:#FF5A36;
  --brand-strong:#E8431F;
  --brand-weak:#FFF1EC;
  --now:#FF5A36;

  /* ── Category semantic colors ─────────────────────────── */
  --c-work:#2E5FE8;      --c-work-w:#EDF2FE;
  --c-side:#6B46D6;      --c-side-w:#F2EEFE;
  --c-errand:#96630A;    --c-errand-w:#FDF4E1;
  --c-study:#0B7C74;     --c-study-w:#E4F5F3;
  --c-promise:#C23A6C;   --c-promise-w:#FDECF2;

  /* ── Radius ───────────────────────────────────────────── */
  --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:22px; --r-full:999px;

  /* ── Spacing ──────────────────────────────────────────── */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;
  --gutter:var(--sp-4);

  /* ── Timeline ─────────────────────────────────────────── */
  --hour-h:40px;
  --tl-gutter:42px;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text-1);
  font-family:var(--font-sans);font-size:var(--fs-16);line-height:1.5;
  letter-spacing:var(--tr-tight);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  word-break:keep-all;
}
button,textarea,input{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
::selection{background:var(--brand-weak);color:var(--brand-strong)}

/* ── Top bar ─────────────────────────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(255,255,255,.90);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);
  backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--border-hair);
}
.topbar-in{
  max-width:520px;margin:0 auto;padding:11px var(--gutter);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.logo{display:flex;align-items:center;gap:8px;min-width:0}
.logo-mark{
  width:18px;height:18px;border-radius:5px;flex:none;
  background:var(--ink);position:relative;overflow:hidden;
}
.logo-mark::before,.logo-mark::after{
  content:"";position:absolute;left:4px;border-radius:2px;background:var(--white);
}
.logo-mark::before{top:4px;width:10px;height:2.5px}
.logo-mark::after{top:9px;width:6px;height:2.5px;background:var(--brand)}
.logo-text{font-size:var(--fs-14);font-weight:var(--fw-b);letter-spacing:var(--tr-tighter)}
.today-btn{
  height:30px;padding:0 12px;border-radius:var(--r-full);
  border:1px solid var(--border-strong);
  font-size:var(--fs-12);font-weight:var(--fw-m);color:var(--text-2);
  background:var(--white);white-space:nowrap;
}
.today-btn:active{background:var(--surface-sunken)}

/* ── Layout ──────────────────────────────────────────────── */
.wrap{max-width:520px;margin:0 auto;padding:14px var(--gutter) 96px;
  display:flex;flex-direction:column;gap:12px}
.panel{
  border:1px solid var(--border-hair);border-radius:var(--r-xl);
  background:var(--surface);padding:15px 14px 14px;
}
.panel-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:10px;margin-bottom:12px;
}
.panel-note{font-size:var(--fs-12);color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── Composer ────────────────────────────────────────────── */
.composer{
  border:1px solid var(--border-hair);border-radius:var(--r-xl);
  background:var(--surface);padding:14px;
}
.composer-label{font-size:var(--fs-13);font-weight:var(--fw-b);letter-spacing:var(--tr-tighter)}
.composer-sub{font-size:var(--fs-11);color:var(--text-3);margin-top:2px;line-height:1.45}
.quick-input{
  display:block;width:100%;margin-top:10px;padding:11px 12px;
  border:1px solid var(--border-hair);border-radius:var(--r-md);
  background:var(--surface-cool);
  font-size:var(--fs-14);line-height:1.5;resize:none;
  min-height:64px;outline:none;transition:border-color .14s,background .14s;
}
.quick-input::placeholder{color:var(--text-4)}
.quick-input:focus{border-color:var(--border-focus);background:var(--white)}
.composer-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.composer-hint{
  font-size:var(--fs-11);color:var(--text-4);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.btn-primary{
  flex:none;height:34px;padding:0 16px;border-radius:var(--r-full);
  background:var(--ink);color:var(--text-inverse);
  font-size:var(--fs-13);font-weight:var(--fw-b);letter-spacing:var(--tr-tighter);
  transition:opacity .14s,transform .14s;
}
.btn-primary[disabled]{background:var(--gray-75);color:var(--text-4);cursor:default}
.btn-primary:not([disabled]):active{transform:scale(.97);opacity:.86}

/* parse preview */
.preview{margin-top:10px;padding-top:11px;border-top:1px dashed var(--border-strong)}
.preview-title{
  font-size:var(--fs-16);font-weight:var(--fw-b);letter-spacing:var(--tr-tighter);
  line-height:1.35;
}
.preview-note{font-size:var(--fs-11);color:var(--text-3);margin-top:3px}
.p-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.p-chip{
  display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;
  border-radius:var(--r-full);border:1px solid var(--border-hair);
  background:var(--surface-cool);font-size:var(--fs-12);color:var(--text-2);
  font-variant-numeric:tabular-nums;
}
.p-chip b{font-weight:var(--fw-m);color:var(--text-1)}
.p-chip .caret{font-size:9px;color:var(--text-4);line-height:1}
.p-chip[aria-expanded="true"]{border-color:var(--ink);background:var(--white)}
.p-chip.is-flex{border-style:dashed;color:var(--text-3)}
.chip-opts{display:flex;gap:6px;margin-top:8px;padding-bottom:2px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.chip-opts::-webkit-scrollbar{display:none}
.chip-opts::-webkit-scrollbar{display:none}
.opt{
  flex:none;height:28px;padding:0 11px;border-radius:var(--r-full);
  border:1px solid var(--border-hair);background:var(--white);
  font-size:var(--fs-12);color:var(--text-2);font-variant-numeric:tabular-nums;
}
.opt.is-on{background:var(--ink);border-color:var(--ink);color:var(--white)}

/* ── Month ───────────────────────────────────────────────── */
.month-nav{display:flex;align-items:center;gap:4px}
.month-title{font-size:var(--fs-16);font-weight:var(--fw-b);letter-spacing:var(--tr-tighter);min-width:104px;text-align:center}
.icon-btn{
  width:28px;height:28px;border-radius:var(--r-full);
  display:grid;place-items:center;font-size:16px;line-height:1;color:var(--text-3);
}
.icon-btn:active{background:var(--surface-sunken)}

.sum-stats{display:flex;gap:6px;margin-bottom:12px}
.stat{
  flex:1;padding:9px 10px;border-radius:var(--r-md);background:var(--surface-cool);
  display:flex;flex-direction:column;gap:1px;min-width:0;
}
.stat-k{font-size:var(--fs-11);color:var(--text-3);line-height:1.2}
.stat-v{font-size:var(--fs-14);font-weight:var(--fw-b);letter-spacing:var(--tr-tighter);
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum-dist{display:flex;height:6px;border-radius:var(--r-full);overflow:hidden;background:var(--gray-75)}
.sum-dist span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:9px}
.legend li{list-style:none;display:flex;align-items:center;gap:5px;font-size:var(--fs-11);color:var(--text-3)}
.legend .swatch{width:7px;height:7px;border-radius:2px;flex:none}
.legend b{font-weight:var(--fw-m);color:var(--text-2);font-variant-numeric:tabular-nums}

.cal-week{display:grid;grid-template-columns:repeat(7,1fr);margin:12px 0 4px}
.cal-week span{
  text-align:center;font-size:var(--fs-11);font-weight:var(--fw-m);color:var(--text-3);
  padding-bottom:4px;
}
.cal-week span:first-child{color:#C0492F}
.cal-week span:last-child{color:#3358A8}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px 2px}
.cal-cell{
  position:relative;height:66px;min-width:0;overflow:hidden;padding:4px 3px 5px;border-radius:var(--r-sm);
  border:1px solid transparent;text-align:left;display:flex;flex-direction:column;gap:1px;
  background:transparent;
}
.cal-cell.is-out{opacity:.28;pointer-events:none}
.cal-cell.is-sel{border-color:var(--ink);background:var(--white)}
.cal-cell.is-today .cal-num{background:var(--ink);color:var(--white)}
.cal-cell:not(.is-sel):active{background:var(--surface-cool)}
.cal-num{
  align-self:flex-start;min-width:19px;height:19px;padding:0 4px;border-radius:var(--r-full);
  display:grid;place-items:center;
  font-size:var(--fs-11);font-weight:var(--fw-m);color:var(--text-2);
  font-variant-numeric:tabular-nums;line-height:1;
}
.cal-cell.is-sun .cal-num{color:#C0492F}
.cal-cell.is-sat .cal-num{color:#3358A8}
.cal-cell.is-today .cal-num,.cal-cell.is-today.is-sun .cal-num,.cal-cell.is-today.is-sat .cal-num{color:var(--white)}
.ev{
  display:block;width:100%;max-width:100%;min-width:0;
  font-size:8.5px;line-height:11px;height:11px;
  padding:0 2px;border-radius:3px;
  background:var(--w);color:var(--c);
  border-left:2px solid var(--c);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  letter-spacing:-.03em;
}
.ev.is-done{opacity:.5;text-decoration:line-through}
.ev-more{font-size:8px;line-height:10px;color:var(--text-4);padding-left:3px;letter-spacing:-.02em}

/* ── Day panel ───────────────────────────────────────────── */
.day-title{font-size:var(--fs-18);font-weight:var(--fw-b);letter-spacing:var(--tr-tighter);line-height:1.25}
.day-sub{font-size:var(--fs-12);color:var(--text-3);margin-top:2px;font-variant-numeric:tabular-nums}
.day-badge{
  flex:none;font-size:var(--fs-11);color:var(--text-3);border:1px solid var(--border-hair);
  border-radius:var(--r-full);padding:4px 9px;font-variant-numeric:tabular-nums;
}

.timeline{position:relative;height:calc(15 * var(--hour-h));margin-top:6px}
.tl-hour{position:absolute;left:0;right:0;height:0;border-top:1px solid #F1F2F4}
.tl-hour:first-child{border-top-color:transparent}
.tl-hour>i{
  position:absolute;left:0;top:-7px;width:var(--tl-gutter);
  font-size:10px;font-style:normal;color:var(--gray-300);
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;background:var(--white);
  line-height:14px;
}
.tl-half{position:absolute;left:var(--tl-gutter);right:0;height:0;border-top:1px dashed #F6F7F8}

.tl-block{
  position:absolute;left:var(--tl-gutter);right:0;
  border-radius:10px;padding:5px 4px 5px 6px;
  display:flex;align-items:stretch;gap:2px;
  background:var(--w);
  box-shadow:inset 3px 0 0 var(--c);
  overflow:hidden;isolation:isolate;
  transition:box-shadow .12s;
}
.tl-block.is-flex{
  background:
    repeating-linear-gradient(135deg,rgba(19,20,21,.028) 0 5px,transparent 5px 10px),
    var(--w);
  box-shadow:inset 3px 0 0 var(--c),inset 0 0 0 1px rgba(19,20,21,.10);
}
.tl-block.is-sel{box-shadow:inset 3px 0 0 var(--c),inset 0 0 0 1.5px var(--c)}
.tl-block.is-done{opacity:.55}
.tl-block.is-done .tl-title{text-decoration:line-through}
.tl-block.is-tiny .tl-meta{display:none}
.tl-block.is-tiny{padding-top:3px;padding-bottom:3px}
.tl-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px}
.tl-title{
  font-size:12px;font-weight:var(--fw-m);line-height:1.25;color:var(--text-1);
  letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tl-meta{
  font-size:10px;color:var(--text-3);line-height:1.2;
  font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tl-tag{
  font-size:8.5px;line-height:10px;padding:1px 3px;border-radius:3px;
  background:rgba(255,255,255,.75);color:var(--c);border:.5px solid rgba(19,20,21,.08);
  align-self:flex-start;letter-spacing:-.02em;
}
.grip{
  width:15px;flex:none;border-radius:5px;cursor:grab;touch-action:none;
  display:grid;place-items:center;opacity:.30;
  color:var(--c);font-size:10px;line-height:1;letter-spacing:0;
  -webkit-user-select:none;user-select:none;
}
.grip::before{content:"⠿"}
.grip:active{cursor:grabbing;opacity:.75}
.nudge{display:flex;flex-direction:column;justify-content:center;gap:2px;flex:none;width:24px}
.nudge button{
  height:16px;border-radius:4px;font-size:8px;line-height:1;color:var(--c);
  background:rgba(255,255,255,.6);border:.5px solid rgba(19,20,21,.07);
  display:grid;place-items:center;
}
.nudge button:active{background:var(--white);color:var(--text-1)}
.tl-block.is-tiny .nudge button{height:9px;font-size:6px}

.tl-now{position:absolute;left:calc(var(--tl-gutter) - 4px);right:0;height:0;border-top:2px solid var(--now);z-index:5;pointer-events:none}
.tl-now::before{
  content:"";position:absolute;left:0;top:-4px;width:7px;height:7px;border-radius:50%;
  background:var(--now);
}
.tl-empty{
  position:absolute;left:var(--tl-gutter);right:0;top:34%;text-align:center;
  font-size:var(--fs-12);color:var(--text-4);line-height:1.6;
}

.flex-tray{margin-top:12px;padding-top:10px;border-top:1px solid var(--border-hair)}
.tray-label{font-size:var(--fs-11);color:var(--text-3);display:block;margin-bottom:6px}
.tray-item{
  width:100%;text-align:left;padding:8px 10px;border-radius:var(--r-sm);
  background:var(--surface-cool);font-size:var(--fs-12);color:var(--text-2);
  display:flex;align-items:center;gap:7px;margin-bottom:5px;
}
.tray-item .dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--c)}

/* ── Checklist ───────────────────────────────────────────── */
.list-title{font-size:var(--fs-16);font-weight:var(--fw-b);letter-spacing:var(--tr-tighter)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:1px}
.chips.is-scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips + .chips{margin-top:6px}
.chip{
  flex:none;height:28px;padding:0 11px;border-radius:var(--r-full);
  border:1px solid var(--border-hair);background:var(--white);
  font-size:var(--fs-12);color:var(--text-2);white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;
}
.chip .dot{width:6px;height:6px;border-radius:50%;flex:none}
.chip.is-on{background:var(--ink);border-color:var(--ink);color:var(--white)}
.chip.is-on .dot{box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.chip:active{opacity:.7}
.rows{margin-top:10px}
.row{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--border-hair);align-items:flex-start}
.row:first-child{border-top:0;padding-top:6px}
.check{
  width:21px;height:21px;flex:none;margin-top:2px;border-radius:var(--r-full);
  border:1.5px solid var(--gray-200);display:grid;place-items:center;
  background:var(--white);transition:background .12s,border-color .12s;
}
.check svg{width:11px;height:11px;opacity:0;transform:scale(.6);transition:opacity .12s,transform .12s}
.row.is-done .check{background:var(--c);border-color:var(--c)}
.row.is-done .check svg{opacity:1;transform:scale(1)}
.row-main{flex:1;min-width:0;text-align:left}
.row-title{
  font-size:var(--fs-14);font-weight:var(--fw-m);line-height:1.35;
  letter-spacing:var(--tr-tighter);
}
.row.is-done .row-title{color:var(--text-4);text-decoration:line-through}
.row-meta{
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;
  font-size:var(--fs-11);color:var(--text-3);margin-top:3px;
  font-variant-numeric:tabular-nums;
}
.row-meta .dot{width:5px;height:5px;border-radius:50%;flex:none;background:var(--c)}
.row-meta .sep{color:var(--gray-200)}
.row-sub{
  display:flex;align-items:center;gap:6px;margin-top:5px;
  font-size:var(--fs-11);color:var(--text-3);
}
.mini-check{
  width:15px;height:15px;flex:none;border-radius:4px;border:1px solid var(--gray-200);
  display:grid;place-items:center;background:var(--white);
}
.mini-check svg{width:8px;height:8px;opacity:0}
.row-sub.is-done .mini-check{background:var(--gray-300);border-color:var(--gray-300)}
.row-sub.is-done .mini-check svg{opacity:1}
.row-sub.is-done span{text-decoration:line-through;color:var(--text-4)}
.empty{
  padding:26px 8px;text-align:center;font-size:var(--fs-12);color:var(--text-4);line-height:1.7;
}
.foot-note{font-size:var(--fs-11);color:var(--text-4);text-align:center;padding:6px 0 0}
.foot-note button{color:var(--text-3);text-decoration:underline;text-underline-offset:2px;font-size:inherit}

/* ── Sheet ───────────────────────────────────────────────── */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:none}
.sheet-wrap.is-open{display:block}
.sheet-dim{position:absolute;inset:0;background:rgba(19,20,21,.30);animation:fade .18s ease}
.sheet{
  position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;
  background:var(--white);border-radius:24px 24px 0 0;
  padding:8px 16px calc(18px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;overscroll-behavior:contain;
  box-shadow:0 -10px 34px rgba(19,20,21,.16);
  animation:up .22s cubic-bezier(.22,.61,.36,1);
}
@keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-grab{width:34px;height:4px;border-radius:99px;background:var(--gray-150);margin:4px auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet-cat{
  display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-11);
  color:var(--c);padding:4px 8px;border-radius:var(--r-full);background:var(--w);
}
.sheet-cat .dot{width:5px;height:5px;border-radius:50%;background:var(--c)}
.sheet-x{font-size:var(--fs-12);color:var(--text-3);padding:6px 2px}
.sheet-title{
  display:block;width:100%;margin-top:8px;border:0;padding:0;resize:none;
  font-size:var(--fs-20);font-weight:var(--fw-b);letter-spacing:var(--tr-tighter);
  line-height:1.32;outline:none;background:transparent;min-height:30px;
}
.sheet-time{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 12px;border-radius:var(--r-md);background:var(--surface-cool);margin-bottom:8px}
.sheet-time-v{font-size:var(--fs-14);font-weight:var(--fw-b);font-variant-numeric:tabular-nums;letter-spacing:var(--tr-tighter)}
.nudge-lg{
  height:30px;padding:0 10px;border-radius:var(--r-full);background:var(--white);
  border:1px solid var(--border-hair);font-size:var(--fs-11);color:var(--text-2);white-space:nowrap;
}
.nudge-lg:active{background:var(--surface-sunken)}
.sheet-sec{margin-top:14px}
.sheet-label{
  font-size:var(--fs-11);font-weight:var(--fw-m);color:var(--text-3);
  margin-bottom:7px;letter-spacing:.01em;
}
.switch{
  width:100%;height:44px;border-radius:var(--r-md);border:1px solid var(--border-hair);
  background:var(--white);display:flex;align-items:center;justify-content:space-between;
  padding:0 13px;font-size:var(--fs-13);color:var(--text-2);
}
.switch .knob{
  width:38px;height:22px;border-radius:99px;background:var(--gray-75);position:relative;
  transition:background .16s;flex:none;
}
.switch .knob::after{
  content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:var(--white);box-shadow:0 1px 2px rgba(19,20,21,.2);transition:transform .16s;
}
.switch[aria-pressed="true"]{border-color:var(--ink)}
.switch[aria-pressed="true"] .knob{background:var(--ink)}
.switch[aria-pressed="true"] .knob::after{transform:translateX(16px)}
.sheet-memo{
  width:100%;min-height:56px;resize:vertical;padding:10px 12px;
  border:1px solid var(--border-hair);border-radius:var(--r-md);
  font-size:var(--fs-13);line-height:1.5;background:var(--white);outline:none;
}
.sheet-memo:focus,.sheet-title:focus{outline:none}
.sheet-memo:focus{border-color:var(--border-focus)}
.sub-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.sub-row{display:flex;align-items:center;gap:8px;font-size:var(--fs-13);color:var(--text-2)}
.sub-row.is-done span{text-decoration:line-through;color:var(--text-4)}
.sub-row .del{margin-left:auto;font-size:var(--fs-11);color:var(--text-4);padding:2px 4px}
.sub-add{display:flex;gap:6px}
.sub-add input{
  flex:1;height:38px;padding:0 12px;border-radius:var(--r-sm);
  border:1px solid var(--border-hair);background:var(--surface-cool);
  font-size:var(--fs-13);outline:none;
}
.sub-add input:focus{background:var(--white);border-color:var(--border-focus)}
.sub-add button{
  flex:none;height:38px;padding:0 14px;border-radius:var(--r-sm);
  background:var(--ink);color:var(--white);font-size:var(--fs-12);font-weight:var(--fw-m);
}
.sheet-foot{display:flex;gap:8px;margin-top:20px;padding-top:14px;border-top:1px solid var(--border-hair)}
.btn-ghost{
  flex:1;height:44px;border-radius:var(--r-md);border:1px solid var(--border-hair);
  font-size:var(--fs-13);color:var(--text-2);background:var(--white);
}
.btn-ghost.is-danger{color:#B3261E;border-color:#F3D7D4}
.btn-ghost:active{background:var(--surface-sunken)}

/* ── Toast ───────────────────────────────────────────────── */
.toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,8px);
  z-index:80;max-width:min(420px,calc(100vw - 32px));
  background:rgba(19,20,21,.94);color:var(--white);
  border-radius:var(--r-md);padding:11px 14px;
  font-size:var(--fs-12);line-height:1.35;
  display:flex;align-items:center;gap:10px;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  box-shadow:0 8px 24px rgba(19,20,21,.22);
}
.toast.is-on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{flex:none;color:#FFB9A5;font-weight:var(--fw-b);font-size:var(--fs-12)}
</style>

<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="logo">
      <span class="logo-mark" aria-hidden="true"></span>
      <span class="logo-text">타임 트래커</span>
    </div>
    <button class="today-btn" id="todayBtn">오늘로</button>
  </div>
</header>

<main class="wrap">
  <section class="composer" aria-label="빠른 입력">
    <p class="composer-label">한 줄로 적으면 알아서 잡아둘게요</p>
    <p class="composer-sub">날짜·시간대·소요를 문장에서 읽어요. 피커는 필요할 때만 열어요.</p>
    <textarea id="quickInput" class="quick-input" rows="2"
      placeholder="일요일 저녁 민지님과 회의 2시간정도 / 메모: 서버 단위로 목업 작업 논의"></textarea>
    <div id="preview" class="preview" hidden></div>
    <div class="composer-foot">
      <span class="composer-hint" id="compHint">예: 내일 아침 병원 30분</span>
      <button class="btn-primary" id="addBtn" disabled>담기</button>
    </div>
  </section>

  <section class="panel" aria-label="월간 요약">
    <div class="panel-head">
      <div class="month-nav">
        <button class="icon-btn" data-act="month-prev" aria-label="이전 달">‹</button>
        <span class="month-title" id="monthTitle"></span>
        <button class="icon-btn" data-act="month-next" aria-label="다음 달">›</button>
      </div>
      <span class="panel-note" id="monthNote"></span>
    </div>
    <div id="summary"></div>
    <div class="cal-week" id="calWeek" aria-hidden="true"></div>
    <div class="cal-grid" id="calGrid" role="grid" aria-label="월간 캘린더"></div>
  </section>

  <section class="panel" id="dayPanel" aria-label="일별 타임테이블">
    <div class="panel-head">
      <div>
        <h2 class="day-title" id="dayTitle"></h2>
        <p class="day-sub" id="daySub"></p>
      </div>
      <span class="day-badge" id="dayBadge" hidden></span>
    </div>
    <div class="timeline" id="timeline"></div>
    <div id="flexTray"></div>
  </section>

  <section class="panel" aria-label="체크리스트">
    <div class="panel-head">
      <h2 class="list-title">할 일</h2>
      <span class="panel-note" id="doneCount"></span>
    </div>
    <div class="chips" id="durChips" aria-label="소요 시간 필터"></div>
    <div class="chips" id="catChips" aria-label="카테고리 필터"></div>
    <div class="rows" id="rows"></div>
  </section>

  <p class="foot-note">모든 변경은 이 기기에만 저장돼요 · <button data-act="reset">처음 상태로</button></p>
</main>

<div class="sheet-wrap" id="sheetWrap" aria-hidden="true">
  <div class="sheet-dim" data-act="sheet-close"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="일정 조정"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';

/* ============================================================
   0. Constants
   ============================================================ */
var LS_KEY = 'time-tracker.v1';
var WD = ['일','월','화','수','목','금','토'];
var START_HOUR = 9, END_HOUR = 24;
var HOUR_H = 40; /* keep in sync with --hour-h */

var CATS = [
  {id:'work',    name:'업무·협업',       hex:'#2E5FE8', weak:'#EDF2FE'},
  {id:'side',    name:'사이드프로젝트',  hex:'#6B46D6', weak:'#F2EEFE'},
  {id:'errand',  name:'일상·볼일',       hex:'#96630A', weak:'#FDF4E1'},
  {id:'study',   name:'공부',            hex:'#0B7C74', weak:'#E4F5F3'},
  {id:'promise', name:'약속',            hex:'#C23A6C', weak:'#FDECF2'}
];
var CAT = {};
CATS.forEach(function(c){ CAT[c.id] = c; });

var DUR_FILTERS = [
  {id:'all',  label:'전체'},
  {id:'s',    label:'30분 이하'},
  {id:'h',    label:'1시간'},
  {id:'l',    label:'2시간+'},
  {id:'none', label:'틈틈이·미정'}
];

/* ============================================================
   1. Utilities
   ============================================================ */
var $ = function(sel, root){ return (root || document).querySelector(sel); };
var pad2 = function(n){ return String(n).padStart(2,'0'); };
var ymd = function(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); };
var fromYmd = function(s){ var p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); };
var addDays = function(d, n){ var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; };
var toMin = function(t){ var p = t.split(':').map(Number); return p[0]*60 + p[1]; };
var toHHMM = function(m){ return pad2(Math.floor(m/60)) + ':' + pad2(((m%60)+60)%60); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
}); };
var uid = function(){ return 'i' + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); };
var clamp = function(n, a, b){ return Math.max(a, Math.min(b, n)); };

function fmtDur(m){
  if (m == null || isNaN(m)) return '미정';
  var h = Math.floor(m/60), mm = m%60;
  if (h && mm) return h + '시간 ' + mm + '분';
  if (h) return h + '시간';
  return mm + '분';
}
function fmtDurChip(m){
  if (m == null) return '미정';
  if (m < 60) return m + '분';
  var h = Math.floor(m/60), mm = m%60;
  if (mm) return h + '시간 ' + mm + '분';
  return h + '시간';
}
function mdLabel(s){ var d = fromYmd(s); return (d.getMonth()+1) + '/' + d.getDate(); }
function dayLabel(s){ var d = fromYmd(s); return WD[d.getDay()] + ' ' + mdLabel(s); }
function todayStr(){ return ymd(new Date()); }

/* ============================================================
   2. Natural-language parser
   ============================================================ */
var KNUM = {'한':1,'두':2,'세':3,'네':4,'다섯':5,'여섯':6};

var PERIODS = [
  ['점심 이후', 13*60+30], ['점심 후', 13*60+30], ['점심때', 12*60], ['점심', 12*60],
  ['아침', 8*60+30], ['오전', 10*60], ['오후', 14*60],
  ['저녁', 19*60], ['밤', 21*60], ['새벽', 5*60], ['낮', 12*60+30]
];

var CAT_RULES = [
  ['side',    ['요아정','클로드코드','클로드 코드','사이드','사이드프로젝트','개인프로젝트','냉장고 구조대','웹앱','토이','앱 개편']],
  ['study',   ['공부','강의','스터디','인강','웨비나','세미나','책','독서','읽기','학습','자격증','노트필기','특강']],
  ['promise', ['약속','모임','데이트','친구','만나기','생일','파티','동창','가족']],
  ['work',    ['회의','미팅','협업','목업','잔업','커피챗','대표님','업무','보고','디자인시스템','디자인 시스템','서버','스프린트','기획','리뷰','발표','면접','포트폴리오','이력서','외주','납품','시안']],
  ['errand',  ['동사무소','주민센터','행정복지센터','병원','약국','은행','장보기','청소','배송','민원','관리비','수거','방문','볼일','택배','세탁','미용실','마트','이사','정리']]
];

var META_TAIL = /(소요될\s*예정|소요\s*예정|소요|예정|걸릴\s*예정|진행\s*예정|필요함|필요|하기|해야\s*함|해야함|함)$/;

function parseSentence(raw, base){
  base = base || new Date();
  var src = String(raw || '').replace(/\s+/g,' ').trim();
  if (!src) return null;

  var memo = '', checks = [], note = '';

  /* 제목과 메모 분리: "메모:" 또는 " / " */
  var mm = src.match(/메모\s*[:：]\s*([\s\S]+)$/);
  if (mm){ memo = mm[1].trim(); src = src.slice(0, mm.index); }
  var parts = src.split(/\s+\/\s+|\s*\/\s*/);
  if (parts.length > 1){
    src = parts[0];
    var tail = parts.slice(1).join(' / ').replace(/^메모\s*[:：]\s*/,'').trim();
    if (tail) memo = memo ? (tail + ' / ' + memo) : tail;
  }

  /* 체크 항목 */
  var cm = src.match(/(?:^|\s)\(?\s*체크\s*[:：]\s*([^)]+?)\s*\)?\s*$/);
  if (cm){ checks.push({text: cm[1].trim(), done:false}); src = src.slice(0, cm.index); }

  var rest = ' ' + src + ' ';
  function take(re){
    var m = rest.match(re);
    if (!m) return null;
    rest = rest.replace(m[0], ' ');
    return m;
  }

  /* ── 날짜 ─────────────────────────────────────────────── */
  var date = null, dateSet = false;

  var d1 = take(/(오늘|금일|내일|명일|모레|글피)/);
  if (d1){
    var k = d1[1], n = (k === '오늘' || k === '금일') ? 0 : (k === '내일' || k === '명일') ? 1 : (k === '모레') ? 2 : 3;
    date = ymd(addDays(base, n)); dateSet = true;
  }
  if (!dateSet){
    var d2 = take(/(이틀|사흘|나흘|\d{1,2})\s*일?\s*(뒤|후|이따가?|있다가)/);
    if (d2){
      var n2 = d2[1] === '이틀' ? 2 : d2[1] === '사흘' ? 3 : d2[1] === '나흘' ? 4 : parseInt(d2[1], 10);
      date = ymd(addDays(base, n2)); dateSet = true;
    }
  }
  if (!dateSet){
    var d3 = take(/(?:(다음\s*주|다음주|담주|이번\s*주|이번주)\s*)?([일월화수목금토])\s*(?:요일|욜)/);
    if (d3){
      var ti = WD.indexOf(d3[2]);
      var delta = (ti - base.getDay() + 7) % 7;
      if (/다음\s*주|담주/.test(d3[1] || '')) delta += 7;
      date = ymd(addDays(base, delta)); dateSet = true;
    }
  }
  if (!dateSet){
    var d4 = take(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
    if (d4){
      var yy = base.getFullYear();
      var cand = new Date(yy, parseInt(d4[1],10)-1, parseInt(d4[2],10));
      if (cand < new Date(yy, base.getMonth(), base.getDate())) cand = new Date(yy+1, parseInt(d4[1],10)-1, parseInt(d4[2],10));
      date = ymd(cand); dateSet = true;
    }
  }
  if (!dateSet){
    var d5 = take(/(^|[\s,·])(\d{1,2})\s*[\/.]\s*(\d{1,2})(?![\d:])/);
    if (d5){
      var yy2 = base.getFullYear();
      var c2 = new Date(yy2, parseInt(d5[2],10)-1, parseInt(d5[3],10));
      if (c2 < new Date(yy2, base.getMonth(), base.getDate())) c2 = new Date(yy2+1, parseInt(d5[2],10)-1, parseInt(d5[3],10));
      date = ymd(c2); dateSet = true;
    }
  }
  if (!dateSet){
    var d6 = take(/(\d{1,2})\s*일(?!\s*(?:뒤|후|분|시간|정도))/);
    if (d6){
      var day = parseInt(d6[1], 10);
      if (day >= 1 && day <= 31){
        var y3 = base.getFullYear(), m3 = base.getMonth();
        var c3 = new Date(y3, m3, day);
        if (c3 < new Date(y3, m3, base.getDate())) c3 = new Date(y3, m3+1, day);
        date = ymd(c3); dateSet = true;
      }
    }
  }
  if (!dateSet) date = ymd(base);

  /* ── 소요 시간 ────────────────────────────────────────── */
  var dur = null;
  var dm = take(/(\d+(?:\.\d+)?)\s*시간\s*(?:(\d{1,2})\s*분|(반))?/);
  if (dm){
    dur = Math.round(parseFloat(dm[1]) * 60);
    if (dm[2]) dur += parseInt(dm[2], 10);
    if (dm[3]) dur += 30;
  }
  if (dur == null){
    var dk = take(/(한|두|세|네|다섯|여섯)\s*시간\s*(?:(\d{1,2})\s*분|(반))?/);
    if (dk){
      dur = KNUM[dk[1]] * 60;
      if (dk[2]) dur += parseInt(dk[2], 10);
      if (dk[3]) dur += 30;
    }
  }
  if (dur == null){
    var dh = take(/(반)\s*시간/);
    if (dh) dur = 30;
  }
  if (dur == null){
    var dmin = take(/(\d{1,3})\s*분/);
    if (dmin) dur = parseInt(dmin[1], 10);
  }
  if (dur == null){
    var db = take(/(반나절|종일)/);
    if (db) dur = db[1] === '종일' ? 480 : 180;
  }

  /* ── 시간 ─────────────────────────────────────────────── */
  var start = null, vague = false, whenLabel = '';

  var clock = take(/(오전|오후|아침|점심|저녁|밤|새벽|낮)?\s*(\d{1,2})\s*시(?!간)\s*(?:(\d{1,2})\s*분)?/);
  if (!clock) clock = take(/(오전|오후)?\s*(\d{1,2})\s*:\s*(\d{2})/);
  if (clock){
    var h = parseInt(clock[2], 10), mi = clock[3] ? parseInt(clock[3], 10) : 0;
    var p = clock[1] || '';
    if (/오후|저녁|밤/.test(p) && h < 12) h += 12;
    if (/오전|아침|새벽/.test(p) && h === 12) h = 0;
    if (h >= 0 && h <= 23) start = h*60 + clamp(mi, 0, 59);
  }

  if (start == null){
    for (var i = 0; i < PERIODS.length; i++){
      var kw = PERIODS[i][0].replace(' ', '\\s*');
      var pm = take(new RegExp('(' + kw + ')\\s*(쯤|쯤에|께|무렵|까지|에는|에)?'));
      if (pm){
        whenLabel = pm[1];
        if (/쯤|께|무렵/.test(pm[2] || '')){ vague = true; whenLabel = pm[1] + pm[2]; }
        else start = PERIODS[i][1];
        break;
      }
    }
  }

  /* ── 미정 여부 ────────────────────────────────────────── */
  var unc = take(/(시간\s*미정|시간미정|미정|틈틈이|틈틈히|비는\s*시간|남는\s*시간|자투리)/);
  var uncertain = !!unc || start == null || vague;
  if (unc && /틈틈/.test(unc[1])) whenLabel = '틈틈이';

  /* ── 카테고리 ─────────────────────────────────────────── */
  var cat = null;
  var scan = (src + ' ' + memo);
  for (var ci = 0; ci < CAT_RULES.length; ci++){
    var kws = CAT_RULES[ci][1];
    for (var ki = 0; ki < kws.length; ki++){
      if (scan.indexOf(kws[ki]) >= 0){ cat = CAT_RULES[ci][0]; break; }
    }
    if (cat) break;
  }
  if (!cat) cat = 'errand';

  /* ── 제목 정리 ────────────────────────────────────────── */
  var sents = rest.split(/\s*[.。!?]\s*|\s{2,}/).map(function(s){ return s.trim(); }).filter(Boolean);
  var title = '';
  for (var si = 0; si < sents.length; si++){
    var s = sents[si]
      .replace(/[()（）\[\]]/g, ' ')
      .replace(/정도/g, ' ')
      .replace(/(^|\s)약\s/g, ' ')
      .replace(/^(에|에는|쯤|부터|까지)\s*/,'')
      .replace(/\s+/g, ' ')
      .trim();
    for (var t = 0; t < 3; t++) s = s.replace(META_TAIL, '').replace(/\s+/g,' ').trim();
    s = s.replace(/^[,.·\-–—\s]+|[,.·\-–—\s]+$/g, '');
    if (s.length >= 2 && !/^(소요|예정|시간|분)$/.test(s)){ title = s; break; }
  }
  if (!title){
    title = sents.join(' ').replace(/\s+/g,' ').trim().slice(0, 60) || src.slice(0, 60);
  }
  title = title.replace(/\s+/g,' ').trim().slice(0, 80);

  return {
    title: title,
    date: date,
    start: start == null ? null : toHHMM(start),
    dur: dur,
    cat: cat,
    uncertain: uncertain,
    vague: vague,
    whenLabel: whenLabel,
    memo: memo.replace(/\s+/g,' ').trim(),
    checks: checks,
    note: note
  };
}

/* ============================================================
   3. State

function loadState(){
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw){
      var o = JSON.parse(raw);
      if (o && Array.isArray(o.items)) return o;
    }
  } catch(e){}
  return null;
}

var state = loadState() || {
  version: 1,
  items: seedItems(),
  cursor: null,
  selected: null,
  catFilter: 'all',
  durFilter: 'all'
};
if (!state.catFilter) state.catFilter = 'all';
if (!state.durFilter) state.durFilter = 'all';

function save(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
}

function itemById(id){
  for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i];
  return null;
}
function itemsOn(dateStr){
  return state.items.filter(function(it){ return it.date === dateStr; });
}

/* ============================================================
   4. Placement (fixed + 어림 배치)
   ============================================================ */
function placementsFor(dateStr){
  var items = itemsOn(dateStr);
  var out = [], occ = [];

  items.forEach(function(it){
    if (it.start != null){
      var s = toMin(it.start), d = it.dur || 60;
      out.push({it:it, s:s, e:s+d, suggested:false});
      occ.push({s:s, e:s+d});
    }
  });

  var flex = items.filter(function(it){ return it.start == null; })
    .sort(function(a,b){ return (b.dur || 60) - (a.dur || 60); });

  flex.forEach(function(it){
    var d = it.dur || 60, s = null, t = 18*60;
    while (t + d <= END_HOUR*60){
      var clash = occ.some(function(o){ return t < o.e && t + d > o.s; });
      if (!clash){ s = t; break; }
      t += 30;
    }
    if (s == null) s = 19*60;
    occ.push({s:s, e:s+d});
    out.push({it:it, s:s, e:s+d, suggested:true});
  });

  return out.sort(function(a,b){ return a.s - b.s || b.e - a.e; });
}

function layout(placed){
  /* 겹치는 구간을 클러스터로 묶어 레인 배정 */
  var clusters = [], cur = null;
  placed.forEach(function(p){
    if (!cur || p.s >= cur.end){ cur = {items:[], end:p.e}; clusters.push(cur); }
    cur.items.push(p);
    cur.end = Math.max(cur.end, p.e);
  });
  clusters.forEach(function(c){
    c.items.forEach(function(p, i){ p.lane = i; p.lanes = c.items.length; });
  });
  return placed;
}

/* ============================================================
   5. Render — month
   ============================================================ */
function monthItems(y, m){
  var pre = y + '-' + pad2(m);
  return state.items.filter(function(it){ return it.date && it.date.indexOf(pre) === 0; });
}

function renderMonth(){
  var cur = state.cursor || todayStr().slice(0,7);
  var y = parseInt(cur.slice(0,4), 10), m = parseInt(cur.slice(5,7), 10);
  $('#monthTitle').textContent = y + '년 ' + m + '월';

  var items = monthItems(y, m);
  var planned = 0, done = 0, unfixed = 0;
  items.forEach(function(it){
    if (it.dur) planned += it.dur;
    if (it.done && it.dur) done += it.dur;
    if (it.uncertain && !it.confirmed) unfixed++;
  });

  var note = items.length ? items.length + '건' : '비어 있어요';
  $('#monthNote').textContent = note;

  /* 분포 */
  var byCat = {};
  items.forEach(function(it){
    if (!it.dur) return;
    byCat[it.cat] = (byCat[it.cat] || 0) + it.dur;
  });
  var segs = CATS.map(function(c){ return {c:c, v:byCat[c.id] || 0}; }).filter(function(x){ return x.v > 0; });
  var total = planned || 1;

  var distHTML = '<div class="sum-dist" role="img" aria-label="카테고리별 분포">';
  if (!segs.length) distHTML += '<span style="width:100%;background:var(--gray-75)"></span>';
  segs.forEach(function(x){
    distHTML += '<span style="width:' + (x.v/total*100).toFixed(2) + '%;background:' + x.c.hex + '"></span>';
  });
  distHTML += '</div>';

  var legend = '';
  if (segs.length){
    legend = '<ul class="legend">' + segs.map(function(x){
      return '<li><span class="swatch" style="background:' + x.c.hex + '"></span>' +
        esc(x.c.name) + ' <b>' + fmtDurChip(x.v) + '</b></li>';
    }).join('') + '</ul>';
  }

  $('#summary').innerHTML =
    '<div class="sum-stats">' +
      '<div class="stat"><span class="stat-k">예정</span><span class="stat-v">' + (planned ? fmtDur(planned) : '0분') + '</span></div>' +
      '<div class="stat"><span class="stat-k">완료</span><span class="stat-v">' + (done ? fmtDur(done) : '0분') + '</span></div>' +
      '<div class="stat"><span class="stat-k">미정</span><span class="stat-v">' + unfixed + '건</span></div>' +
    '</div>' + distHTML + legend;

  /* 요일 헤더 */
  $('#calWeek').innerHTML = WD.map(function(w){ return '<span>' + w + '</span>'; }).join('');

  /* 그리드 */
  var first = new Date(y, m-1, 1);
  var startIdx = first.getDay();
  var daysInMonth = new Date(y, m, 0).getDate();
  var prevDays = new Date(y, m-1, 0).getDate();
  var cells = [];
  var byDate = {};
  items.forEach(function(it){
    (byDate[it.date] = byDate[it.date] || []).push(it);
  });

  for (var i = 0; i < 42; i++){
    var dayNum, dateStr = null, out = false;
    if (i < startIdx){
      dayNum = prevDays - startIdx + 1 + i; out = true;
    } else if (i >= startIdx + daysInMonth){
      dayNum = i - startIdx - daysInMonth + 1; out = true;
    } else {
      dayNum = i - startIdx + 1;
      dateStr = y + '-' + pad2(m) + '-' + pad2(dayNum);
    }
    var dObj = addDays(first, i - startIdx);
    var dow = dObj.getDay();
    var cls = 'cal-cell';
    if (out) cls += ' is-out';
    if (dow === 0) cls += ' is-sun';
    if (dow === 6) cls += ' is-sat';
    if (!out && dateStr === todayStr()) cls += ' is-today';
    if (!out && dateStr === state.selected) cls += ' is-sel';

    var evs = '';
    if (!out){
      var list = (byDate[dateStr] || []).slice().sort(function(a,b){
        var am = a.start ? toMin(a.start) : 25*60, bm = b.start ? toMin(b.start) : 25*60;
        return am - bm;
      });
      var show = list.slice(0, 3);
      show.forEach(function(it){
        var c = CAT[it.cat] || CATS[0];
        evs += '<span class="ev' + (it.done ? ' is-done' : '') + '" style="--c:' + c.hex + ';--w:' + c.weak + '">' +
          esc(it.title) + '</span>';
      });
      if (list.length > 3) evs += '<span class="ev-more">+' + (list.length - 3) + '</span>';
    }

    cells.push(
      '<button class="' + cls + '" role="gridcell"' +
        (out ? ' tabindex="-1"' : ' data-act="pick-day" data-date="' + dateStr + '"') +
        ' aria-label="' + (out ? '' : dayNum + '일, ' + ((byDate[dateStr] || []).length) + '건') + '">' +
        '<span class="cal-num">' + dayNum + '</span>' + evs +
      '</button>'
    );
  }
  $('#calGrid').innerHTML = cells.join('');
}

/* ============================================================
   6. Render — day timeline
   ============================================================ */
function renderDay(){
  var ds = state.selected;
  var d = fromYmd(ds);
  var isToday = ds === todayStr();
  $('#dayTitle').textContent = (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + WD[d.getDay()] + '요일' + (isToday ? ' · 오늘' : '');

  var items = itemsOn(ds);
  var total = items.reduce(function(a, it){ return a + (it.dur || 0); }, 0);
  $('#daySub').textContent = items.length
    ? items.length + '건 · ' + (total ? fmtDur(total) : '소요 미정')
    : '아직 잡힌 일정이 없어요';

  var unfixed = items.filter(function(it){ return it.uncertain && !it.confirmed; }).length;
  var badge = $('#dayBadge');
  if (unfixed){ badge.hidden = false; badge.textContent = '어림 ' + unfixed; }
  else badge.hidden = true;

  /* grid */
  var grid = '';
  for (var h = START_HOUR; h < END_HOUR; h++){
    grid += '<div class="tl-hour" style="top:' + ((h-START_HOUR)*HOUR_H) + 'px"><i>' + pad2(h) + ':00</i></div>';
    grid += '<div class="tl-half" style="top:' + ((h-START_HOUR)*HOUR_H + HOUR_H/2) + 'px"></div>';
  }

  var blocks = '';
  if (!items.length){
    blocks = '<div class="tl-empty">이 날은 비어 있어요.<br>위에 한 줄로 일정을 적어보세요.</div>';
  } else {
    var placed = layout(placementsFor(ds));
    blocks = placed.map(function(p){
      var it = p.it, c = CAT[it.cat] || CATS[0];
      var top = (p.s - START_HOUR*60) / 60 * HOUR_H;
      var height = (p.e - p.s) / 60 * HOUR_H;
      var maxH = (END_HOUR - START_HOUR) * HOUR_H;
      top = clamp(top, 0, maxH - 24);
      height = clamp(height, 24, maxH - top);
      var leftPct = (p.lane / p.lanes) * 100;
      var widthPct = (1 / p.lanes) * 100;
      var flex = it.uncertain && !it.confirmed;
      var cls = 'tl-block' + (flex ? ' is-flex' : '') + (it.done ? ' is-done' : '') + (height < 36 ? ' is-tiny' : '');
      var meta = toHHMM(p.s) + '–' + toHHMM(p.e) + ' · ' + fmtDurChip(it.dur);
      var tag = flex ? '<span class="tl-tag">' + (it.whenLabel && it.whenLabel.indexOf('틈틈') >= 0 ? '틈틈이' : '어림') + '</span>' : '';
      var leftStyle = leftPct === 0 ? 'var(--tl-gutter)'
        : 'calc(var(--tl-gutter) + (100% - var(--tl-gutter)) * ' + (leftPct/100).toFixed(4) + ')';
      var widthStyle = 'calc((100% - var(--tl-gutter)) * ' + (widthPct/100).toFixed(4) + ' - 2px)';
      return '<div class="' + cls + '" data-act="open-item" data-id="' + it.id + '"' +
          ' data-start="' + p.s + '" data-dur="' + (it.dur || 60) + '"' +
          ' style="--c:' + c.hex + ';--w:' + c.weak + ';top:' + top.toFixed(1) + 'px;height:' + height.toFixed(1) +
          'px;left:' + leftStyle + ';right:auto;width:' + widthStyle + '">' +
          '<div class="grip" data-grip="1" role="button" aria-label="끌어서 시간 옮기기"></div>' +
          '<div class="tl-body">' +
            '<span class="tl-title">' + esc(it.title) + '</span>' +
            '<span class="tl-meta">' + meta + '</span>' +
            tag +
          '</div>' +
          '<div class="nudge">' +
            '<button data-act="nudge" data-id="' + it.id + '" data-dir="-1" aria-label="30분 앞으로">▲</button>' +
            '<button data-act="nudge" data-id="' + it.id + '" data-dir="1" aria-label="30분 뒤로">▼</button>' +
          '</div>' +
        '</div>';
    }).join('');
  }

  var nowHTML = '';
  if (isToday){
    var now = new Date();
    var nowMin = now.getHours()*60 + now.getMinutes();
    if (nowMin >= START_HOUR*60 && nowMin <= END_HOUR*60){
      var ntop = (nowMin - START_HOUR*60)/60*HOUR_H;
      nowHTML = '<div class="tl-now" style="top:' + ntop.toFixed(1) + 'px"></div>';
    }
  }

  var tl = $('#timeline');
  tl.innerHTML = grid + blocks + nowHTML;
  attachDrag(tl);

  /* 날짜 미정 보관함 */
  var undated = state.items.filter(function(it){ return !it.date; });
  if (undated.length){
    $('#flexTray').innerHTML = '<div class="flex-tray"><span class="tray-label">날짜 미정 ' + undated.length + '건</span>' +
      undated.map(function(it){
        var c = CAT[it.cat] || CATS[0];
        return '<button class="tray-item" data-act="open-item" data-id="' + it.id + '" style="--c:' + c.hex + '">' +
          '<span class="dot"></span>' + esc(it.title) + '</button>';
      }).join('') + '</div>';
  } else {
    $('#flexTray').innerHTML = '';
  }
}

/* ── drag ─────────────────────────────────────────────── */
var suppressClickUntil = 0;
function attachDrag(root){
  root.querySelectorAll('.grip').forEach(function(grip){
    grip.addEventListener('pointerdown', function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      var block = grip.closest('.tl-block');
      if (!block) return;
      var id = block.getAttribute('data-id');
      var it = itemById(id);
      if (!it) return;
      var origStart = parseInt(block.getAttribute('data-start'), 10);
      var dur = parseInt(block.getAttribute('data-dur'), 10) || 60;
      var startY = ev.clientY, moved = false, lastMin = origStart;
      var metaEl = block.querySelector('.tl-meta');
      if (grip.setPointerCapture) grip.setPointerCapture(ev.pointerId);

      function move(e){
        var dy = e.clientY - startY;
        if (Math.abs(dy) > 2) moved = true;
        var deltaMin = Math.round(dy / (HOUR_H/60) / 15) * 15;
        var s = clamp(origStart + deltaMin, 0, END_HOUR*60 - dur);
        lastMin = s;
        block.style.top = ((s - START_HOUR*60)/60*HOUR_H).toFixed(1) + 'px';
        if (metaEl) metaEl.textContent = toHHMM(s) + '–' + toHHMM(s+dur) + ' · ' + fmtDurChip(dur);
      }
      function end(){
        grip.removeEventListener('pointermove', move);
        grip.removeEventListener('pointerup', end);
        grip.removeEventListener('pointercancel', end);
        if (moved){
          it.start = toHHMM(lastMin);
          save();
          suppressClickUntil = Date.now() + 400;
          renderAll();
          toast('시간을 ' + toHHMM(lastMin) + '로 옮겼어요');
        }
      }
      grip.addEventListener('pointermove', move);
      grip.addEventListener('pointerup', end);
      grip.addEventListener('pointercancel', end);
    });
  });
}

/* ============================================================
   7. Render — checklist
   ============================================================ */
function matchDur(it, f){
  if (f === 'all') return true;
  if (f === 'none') return !!it.uncertain || it.dur == null;
  if (it.dur == null) return false;
  if (f === 's') return it.dur <= 30;
  if (f === 'h') return it.dur > 30 && it.dur < 120;
  if (f === 'l') return it.dur >= 120;
  return true;
}

function renderFilters(){
  $('#durChips').innerHTML = DUR_FILTERS.map(function(f){
    return '<button class="chip' + (state.durFilter === f.id ? ' is-on' : '') + '" data-act="dur-filter" data-val="' + f.id + '">' +
      f.label + '</button>';
  }).join('');

  var catChips = [{id:'all', name:'카테고리 전체', hex:null}].concat(CATS);
  $('#catChips').innerHTML = catChips.map(function(c){
    var on = state.catFilter === c.id;
    return '<button class="chip' + (on ? ' is-on' : '') + '" data-act="cat-filter" data-val="' + c.id + '">' +
      (c.hex ? '<span class="dot" style="background:' + c.hex + '"></span>' : '') + esc(c.name) + '</button>';
  }).join('');
}

function renderList(){
  var arr = state.items.slice();
  if (state.catFilter !== 'all') arr = arr.filter(function(it){ return it.cat === state.catFilter; });
  if (state.durFilter !== 'all') arr = arr.filter(function(it){ return matchDur(it, state.durFilter); });

  arr.sort(function(a,b){
    var ad = a.date || '9999-99-99', bd = b.date || '9999-99-99';
    if (ad !== bd) return ad < bd ? -1 : 1;
    var am = a.start ? toMin(a.start) : 25*60, bm = b.start ? toMin(b.start) : 25*60;
    return am - bm;
  });

  var doneAll = state.items.filter(function(it){ return it.done; }).length;
  $('#doneCount').textContent = doneAll + ' / ' + state.items.length + ' 완료';

  if (!arr.length){
    $('#rows').innerHTML = '<div class="empty">이 조건에 맞는 일정이 없어요.<br>필터를 바꾸거나 새로 적어보세요.</div>';
    return;
  }

  var checkSvg = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  $('#rows').innerHTML = arr.map(function(it){
    var c = CAT[it.cat] || CATS[0];
    var flex = it.uncertain && !it.confirmed;
    var when;
    if (!it.date) when = '날짜 미정';
    else if (it.start) when = dayLabel(it.date) + ' · ' + it.start + '–' + toHHMM(toMin(it.start) + (it.dur || 60));
    else when = dayLabel(it.date) + ' · 시간 미정';

    var durTxt = it.dur != null ? fmtDurChip(it.dur) : '소요 미정';
    var sub = it.checks && it.checks.length
      ? '<div class="row-sub' + (it.checks.every(function(x){ return x.done; }) ? ' is-done' : '') + '" style="margin-top:6px">' +
          it.checks.map(function(ch, idx){
            return '<button class="mini-check" data-act="toggle-check" data-id="' + it.id + '" data-idx="' + idx + '" aria-pressed="' + (ch.done ? 'true':'false') + '">' +
              '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
              '<span>' + esc(ch.text) + '</span>';
          }).join(' ') +
        '</div>'
      : '';

    return '<div class="row' + (it.done ? ' is-done' : '') + '" style="--c:' + c.hex + '">' +
        '<button class="check" data-act="toggle-done" data-id="' + it.id + '" aria-pressed="' + (it.done ? 'true':'false') + '" aria-label="' + (it.done ? '완료 취소' : '완료') + '">' + checkSvg + '</button>' +
        '<div class="row-main" data-act="open-item" data-id="' + it.id + '" role="button" tabindex="0">' +
          '<div class="row-title">' + esc(it.title) + '</div>' +
          '<div class="row-meta">' +
            '<span class="dot"></span>' + esc(c.name) +
            '<span class="sep">·</span>' + when +
            '<span class="sep">·</span>' + durTxt +
            (flex ? '<span class="sep">·</span><span style="color:var(--brand-strong)">어림</span>' : '') +
          '</div>' + sub +
        '</div>' +
      '</div>';
  }).join('');
}

/* ============================================================
   8. Render — composer preview
   ============================================================ */
var draft = null;
var openChipDim = null;

function chipLabel(dim){
  if (!draft) return '';
  if (dim === 'date'){
    if (draft.date === todayStr()) return '오늘 ' + mdLabel(draft.date);
    if (draft.date === ymd(addDays(new Date(),1))) return '내일 ' + mdLabel(draft.date);
    return dayLabel(draft.date);
  }
  if (dim === 'time') return draft.start ? draft.start : '시간 미정';
  if (dim === 'dur') return fmtDurChip(draft.dur);
  if (dim === 'cat') return (CAT[draft.cat] || CATS[0]).name;
  return '';
}

function chipOptions(dim){
  var opts = [];
  if (dim === 'date'){
    var base = new Date();
    opts.push({v: todayStr(), l: '오늘'});
    opts.push({v: ymd(addDays(base,1)), l: '내일'});
    opts.push({v: ymd(addDays(base,2)), l: '모레'});
    for (var i = 3; i < 10; i++){
      var d = addDays(base, i);
      opts.push({v: ymd(d), l: WD[d.getDay()] + ' ' + (d.getMonth()+1) + '/' + d.getDate()});
    }
  } else if (dim === 'time'){
    opts.push({v: '', l: '미정'});
    for (var h = 9; h <= 23; h++) opts.push({v: pad2(h) + ':00', l: pad2(h) + ':00'});
  } else if (dim === 'dur'){
    opts.push({v: '', l: '미정'});
    [15,30,45,60,90,120,180,240].forEach(function(mn){ opts.push({v: String(mn), l: fmtDurChip(mn)}); });
  } else if (dim === 'cat'){
    CATS.forEach(function(c){ opts.push({v: c.id, l: c.name}); });
  }
  return opts;
}

function renderPreview(){
  var pv = $('#preview');
  var addBtn = $('#addBtn');
  var raw = $('#quickInput').value;

  if (!raw.trim()){
    pv.hidden = true; pv.innerHTML = '';
    draft = null; addBtn.disabled = true;
    openChipDim = null;
    return;
  }

  draft = parseSentence(raw);
  if (!draft || !draft.title){
    pv.hidden = true; addBtn.disabled = true; return;
  }

  pv.hidden = false;
  addBtn.disabled = false;

  var c = CAT[draft.cat] || CATS[0];
  var flex = draft.uncertain && !draft.start;

  var chips = '';
  chips += chipHTML('date', chipLabel('date'), false);
  chips += chipHTML('time', chipLabel('time'), !draft.start);
  chips += chipHTML('dur', chipLabel('dur'), draft.dur == null);
  chips += chipHTML('cat', chipLabel('cat'), false);

  var optsHTML = '';
  if (openChipDim){
    var opts = chipOptions(openChipDim);
    optsHTML = '<div class="chip-opts" role="group" aria-label="' + openChipDim + ' 선택">' +
      opts.map(function(o){
        var on = String(o.v) === String(openChipDim === 'date' ? draft.date : openChipDim === 'time' ? (draft.start || '') : openChipDim === 'dur' ? (draft.dur == null ? '' : draft.dur) : draft.cat);
        return '<button class="opt' + (on ? ' is-on' : '') + '" data-act="chip-pick" data-dim="' + openChipDim + '" data-val="' + esc(o.v) + '">' + esc(o.l) + '</button>';
      }).join('') + '</div>';
  }

  pv.innerHTML =
    '<div class="preview-title">' + esc(draft.title) + '</div>' +
    (draft.memo ? '<div class="preview-note">메모 · ' + esc(draft.memo) + '</div>' : '') +
    (draft.checks.length ? '<div class="preview-note">체크 · ' + esc(draft.checks.map(function(x){return x.text;}).join(', ')) + '</div>' : '') +
    '<div class="p-chips">' + chips +
      (flex ? '<span class="p-chip is-flex">어림 배치</span>' : '') +
    '</div>' + optsHTML;
}

function chipHTML(dim, label, isFlex){
  return '<button class="p-chip' + (isFlex ? ' is-flex' : '') + '" data-act="chip-open" data-dim="' + dim + '" aria-expanded="' + (openChipDim === dim) + '">' +
    '<b>' + esc(label) + '</b><span class="caret">▾</span></button>';
}

/* ============================================================
   9. Sheet
   ============================================================ */
var sheetId = null;

function openSheet(id){
  var it = itemById(id);
  if (!it) return;
  sheetId = id;
  renderSheet();
  var w = $('#sheetWrap');
  w.classList.add('is-open');
  w.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
}

function closeSheet(){
  sheetId = null;
  var w = $('#sheetWrap');
  w.classList.remove('is-open');
  w.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
  renderAll();
}

function renderSheet(){
  var it = itemById(sheetId);
  if (!it) return;
  var c = CAT[it.cat] || CATS[0];
  var flex = it.uncertain && !it.confirmed;
  var s = it.start != null ? toMin(it.start) : (placementsFor(it.date).filter(function(p){ return p.it.id === it.id; })[0] || {s:19*60}).s;
  var e = s + (it.dur || 60);

  var timeChips = '<div class="chips is-scroll">';
  timeChips += '<button class="chip' + (it.start == null ? ' is-on' : '') + '" data-act="sheet-time" data-val="">미정</button>';
  for (var h = 9; h <= 23; h++){
    var v = pad2(h) + ':00';
    timeChips += '<button class="chip' + (it.start === v ? ' is-on' : '') + '" data-act="sheet-time" data-val="' + v + '">' + v + '</button>';
  }
  timeChips += '</div>';

  var catChips = '<div class="chips">' + CATS.map(function(cc){
    return '<button class="chip' + (it.cat === cc.id ? ' is-on' : '') + '" data-act="sheet-cat" data-val="' + cc.id + '">' +
      '<span class="dot" style="background:' + cc.hex + '"></span>' + cc.name + '</button>';
  }).join('') + '</div>';

  var subs = (it.checks || []).map(function(ch, idx){
    return '<div class="sub-row' + (ch.done ? ' is-done' : '') + '">' +
      '<button class="mini-check" data-act="toggle-check" data-id="' + it.id + '" data-idx="' + idx + '" aria-pressed="' + (ch.done ? 'true':'false') + '">' +
        '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
      '<span>' + esc(ch.text) + '</span>' +
      '<button class="del" data-act="del-check" data-id="' + it.id + '" data-idx="' + idx + '">삭제</button>' +
    '</div>';
  }).join('');

  $('#sheet').innerHTML =
    '<div class="sheet-grab" aria-hidden="true"></div>' +
    '<div class="sheet-head">' +
      '<span class="sheet-cat" style="--c:' + c.hex + ';--w:' + c.weak + '"><span class="dot"></span>' + esc(c.name) + '</span>' +
      '<button class="sheet-x" data-act="sheet-close">닫기</button>' +
    '</div>' +
    '<textarea class="sheet-title" id="sheetTitle" rows="1" aria-label="일정 제목">' + esc(it.title) + '</textarea>' +
    '<div class="sheet-sec">' +
      '<div class="sheet-label">시간' + (flex ? ' · 지금은 어림 배치' : '') + '</div>' +
      '<div class="sheet-time">' +
        '<button class="nudge-lg" data-act="sheet-nudge" data-dir="-1">▲ 30분 앞</button>' +
        '<span class="sheet-time-v">' + toHHMM(s) + '–' + toHHMM(e) + '</span>' +
        '<button class="nudge-lg" data-act="sheet-nudge" data-dir="1">▼ 30분 뒤</button>' +
      '</div>' +
      timeChips +
    '</div>' +
    '<div class="sheet-sec">' +
      '<div class="sheet-label">확정</div>' +
      '<button class="switch" data-act="sheet-confirm" aria-pressed="' + (it.confirmed ? 'true':'false') + '">' +
        '<span>' + (it.confirmed ? '확정된 시간이에요' : '아직 어림 시간이에요') + '</span>' +
        '<span class="knob" aria-hidden="true"></span>' +
      '</button>' +
    '</div>' +
    '<div class="sheet-sec">' +
      '<div class="sheet-label">카테고리</div>' + catChips +
    '</div>' +
    '<div class="sheet-sec">' +
      '<div class="sheet-label">메모</div>' +
      '<textarea class="sheet-memo" id="sheetMemo" placeholder="메모를 남겨두세요">' + esc(it.memo || '') + '</textarea>' +
    '</div>' +
    '<div class="sheet-sec">' +
      '<div class="sheet-label">체크</div>' +
      '<div class="sub-list">' + subs + '</div>' +
      '<div class="sub-add">' +
        '<input id="subInput" placeholder="체크할 일 (예: 가기 전 전화)" aria-label="체크할 일 추가">' +
        '<button data-act="add-check">추가</button>' +
      '</div>' +
    '</div>' +
    '<div class="sheet-foot">' +
      '<button class="btn-ghost" data-act="sheet-today">' + (it.date === todayStr() ? '오늘 일정' : '오늘로 옮기기') + '</button>' +
      '<button class="btn-ghost is-danger" data-act="sheet-del">삭제</button>' +
    '</div>';

  var t = $('#sheetTitle');
  t.addEventListener('input', function(){
    var v = this.value.replace(/\n/g,' ').trim();
    var itm = itemById(sheetId);
    if (!itm) return;
    itm.title = v || itm.title;
    save();
  });
  t.addEventListener('blur', function(){ renderAll(); });

  var memoEl = $('#sheetMemo');
  memoEl.addEventListener('input', function(){
    var itm = itemById(sheetId);
    if (!itm) return;
    itm.memo = this.value;
    save();
  });

  var subInput = $('#subInput');
  subInput.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter'){ ev.preventDefault(); addCheck(); }
  });
}

function addCheck(){
  var it = itemById(sheetId);
  var input = $('#subInput');
  if (!it || !input) return;
  var v = input.value.trim();
  if (!v) return;
  it.checks = it.checks || [];
  it.checks.push({text: v, done: false});
  save();
  renderSheet();
  renderAll();
  var ni = $('#subInput');
  if (ni) ni.focus();
}

/* ============================================================
   10. Toast
   ============================================================ */
var toastTimer = null;
function toast(msg, actionLabel, actionFn){
  var el = $('#toast');
  el.innerHTML = '<span>' + esc(msg) + '</span>' +
    (actionLabel ? '<button type="button" id="toastAct">' + esc(actionLabel) + '</button>' : '');
  el.hidden = false;
  requestAnimationFrame(function(){ el.classList.add('is-on'); });
  if (actionLabel && actionFn){
    var b = $('#toastAct');
    b.addEventListener('click', function(){
      hideToast();
      actionFn();
    });
  }
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, actionLabel ? 4200 : 2000);
}
function hideToast(){
  var el = $('#toast');
  el.classList.remove('is-on');
  setTimeout(function(){ el.hidden = true; }, 200);
}

/* ============================================================
   11. Mode-specific render
   ============================================================ */
function renderAll(){
  renderMonth();
  renderDay();
  renderFilters();
  renderList();
}

/* ============================================================
   12. Actions (event delegation)
   ============================================================ */
document.addEventListener('click', function(ev){
  if (Date.now() < suppressClickUntil) return;
  var el = ev.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');
  var id = el.getAttribute('data-id');

  /* ---- month nav ---- */
  if (act === 'month-prev' || act === 'month-next'){
    var cur = state.cursor || todayStr().slice(0,7);
    var y = parseInt(cur.slice(0,4),10), m = parseInt(cur.slice(5,7),10);
    var d = new Date(y, m-1 + (act === 'month-next' ? 1 : -1), 1);
    state.cursor = ymd(d).slice(0,7);
    save(); renderMonth();
    return;
  }

  /* ---- pick day ---- */
  if (act === 'pick-day'){
    var ds = el.getAttribute('data-date');
    if (!ds) return;
    state.selected = ds;
    if (ds.slice(0,7) !== state.cursor) state.cursor = ds.slice(0,7);
    save(); renderAll();
    return;
  }

  /* ---- nudge on block ---- */
  if (act === 'nudge'){
    var it = itemById(id);
    if (!it) return;
    var dir = parseInt(el.getAttribute('data-dir'), 10);
    var curS;
    if (it.start != null) curS = toMin(it.start);
    else {
      var pl = placementsFor(it.date).filter(function(p){ return p.it.id === it.id; })[0];
      curS = pl ? pl.s : 19*60;
    }
    var dur = it.dur || 60;
    var ns = clamp(curS + dir*30, 0, END_HOUR*60 - dur);
    it.start = toHHMM(ns);
    save(); renderAll();
    toast((dir < 0 ? '30분 앞으로' : '30분 뒤로') + ' · ' + toHHMM(ns), '되돌리기', function(){
      it.start = toHHMM(curS); save(); renderAll();
    });
    return;
  }

  /* ---- open item ---- */
  if (act === 'open-item'){
    openSheet(id);
    return;
  }

  /* ---- toggle done ---- */
  if (act === 'toggle-done'){
    var ti = itemById(id);
    if (!ti) return;
    ti.done = !ti.done;
    save(); renderAll();
    if (ti.done) toast('완료로 표시했어요', '되돌리기', function(){ ti.done = false; save(); renderAll(); });
    return;
  }

  /* ---- toggle sub check ---- */
  if (act === 'toggle-check'){
    var ci = itemById(id);
    var idx = parseInt(el.getAttribute('data-idx'), 10);
    if (!ci || !ci.checks || !ci.checks[idx]) return;
    ci.checks[idx].done = !ci.checks[idx].done;
    save();
    if (sheetId === id) renderSheet();
    renderAll();
    return;
  }

  /* ---- filters ---- */
  if (act === 'dur-filter'){
    state.durFilter = el.getAttribute('data-val');
    save(); renderFilters(); renderList();
    return;
  }
  if (act === 'cat-filter'){
    state.catFilter = el.getAttribute('data-val');
    save(); renderFilters(); renderList();
    return;
  }

  /* ---- composer chips ---- */
  if (act === 'chip-open'){
    var dim = el.getAttribute('data-dim');
    openChipDim = (openChipDim === dim) ? null : dim;
    renderPreview();
    return;
  }
  if (act === 'chip-pick'){
    if (!draft) return;
    var dim2 = el.getAttribute('data-dim');
    var val = el.getAttribute('data-val');
    if (dim2 === 'date') draft.date = val;
    if (dim2 === 'time'){
      draft.start = val || null;
      draft.uncertain = !val;
    }
    if (dim2 === 'dur') draft.dur = val ? parseInt(val, 10) : null;
    if (dim2 === 'cat') draft.cat = val;
    openChipDim = null;
    renderPreview();
    return;
  }

  /* ---- sheet ---- */
  if (act === 'sheet-close'){ closeSheet(); return; }

  if (act === 'sheet-nudge'){
    var si = itemById(sheetId);
    if (!si) return;
    var dir2 = parseInt(el.getAttribute('data-dir'), 10);
    var base;
    if (si.start != null) base = toMin(si.start);
    else {
      var pl2 = placementsFor(si.date).filter(function(p){ return p.it.id === si.id; })[0];
      base = pl2 ? pl2.s : 19*60;
    }
    var nd = si.dur || 60;
    si.start = toHHMM(clamp(base + dir2*30, 0, END_HOUR*60 - nd));
    save(); renderSheet(); renderAll();
    return;
  }

  if (act === 'sheet-time'){
    var st = itemById(sheetId);
    if (!st) return;
    var v2 = el.getAttribute('data-val');
    st.start = v2 || null;
    save(); renderSheet(); renderAll();
    return;
  }

  if (act === 'sheet-confirm'){
    var sc = itemById(sheetId);
    if (!sc) return;
    if (!sc.confirmed && sc.start == null){
      var pl3 = placementsFor(sc.date).filter(function(p){ return p.it.id === sc.id; })[0];
      if (pl3) sc.start = toHHMM(pl3.s);
    }
    sc.confirmed = !sc.confirmed;
    if (sc.confirmed) sc.uncertain = false;
    save(); renderSheet(); renderAll();
    return;
  }

  if (act === 'sheet-cat'){
    var sk = itemById(sheetId);
    if (!sk) return;
    sk.cat = el.getAttribute('data-val');
    save(); renderSheet(); renderAll();
    return;
  }

  if (act === 'add-check'){ addCheck(); return; }

  if (act === 'del-check'){
    var di = itemById(id);
    var dix = parseInt(el.getAttribute('data-idx'), 10);
    if (!di || !di.checks) return;
    di.checks.splice(dix,1);
    save(); renderSheet(); renderAll();
    return;
  }

  if (act === 'sheet-today'){
    var td = itemById(sheetId);
    if (!td) return;
    td.date = todayStr();
    state.selected = td.date;
    state.cursor = td.date.slice(0,7);
    save(); renderSheet(); renderAll();
    toast('오늘로 옮겼어요');
    return;
  }

  if (act === 'sheet-del'){
    var dd = itemById(sheetId);
    if (!dd) return;
    var backup = JSON.parse(JSON.stringify(dd));
    state.items = state.items.filter(function(x){ return x.id !== dd.id; });
    save();
    closeSheet();
    toast('삭제했어요', '되돌리기', function(){
      state.items.push(backup);
      save(); renderAll();
    });
    return;
  }

  if (act === 'reset'){
    if (!window.confirm('저장된 일정을 모두 지우고 처음 상태로 돌아갈까요?')) return;
    state = {version:1, items: seedItems(), cursor:null, selected:null, catFilter:'all', durFilter:'all'};
    initCursor();
    save(); renderAll();
    toast('처음 상태로 돌아왔어요');
    return;
  }
});

/* keyboard: row open */
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape' && sheetId){ closeSheet(); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('.row-main[data-act]')){
    ev.preventDefault();
    openSheet(ev.target.getAttribute('data-id'));
  }
});

/* ============================================================
   13. Composer wiring
   ============================================================ */
var inputTimer = null;
$('#quickInput').addEventListener('input', function(){
  clearTimeout(inputTimer);
  inputTimer = setTimeout(renderPreview, 180);
});
$('#quickInput').addEventListener('keydown', function(ev){
  if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)){
    ev.preventDefault();
    addFromComposer();
  }
});

function addFromComposer(){
  if (!draft || !draft.title) return;
  var it = {
    id: uid(),
    title: draft.title,
    date: draft.date,
    start: draft.start,
    dur: draft.dur,
    cat: draft.cat,
    uncertain: !!draft.uncertain,
    confirmed: false,
    whenLabel: draft.whenLabel || '',
    memo: draft.memo || '',
    checks: (draft.checks || []).slice(),
    done: false,
    createdAt: Date.now()
  };
  state.items.push(it);
  state.selected = it.date;
  state.cursor = it.date.slice(0,7);
  save();

  $('#quickInput').value = '';
  $('#preview').hidden = true;
  $('#preview').innerHTML = '';
  draft = null;
  openChipDim = null;
  $('#addBtn').disabled = true;
  renderAll();

  var when = it.start ? (mdLabel(it.date) + ' ' + it.start) : (mdLabel(it.date) + ' · 어림 배치');
  toast(when + ' · ' + fmtDurChip(it.dur) + '로 담았어요', '되돌리기', function(){
    state.items = state.items.filter(function(x){ return x.id !== it.id; });
    save(); renderAll();
  });
}

$('#addBtn').addEventListener('click', addFromComposer);

/* today button */
$('#todayBtn').addEventListener('click', function(){
  var t = todayStr();
  state.selected = t;
  state.cursor = t.slice(0,7);
  save(); renderAll();
  var panel = $('#dayPanel');
  if (panel.getBoundingClientRect().top > window.innerHeight - 120){
    panel.scrollIntoView({behavior:'smooth', block:'start'});
  }
});

/* ============================================================
   14. Init
   ============================================================ */
function initCursor(){
  var t = todayStr();
  var monthHasItems = state.items.some(function(it){ return it.date && it.date.slice(0,7) === t.slice(0,7); });
  if (!state.cursor){
    if (monthHasItems || !state.items.length){
      state.cursor = t.slice(0,7);
    } else {
      var dates = state.items.map(function(it){ return it.date; }).filter(Boolean).sort();
      state.cursor = dates.length ? dates[0].slice(0,7) : t.slice(0,7);
    }
  }
  if (!state.selected){
    if (state.items.some(function(it){ return it.date === t; })){
      state.selected = t;
    } else {
      var upcoming = state.items.map(function(it){ return it.date; }).filter(function(ds){ return ds && ds >= t; }).sort()[0];
      state.selected = upcoming || t;
    }
  }
}

initCursor();
renderAll();

/* 날짜가 바뀌면(자정·복귀) 다시 그림 */
var lastToday = todayStr();
setInterval(function(){
  var t = todayStr();
  if (t !== lastToday){
    lastToday = t;
    if (state.selected === lastToday && !state.items.length){ /* noop */ }
    renderAll();
  }
}, 30000);
document.addEventListener('visibilitychange', function(){
  if (!document.hidden){
    var t = todayStr();
    if (t !== lastToday){ lastToday = t; renderAll(); }
    renderDay();
  }
});

/* 노출: 문장 파싱·상태 확인용 (읽기 전용 사용) */
window.__tt = {
  parse: parseSentence,
  state: function(){ return state; },
  placements: placementsFor
};

})();
