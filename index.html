<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F6">
<title>냉장고 구조대 · 한 달 소진 프로젝트</title>
<style>
  /* ══════════════════════════════════════════════
     냉장고 구조대 — Toss 스타일 스킨
     쿨그레이 배경 · 순백 카드 · 넉넉한 여백 · 큰 터치 타겟
     ══════════════════════════════════════════════ */
  :root{
    --bg:#F2F4F6;
    --card:#FFFFFF;
    --ink:#191F28;
    --ink2:#4E5968;
    --sub:#8B95A1;
    --sub2:#B0B8C1;
    --line:#EDF0F3;
    --line2:#E5E8EB;
    --blue:#3182F6;
    --blue-deep:#1B64DA;
    --blue-soft:#E8F3FF;
    --red:#F04452;
    --red-soft:#FFEEEE;
    --amber:#B26E00;
    --amber-soft:#FFF6E5;
    --green:#00C471;
    --green-soft:#E5F9F0;
    --shadow:0 1px 2px rgba(17,24,39,.03), 0 8px 24px rgba(17,24,39,.04);
    --shadow-lg:0 18px 48px rgba(17,24,39,.16);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  html,body{height:100%}

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    letter-spacing:-.02em;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    font-size:15px;
    line-height:1.5;
  }

  button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;font-size:inherit}
  input{font-family:inherit;font-size:inherit;color:inherit}

  .app{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:calc(108px + env(safe-area-inset-bottom));
  }

  /* ── 상단 바 ── */
  .topbar{
    position:sticky;
    top:0;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:20px 20px 14px;
    background:rgba(242,244,246,.94);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
  }
  .brand{display:flex;align-items:center;gap:10px}
  .brand-mark{
    width:38px;height:38px;border-radius:12px;
    background:#fff;box-shadow:var(--shadow);
    display:grid;place-items:center;font-size:20px;
  }
  .brand-text h1{font-size:18px;font-weight:800;letter-spacing:-.04em;line-height:1.25}
  .brand-text p{font-size:13px;color:var(--sub);font-weight:500;margin-top:1px;letter-spacing:-.02em}
  .ghost-btn{
    width:40px;height:40px;border-radius:12px;background:#fff;
    box-shadow:var(--shadow);color:var(--ink2);
    font-size:18px;font-weight:700;line-height:1;display:grid;place-items:center;
  }
  .ghost-btn:active{transform:scale(.95)}

  /* ── 대시보드 ── */
  .dash{
    margin:6px 20px 0;
    border-radius:24px;
    padding:22px 22px 20px;
    flex:0 0 auto;
    background:var(--card);
    box-shadow:var(--shadow);
  }
  .dash-top{display:flex;align-items:center;gap:16px}
  .ring-wrap{display:none}
  .dash-main{flex:1;min-width:0}
  .dash-eyebrow{font-size:13px;font-weight:600;color:var(--sub);letter-spacing:-.01em}
  .dash-num{display:flex;align-items:baseline;gap:6px;margin-top:6px}
  .dash-num strong{font-size:30px;font-weight:800;letter-spacing:-.06em;line-height:1.05}
  .dash-num span{font-size:16px;color:var(--sub2);font-weight:600;letter-spacing:-.03em}
  .dash-sub{font-size:14px;color:var(--ink2);margin-top:8px;font-weight:500;letter-spacing:-.02em}

  .bar{
    margin-top:16px;height:10px;border-radius:99px;background:#EDF1F4;
    overflow:hidden;position:relative;
  }
  .bar i{
    display:block;height:100%;border-radius:99px;
    background:var(--blue);
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }

  .alert-row{
    margin-top:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .alert-pill{
    display:inline-flex;align-items:center;gap:5px;
    font-size:13px;font-weight:700;letter-spacing:-.02em;
    padding:8px 12px;border-radius:10px;min-height:36px;
    background:#F2F4F6;color:var(--ink2);
  }
  .alert-pill.hot{background:var(--red-soft);color:var(--red)}
  .alert-pill.cool{background:var(--green-soft);color:#059669}
  .alert-pill.nutri{background:#fff;color:var(--ink2);border:1px solid var(--line2)}
  .urgent-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .urgent-chip{
    font-size:13.5px;font-weight:600;padding:9px 13px;border-radius:12px;min-height:40px;
    background:#F7F8FA;color:var(--ink2);border:1px solid #EDF0F3;
    display:inline-flex;align-items:center;
  }
  .urgent-chip:active{background:#EFF2F6}

  /* ── 탭 ── */
  .tabs{
    margin:20px 20px 0;
    display:flex;gap:4px;
    background:#E7EAEE;
    padding:5px;border-radius:16px;
  }
  .tab{
    flex:1;padding:12px 4px;border-radius:12px;min-height:46px;
    font-size:13.5px;font-weight:700;letter-spacing:-.03em;color:var(--ink2);
    white-space:nowrap;
    transition:background .18s,color .18s,box-shadow .18s;
  }
  .tab.is-active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(17,24,39,.08)}
  .tab:active{transform:scale(.985)}

  .main{padding:20px 20px 8px;flex:1}
  .view.is-hidden{display:none}

  /* ── 필터 ── */
  .filters{
    display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 6px;
  }
  .chip{
    flex:0 0 auto;padding:11px 15px;border-radius:12px;min-height:44px;
    display:inline-flex;align-items:center;
    background:#fff;color:var(--ink2);
    font-size:14px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;
    box-shadow:0 1px 2px rgba(17,24,39,.03);border:1px solid transparent;
    transition:background .15s,color .15s,border-color .15s;
  }
  .chip.is-on{background:#191F28;color:#fff;border-color:#191F28}
  .chip:active{transform:scale(.97)}
  .chip.toggle{display:inline-flex;align-items:center;gap:8px;padding-right:13px}
  .mini-switch{
    width:34px;height:20px;border-radius:99px;background:#DCE1E6;
    position:relative;display:inline-block;transition:background .2s;flex:0 0 auto;
  }
  .mini-switch i{
    position:absolute;top:2.5px;left:2.5px;width:15px;height:15px;border-radius:50%;
    background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.14);
  }
  .chip.toggle.is-on .mini-switch{background:var(--blue)}
  .chip.toggle.is-on .mini-switch i{transform:translateX(14px)}

  /* ── 재료 리스트 ── */
  .group-head{
    display:flex;align-items:center;justify-content:space-between;
    margin:26px 4px 12px;
  }
  .group-head:first-child{margin-top:8px}
  .group-title{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800;color:var(--ink);letter-spacing:-.03em}
  .group-title .cnt{font-size:13px;font-weight:600;color:var(--sub)}
  .group-title .cnt b{color:var(--blue-deep);font-weight:700}
  .group-hint{font-size:12.5px;color:var(--sub);font-weight:500}

  .item{
    display:flex;align-items:center;gap:12px;
    background:var(--card);border-radius:20px;
    padding:16px 16px 16px 18px;margin-bottom:10px;
    box-shadow:var(--shadow);
    min-height:76px;
    transition:opacity .2s,background .2s;
  }
  .item.is-done{opacity:.5;background:#FAFBFC;box-shadow:none}
  .item-main{flex:1;min-width:0;text-align:left;display:block;padding:2px 0}
  .item-name{
    display:flex;align-items:center;gap:7px;flex-wrap:wrap;
    font-size:16px;font-weight:700;letter-spacing:-.03em;line-height:1.35;
  }
  .item.is-done .item-name{text-decoration:line-through;color:var(--sub);text-decoration-thickness:1.5px}
  .item-meta{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    margin-top:6px;font-size:13px;color:var(--sub);font-weight:500;line-height:1.4;
  }
  .item-meta .warn{color:#E8590C;font-weight:600}
  .item-meta .dot{width:3px;height:3px;border-radius:50%;background:#D6DBE0}
  .share-pill{
    display:inline-flex;align-items:center;gap:3px;
    font-size:12px;font-weight:700;letter-spacing:-.02em;
    color:var(--blue-deep);background:var(--blue-soft);
    padding:3px 8px;border-radius:8px;
  }
  .finish-btn{
    flex:0 0 auto;font-size:13px;font-weight:700;letter-spacing:-.02em;
    padding:10px 13px;border-radius:12px;white-space:nowrap;min-height:44px;
    background:#F2F4F6;color:var(--ink2);
    transition:background .15s,transform .12s;
  }
  .finish-btn:active{background:#E5E8EB;transform:scale(.96)}
  .mine{
    font-size:11px;font-weight:700;color:var(--blue-deep);
    background:var(--blue-soft);padding:3px 7px;border-radius:7px;letter-spacing:-.01em;
  }

  .emo{font-size:18px;line-height:1;flex:0 0 auto}

  /* ── 개수 차감 스테퍼 ── */
  .step{
    flex:0 0 auto;display:flex;align-items:center;gap:2px;
    background:#F2F4F6;border-radius:14px;padding:3px;
  }
  .step button{
    width:38px;height:38px;border-radius:11px;
    display:grid;place-items:center;
    font-size:18px;font-weight:700;line-height:1;color:var(--ink2);
    background:#fff;box-shadow:0 1px 2px rgba(17,24,39,.06);
  }
  .step button:active{transform:scale(.92)}
  .step button:disabled{opacity:.35;box-shadow:none;background:transparent}
  .step-num{
    min-width:44px;text-align:center;font-size:14px;font-weight:800;
    letter-spacing:-.04em;color:var(--ink);white-space:nowrap;
  }
  .step-num small{font-size:11px;font-weight:600;color:var(--sub);margin-left:1px}
  /* 1개에서 −를 누른 '소량' 단계 — 스테퍼를 주황으로 바꿔 한눈에 구분 */
  .step.is-partial{background:#FFF1E3}
  .step.is-partial button{background:#fff}
  .step-num.is-partial{
    font-size:12.5px;font-weight:800;color:#E8590C;letter-spacing:-.02em;
  }
  .step-num[data-act]{cursor:pointer;border-radius:8px}
  .step-num[data-act]:active{background:rgba(232,89,12,.12)}

  /* ── 아직 많이 남았나요? ── */
  .leftover{
    margin:14px 0 6px;border-radius:22px;padding:20px;
    background:#FFFDF6;border:1px solid #F5EAD2;
    box-shadow:var(--shadow);
  }
  .leftover-head{display:flex;align-items:center;gap:6px;font-size:15.5px;font-weight:800;color:#7A5A0C;letter-spacing:-.03em}
  .leftover-sub{font-size:13px;color:#967A45;font-weight:400;margin-top:6px;line-height:1.55}
  .leftover-row{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    margin-top:14px;padding-top:14px;border-top:1px solid rgba(180,140,40,.14);
  }
  .leftover-row:first-of-type{border-top:0;padding-top:4px}
  .leftover-name{flex:1 1 100%;min-width:0;font-size:14px;font-weight:700;color:#5E4A11;display:flex;align-items:center;gap:6px;letter-spacing:-.02em}
  .leftover-name em{font-style:normal;font-size:12px;font-weight:500;color:#A98A42}
  .lo-btn{
    flex:1 1 0;font-size:13px;font-weight:700;padding:12px 8px;border-radius:12px;min-height:46px;
    background:#fff;color:#7A5A0C;border:1px solid #EFE0BC;white-space:nowrap;
  }
  .lo-btn.solid{background:#8A6210;color:#fff;border-color:#8A6210}
  .lo-btn:active{transform:scale(.97)}

  /* ── 직접 입력: 고정 선택 태그 + 추천 칩 ── */
  .selbar{
    position:sticky;top:-10px;z-index:5;
    margin:14px -20px 0;padding:14px 20px 12px;
    background:#fff;border-bottom:1px solid var(--line);
    box-shadow:0 8px 16px -14px rgba(17,24,39,.3);
  }
  .tagrow{
    display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .tagrow::-webkit-scrollbar{display:none}
  .ptag{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
    font-size:13px;font-weight:700;padding:9px 12px;border-radius:99px;min-height:38px;
    background:var(--blue-soft);color:var(--blue-deep);
    letter-spacing:-.02em;white-space:nowrap;
  }
  .ptag .x{font-size:11px;font-weight:700;color:#7FA9E0;margin-left:1px}
  .ptag:active{transform:scale(.96)}
  .tag-empty{font-size:13px;font-weight:400;color:var(--sub);padding:9px 2px}
  .recbox{margin-top:12px}
  .rec-label{font-size:12.5px;font-weight:700;color:var(--sub);letter-spacing:-.01em;margin-bottom:8px}
  .rec-row{
    display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .rec-row::-webkit-scrollbar{display:none}
  .rec{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;
    font-size:13px;font-weight:600;padding:9px 12px;border-radius:99px;min-height:38px;
    background:#FFF9EC;color:#8A6210;border:1px solid #F3E5C6;white-space:nowrap;
  }
  .rec:active{transform:scale(.96)}

  .eat-sub{font-size:12.5px;font-weight:500;color:var(--sub);white-space:nowrap;letter-spacing:-.02em}
  .eat-row .step{margin-left:auto}

  /* 먹음 방식 선택 — 조금 먹음(남음) / 다 먹음(소진) */
  .eat-row.eat-bulk{display:block;padding:16px 2px}
  .eat-bulk .eat-top{display:flex;align-items:center;gap:10px}
  .eat-bulk .eat-name{flex:1;min-width:0}
  .eat-bulk .eat-sub{flex:0 1 auto;max-width:56%;overflow:hidden;text-overflow:ellipsis;padding-top:1px}
  .eat-modes{display:flex;gap:8px;margin-top:10px}

  /* 개수 재료 행 — 먹은 양을 1개 / 소량(반 개) 단위로 */
  .eat-row.eat-qty{display:block;padding:16px 2px}
  .eat-qty .eat-top{display:flex;align-items:center;gap:10px}
  .eat-qty .eat-name{flex:1;min-width:0}
  .eat-qty .eat-sub{flex:0 1 auto;max-width:58%;overflow:hidden;text-overflow:ellipsis;padding-top:1px}
  .eat-ctrl{display:flex;align-items:center;gap:8px;margin-top:10px}
  .eat-ctrl .step{flex:0 0 auto;margin-left:0}
  .eat-ctrl .step button{width:34px;height:34px;border-radius:10px;font-size:16px}
  .eat-ctrl .step-num{min-width:38px;font-size:13px}
  .eat-ctrl .emode.some{
    flex:1 1 0;min-width:0;min-height:44px;padding:10px 6px;
    font-size:12.5px;border-radius:11px;
  }
  .eat-ctrl .emode.some.is-on{background:#FFF1E3;border-color:#F6D3AE;color:#E8590C}
  .eat-ctrl .emode.some.is-on em{opacity:.7}
  .eat-ctrl .emode.finish-all{flex:0 0 auto}
  .emode{
    flex:1;padding:12px 6px;border-radius:12px;min-height:46px;
    background:#F5F7F9;border:1px solid #EDF0F3;
    font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap;
    transition:background .15s,color .15s,border-color .15s;
  }
  .emode em{font-style:normal;font-size:11px;font-weight:600;opacity:.62;margin-left:2px}
  .emode.is-on{background:var(--blue-soft);border-color:#BFD9FB;color:var(--blue-deep);font-weight:700}
  .emode.all.is-on{background:#191F28;border-color:#191F28;color:#fff}
  .emode.all.is-on em{opacity:.66}
  .emode.none{flex:0 0 46px;font-size:15px;font-weight:700;color:var(--sub2)}
  .emode.none.is-on{background:#F1F3F5;border-color:#E1E6EA;color:var(--sub)}
  .emode:active{transform:scale(.97)}
  .eat-row .emode.finish-all{flex:0 0 auto;padding:10px 10px;font-size:11.5px;border-radius:10px;min-height:36px;border-color:#E5E8EB;color:var(--ink2)}
  .eat-row .emode.finish-all.is-on{background:#191F28;border-color:#191F28;color:#fff}
  .eat-row.eat-bulk.is-none{opacity:.45}
  .eat-row.is-done .eat-sub{color:var(--sub2)}

  /* ── 이모지 선택 ── */
  .emopick{display:flex;gap:8px;flex-wrap:wrap}
  .emopick button{
    width:46px;height:46px;border-radius:14px;font-size:22px;
    background:#F5F7F9;border:1px solid transparent;display:grid;place-items:center;
  }
  .emopick button.is-on{background:var(--blue-soft);border-color:#BFD9FB}
  .emopick button:active{transform:scale(.94)}

  .badge{
    flex:0 0 auto;
    font-size:11.5px;font-weight:700;letter-spacing:-.01em;
    padding:3px 8px;border-radius:8px;white-space:nowrap;
  }
  .badge.urgent{background:var(--red-soft);color:var(--red)}
  .badge.soon{background:var(--amber-soft);color:var(--amber)}
  .badge.normal{background:#F2F4F6;color:var(--ink2)}
  .badge.safe{background:var(--green-soft);color:#0A8A5F}
  .badge.pantry{background:#F4F5F7;color:var(--sub)}
  .badge.done{background:#F2F4F6;color:var(--sub2)}

  .switch{
    flex:0 0 auto;width:54px;height:32px;border-radius:99px;
    background:#DCE1E6;position:relative;transition:background .22s ease;
  }
  .switch span{
    position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.16);
    transition:transform .22s cubic-bezier(.4,0,.2,1);
    display:grid;place-items:center;font-size:12px;color:transparent;
  }
  .switch.on{background:var(--blue)}
  .switch.on span{transform:translateX(22px)}
  .switch.on span::after{content:"✓";color:var(--blue);font-weight:900;font-size:13px}
  .switch:active{transform:scale(.94)}

  .empty{
    text-align:center;padding:52px 20px;color:var(--sub);
  }
  .empty .emo{font-size:34px;display:block;margin-bottom:14px;opacity:.85}
  .empty p{font-size:14px;font-weight:500;line-height:1.65}

  .section-note{
    display:block;
    margin:20px 0 4px;padding:18px 20px;
    background:#EEF1F4;border-radius:20px;
    font-size:13px;color:var(--ink2);line-height:1.65;font-weight:400;letter-spacing:-.02em;
  }
  .section-note b{font-weight:700;color:var(--ink)}

  /* ── 식단 탭 ── */
  .meals-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:2px 2px 16px}
  .meals-head h2{font-size:22px;font-weight:800;letter-spacing:-.05em;line-height:1.3}
  .meals-head p{font-size:13.5px;color:var(--sub);font-weight:400;margin-top:6px;line-height:1.5}
  .mini-btn{
    flex:0 0 auto;font-size:13.5px;font-weight:700;letter-spacing:-.02em;
    padding:12px 15px;border-radius:14px;background:#fff;color:var(--ink2);
    box-shadow:var(--shadow);min-height:46px;
  }
  .mini-btn:active{transform:scale(.96)}

  /* ── 오늘 / 내일 세그먼트 ── */
  .daytabs{
    display:flex;gap:6px;background:#E7EAEE;padding:5px;border-radius:16px;margin-bottom:16px;
  }
  .daytab{
    flex:1;padding:12px 6px;border-radius:12px;min-height:48px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    font-size:15px;font-weight:700;letter-spacing:-.03em;color:var(--ink2);
    transition:background .18s,color .18s,box-shadow .18s;
  }
  .daytab em{font-style:normal;font-size:12px;font-weight:600;color:var(--sub);letter-spacing:-.01em}
  .daytab.is-on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(17,24,39,.08)}
  .daytab.is-on em{color:var(--blue-deep);font-weight:700}
  .daytab:active{transform:scale(.985)}

  .day{margin-bottom:0}
  .day-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px;margin-bottom:8px}
  .day-left{display:flex;align-items:center;gap:8px}
  .day-tag{
    font-size:13px;font-weight:700;color:var(--blue-deep);background:var(--blue-soft);
    padding:5px 10px;border-radius:9px;letter-spacing:-.02em;
  }
  .day-tag.tomorrow{color:var(--ink2);background:#EDF0F3}
  .day-date{font-size:13px;color:var(--sub);font-weight:500}
  .day-count{font-size:12.5px;font-weight:700;color:var(--ink2);background:#F2F4F6;padding:5px 9px;border-radius:8px}
  .day-count.zero{color:var(--sub)}

  .snackbar{display:flex;align-items:center;gap:10px;margin:0 2px 16px}
  .snacks{flex:1;min-width:0;display:flex;align-items:center;gap:8px;overflow-x:auto;
    scrollbar-width:none;-ms-overflow-style:none;padding:2px 0}
  .snacks::-webkit-scrollbar{display:none}
  .snacks .day-count{margin-left:auto}
  .snacks-label{flex:0 0 auto;white-space:nowrap;font-size:12.5px;font-weight:700;color:var(--sub);letter-spacing:-.01em;margin-right:2px}
  .snack{
    flex:0 0 auto;
    font-size:13px;font-weight:600;padding:9px 13px;border-radius:12px;min-height:40px;
    background:#fff;color:var(--ink2);border:1px solid transparent;
    box-shadow:0 1px 2px rgba(17,24,39,.03);
    transition:background .15s,color .15s,border-color .15s;
  }
  .snack.is-on{background:var(--blue-soft);color:var(--blue-deep);border-color:#CBDFFA;font-weight:700}
  .snack:active{transform:scale(.96)}

  /* ── 끼니 카드 ── */
  .meal-card{
    position:relative;
    border-radius:24px;background:var(--card);
    padding:22px 20px 20px;margin:0 0 14px;
    box-shadow:var(--shadow);
    transition:background .18s,opacity .2s;
  }
  .meal-card.is-skip{background:#FAFBFC}
  .meal-card.is-eaten{background:#FBFDFF}
  .meal-card.is-mine{background:#FBFDFF}
  .meal-card.has-gone{background:#FFFCF7}

  /* 카드 상단: 끼니 라벨 + 상태 배지 · 우측 교체 버튼 */
  .mc-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .mc-label{flex:1;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .mc-meal{font-size:13.5px;font-weight:700;color:var(--ink2);letter-spacing:-.02em;white-space:nowrap}
  .mc-dot{font-style:normal;font-size:11px;font-weight:500;color:var(--sub2);line-height:1}
  .mc-date{font-size:13px;font-weight:500;color:var(--sub);white-space:nowrap}
  .mc-badge{
    font-size:11.5px;font-weight:700;letter-spacing:-.01em;
    padding:3px 8px;border-radius:8px;
    background:#F2F4F6;color:var(--ink2);white-space:nowrap;
  }
  .mc-badge.mine{background:var(--blue-soft);color:var(--blue-deep)}
  .mc-badge.eaten{background:var(--green-soft);color:#0A8A5F}
  .mc-badge.skip{background:#EDF0F3;color:var(--sub)}
  .mc-swap{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;
    font-size:13px;font-weight:700;letter-spacing:-.02em;color:var(--ink2);
    padding:9px 12px;border-radius:12px;background:#F5F7F9;
    white-space:nowrap;min-height:40px;transition:background .15s,transform .12s;
  }
  .mc-swap:active{background:#E9EDF1;transform:scale(.97)}

  /* 제목 줄 + 인라인 편집 버튼 */
  .mc-title{display:block}
  .meal-name{
    font-size:21px;font-weight:800;letter-spacing:-.045em;line-height:1.34;color:var(--ink);
    word-break:keep-all;
  }
  .meal-card.is-skip .meal-name{color:var(--sub);text-decoration:line-through;text-decoration-thickness:2px;font-size:18px}
  .mc-tools{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
  .mc-edit{
    flex:0 0 auto;
    font-size:13px;font-weight:600;letter-spacing:-.02em;line-height:1.35;
    color:var(--ink2);background:#F5F7F9;
    padding:9px 12px;border-radius:12px;white-space:nowrap;min-height:40px;
    display:inline-flex;align-items:center;gap:4px;
    transition:background .15s;
  }
  .mc-edit:active{background:#E9EDF1}

  /* 조리 시간·태그 */
  .mc-meta{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13.5px;font-weight:500;color:var(--sub);letter-spacing:-.02em}
  .mc-meta em{font-style:normal;color:var(--sub2)}

  /* 조리 한 줄 */
  .steps{margin-top:12px;font-size:14px;line-height:1.7;color:var(--ink2);font-weight:400;letter-spacing:-.02em}
  .steps.warn{
    margin-top:14px;padding:14px 16px;border-radius:16px;
    background:#FFF8EC;color:#8A5305;font-weight:500;
  }
  .mine-empty{
    margin-top:16px;font-size:13.5px;font-weight:400;color:var(--sub);
    background:#F5F7F9;border-radius:14px;padding:14px 16px;line-height:1.55;
  }
  .mine-empty b{color:var(--ink2);font-weight:700}

  /* 재료 칩 */
  .use-chips{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
  .ichip{
    display:inline-flex;align-items:center;gap:6px;
    min-height:40px;padding:6px 6px 6px 12px;border-radius:13px;
    background:#F5F7F9;border:1px solid transparent;
    font-size:13.5px;font-weight:600;letter-spacing:-.02em;color:var(--ink2);
    transition:background .15s;
  }
  .ichip .nm{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .ichip .x{
    width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
    font-size:10px;font-weight:800;color:var(--sub);background:#E7EBEF;line-height:1;
  }
  .ichip:active{background:#EDF1F5}
  .ichip:active .x{background:#DCE2E8}
  .ichip.urgent{background:var(--red-soft);border-color:#FFDCDC;color:#C2323E}
  .ichip.urgent .x{background:#FFDCDC;color:#C77F81}
  .ichip.soon{background:var(--amber-soft);border-color:#F7E6C4;color:#94600A}
  .ichip.soon .x{background:#F8E7C9;color:#B58C4A}
  .ichip.is-depleted{background:#F4F5F7;border-color:#EDF0F3;color:var(--sub2)}
  .ichip.is-depleted .nm{text-decoration:line-through;text-decoration-thickness:1px}
  .ichip.is-depleted .x{background:#EDEFF2;color:#C4CAD1}
  .ichip .gone{
    font-size:10px;font-weight:700;letter-spacing:-.01em;
    padding:2px 5px;border-radius:6px;background:#F1EDE5;color:#A07B3C;
  }
  .ichip .state{
    font-size:10px;font-weight:700;letter-spacing:-.01em;
    padding:2px 5px;border-radius:6px;background:var(--blue-soft);color:var(--blue-deep);
  }
  .ichip.is-sharing{background:#F2F8FF;border-color:#DCEAFA;color:var(--blue-deep)}
  .ichip.is-finished{background:#F4F5F7;border-color:#EDF0F3;color:var(--sub)}
  .ichip.is-finished .state{background:#EDEFF2;color:var(--sub)}
  .ichip.is-finished .x{background:#EDEFF2;color:#C4CAD1}
  .ichip.add{
    padding:6px 14px;background:#fff;border:1px dashed #CBD5DE;
    color:var(--ink2);font-weight:700;
  }
  .ichip.add:active{background:#F5F7F9}

  /* 소진 알림 바 */
  .gone-bar{
    margin-top:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:14px 16px;border-radius:16px;
    background:#FFF8EC;border:1px solid #F5E6C9;
    font-size:13px;font-weight:500;letter-spacing:-.02em;color:#8A5305;line-height:1.55;
  }
  .gone-bar strong{font-weight:700}
  .gone-bar button{
    margin-left:auto;flex:0 0 auto;
    font-size:12.5px;font-weight:700;color:#7A4A05;
    background:#fff;border:1px solid #EFDCBA;border-radius:10px;padding:9px 11px;min-height:38px;
    white-space:nowrap;
  }
  .gone-bar button:active{background:#FDF1DC}

  /* ── 탄단지 요약 ── */
  .macro{
    margin-top:16px;padding:14px 16px;border-radius:16px;background:#F7F8FA;
  }
  .macro-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .macro-kcal{font-size:13px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
  .macro-pcts{margin-left:auto;display:flex;gap:7px;font-size:12.5px;letter-spacing:-.02em;white-space:nowrap}
  .macro-pcts b{font-weight:700}
  .macro-pcts .c{color:#B77900}
  .macro-pcts .p{color:var(--blue-deep)}
  .macro-pcts .f{color:#C9623F}
  .macro-bar{display:flex;gap:3px;height:9px;margin-top:11px;background:#E7EBEF;border-radius:99px;overflow:hidden}
  .macro-bar i{display:block;height:100%;border-radius:99px;min-width:3px;transition:width .25s ease}
  .macro-bar .c{background:#FFC64D}
  .macro-bar .p{background:#4C93F7}
  .macro-bar .f{background:#FFA07A}
  .macro-gram{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--sub);font-weight:500;letter-spacing:-.01em}
  .macro-gram b{color:var(--ink2);font-weight:700}
  .macro-gram .base{margin-left:auto;color:var(--sub2);font-weight:500}

  /* ── 속 불편·영양 경고 박스 ── */
  .mwarn{margin-top:12px;padding:15px 16px;border-radius:16px;border:1px solid transparent}
  .mwarn.alert{background:#FFF1F1;border-color:#FFDCDC}
  .mwarn.warn{background:#FFF8EC;border-color:#F5E6C9}
  .mwarn-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:14.5px;font-weight:800;letter-spacing:-.03em;line-height:1.35}
  .mwarn.alert .mwarn-head{color:#C2323E}
  .mwarn.warn .mwarn-head{color:#8A5305}
  .mwarn-head .ico{font-size:14px;line-height:1}
  .mwarn-head .who{margin-left:auto;font-size:11.5px;font-weight:700;letter-spacing:-.01em;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.8);color:#A9525B;white-space:nowrap}
  .mwarn.warn .mwarn-head .who{color:#8A6A2E}
  .mwarn-why{margin-top:9px;font-size:13px;line-height:1.62;font-weight:500;letter-spacing:-.02em;color:#A9525B}
  .mwarn.warn .mwarn-why{color:#8A6A2E}
  .mwarn-why b{font-weight:800}
  .mwarn.alert .mwarn-why b{color:#BF2E3B}
  .mwarn.warn .mwarn-why b{color:#7A4A05}
  .mwarn-tip{margin-top:11px;padding-top:10px;border-top:1px dashed rgba(160,120,60,.22);font-size:12.5px;line-height:1.6;font-weight:500;letter-spacing:-.02em;color:#8A6A2E}
  .mwarn.alert .mwarn-tip{border-top-color:rgba(194,50,62,.18);color:#A9525B}
  .mwarn-sug{
    margin-top:11px;display:inline-flex;align-items:center;gap:5px;
    padding:9px 13px;min-height:38px;border-radius:11px;
    background:#fff;border:1px solid #F0DCB8;color:#7A4A05;
    font-size:12.5px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;
  }
  .mwarn-sug:active{background:#FDF1DC;transform:scale(.97)}

  /* ── 컴팩트 경고: 한 줄 칩 + 펼침 ── */
  .wsum{margin-top:14px}
  .wsum-row{
    display:flex;align-items:center;gap:8px;width:100%;
    padding:9px 12px;border-radius:13px;min-height:44px;
    background:#FFF8EC;border:1px solid #F5E6C9;
  }
  .wsum-row.alert{background:#FFF1F1;border-color:#FFDCDC}
  .wsum-row:active{filter:brightness(.99)}
  .wsum-chips{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
  .wsum-chips::-webkit-scrollbar{display:none}
  .wchip{
    flex:0 0 auto;font-size:12px;font-weight:700;letter-spacing:-.01em;color:#8A5305;
    background:rgba(255,255,255,.92);padding:5px 9px;border-radius:8px;white-space:nowrap;
  }
  .wchip.alert{color:#C2323E}
  .wsum-more{flex:0 0 auto;display:inline-flex;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:#8A6A2E}
  .wsum-row.alert .wsum-more{color:#A9525B}
  .wsum-more .caret{font-style:normal;font-size:11px;line-height:1;transition:transform .18s}
  .wsum.is-open .wsum-more .caret{transform:rotate(180deg)}
  .wsum-detail .mwarn{margin-top:8px;padding:13px 14px;border-radius:13px}
  .wsum-detail .mwarn-why{margin-top:6px;font-size:12.5px;line-height:1.55}
  .wsum-detail .mwarn-tip{margin-top:8px;padding-top:8px;font-size:12px}

  /* ── 먹은·외식 끼니: 접힌 아코디언 ── */
  .meal-card.is-compact{padding:0;overflow:hidden}
  .mcc{display:block;width:100%;text-align:left;padding:15px 18px;background:transparent}
  .mcc:active{background:rgba(17,24,39,.03)}
  .mcc-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .mcc-top .mc-meal{font-size:13px}
  .mcc-caret{margin-left:auto;font-size:13px;font-weight:700;color:var(--sub2);transform:rotate(-90deg);line-height:1}
  .mcc-title{
    display:block;margin-top:7px;font-size:15px;font-weight:800;letter-spacing:-.035em;
    color:var(--ink2);line-height:1.4;word-break:keep-all;
  }
  .meal-card.is-skip .mcc-title{color:var(--sub);text-decoration:line-through;text-decoration-thickness:1.5px}
  .meal-card.is-out .mcc-title,.meal-card.is-out .meal-name{text-decoration:none;color:var(--ink2)}
  .mcc-macro{display:flex;align-items:center;gap:8px;margin-top:9px}
  .mini-bar{flex:1;min-width:40px;display:flex;gap:2px;height:6px;background:#E7EBEF;border-radius:99px;overflow:hidden}
  .mini-bar i{display:block;height:100%;border-radius:99px;min-width:2px}
  .mini-bar .c{background:#FFC64D}
  .mini-bar .p{background:#4C93F7}
  .mini-bar .f{background:#FFA07A}
  .mini-pct{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--sub);white-space:nowrap;letter-spacing:-.01em}
  .mini-kcal{flex:0 0 auto;font-size:11px;font-weight:600;color:var(--sub2);white-space:nowrap}
  .mc-collapse{
    flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--sub);
    padding:7px 10px;border-radius:9px;background:#F2F4F6;white-space:nowrap;
  }

  /* ── 더 챙기면 좋은 비율 ── */
  .gapbox{margin:0 0 14px;padding:14px 16px;border-radius:20px;background:#F7F9FB;border:1px solid #EDF1F5}
  .gap-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .gap-title{font-size:13.5px;font-weight:800;color:var(--ink);letter-spacing:-.03em}
  .gap-pct{margin-left:auto;font-size:11px;font-weight:600;color:var(--sub);white-space:nowrap}
  .gap-sum{display:flex;gap:6px;overflow-x:auto;margin-top:9px;padding-bottom:1px;scrollbar-width:none}
  .gap-sum::-webkit-scrollbar{display:none}
  .gchip{
    flex:0 0 auto;font-size:12px;font-weight:700;letter-spacing:-.01em;
    color:#7A4A05;background:#FFF3E0;padding:7px 10px;border-radius:10px;white-space:nowrap;
  }
  .gchip b{font-weight:800}
  .gchip em{font-style:normal;font-weight:600;opacity:.72;margin-left:4px}
  .gchip.down{background:#EEF4FF;color:#2C5FA8}
  .gchip.ok{background:#EAF7F0;color:#0A7A54}
  .gap-pick{display:flex;align-items:center;gap:6px;overflow-x:auto;margin-top:9px;scrollbar-width:none}
  .gap-pick::-webkit-scrollbar{display:none}
  .gap-pick-label{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--sub);white-space:nowrap}
  .gadd{
    flex:0 0 auto;font-size:12px;font-weight:700;color:var(--ink2);
    background:#fff;border:1px solid #E5E8EB;padding:8px 10px;border-radius:10px;
    min-height:36px;white-space:nowrap;
  }
  .gadd:active{background:#EFF3F6;transform:scale(.97)}

  /* ── 급한 재료 사인: 한 줄 띠 ── */
  .uc-strip{
    display:flex;align-items:center;gap:8px;width:100%;
    margin:0 0 14px;padding:10px 12px;min-height:50px;
    border-radius:16px;background:#FFF6F6;border:1px solid #FBDCDC;
  }
  .uc-strip:active{background:#FFEFEF}
  .uc-strip-head{flex:0 0 auto;font-size:12px;font-weight:800;color:#C2323E;letter-spacing:-.02em;white-space:nowrap}
  .uc-strip-chips{flex:1;min-width:0;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
  .uc-strip-chips::-webkit-scrollbar{display:none}
  .uc-chip{
    flex:0 0 auto;font-size:11.5px;font-weight:600;color:#8A4A50;
    background:#fff;padding:5px 8px;border-radius:8px;white-space:nowrap;
  }
  .uc-chip.more{color:#B4696E}
  .uc-strip-go{flex:0 0 auto;font-size:16px;font-weight:700;color:#D9A6AA;line-height:1}
  .rs-h3sub{font-size:11.5px;font-weight:600;color:var(--sub);margin-left:5px;letter-spacing:-.01em}

  /* 레시피 보기 버튼 */
  .recipe-btn{
    display:flex;align-items:center;justify-content:center;gap:7px;
    width:100%;margin-top:16px;padding:14px 12px;min-height:50px;
    border-radius:15px;background:#F5F7F9;color:var(--ink);
    font-size:15px;font-weight:700;letter-spacing:-.03em;
    transition:background .15s,transform .12s;
  }
  .recipe-btn:active{background:#E9EDF1;transform:scale(.99)}
  .recipe-btn .cnt{color:var(--sub);font-weight:600;font-size:13px}

  /* 하단 메인 액션: 외식 | 먹었음 한 열 */
  .mc-actions{display:grid;grid-template-columns:1fr 1.35fr;gap:9px;margin-top:10px}
  .act{
    min-width:0;padding:15px 8px;border-radius:15px;min-height:52px;
    font-size:15px;font-weight:700;letter-spacing:-.03em;white-space:nowrap;
    background:#F5F7F9;color:var(--ink2);
    transition:background .15s,transform .12s;
  }
  .act:active{transform:scale(.975)}
  .act.out{background:#F5F7F9;color:var(--ink2)}
  .act.out:active{background:#E9EDF1}
  .act.solid{
    background:var(--blue);color:#fff;
    box-shadow:0 6px 16px rgba(49,130,246,.22);
  }
  .act.solid:active{background:var(--blue-deep)}
  .act.undo{grid-column:1 / -1;background:#F5F7F9;color:var(--ink2);font-weight:600}

  .skip-note{
    margin-top:18px;display:flex;align-items:center;gap:8px;
    font-size:13.5px;font-weight:500;color:var(--sub);
  }

  /* ── 급한 재료 사인 카드 (카드 사이) ── */
  .urgent-callout{
    margin:0 0 14px;padding:20px;border-radius:24px;
    background:#FFF3F3;border:1px solid #FFE0E0;
  }
  .uc-head{display:flex;align-items:center;gap:8px;font-size:16.5px;font-weight:800;color:#C2323E;letter-spacing:-.035em}
  .uc-sub{font-size:13px;color:#B4696E;font-weight:400;margin-top:7px;line-height:1.6}
  .uc-list{margin-top:12px}
  .uc-line{
    display:flex;align-items:center;gap:10px;
    padding:13px 0;border-top:1px solid rgba(200,80,80,.12);min-height:48px;
  }
  .uc-line:first-child{border-top:0;padding-top:4px}
  .uc-emo{font-size:20px;line-height:1;flex:0 0 auto}
  .uc-name{font-size:15px;font-weight:700;letter-spacing:-.03em;color:var(--ink);flex:0 1 auto;white-space:nowrap}
  .uc-note{font-size:12.5px;color:#B4696E;font-weight:500;margin-left:auto;letter-spacing:-.02em;text-align:right}
  .uc-more{font-size:12.5px;color:#B4696E;font-weight:600;padding-top:6px}
  .uc-btn{
    width:100%;margin-top:10px;min-height:48px;border-radius:14px;
    background:#fff;color:#C2323E;font-size:14px;font-weight:700;letter-spacing:-.03em;
    box-shadow:0 1px 2px rgba(190,60,60,.08);
  }
  .uc-btn:active{background:#FFEFEF}

  /* ── FAB ── */
  .fab{
    position:fixed;z-index:40;
    bottom:calc(22px + env(safe-area-inset-bottom));
    right:max(20px,calc(50% - 215px + 20px));
    display:inline-flex;align-items:center;gap:7px;
    padding:17px 22px;border-radius:99px;min-height:56px;
    background:var(--blue);color:#fff;
    font-size:15px;font-weight:700;letter-spacing:-.03em;
    box-shadow:0 10px 26px rgba(49,130,246,.34);
    transition:transform .12s;
  }
  .fab:active{transform:scale(.96)}
  .fab.is-hidden-tab{display:none}

  /* ── 시트 ── */
  .scrim{
    position:fixed;inset:0;background:rgba(17,24,39,.46);
    opacity:0;pointer-events:none;transition:opacity .24s ease;z-index:50;
    backdrop-filter:blur(2px);
  }
  .scrim.is-open{opacity:1;pointer-events:auto}

  .sheet{
    position:fixed;z-index:60;
    left:50%;bottom:0;width:100%;max-width:430px;
    transform:translate(-50%,104%);
    transition:transform .32s cubic-bezier(.32,.72,.3,1);
    background:#fff;
    border-radius:28px 28px 0 0;
    padding:12px 20px calc(26px + env(safe-area-inset-bottom));
    max-height:90vh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    box-shadow:var(--shadow-lg);
  }
  .sheet.is-open{transform:translate(-50%,0)}
  .sheet-grip{
    width:40px;height:4px;border-radius:99px;background:#E1E6EA;
    margin:2px auto 18px;
  }
  .sheet h2{font-size:21px;font-weight:800;letter-spacing:-.045em;line-height:1.35}
  .sheet-sub{font-size:13.5px;color:var(--sub);font-weight:400;margin-top:8px;line-height:1.6}

  .field{margin-top:20px;flex:1;min-width:0}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:-.02em;margin-bottom:9px}
  .field input{
    width:100%;padding:15px 16px;border-radius:15px;min-height:52px;
    background:#F5F7F9;border:1px solid transparent;
    font-size:16px;font-weight:600;outline:none;letter-spacing:-.02em;
    transition:border-color .15s,background .15s;
  }
  .field input:focus{border-color:var(--blue);background:#fff}
  .field input::placeholder{color:var(--sub2);font-weight:400}
  .field-row{display:flex;gap:12px}
  .field textarea{
    width:100%;padding:15px 16px;border-radius:15px;
    background:#F5F7F9;border:1px solid transparent;
    font:inherit;font-size:15px;font-weight:500;line-height:1.6;
    outline:none;resize:vertical;min-height:88px;letter-spacing:-.02em;
    transition:border-color .15s,background .15s;
  }
  .field textarea:focus{border-color:var(--blue);background:#fff}
  .field textarea::placeholder{color:var(--sub2);font-weight:400}
  .field .hint-inline{font-size:12px;font-weight:600;color:var(--sub);margin-left:5px;letter-spacing:0}
  .field .hint-inline b{color:var(--blue-deep);font-weight:700}

  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{
    flex:1 1 0;padding:14px 6px;border-radius:14px;min-height:50px;
    background:#F5F7F9;border:1px solid transparent;
    font-size:14px;font-weight:600;color:var(--ink2);
    white-space:nowrap;letter-spacing:-.02em;
  }
  .seg button.is-on{background:#191F28;border-color:#191F28;color:#fff;font-weight:700}
  .seg button:active{transform:scale(.97)}

  .quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
  .quick-label{width:100%;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:2px}
  .quick button{
    font-size:13.5px;font-weight:600;padding:11px 14px;border-radius:12px;min-height:44px;
    background:#F5F7F9;color:var(--ink2);
  }
  .quick button:active{background:var(--blue-soft);color:var(--blue-deep)}

  .sheet-actions{display:flex;gap:10px;margin-top:26px}
  .btn{
    flex:1;padding:17px 12px;border-radius:16px;min-height:56px;
    font-size:16px;font-weight:700;letter-spacing:-.03em;
  }
  .btn.primary{flex:1.6;background:var(--blue);color:#fff}
  .btn.primary:active{background:var(--blue-deep)}
  .btn.ghost{background:#F2F4F6;color:var(--ink2)}
  .btn.ghost:active{background:#E5E8EB}
  .danger-link{
    width:100%;margin-top:14px;padding:15px;border-radius:14px;min-height:52px;
    font-size:14px;font-weight:700;color:var(--red);background:var(--red-soft);
  }
  .danger-link.is-hidden{display:none}

  .eat-list{margin-top:8px}
  .cust-list{
    margin-top:12px;max-height:34vh;overflow-y:auto;
    border-radius:18px;background:#FAFBFC;border:1px solid #F0F3F6;padding:0 14px 6px;
  }
  .cust-group{
    display:flex;align-items:center;gap:6px;
    padding:14px 2px 6px;font-size:12.5px;font-weight:700;color:var(--sub);letter-spacing:-.01em;
    position:sticky;top:0;background:#FAFBFC;z-index:1;
  }
  .cust-empty{padding:26px 2px;text-align:center;font-size:13.5px;font-weight:500;color:var(--sub)}
  .eat-row{
    display:flex;align-items:center;gap:12px;
    padding:15px 2px;border-bottom:1px solid #F0F3F6;min-height:60px;
  }
  .eat-row:last-child{border-bottom:0}
  .eat-row input{
    appearance:none;-webkit-appearance:none;
    width:26px;height:26px;border-radius:9px;flex:0 0 auto;
    border:1.5px solid #D5DBE1;background:#fff;position:relative;
    transition:background .15s,border-color .15s;
  }
  .eat-row input:checked{background:var(--blue);border-color:var(--blue)}
  .eat-row input:checked::after{
    content:"✓";position:absolute;inset:0;display:grid;place-items:center;
    color:#fff;font-size:14px;font-weight:900;
  }
  .eat-row.is-done{opacity:.42}
  .eat-name{flex:1;font-size:15px;font-weight:600;letter-spacing:-.02em}
  .eat-row.is-done .eat-name{text-decoration:line-through}
  .eat-check{font-size:13px;font-weight:700;color:#0A8A5F}

  .menu-list{display:flex;flex-direction:column;gap:10px;margin-top:20px}
  .menu-list button{
    text-align:left;padding:18px;border-radius:18px;background:#F5F7F9;
    font-size:15.5px;font-weight:700;letter-spacing:-.03em;
    display:flex;flex-direction:column;gap:5px;
  }
  .menu-list button em{font-style:normal;font-size:13px;font-weight:400;color:var(--sub);letter-spacing:-.01em}
  .menu-list button.danger{color:var(--red)}
  .menu-list button.danger em{color:#C08589}

  /* ── 토스트 ── */
  .toast{
    position:fixed;z-index:90;
    left:50%;bottom:calc(100px + env(safe-area-inset-bottom));
    transform:translate(-50%,14px);
    background:rgba(25,31,40,.94);color:#fff;
    font-size:14px;font-weight:600;letter-spacing:-.02em;line-height:1.5;
    padding:14px 18px;border-radius:15px;
    opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
    max-width:calc(100% - 44px);text-align:center;
    box-shadow:0 10px 26px rgba(17,24,39,.24);
  }
  .toast.is-open{opacity:1;transform:translate(-50%,0)}

  /* ── 소진 확인 모달 ── */
  .modal{
    position:fixed;inset:0;z-index:85;
    display:flex;align-items:center;justify-content:center;
    padding:0 26px;
    background:rgba(17,24,39,.5);
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .modal.is-open{opacity:1;pointer-events:auto}
  .modal-card{
    position:relative;width:100%;max-width:340px;
    background:#fff;border-radius:24px;padding:28px 22px 20px;
    box-shadow:var(--shadow-lg);
    transform:translateY(12px) scale(.97);
    transition:transform .24s cubic-bezier(.32,.72,.3,1);
  }
  .modal.is-open .modal-card{transform:none}
  .modal-emo{font-size:34px;line-height:1;text-align:center;margin-bottom:12px}
  .modal-card h2{font-size:18.5px;font-weight:800;letter-spacing:-.04em;text-align:center;line-height:1.42}
  .modal-sub{margin-top:10px;font-size:13.5px;line-height:1.65;color:var(--sub);font-weight:400;text-align:center}
  .modal-actions{margin-top:22px;display:flex;flex-direction:column;gap:9px}
  .modal-actions .btn{padding:16px 12px;border-radius:15px;font-size:15.5px;font-weight:700;min-height:54px}
  .modal-actions .btn.hint{font-size:14px;font-weight:600;padding:14px 12px;min-height:50px}
  .modal-close{
    position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:11px;
    background:#F2F4F6;color:var(--sub);font-size:13px;font-weight:700;display:grid;place-items:center;
  }

  /* ── 끼니 재료 추가 시트 ── */
  .pick-head{
    display:flex;align-items:center;gap:8px;
    margin-top:14px;padding:12px 14px;border-radius:14px;
    background:#F5F9FF;font-size:12.5px;font-weight:500;color:var(--ink2);line-height:1.5;
  }
  .pick-head b{color:var(--blue-deep);font-weight:700}

  /* ── 레시피 팝업(바텀시트) ── */
  .recipe-sheet{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
  .rs-kicker{font-size:13px;font-weight:700;color:var(--blue-deep);letter-spacing:-.02em}
  .rs-title{font-size:23px;font-weight:800;letter-spacing:-.05em;line-height:1.34;margin-top:8px;word-break:keep-all}
  .rs-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .rs-meta span{
    font-size:13px;font-weight:600;color:var(--ink2);
    background:#F5F7F9;border-radius:11px;padding:9px 12px;min-height:38px;
    display:inline-flex;align-items:center;gap:5px;
  }
  .rs-block{margin-top:26px}
  .rs-block h3{font-size:16px;font-weight:800;letter-spacing:-.04em;color:var(--ink)}
  .rs-sublabel{
    display:flex;align-items:center;gap:6px;
    font-size:12.5px;font-weight:700;color:var(--sub);letter-spacing:-.01em;
    margin:16px 2px 8px;
  }
  .rs-sublabel.buy{color:#B26E00}
  .rs-sublabel span{font-weight:600;color:var(--sub2)}
  .rs-ing{
    display:flex;align-items:center;gap:12px;
    background:#FAFBFC;border-radius:16px;padding:14px 15px;margin-bottom:8px;min-height:56px;
  }
  .rs-ing.buy{background:#FFFBF2}
  .rs-ing .emo{font-size:20px}
  .rs-ing-name{flex:1;min-width:0;font-size:14.5px;font-weight:700;letter-spacing:-.025em;color:var(--ink)}
  .rs-ing-state{flex:0 0 auto;font-size:12.5px;font-weight:600;color:var(--sub);letter-spacing:-.02em}
  .rs-ing-state.ok{color:#0A8A5F}
  .rs-ing-state.warn{color:#B26E00}
  .rs-ing-state.none{color:#C2323E}
  .rs-empty{
    background:#FAFBFC;border-radius:16px;padding:16px;
    font-size:13.5px;font-weight:500;color:var(--sub);line-height:1.6;
  }
  .rs-steps{list-style:none;margin-top:16px;counter-reset:step}
  .rs-steps li{
    position:relative;padding:0 0 20px 46px;counter-increment:step;
  }
  .rs-steps li::before{
    content:counter(step);
    position:absolute;left:0;top:-1px;
    width:32px;height:32px;border-radius:11px;
    background:var(--blue-soft);color:var(--blue-deep);
    display:grid;place-items:center;
    font-size:14px;font-weight:800;letter-spacing:-.02em;
  }
  .rs-steps li::after{
    content:"";position:absolute;left:15.5px;top:36px;bottom:4px;width:1.5px;background:#EDF0F3;
  }
  .rs-steps li:last-child{padding-bottom:0}
  .rs-steps li:last-child::after{display:none}
  .rs-steps li p{font-size:14.5px;line-height:1.65;color:var(--ink2);font-weight:400;letter-spacing:-.02em}
  .rs-steps li b{
    display:block;font-size:11.5px;font-weight:800;color:var(--sub2);
    letter-spacing:.04em;margin-bottom:3px;
  }
  .rs-tip{
    margin-top:28px;padding:18px 19px;border-radius:18px;
    background:#FFF9EC;color:#7A5A0C;
    font-size:14px;font-weight:500;line-height:1.65;letter-spacing:-.02em;
  }
  .rs-tip b{font-weight:800}
  .rs-note{
    margin-top:20px;padding:16px 18px;border-radius:16px;
    background:#F5F7F9;font-size:13.5px;color:var(--ink2);line-height:1.6;
  }
  .rs-note b{font-weight:700;color:var(--ink)}
  .rs-actions{display:flex;gap:9px;margin-top:28px}
  .rs-actions .btn{min-height:54px;font-size:15.5px}

  /* ══ 하루 영양 목표 (탄단지 g) ══ */
  .goalbox{
    margin:0 0 14px;padding:16px 16px 14px;border-radius:20px;
    background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);
  }
  .goalbox-head{display:flex;align-items:center;gap:8px}
  .goalbox-title{flex:1;min-width:0;font-size:14px;font-weight:800;color:var(--ink);letter-spacing:-.03em}
  .goal-edit{
    flex:0 0 auto;font-size:12px;font-weight:700;color:var(--ink2);
    background:#F2F4F6;padding:8px 11px;border-radius:10px;min-height:36px;white-space:nowrap;
  }
  .goal-edit:active{background:#E5E8EB}
  .goalbox-sub{font-size:12px;color:var(--sub);font-weight:500;margin-top:6px;letter-spacing:-.01em;line-height:1.5}
  .goalrows{margin-top:13px;display:flex;flex-direction:column;gap:10px}
  .gline{display:flex;align-items:baseline;gap:7px}
  .glabel{font-size:12.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
  .glabel.c{color:#B77900}
  .glabel.p{color:var(--blue-deep)}
  .glabel.f{color:#C9623F}
  .gnum{margin-left:auto;font-size:12px;color:var(--sub);font-weight:600;white-space:nowrap}
  .gnum b{font-size:14.5px;font-weight:800;color:var(--ink);letter-spacing:-.03em}
  .gnote{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--blue-deep);background:var(--blue-soft);padding:3px 7px;border-radius:7px;white-space:nowrap}
  .growseg.over .gnote{color:var(--red);background:var(--red-soft)}
  .growseg.done .gnote{color:#0A8A5F;background:var(--green-soft)}
  .gbar2{height:7px;border-radius:99px;background:#EDF1F4;overflow:hidden;margin-top:6px}
  .gbar2 i{display:block;height:100%;border-radius:99px;transition:width .35s ease}
  .gbar2 .c{background:#FFC64D}
  .gbar2 .p{background:#4C93F7}
  .gbar2 .f{background:#FFA07A}
  .gbar2 .k{background:var(--blue)}
  .goalbox .gap-pick{margin-top:7px}
  .goal-pick{margin-top:13px}
  .goal-pick-label{display:block;font-size:11px;font-weight:700;color:var(--sub);letter-spacing:-.01em;margin-bottom:7px}
  .goal-ok{margin-top:13px;font-size:12.5px;font-weight:700;color:#0A8A5F;background:var(--green-soft);border-radius:11px;padding:10px 12px;line-height:1.5}
  .goalbox-foot{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line2);font-size:11.5px;color:var(--sub);font-weight:500;line-height:1.5}
  .macro-gram em{
    font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:-.01em;
    padding:2px 5px;border-radius:6px;margin-left:4px;
    background:#F1F3F5;color:var(--ink2);
  }
  .macro-gram em.c{background:#FFF4DC;color:#B77900}
  .macro-gram em.p{background:#E8F1FE;color:var(--blue-deep)}
  .macro-gram em.f{background:#FFEFE8;color:#C9623F}

  /* ══ 지난 기록 ══ */
  .hist-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:2px 2px 14px}
  .hist-head h2{font-size:22px;font-weight:800;letter-spacing:-.05em;line-height:1.3}
  .hist-head p{font-size:13.5px;color:var(--sub);margin-top:6px;line-height:1.5}
  .views-toggle{display:flex;gap:6px;background:#E7EAEE;padding:5px;border-radius:14px;margin-bottom:14px}
  .views-toggle button{
    flex:1;padding:10px 6px;border-radius:10px;min-height:42px;
    font-size:13.5px;font-weight:700;color:var(--ink2);letter-spacing:-.02em;white-space:nowrap;
  }
  .views-toggle button.is-on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(17,24,39,.08)}
  .views-toggle button:active{transform:scale(.985)}
  .hist-stat{
    font-size:12.5px;font-weight:600;color:var(--ink2);
    background:#EEF1F4;border-radius:12px;padding:11px 13px;margin-bottom:14px;line-height:1.5;
  }
  .calbox{background:#fff;border-radius:20px;padding:14px 12px 12px;box-shadow:var(--shadow);margin-bottom:14px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px;gap:8px}
  .cal-head span{font-size:15px;font-weight:800;letter-spacing:-.03em}
  .cal-nav{
    width:38px;height:38px;border-radius:11px;background:#F2F4F6;
    font-size:16px;font-weight:700;color:var(--ink2);display:grid;place-items:center;line-height:1;
  }
  .cal-nav:disabled{opacity:.3}
  .cal-nav:active{background:#E5E8EB}
  .cal-dow,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-dow span{text-align:center;font-size:11px;font-weight:700;color:var(--sub);padding:4px 0}
  .cal-dow span:first-child{color:#E06C6C}
  .cal-cell{
    position:relative;min-height:44px;border-radius:11px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  }
  .cal-cell.is-blank{pointer-events:none}
  .cal-num{font-size:13px;font-weight:700;color:var(--ink2);line-height:1}
  .cal-cell.is-today{background:var(--blue-soft);box-shadow:inset 0 0 0 1.5px #BFD9FB}
  .cal-cell.is-today .cal-num{color:var(--blue-deep);font-weight:800}
  .cal-cell.is-future .cal-num{color:var(--sub2);opacity:.5}
  .cal-cell.is-good::after{content:"";position:absolute;inset:2px;border-radius:9px;border:1.5px solid #A7E3C8;pointer-events:none}
  .cal-cell.is-sel{background:#191F28}
  .cal-cell.is-sel .cal-num{color:#fff}
  .cal-cell.is-sel.is-good::after{border-color:rgba(255,255,255,.4)}
  .cal-cell:active{background:#F2F4F6}
  .cal-dots{display:flex;gap:2px;height:5px;align-items:center}
  .cal-dots .dot{width:5px;height:5px;border-radius:50%;display:block}
  .dot.eat{background:var(--blue)}
  .dot.out{background:#B0B8C1}
  .dot.none{background:#E5E8EB}
  .dot.snk{background:#FFC64D}
  .cal-cell.is-sel .dot.none{background:#4E5968}
  .cal-legend{display:flex;gap:10px;flex-wrap:wrap;padding:10px 4px 2px;font-size:11px;font-weight:600;color:var(--sub)}
  .cal-legend i{width:5px;height:5px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
  .hd{background:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
  .hd-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .hd-date{font-size:15px;font-weight:800;letter-spacing:-.03em}
  .hd-pct{margin-left:auto;font-size:11px;font-weight:800;color:var(--blue-deep);background:var(--blue-soft);padding:4px 8px;border-radius:8px;white-space:nowrap}
  .hd-pct.good{color:#0A8A5F;background:var(--green-soft)}
  .hd-pct.none{color:var(--sub);background:#F2F4F6}
  .hd-sum{margin-top:9px;font-size:12.5px;color:var(--ink2);font-weight:600;letter-spacing:-.01em}
  .hd-sum b{font-size:15px;font-weight:800;color:var(--ink);letter-spacing:-.03em}
  .hd-bars{display:flex;gap:4px;margin-top:9px}
  .hb{flex:1;height:6px;border-radius:99px;background:#EDF1F4;overflow:hidden;display:block}
  .hb i{display:block;height:100%;border-radius:99px}
  .hb i.c{background:#FFC64D}
  .hb i.p{background:#4C93F7}
  .hb i.f{background:#FFA07A}
  .hd-meals{margin-top:13px;border-top:1px solid var(--line)}
  .hd-meal{padding:12px 0;border-bottom:1px solid var(--line)}
  .hd-meal:last-child{border-bottom:0;padding-bottom:0}
  .hd-mrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .hd-mlabel{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--sub);background:#F2F4F6;padding:3px 7px;border-radius:7px}
  .hd-mname{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:var(--ink);letter-spacing:-.02em;line-height:1.4}
  .htag{flex:0 0 auto;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:7px;white-space:nowrap}
  .htag.eat{background:var(--green-soft);color:#0A8A5F}
  .htag.out{background:#EDF0F3;color:var(--sub)}
  .htag.none{background:var(--amber-soft);color:var(--amber)}
  .hd-meal.is-off .hd-mname{color:var(--sub);text-decoration:line-through;text-decoration-thickness:1.5px}
  .hd-meal.is-none .hd-mname{color:var(--sub);font-weight:600}
  .hd-mnum{margin-top:6px;font-size:11.5px;color:var(--sub);font-weight:600;letter-spacing:-.01em}
  .hd-retro{display:flex;gap:6px;margin-top:9px}
  .hd-retro button{
    flex:1;min-height:40px;border-radius:11px;background:#F5F7F9;color:var(--ink2);
    font-size:12.5px;font-weight:700;letter-spacing:-.02em;
  }
  .hd-retro button:active{background:#E9EDF1}
  .hd-snacks,.hd-uses{margin-top:10px;font-size:11.5px;color:var(--sub);line-height:1.65;font-weight:500}
  .hd-uses-label{margin-right:5px;font-weight:700;color:var(--ink2)}
  .hist-card{margin-bottom:12px}
  .hist-card .hd{margin-bottom:0}

  .flash{animation:flash 1.1s ease}
  @keyframes flash{
    0%{box-shadow:0 0 0 0 rgba(49,130,246,.4)}
    40%{box-shadow:0 0 0 5px rgba(49,130,246,.2)}
    100%{box-shadow:var(--shadow)}
  }

  @media (min-width:431px){
    body{background:#E9ECEF}
    .app{box-shadow:0 0 46px rgba(17,24,39,.08);min-height:100vh}
  }

  @media (max-width:359px){
    .mc-edit,.mc-swap{font-size:12px;padding:8px 10px}
    .act{font-size:14px;padding:14px 6px}
    .meal-name{font-size:19px}
    .topbar{padding:16px 16px 12px}
    .dash{margin-left:16px;margin-right:16px;padding:18px}
    .tabs{margin-left:16px;margin-right:16px}
    .main{padding:16px 16px 8px}
    .item{padding:14px}
  }

  /* ══ 정보 다이어트: 대시보드 한 줄 ══ */
  .dash-one{
    display:flex;align-items:center;gap:6px;width:100%;
    margin-top:16px;padding:12px 14px;border-radius:14px;min-height:48px;
    background:#FFF3F3;color:#C2323E;font-size:13.5px;font-weight:600;letter-spacing:-.02em;
    text-align:left;
  }
  .dash-one b{font-weight:800}
  .dash-one i{margin-left:auto;font-style:normal;font-size:16px;font-weight:700;color:#D9A6AA}
  .dash-one.calm{
    background:#F2F7F4;color:#0A8A5F;font-weight:600;margin-top:16px;
  }

  /* ══ 끼니 카드 한 줄 탄단지 ══ */
  .mcline{display:flex;align-items:center;gap:9px;margin-top:15px}
  .mcline-kcal{flex:0 0 auto;font-size:13px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
  .mcline-p{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--blue-deep);white-space:nowrap}

  /* 한 줄 경고 */
  .wline{
    display:flex;align-items:center;gap:6px;width:100%;
    margin-top:10px;padding:11px 13px;border-radius:12px;min-height:42px;
    background:#FFF8EC;border:1px solid #F5E6C9;color:#8A5305;
    font-size:12.5px;font-weight:600;letter-spacing:-.01em;text-align:left;line-height:1.4;
  }
  .wline.alert{background:#FFF1F1;border-color:#FFDCDC;color:#C2323E}
  .wline span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wline .caret{flex:0 0 auto;font-style:normal;font-size:11px;transition:transform .18s}
  .wline.is-open .caret{transform:rotate(180deg)}
  .wsum-detail[hidden]{display:none}

  /* ══ 추가 섭취 ══ */
  .extra{margin:0 0 14px;padding:16px 16px 14px;border-radius:20px;background:#fff;box-shadow:var(--shadow)}
  .extra-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
  .extra-head span{margin-left:auto;font-size:12px;font-weight:600;color:var(--sub);letter-spacing:-.01em}
  .extra-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .exchip{
    display:inline-flex;align-items:center;gap:6px;min-height:38px;
    padding:6px 6px 6px 12px;border-radius:12px;background:#F5F9FF;border:1px solid #DCEAFA;
    font-size:13px;font-weight:700;color:var(--blue-deep);letter-spacing:-.02em;
  }
  .exchip .x{
    width:24px;height:24px;border-radius:8px;display:grid;place-items:center;
    font-size:10px;font-weight:800;color:#7FA9E0;background:#E3EFFE;line-height:1;
  }
  .exchip:active{background:#EAF3FF}
  .extra-empty{margin-top:10px;font-size:12.5px;color:var(--sub);font-weight:500;line-height:1.5}
  .extra-quick{display:flex;gap:6px;overflow-x:auto;margin-top:11px;padding-bottom:2px;scrollbar-width:none}
  .extra-quick::-webkit-scrollbar{display:none}
  .exq{
    flex:0 0 auto;min-height:38px;padding:9px 12px;border-radius:11px;
    background:#F7F8FA;border:1px solid var(--line);color:var(--ink2);
    font-size:12.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;
  }
  .exq.is-on{background:var(--blue-soft);border-color:#CBDFFA;color:var(--blue-deep);font-weight:700}
  .exq:active{transform:scale(.97)}

  /* ══ 잔량 퍼센트 슬라이더 ══ */
  .item.is-pct{display:block;padding:16px 18px}
  .item-top{display:flex;align-items:center;gap:12px;min-height:40px}
  .pctrow{display:flex;align-items:center;gap:10px;margin-top:10px}
  .pctrow input[type=range]{
    flex:1;min-width:0;height:34px;background:transparent;
    -webkit-appearance:none;appearance:none;
  }
  .pctrow input[type=range]::-webkit-slider-runnable-track{
    height:8px;border-radius:99px;
    background:linear-gradient(90deg,var(--blue) var(--p,100%),#E7EBEF var(--p,100%));
  }
  .pctrow input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;
    background:#fff;border:1px solid #DCE1E6;box-shadow:0 2px 7px rgba(17,24,39,.18);
  }
  .pctrow input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:#E7EBEF}
  .pctrow input[type=range]::-moz-range-progress{height:8px;border-radius:99px;background:var(--blue)}
  .pctrow input[type=range]::-moz-range-thumb{
    width:24px;height:24px;border:1px solid #DCE1E6;background:#fff;box-shadow:0 2px 7px rgba(17,24,39,.18);
  }
  .pctval{
    flex:0 0 auto;min-width:52px;text-align:right;
    font-size:12.5px;font-weight:800;color:var(--blue-deep);letter-spacing:-.02em;white-space:nowrap;
  }
  .pctval.dim{color:var(--sub2)}
  .pctval small{display:block;font-size:10px;font-weight:600;color:var(--sub);letter-spacing:0}
  .pct-hint{margin:9px 2px 0;font-size:11.5px;font-weight:500;color:var(--sub2);line-height:1.45}

  /* 먹었음 시트 퍼센트 행 */
  .eat-row.eat-pct{display:block;padding:16px 2px}
  .eat-pct .eat-top{display:flex;align-items:center;gap:10px}
  .eat-pct .eat-name{flex:1;min-width:0}
  .eat-pct .eat-sub{flex:0 1 auto;max-width:58%;overflow:hidden;text-overflow:ellipsis;padding-top:1px}
  .eat-quick{display:flex;gap:6px;margin-top:6px}
  .eat-quick .eq{
    flex:1 1 0;min-height:38px;border-radius:11px;border:1px solid #EDF0F3;background:#F5F7F9;
    font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:-.01em;
  }
  .eat-quick .eq.is-on{background:var(--blue-soft);border-color:#BFD9FB;color:var(--blue-deep)}
  .eat-quick .eq:active{transform:scale(.97)}

  /* ══ 목표 프리셋 · 직접 조정 ══ */
  .presets{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  .preset{
    display:block;text-align:left;padding:18px;border-radius:18px;
    background:#F5F7F9;border:1.5px solid transparent;
    transition:background .15s,border-color .15s;
  }
  .preset:active{transform:scale(.99)}
  .preset.is-on{background:#fff;border-color:var(--blue);box-shadow:0 6px 18px rgba(49,130,246,.12)}
  .preset-t{display:flex;align-items:center;gap:6px;font-size:15.5px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
  .preset-t em{font-style:normal;font-size:10.5px;font-weight:800;color:var(--blue-deep);background:var(--blue-soft);padding:3px 7px;border-radius:7px}
  .preset-m{display:block;margin-top:5px;font-size:12.5px;font-weight:500;color:var(--sub);letter-spacing:-.01em}
  .preset-g{display:block;margin-top:9px;font-size:12.5px;font-weight:700;color:var(--ink2);letter-spacing:-.01em}
  .preset-g b{font-weight:800;color:var(--ink)}
  .acc{margin-top:18px;border-radius:16px;border:1px solid var(--line2);overflow:hidden;background:#fff}
  .acc-head{
    display:flex;align-items:center;width:100%;padding:16px;min-height:54px;
    font-size:14px;font-weight:700;color:var(--ink2);background:#FAFBFC;letter-spacing:-.02em;
  }
  .acc-head .caret{margin-left:auto;font-style:normal;font-size:12px;transition:transform .2s}
  .acc.is-open .acc-head .caret{transform:rotate(180deg)}
  .acc-body{display:none;padding:2px 16px 18px}
  .acc.is-open .acc-body{display:block}
  .ratio{display:flex;align-items:center;gap:10px;margin-top:14px}
  .ratio-l{flex:0 0 56px;font-size:13px;font-weight:700;color:var(--ink2)}
  .ratio input[type=range]{flex:1;min-width:0;height:34px;accent-color:var(--blue)}
  .ratio-v{flex:0 0 auto;min-width:80px;text-align:right;font-size:11.5px;font-weight:600;color:var(--sub)}
  .ratio-v b{font-size:13.5px;font-weight:800;color:var(--ink);margin-right:3px}

  /* ══ 외식 기록 시트 ══ */
  .out-area{
    width:100%;padding:15px 16px;border-radius:15px;min-height:96px;
    background:#F5F7F9;border:1px solid transparent;
    font:inherit;font-size:15px;font-weight:500;line-height:1.6;letter-spacing:-.02em;
    outline:none;resize:none;transition:border-color .15s,background .15s;
  }
  .out-area:focus{border-color:var(--blue);background:#fff}
  .out-area::placeholder{color:var(--sub2);font-weight:400}
  .out-quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  .out-q{
    min-height:40px;padding:9px 12px;border-radius:11px;background:#F5F7F9;
    font-size:12.5px;font-weight:600;color:var(--ink2);letter-spacing:-.01em;white-space:nowrap;
  }
  .out-q:active{background:var(--blue-soft);color:var(--blue-deep)}
  .out-list{margin-top:6px}
  .out-item{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);min-height:58px}
  .out-item:last-child{border-bottom:0}
  .out-name{flex:1;min-width:0}
  .out-name b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.02em;color:var(--ink);line-height:1.35}
  .out-name em{display:block;margin-top:3px;font-style:normal;font-size:11.5px;font-weight:600;color:var(--sub)}
  .out-item .step{flex:0 0 auto}
  .out-item .step button{width:32px;height:32px;font-size:16px;border-radius:9px}
  .out-item .step-num{min-width:34px;font-size:12.5px}
  .out-x{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:#F2F4F6;color:var(--sub);font-size:11px;font-weight:800;display:grid;place-items:center}
  .out-total{margin-top:16px;padding:16px 18px;border-radius:16px;background:var(--blue-soft)}
  .out-total .k{display:block;font-size:22px;font-weight:800;color:var(--blue-deep);letter-spacing:-.04em}
  .out-total .m{margin-top:6px;font-size:12.5px;font-weight:600;color:#4E6E9E;letter-spacing:-.01em}
  .out-gap{margin-top:8px;font-size:12px;font-weight:600;color:#3E679C}
  .out-none{padding:20px 2px;text-align:center;font-size:13px;font-weight:500;color:var(--sub);line-height:1.6}
  .out-skip{
    width:100%;margin-top:14px;padding:14px;border-radius:13px;min-height:48px;
    background:#F5F7F9;color:var(--ink2);font-size:13.5px;font-weight:600;letter-spacing:-.02em;
  }
  .out-skip:active{background:#E9EDF1}

  /* 외식 끼니 상세 */
  .out-detail{margin-top:14px;padding:4px 16px 6px;border-radius:16px;background:#FAFBFC}
  .out-detail .od{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2)}
  .out-detail .od:last-of-type{border-bottom:0}
  .out-detail .od b{flex:1;font-weight:700;color:var(--ink)}
  .out-detail .od span{font-size:11.5px;color:var(--sub);font-weight:600}

  /* ══ 외식 양 조절 — 음식 그림 ══ */
  .portion{margin-top:18px;padding:15px 16px 16px;border-radius:18px;background:#F7F9FB;border:1px solid #EFF2F5}
  .portion-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .portion-head span{font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:-.02em}
  .portion-head b{font-size:13.5px;font-weight:800;color:var(--blue-deep);letter-spacing:-.02em;white-space:nowrap}
  .portion-body{display:flex;align-items:center;gap:12px;margin-top:6px}
  .plate-wrap{flex:0 0 104px;width:104px;height:104px}
  .plate-svg{width:104px;height:104px;display:block;overflow:visible}
  .plate-food{transition:opacity .18s ease}
  .plate-wrap.is-empty .plate-food{opacity:.16}
  .pchips{flex:1;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .pchip{padding:8px 3px;border-radius:12px;background:#fff;border:1px solid var(--line2);min-height:44px}
  .pchip:active{transform:scale(.97)}
  .pchip b{display:block;font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:-.04em;white-space:nowrap}
  .pchip em{display:block;margin-top:1px;font-style:normal;font-size:10px;font-weight:600;color:var(--sub)}
  .pchip.is-on{background:var(--blue-soft);border-color:#BFD9FB}
  .pchip.is-on b{color:var(--blue-deep);font-weight:800}
  .pchip.is-on em{color:#4E7CB8}
  .portion-slider{margin-top:8px}
  .portion-hint{margin-top:8px;font-size:11.5px;font-weight:500;color:var(--sub);line-height:1.55;letter-spacing:-.01em}
  .portion-hint b{font-weight:700;color:var(--ink2)}

  /* ══ 외식 사진 ══ */
  .photo-add{
    width:100%;margin-top:16px;padding:14px 12px;border-radius:14px;min-height:50px;
    background:#F5F7F9;color:var(--ink2);font-size:13.5px;font-weight:700;letter-spacing:-.02em;
  }
  .photo-add:active{background:#E9EDF1}
  .photo-add .hint-inline{font-size:11.5px;font-weight:500;color:var(--sub);margin-left:6px;letter-spacing:0}
  .photo-prev{position:relative;margin-top:12px;border-radius:14px;overflow:hidden;background:#F2F4F6}
  .photo-prev img{display:block;width:100%;max-height:200px;object-fit:cover}
  .photo-del{
    position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:10px;
    background:rgba(17,24,39,.6);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;
  }
  .out-detail-photo{display:block;width:100%;padding:0;margin:10px 0 2px;border-radius:13px;overflow:hidden;background:#F2F4F6}
  .out-detail-photo img{display:block;width:100%;max-height:180px;object-fit:cover}
  .hd-photo{flex:0 0 auto;width:46px;height:46px;padding:0;border-radius:11px;overflow:hidden;background:#F2F4F6}
  .hd-photo img{display:block;width:100%;height:100%;object-fit:cover}

  /* ══ 외식 사진 크게 보기 ══ */
  .photo-modal{padding:0 22px}
  .photo-box{position:relative;width:100%;max-width:380px;display:grid;place-items:center}
  .photo-box img{display:block;width:100%;max-height:70vh;object-fit:contain;border-radius:20px;background:#fff;box-shadow:var(--shadow-lg)}
  .photo-x{
    position:absolute;top:-46px;right:0;width:38px;height:38px;border-radius:12px;
    background:rgba(255,255,255,.94);color:var(--ink2);font-size:13px;font-weight:800;display:grid;place-items:center;
    box-shadow:0 4px 14px rgba(17,24,39,.18);
  }

  /* ══ 토스트 되돌리기 ══ */
  .toast.is-open{pointer-events:auto}
  .toast-act{
    display:inline-flex;align-items:center;margin-left:10px;
    padding:5px 11px;border-radius:9px;background:rgba(255,255,255,.18);
    font-size:13px;font-weight:800;color:#fff;letter-spacing:-.01em;
  }
  .toast-act:active{background:rgba(255,255,255,.3)}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🧊</span>
      <div class="brand-text">
        <h1>냉장고 구조대</h1>
        <p>한 달 소진 프로젝트</p>
      </div>
    </div>
    <button class="ghost-btn" id="menuBtn" aria-label="더보기">⋯</button>
  </header>

  <section class="dash" id="dash"></section>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-tab="pantry" role="tab">🧺 소진 체크</button>
    <button class="tab" data-tab="meals" role="tab">🍽️ 오늘·내일</button>
    <button class="tab" data-tab="history" role="tab">📅 지난 기록</button>
  </nav>

  <main class="main">
    <section class="view" id="view-pantry">
      <div id="leftoverCard"></div>
      <div class="filters" id="filters"></div>
      <div id="pantryList"></div>
    </section>
    <section class="view is-hidden" id="view-meals">
      <div id="leftoverCardMeals"></div>
      <div id="mealsWrap"></div>
    </section>
    <section class="view is-hidden" id="view-history">
      <div id="historyWrap"></div>
    </section>
  </main>

  <button class="fab" id="fabAdd">＋ 재료 추가</button>
</div>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="ingSheet" role="dialog" aria-modal="true">
  <div class="sheet-grip"></div>
  <h2 id="ingSheetTitle">재료 추가</h2>
  <p class="sheet-sub" id="ingSheetSub">장 본 재료를 바로 넣고 급한 정도를 정해두세요.</p>

  <div class="field">
    <label for="fName">이름</label>
    <input id="fName" type="text" placeholder="예: 대파" maxlength="24" autocomplete="off">
  </div>

  <div class="field">
    <label>보관 위치</label>
    <div class="seg" id="segLoc">
      <button type="button" data-val="fridge">🧊 냉장고</button>
      <button type="button" data-val="freezer">❄️ 냉동고</button>
      <button type="button" data-val="pantry">🧺 기본·상온</button>
    </div>
  </div>

  <div class="field">
    <label>급한 정도</label>
    <div class="seg" id="segUrg">
      <button type="button" data-val="urgent">🚨 급해요</button>
      <button type="button" data-val="soon">⏳ 곧 소진</button>
      <button type="button" data-val="normal">보통</button>
      <button type="button" data-val="safe">여유</button>
    </div>
  </div>

  <div class="field-row">
    <div class="field">
      <label for="fQty">수량</label>
      <input id="fQty" type="text" placeholder="예: 1단" maxlength="20" autocomplete="off">
    </div>
    <div class="field">
      <label for="fNote">메모</label>
      <input id="fNote" type="text" placeholder="예: 11/25까지" maxlength="30" autocomplete="off">
    </div>
  </div>

  <div class="field">
    <label>이모지 <span class="hint-inline">누르면 바뀌어요</span></label>
    <div class="emopick" id="fEmo"></div>
  </div>

  <div class="quick" id="quickAdd"></div>

  <div class="sheet-actions">
    <button class="btn ghost" id="ingCancel">취소</button>
    <button class="btn primary" id="ingSave">저장</button>
  </div>
  <button class="danger-link is-hidden" id="ingDelete">이 재료 삭제</button>
</div>

<div class="sheet" id="eatSheet" role="dialog" aria-modal="true">
  <div class="sheet-grip"></div>
  <h2>먹었어요</h2>
