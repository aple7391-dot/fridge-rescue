      tip: '산미 있는 재료와 유제품은 한 끼에 같이 먹지 말고 나눠 보세요.'
    });
    if (rc.length && sp.length) out.push({
      sev: 'warn', tag: '찬 생채소 + 매운맛',
      why: '찬 ' + tagNames(st, 'rawCold') + '에 매운 재료까지 더해져 배가 찬 느낌이 들거나 금방 화장실이 급해질 수 있어요.',
      tip: '샐러드는 실온에 5분 두었다가 먹고, 매운 양은 줄여 보세요.'
    });
    if (hs.length >= 3) out.push({
      sev: 'warn', tag: '짠맛 누적',
      why: tagNames(st, 'highSodium') + ' 등 짠 재료가 한 끼에 ' + hs.length + '가지나 들어가요. 다음 날 붓기와 갈증으로 이어질 수 있어요.',
      tip: '간장·소금은 반만 쓰고 김치 국물은 남겨 주세요.'
    });

    out.sort(function (a, b) { return (a.sev === 'alert' ? 0 : 1) - (b.sev === 'alert' ? 0 : 1); });
    return out.slice(0, 2);
  }

  /* 한 끼 탄단지 균형 */
  function macroSingle(t) {
    var out = [];
    if (!t || t.kcal <= 0) return out;
    var cb = t.pct.c, pb = t.pct.p, fb = t.pct.f;
    if (pb < 15 || t.p < 16) out.push({
      sev: 'warn', title: '단백질이 부족해요', short: '단백질 부족',
      why: '단백질 ' + g1(t.p) + 'g · 열량 비중 ' + pb + '% (한 끼 18g 이상, 18~35% 권장)',
      tip: '계란·닭가슴살·두부·참치처럼 단백질 재료를 하나 더하면 균형이 맞아요.',
      sug: 'protein'
    });
    if (fb > 38) out.push({
      sev: 'warn', title: '지방 비중이 높아요', short: '지방 높음',
      why: '지방 ' + g1(t.f) + 'g · 열량 비중 ' + fb + '% (권장 15~35%)',
      tip: '버터·치즈·기름진 고기는 양을 절반으로 줄이고, 곁들이는 채소를 늘려 보세요.'
    });
    if (cb > 68) out.push({
      sev: 'warn', title: '탄수화물에 치우쳤어요', short: '탄수화물 높음',
      why: '탄수화물 ' + g1(t.c) + 'g · 열량 비중 ' + cb + '% (권장 35~62%)',
      tip: '밥·면·빵 양을 조금 줄이고 단백질 반찬을 더해 보세요.',
      sug: 'protein'
    });
    if (cb < 18) out.push({
      sev: 'warn', title: '탄수화물이 너무 적어요', short: '탄수화물 부족',
      why: '탄수화물 ' + g1(t.c) + 'g · 열량 비중 ' + cb + '% (권장 35~62%)',
      tip: '밥 반 공기나 과일 한 조각을 더하면 오후까지 힘이 덜 빠져요.'
    });
    return out.slice(0, 2);
  }

  /* 실제로 먹는 끼니 순서 (외식으로 비운 끼니는 건너뛴다) */
  function mealSequence() {
    return [['today', 'lunch'], ['today', 'dinner'], ['tomorrow', 'lunch'], ['tomorrow', 'dinner']]
      .filter(function (s) { return !state.skips[slotKey(s[0], s[1])]; });
  }

  function nextSlotOf(day, meal) {
    var seq = mealSequence();
    for (var i = 0; i < seq.length; i++) {
      if (seq[i][0] === day && seq[i][1] === meal) return seq[i + 1] || null;
    }
    return null;
  }

  function slotLabel(day, meal) {
    return (day === 'today' ? '오늘 ' : '내일 ') + (meal === 'lunch' ? '점심' : '저녁');
  }

  /* 이 끼니 + 바로 다음 끼니를 함께 본 경고 */
  function crossCheck(day, meal) {
    var nx = nextSlotOf(day, meal);
    if (!nx) return null;
    var rA = mealRecipe(day, meal), rB = mealRecipe(nx[0], nx[1]);
    if (!rA || !rB) return null;

    var label = slotLabel(nx[0], nx[1]);
    var stA = tagStats(rA.uses), stB = tagStats(rB.uses);
    var a = sumMacros(rA.uses), b = sumMacros(rB.uses);
    var why = [], sev = 'warn', tip = '', short = '';

    var aSp = (stA.spicy || []).length, bSp = (stB.spicy || []).length;
    var aDy = (stA.dairy || []).length, bDy = (stB.dairy || []).length;
    var aHf = (stA.highFat || []).length, bHf = (stB.highFat || []).length;
    var aRf = (stA.refinedFlour || []).length, bRf = (stB.refinedFlour || []).length;

    if (aSp && bSp) {
      sev = 'alert';
      if (!short) short = '매운 끼니 연속';
      why.push('<b>매운 끼니가 연속</b> — 두 끼 모두 매운 재료가 들어가요. 위가 쉬지 못해 속이 쓰리거나 더부룩할 수 있어요.');
      tip = '한 끼는 순한 메뉴로 바꾸면 속이 훨씬 편해져요.';
    }
    if (aHf && bHf) {
      if (!short) short = '기름진 끼니 연속';
      why.push('<b>기름진 재료가 연속</b> — 기름진 재료나 가공육이 두 끼 이어지면 소화가 느려지고 다음 끼니까지 나른해질 수 있어요.');
      if (!tip) tip = '한 끼는 구이·찜처럼 담백한 조리로 바꿔 보세요.';
    }
    if (aRf && bRf) {
      if (!short) short = '빵·면 연속';
      why.push('<b>빵·면이 연속</b> — 정제 밀가루가 두 끼 이어지면 혈당이 오르내리며 금방 배고파질 수 있어요.');
      if (!tip) tip = label + '은 밥이나 단백질 위주 메뉴로 골라 보세요.';
    }
    if ((aSp && bDy) || (aDy && bSp)) {
      if (!short) short = '유제품·자극 교차';
      why.push('<b>유제품과 자극이 이어짐</b> — 한 끼는 매운맛, 다른 끼는 유제품이라 위가 번갈아 자극을 받아요.');
      if (!tip) tip = '유제품은 매운 끼니와 떨어진 시간에 먹는 게 좋아요.';
    }

    /* 두 끼 합산 탄단지 */
    var tot = { c: a.c + b.c, p: a.p + b.p, f: a.f + b.f };
    var tk = tot.c * 4 + tot.p * 4 + tot.f * 9;
    if (tk > 0) {
      var pP = Math.round(tot.p * 4 / tk * 100);
      var cP = Math.round(tot.c * 4 / tk * 100);
      if (pP + cP > 100) { pP = Math.min(pP, 97); cP = Math.min(cP, 100 - pP); }
      var fP = Math.max(0, 100 - cP - pP);
      if (pP < 16 || tot.p < 36) {
        if (!short) short = '두 끼 단백질 부족';
        why.push('<b>두 끼 합산 단백질 ' + g1(tot.p) + 'g</b> — 열량 비중 ' + pP + '%로 낮아요. ' + label + '에 단백질 재료를 하나 더 채워 주세요.');
      }
      if (fP > 36) {
        if (!short) short = '두 끼 지방 높음';
        why.push('<b>두 끼 합산 지방 ' + g1(tot.f) + 'g</b> — 열량 비중 ' + fP + '%로 높아요. 다음 끼니는 담백하게 골라 보세요.');
      }
      if (cP > 65) {
        if (!short) short = '두 끼 탄수화물 높음';
        why.push('<b>두 끼 합산 탄수화물 ' + g1(tot.c) + 'g</b> — 열량 비중 ' + cP + '%로 높아요. 밥·면 양을 줄여 보세요.');
      }
    }

    if (!why.length) return null;
    if (!tip) tip = '한 끼만 조금 가볍게 바꿔도 두 끼 합산이 훨씬 편해져요.';
    return { label: label, why: why.slice(0, 3), sev: sev, tip: tip, short: short || '다음 끼니와 겹쳐요' };
  }

  function mealCheck(day, meal) {
    var r = mealRecipe(day, meal);
    if (!r || !(r.uses || []).length) return null;
    var t = sumMacros(r.uses);
    if (t.kcal <= 0) return null;
    var st = tagStats(r.uses);
    return { macro: t, gut: gutSingle(st), mac: macroSingle(t), cross: crossCheck(day, meal) };
  }

  /* 단백질이 부족할 때 지금 냉장고에서 바로 더할 재료 */
  function proteinPick(uses) {
    var inUse = {};
    (uses || []).forEach(function (id) { inUse[id] = true; });
    var pref = ['egg', 'boiledegg', 'chicken', 'tofu', 'tuna', 'mackerel', 'duck', 'pork', 'shake', 'milk'];
    var cands = [];
    state.ingredients.forEach(function (it) {
      if (inUse[it.id] || isDepleted(it)) return;
      if (nutriOf(it).p < 6) return;
      cands.push({ it: it, p: nutriOf(it).p });
    });
    cands.sort(function (a, b) {
      var ia = pref.indexOf(a.it.id), ib = pref.indexOf(b.it.id);
      if (ia === -1 && ib === -1) return b.p - a.p;
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    });
    return cands.length ? cands[0].it : null;
  }

  /* ── 영양·경고 UI 조각 ── */
  /* 끼니 카드 한 줄 탄단지 — kcal + 3색 바 + 단백질 g만 남긴다 */
  function macroLineHtml(n) {
    if (!n || n.kcal <= 0) return '';
    return '<div class="mcline">' +
      '<span class="mcline-kcal">약 ' + fmtN(n.kcal) + 'kcal</span>' +
      '<span class="mini-bar" aria-hidden="true">' +
        '<i class="c" style="width:' + n.pct.c + '%"></i>' +
        '<i class="p" style="width:' + n.pct.p + '%"></i>' +
        '<i class="f" style="width:' + n.pct.f + '%"></i>' +
      '</span>' +
      '<span class="mcline-p">단 ' + g1(n.p) + 'g</span>' +
    '</div>';
  }

  /* 접힌 끼니 카드용 미니 그래프 — 한 줄 바 + % 요약 */
  function miniMacroHtml(n) {
    if (!n || n.kcal <= 0) return '';
    return '<span class="mcc-macro">' +
      '<span class="mini-bar" aria-hidden="true">' +
        '<i class="c" style="width:' + n.pct.c + '%"></i>' +
        '<i class="p" style="width:' + n.pct.p + '%"></i>' +
        '<i class="f" style="width:' + n.pct.f + '%"></i>' +
      '</span>' +
      '<span class="mini-pct">탄 ' + n.pct.c + ' · 단 ' + n.pct.p + ' · 지 ' + n.pct.f + '%</span>' +
      '<span class="mini-kcal">' + n.kcal + 'kcal</span>' +
    '</span>';
  }

  function warnBox(sev, icon, title, who, lines, tip, extra) {
    var h = '<div class="mwarn ' + (sev === 'alert' ? 'alert' : 'warn') + '">' +
      '<div class="mwarn-head"><span class="ico">' + icon + '</span>' + esc(title) +
      (who ? '<span class="who">' + esc(who) + '</span>' : '') + '</div>';
    (lines || []).forEach(function (l) { h += '<p class="mwarn-why">' + l + '</p>'; });
    if (tip) h += '<p class="mwarn-tip">💡 ' + tip + '</p>';
    if (extra) h += extra;
    return h + '</div>';
  }

  function sugButton(day, meal, uses) {
    var pick = proteinPick(uses);
    if (!pick) return '';
    return '<button type="button" class="mwarn-sug" data-suggest="' + esc(pick.id) + '" data-day="' + day + '" data-meal="' + meal + '">' +
      '＋ ' + emojiOf(pick) + ' ' + esc(pick.name) + ' 더하기' +
    '</button>';
  }

  /* 카드에 넣을 [탄단지 요약] + [컴팩트 경고] */
  function checkHtml(day, meal, opts) {
    var o = opts || {};
    var ck = mealCheck(day, meal);
    if (!ck) return { macro: '', warns: '', compact: '', data: null };
    var chips = [];
    var detail = '';

    if (ck.gut.length) {
      var gSev = ck.gut[0].sev;
      chips.push({ sev: gSev, text: (gSev === 'alert' ? '⚠️ 속 불편 조합' : '⚠️ 속 부담 조합') });
      detail += warnBox(
        gSev, '⚠️',
        gSev === 'alert' ? '속이 불편할 수 있는 조합이에요' : '속에 조금 부담되는 조합이에요',
        '',
        ck.gut.map(function (x) { return '<b>' + esc(x.tag) + '</b> — ' + esc(x.why); }),
        esc(ck.gut[0].tip)
      );
    }

    if (ck.mac.length) {
      var title = ck.mac.length > 1 ? '탄단지 균형이 두 군데 치우쳐요' : ck.mac[0].title;
      var needSug = ck.mac.some(function (x) { return x.sug === 'protein'; });
      chips.push({ sev: 'warn', text: '⚖️ ' + (ck.mac.length > 1
        ? '탄단지 ' + ck.mac.length + '곳 치우침'
        : ck.mac[0].short) });
      detail += warnBox(
        'warn', '⚖️', title, '',
        ck.mac.length > 1
          ? ck.mac.map(function (x) { return '<b>' + esc(x.title) + '</b> — ' + esc(x.why); })
          : ck.mac.map(function (x) { return esc(x.why); }),
        esc(ck.mac[0].tip),
        needSug ? sugButton(day, meal, (mealRecipe(day, meal) || {}).uses) : ''
      );
    }

    if (!o.noCross && ck.cross) {
      chips.push({ sev: ck.cross.sev, text: '🔁 ' + ck.cross.short });
      detail += warnBox(ck.cross.sev, '🔁', '다음 끼니와 겹쳐요', ck.cross.label, ck.cross.why, esc(ck.cross.tip));
    }

    var compact = '';
    if (chips.length) {
      var key = slotKey(day, meal);
      var open = !!(ui.warnOpen && ui.warnOpen[key]);
      var hasAlert = chips.some(function (c) { return c.sev === 'alert'; });
      var head = chips[0].text + (chips.length > 1 ? ' +' + (chips.length - 1) : '');
      compact = '<div class="wsum' + (open ? ' is-open' : '') + '" data-wsum="' + key + '">' +
        '<button type="button" class="wline' + (hasAlert ? ' alert' : '') + (open ? ' is-open' : '') + '" data-act="warn" aria-expanded="' + open + '">' +
          '<span>' + esc(head) + '</span><i class="caret">⌄</i>' +
        '</button>' +
        '<div class="wsum-detail"' + (open ? '' : ' hidden') + '>' + detail + '</div>' +
      '</div>';
    }

    return { macro: macroLineHtml(ck.macro), warns: detail, compact: compact, data: ck.macro };
  }

  /* ── 하루 두 끼 합산 탄단지와 목표(g)의 차이 ──
     20대 후반 성인 여성 · 활동량 보통 기준 권장치 (일반적인 값이며 개인차가 있어요) */
  var GOAL_DEFAULT = { kcal: 1800, c: 225, p: 90, f: 60 };
  var MACRO_LABEL = { c: '탄수화물', p: '단백질', f: '지방' };
  var VEG_PICK_RE = /샐러드|상추|양배추|오이|토마토|당근|시금치|나물|채소|야채|버섯|브로콜리|깻잎|파프리카|양파|대파/;

  function goals() { return state.goals || GOAL_DEFAULT; }
  function mealGoal(k) { return Math.round(goals()[k] / 3); }
  function goalPct(val, goal) { return goal > 0 ? Math.round((val || 0) / goal * 100) : 0; }
  function fmtN(n) {
    var s = String(Math.round(n || 0));
    return s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  /* 그 날 두 끼(+추가 섭취·외식)의 탄단지 합계 */
  function dayMacros(day) {
    var t = { c: 0, p: 0, f: 0, kcal: 0, extraKcal: 0, pct: { c: 0, p: 0, f: 0 }, openMeals: [], veg: 0 };
    ['lunch', 'dinner'].forEach(function (m) {
      var k = slotKey(day, m);
      /* 외식으로 기록한 끼니는 그 메뉴의 추정 영양을 그대로 더한다 */
      var out = (state.outside || {})[k];
      if (out) {
        t.c += out.c || 0; t.p += out.p || 0; t.f += out.f || 0;
        t.extraKcal += (out.kcal || 0) - ((out.c || 0) * 4 + (out.p || 0) * 4 + (out.f || 0) * 9);
        return;
      }
      if (state.skips[k]) return;
      var r = mealRecipe(day, m);
      if (!r || !(r.uses || []).length) return;
      var s = sumMacros(r.uses);
      if (s.kcal <= 0) return;
      t.c += s.c; t.p += s.p; t.f += s.f;
      r.uses.forEach(function (id) {
        var it = byId(id);
        if (it && VEG_PICK_RE.test(it.name)) t.veg++;
      });
      if (!state.eaten[k]) t.openMeals.push(m);
    });
    /* 추가 섭취도 그 날 섭취량에 들어간다 */
    (state.snacks[dateKey(day)] || []).forEach(function (sid) {
      var it = byId(sid);
      if (!it) return;
      var n = nutriOf(it);
      t.c += n.c; t.p += n.p; t.f += n.f;
    });
    var kcal = t.c * 4 + t.p * 4 + t.f * 9 + t.extraKcal;
    t.kcal = Math.round(kcal);
    if (kcal > 0) {
      var pP = Math.round(t.p * 4 / kcal * 100);
      var cP = Math.round(t.c * 4 / kcal * 100);
      if (pP + cP > 100) { pP = Math.min(pP, 97); cP = Math.min(cP, 100 - pP); }
      t.pct = { c: cP, p: pP, f: Math.max(0, 100 - cP - pP) };
    }
    return t;
  }

  /* 지금 남아 있는 재료 중 부족한 비율을 보태 줄 재료 */
  function gapPickList(kind, day, limit) {
    var used = {};
    ['lunch', 'dinner'].forEach(function (m) {
      var r = mealRecipe(day, m);
      if (r) (r.uses || []).forEach(function (id) { used[id] = true; });
    });
    var cands = [];
    state.ingredients.forEach(function (it) {
      if (isDepleted(it) || used[it.id]) return;
      var n = nutriOf(it);
      if (kind === 'p' && n.p < 6) return;
      if (kind === 'c' && n.c < 12) return;
      if (kind === 'v' && !VEG_PICK_RE.test(it.name)) return;
      cands.push(it);
    });
    var sortKey = kind === 'c' ? 'c' : 'p';
    cands.sort(function (a, b) {
      var ua = URG[a.urg].order, ub = URG[b.urg].order;
      if (kind !== 'v' && ua !== ub) return ua - ub;
      return nutriOf(b)[sortKey] - nutriOf(a)[sortKey];
    });
    return cands.slice(0, limit || 4);
  }

  /* 목표 대비 한 줄 — 진행 바 + 남은 g / 초과 g */
  function goalRowHtml(key, val) {
    var g = goals();
    var goal = key === 'kcal' ? g.kcal : g[key];
    var unit = key === 'kcal' ? 'kcal' : 'g';
    var pct = goalPct(val, goal);
    var w = Math.max(0, Math.min(100, pct));
    var diff = Math.round(goal - val);
    var cls = '', note;
    if (diff > 0) { note = (key === 'kcal' ? fmtN(diff) + 'kcal' : diff + 'g') + ' 더 필요'; }
    else if (diff < 0) { note = (key === 'kcal' ? fmtN(-diff) + 'kcal' : (-diff) + 'g') + ' 초과'; cls = ' over'; }

  }

  /* ── 잔량 퍼센트(0~100) 모델 ──
     · 개수 없는 재료(버터·소스·통/팩/병)와 남은 게 1개 이하인 개수 재료는 슬라이더로
     · 2개 이상인 다개입 재료는 기존 개수 스테퍼로 */
  function isPctItem(it) {
    if (!it) return false;
    if (!isCountable(it)) return true;
    return it.count <= 1;
  }

  function pctOf(it) {
    if (!it) return 0;
    if (typeof it.pct === 'number') return Math.max(0, Math.min(100, it.pct));
    if (isCountable(it)) return it.count >= 1 ? 100 : (it.count > 0 ? 50 : 0);
    if (it.done) return 0;
    return (it.used || 0) > 0 ? 50 : 100;
  }

    if (!it) return;
    pct = Math.max(0, Math.min(100, Math.round(pct / 5) * 5));
    it.pct = pct;
    it.partial = false;
    if (isCountable(it)) {
      if (pct <= 0) {
        it.count = 0; it.done = true; it.used = 0;
      } else if (pct >= 100) {
        it.count = 1; it.done = false;
      } else {
        it.count = 0.5; it.done = false; it.partial = true;
      }
    } else {

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function normalize(s) {
    var byId0 = {};
    DEFAULT_ITEMS.forEach(function (d) { byId0[d.id] = d; });
    /* 저장 형식 2 = 반 개(0.5) 단위. 예전 형식만 '소량' 플래그를 0.5로 옮긴다 */
    var legacy = !s.v;

    s.ingredients = s.ingredients.map(function (it) {
      var def = byId0[String(it.id)] || null;
      var o = {
        id: String(it.id),
        name: String(it.name || '재료'),
        qty: it.qty || '',
        loc: LOCS[it.loc] ? it.loc : 'fridge',

        note: it.note || '',
        done: !!it.done,
        custom: !!it.custom,
        emoji: it.emoji ? String(it.emoji) : (def && def.emoji) || emojiFor(it.name)
      };

      var explicitCount = typeof it.count === 'number';
      if (typeof it.count === 'number') o.count = Math.max(0, Math.round(it.count * 2) / 2);
      else if (def && typeof def.count === 'number') o.count = o.done ? 0 : def.count;
      else o.count = null;

      o.unit = it.unit ? String(it.unit) : (def && def.unit) || '개';
      o.used = typeof it.used === 'number' ? Math.max(0, Math.round(it.used)) : 0;

      /* 예전 저장값의 '소량'(1개에서 조금 먹음, partial) → 0.5개로 옮긴다 */
      if (legacy && o.count === 1 && it.partial === true) o.count = 0.5;
      if (o.count !== null) o.count = Math.max(0, Math.round(o.count * 2) / 2);
      o.partial = o.count !== null && Math.abs(o.count - Math.round(o.count)) > 0.001;

    var clean = slotRecipes.filter(function (r) { return !goneUses(r.uses).length; });
    var pool = clean.length ? clean : slotRecipes;
    var cands = pool.map(function (r) { return { r: r, score: recipeScore(r, itemsById, {}, null) }; })

  /* =========================================================

  /* 소진된 재료 없이, 지금 있는 재료로 만들 수 있는 다른 레시피 찾기 */
  function pickReplacement(day, meal) {
    var current = planOf(day)[meal];
    var others = {};
    ['today', 'tomorrow'].forEach(function (d) {
      ['lunch', 'dinner'].forEach(function (m) {
        if (d === day && m === meal) return;
        var rid = planOf(d)[m];
        if (rid) others[rid] = true;
      });
    });

    function collect(strict) {
      var itemsById = indexItems();
      var pool = [];
      RECIPES.forEach(function (r) {
        if (r.slots.indexOf(meal) === -1) return;
        if (r.id === current) return;
        var missing = 0, score = 0, urgent = 0, soon = 0, gone = false;
        r.uses.forEach(function (id) {

          score += weightsFor(it.urg);
          if (it.urg === 'urgent') urgent++;
          else if (it.urg === 'soon') soon++;

        if (gone) return;              /* 소진 재료가 든 레시피는 제외 */

        score += urgent * 3 + soon * 1 - missing * 5;

        pool.push({ r: r, score: score });
      });
      pool.sort(function (a, b) { return b.score - a.score; });

    if (!pool.length) pool = collect(false);
    return pool.length ? pool[0].r : null;
  }

  /* 방금 소진된 재료를 쓰는 미식사 끼니를 다른 레시피로 바꾸거나 재료만 덜어낸다 */
  function swapOutIngredient(depletedId) {

        var r = mealRecipe(day, meal);
        if (!r || !r.uses || r.uses.indexOf(depletedId) === -1) return;

        if (r.custom) {
          var c = state.customMeals[k];
          if (c) c.uses = (c.uses || []).filter(function (x) { return x !== depletedId; });
          if (state.mealUses && state.mealUses[k]) {
            state.mealUses[k] = state.mealUses[k].filter(function (x) { return x !== depletedId; });
          }
          trimmed++;
          return;
        }

        var rep = pickReplacement(day, meal);
        if (rep) {
          planOf(day)[meal] = rep.id;
          clearMealUses(day, meal);
          swapped++;

          setMealUses(day, meal, r.uses.filter(function (x) { return x !== depletedId; }));
          trimmed++;
        }
      });

    return { swapped: swapped, trimmed: trimmed };
  }

  function openDeplete(day, meal, id) {
    var it = byId(id);
    if (!it) return;
    depTarget = { day: day, meal: meal, id: id };
    depEmo.textContent = emojiOf(it);

  function closeDeplete() {

  function confirmDeplete() {

    var it = byId(t.id);

    var emo = emojiOf(it), nm = it.name;

    it.done = true;
    it.used = 0;
    it.pct = 0;
    if (isCountable(it)) { it.count = 0; it.partial = false; }

    var res = swapOutIngredient(t.id);
    save();
    closeDeplete();
    renderAll();

    if (res.swapped) toast(emo + ' ' + nm + ' 소진 처리! ' + nm + ' 없이 만드는 메뉴로 바꿨어요');
    else if (res.trimmed) toast(emo + ' ' + nm + ' 소진 처리! 이 끼니에서는 ' + nm + (res.trimmed > 1 ? ' 등' : '') + '만 뺐어요');
    else toast(emo + ' ' + nm + ' 소진 완료로 옮겼어요');
  }

  function removeFromMealOnly() {
    if (!depTarget) return;
    var t = depTarget;
    var it = byId(t.id);
    var r = mealRecipe(t.day, t.meal);
    if (!it || !r) { closeDeplete(); return; }

    setMealUses(t.day, t.meal, r.uses.filter(function (x) { return x !== t.id; }));
    save();
    closeDeplete();
    renderAll();
    toast('이 끼니에서만 ' + emojiOf(it) + ' ' + it.name + ' 뺐어요 · 소진 체크는 그대로예요');
  }

  /* 그 끼니에서 소진된 재료만 덜어내기 (직접 입력 메뉴) */
  function trimGoneFrom(day, meal) {
    var r = mealRecipe(day, meal);
    if (!r) return;
    setMealUses(day, meal, r.uses.filter(function (id) { return !isDepleted(byId(id)); }));
    save();
    renderAll();
    toast('소진된 재료를 이 끼니에서 뺐어요');
  }

  /* =========================================================
     대시보드
     ========================================================= */
  function renderDash() {
    var total = state.ingredients.length;
    var done = state.ingredients.filter(function (i) { return i.done; }).length;
    var pct = total ? Math.round((done / total) * 100) : 0;
    var urgentLeft = state.ingredients.filter(function (i) { return !i.done && i.urg === 'urgent'; }).length;

    dashEl.innerHTML =
      '<div class="dash-top">' +
        '<div class="dash-main">' +
          '<p class="dash-eyebrow">소진 진행률</p>' +
          '<p class="dash-num"><strong>' + done + '</strong><span>/ ' + total + '개 처리</span></p>' +
          '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '</div>' +
      '</div>' +
      (urgentLeft
        ? '<button type="button" class="dash-one" data-jumpurgent="1">🚨 급하게 처리할 재료 <b>' + urgentLeft + '개</b><i>›</i></button>'
        : '<p class="dash-one calm">🎉 급하게 처리할 재료가 없어요</p>');
  }

  /* =========================================================
     필터 & 재료 리스트
     ========================================================= */
  function renderFilters() {
    var html = FILTERS.map(function (f) {
      return '<button class="chip' + (ui.filter === f.id ? ' is-on' : '') + '" data-filter="' + f.id + '">' + f.label + '</button>';
    }).join('');
    html += '<button class="chip toggle' + (ui.hideDone ? ' is-on' : '') + '" data-hide="1">미처리만' +
      '<span class="mini-switch"><i></i></span></button>';
    filtersEl.innerHTML = html;
  }

  function itemRow(it) {
    var meta = [];
    var part = isCountable(it) && hasPartial(it) && !it.done;
    if (isCountable(it)) {
      if (!it.done) meta.push('<span>' + esc(countText(it)) + ' 남음</span>');
    } else if (it.qty && !/^(소량|조금|절반 남음|반 남음)$/.test(String(it.qty).trim())) {
      meta.push('<span>' + esc(it.qty) + '</span>');
    }
    if (it.note) {
      if (meta.length) meta.push('<span class="dot"></span>');
      var isWarn = it.note.indexOf('⚠️') === 0;
      meta.push('<span class="' + (isWarn ? 'warn' : '') + '">' + esc(it.note) + '</span>');
    }
    if (it.custom) meta.push('<span class="mine">내가 추가</span>');

    var nameBtn = '<button class="item-main" data-act="edit" data-id="' + esc(it.id) + '">' +
      '<span class="item-name"><span class="emo">' + emojiOf(it) + '</span>' + esc(it.name) +
        '<span class="badge ' + URG[it.urg].cls + '">' + URG[it.urg].short + ' ' + URG[it.urg].label + '</span>' +
      '</span>' +
      (meta.length ? '<span class="item-meta">' + meta.join('') + '</span>' : '') +
    '</button>';

    var finish = isSharing(it)
      ? '<button class="finish-btn" data-act="finish" data-id="' + esc(it.id) + '" aria-label="' +
        esc(it.name) + ' 다 먹음 처리">다 먹음</button>'
      : '';

    /* 잔량 퍼센트 슬라이더 — 드르륵 옮겨서 남은 양을 표현한다 */
    if (isPctItem(it)) {
      var p = it.done ? 0 : pctOf(it);
      return '<div class="item is-pct' + (it.done ? ' is-done' : '') + '" data-row="' + esc(it.id) + '">' +
        '<div class="item-top">' + nameBtn + finish + '</div>' +
        '<div class="pctrow">' +
          '<input type="range" min="0" max="100" step="5" value="' + p + '" style="--p:' + p + '%"' +
            ' data-pct="' + esc(it.id) + '" aria-label="' + esc(it.name) + ' 남은 양 ' + p + '%"' +
            (it.done ? ' disabled' : '') + '>' +
          '<span class="pctval' + (p === 0 ? ' dim' : '') + '" data-pctv="' + esc(it.id) + '">' + p + '%' +
            '<small>' + pctLabel(p) + '</small></span>' +
        '</div>' +
      '</div>';
    }

    var control;
    var un = esc(unitOf(it));
    var canTap = !it.done && it.count > 0 && it.count <= 2;
    var numAttr = canTap
      ? ' data-act="part" data-id="' + esc(it.id) + '" role="button" tabindex="0" aria-label="' + esc(it.name) +
        (part ? ' 소량 표시 끄기' : ' 반 ' + un + ' 더 표시') + '"'
      : '';
    var whole = Math.floor(it.count + 0.001);
    var numBody = part
      ? (whole >= 1 ? whole + '<small>' + un + '</small> 반' : '소량')
      : it.count + '<small>' + un + '</small>';
    var decLabel = esc(it.name) + (part
      ? (it.count > 0.5 ? ' 소량 씀' : ' 다 씀')
      : (it.count > 1 ? ' 하나 차감' : ' 조금 먹어 소량으로'));
    var incLabel = esc(it.name) + (part
      ? (it.count > 0.5 ? ' 반 ' + un + ' 더' : ' 1' + un + roParticle(unitOf(it)) + ' 되돌리기')
      : ' 하나 더');
    control = '<div class="step' + (part ? ' is-partial' : '') + '">' +
      '<button data-act="dec" data-id="' + esc(it.id) + '" aria-label="' + decLabel + '"' +
        (it.done || it.count <= 0 ? ' disabled' : '') + '>−</button>' +
      '<span class="step-num' + (part ? ' is-partial' : '') + '"' + numAttr + '>' + numBody + '</span>' +
      '<button data-act="inc" data-id="' + esc(it.id) + '" aria-label="' + incLabel + '">+</button>' +
    '</div>';

    return '<div class="item' + (it.done ? ' is-done' : '') + '" data-row="' + esc(it.id) + '">' +
      nameBtn + finish + control +
    '</div>';
  }

  function renderList() {
    var items = state.ingredients.slice();

    if (ui.hideDone) items = items.filter(function (i) { return !i.done; });

    if (ui.filter === 'urgent') {
      items = items.filter(function (i) { return i.urg === 'urgent' || i.urg === 'soon'; });
      items.sort(function (a, b) {
        var d = URG[a.urg].order - URG[b.urg].order;
        if (d !== 0) return d;
        return LOCS[a.loc].order - LOCS[b.loc].order;
      });
      listEl.innerHTML = items.length
        ? sectionHead('🚨 급한 재료부터', items.length + '개', '남은 것만 모았어요') +
          items.map(itemRow).join('')
        : emptyBox('🌿', '급하게 처리할 재료가 없어요.<br>이 페이스면 한 달 소진 충분해요.');
      return;
    }

    if (ui.filter !== 'all') {
      items = items.filter(function (i) { return i.loc === ui.filter; });
      var loc = LOCS[ui.filter];
      if (!items.length) {
        listEl.innerHTML = emptyBox(loc.icon, '이 칸은 다 비웠어요.<br>＋ 재료 추가로 새로 넣을 수 있어요.');
        return;
      }
      var doneCnt = items.filter(function (i) { return i.done; }).length;
      listEl.innerHTML = sectionHead(loc.icon + ' ' + loc.label, doneCnt + '/' + items.length + ' 처리', '') +
        items.map(itemRow).join('');
      return;
    }

    /* 전체: 냉장고 → 냉동고 → 기본·상온 */
    var order = ['fridge', 'freezer', 'pantry'];
    var html = '';
    order.forEach(function (locId) {
      var group = items.filter(function (i) { return i.loc === locId; });
      if (!group.length) return;
      var doneCnt = group.filter(function (i) { return i.done; }).length;
      html += sectionHead(LOCS[locId].icon + ' ' + LOCS[locId].label,
        '<b>' + doneCnt + '</b>/' + group.length, '');
      html += group.map(itemRow).join('');
    });

    if (!html) {
      html = emptyBox('🧺', '이 조건에 맞는 재료가 없어요.');
    }

    html += '<p class="pct-hint">드르륵 옮겨서 남은 양을 0~100%로 맞춰요. 2개 이상 남은 재료는 −/+로 새요.</p>';

    listEl.innerHTML = html;
  }

  function sectionHead(title, right, hint) {
    return '<div class="group-head">' +
      '<span class="group-title">' + title + ' <span class="cnt">' + right + '</span></span>' +
      (hint ? '<span class="group-hint">' + hint + '</span>' : '') +
    '</div>';
  }

  function emptyBox(emo, text) {
    return '<div class="empty"><span class="emo">' + emo + '</span><p>' + text + '</p></div>';
  }

  /* =========================================================
     "아직 많이 남았나요?" 확인 카드
     ========================================================= */
  function leftoverItems() {
    return state.ingredients.filter(function (it) {
      return !it.done && !isCountable(it) && (it.used || 0) >= 2;
    });
  }

  function renderLeftover() {
    var rows = leftoverItems();
    var html = '';
    if (rows.length) {
      html = '<div class="leftover">' +
        '<p class="leftover-head">🤔 아직 많이 남았나요?</p>' +
        '<p class="leftover-sub">두 번 이상 먹은 재료예요. 남은 양에 맞게 정리하면 소진 기록이 정확해져요.</p>' +
        rows.map(function (it) {
          return '<div class="leftover-row">' +
            '<span class="leftover-name">' + emojiOf(it) + ' ' + esc(it.name) +
              ' <em>' + (it.used || 0) + '번 먹음</em></span>' +
            '<button class="lo-btn" data-left="keep" data-id="' + esc(it.id) + '">아직 꽤 남음</button>' +
            '<button class="lo-btn solid" data-left="done" data-id="' + esc(it.id) + '">거의 다 씀 · 소진</button>' +
          '</div>';
        }).join('') +
      '</div>';
    }
    leftoverCard.innerHTML = html;
    leftoverCardMeals.innerHTML = html;
  }

  /* =========================================================
     식단 탭
     ========================================================= */
  function useChips(r) {
    return r.uses.map(function (id) {
      var it = byId(id);
      if (!it) return '';
      var cls = 'use';
      if (it.done) cls += ' done';
      else if (it.urg === 'urgent') cls += ' urgent';
      else if (it.urg === 'soon') cls += ' soon';
      return '<span class="' + cls + '">' + emojiOf(it) + ' ' + esc(it.name) + '</span>';
    }).join('');
  }

  /* 끼니 재료 칩 − 소진된 재료는 흐리게·취소선 + `소진됨`, 끝에 ＋ 재료 */
  function ingChips(r, day, meal) {
    var eaten = !!state.eaten[slotKey(day, meal)];
    var html = (r.uses || []).map(function (id) {
      var it = byId(id);
      if (!it) return '';
      var gone = isDepleted(it);
      var cls = 'ichip';
      var tag = '';
      if (gone && eaten) {
        cls += ' is-finished';
        tag = '<span class="state">다 먹음</span>';
      } else if (gone) {
        cls += ' is-depleted';
        tag = '<span class="gone">소진됨</span>';
      } else if (isSharing(it)) {
        cls += ' is-sharing';
        tag = '<span class="state">' + (isPctItem(it) ? pctOf(it) + '%' : '소량') + '</span>';
      } else if (it.urg === 'urgent') cls += ' urgent';
      else if (it.urg === 'soon') cls += ' soon';
      return '<button type="button" class="' + cls + '" data-chipdel="' + esc(id) + '"' +
        ' aria-label="' + esc(it.name) + ' 빼기">' +
        '<span class="nm">' + emojiOf(it) + ' ' + esc(it.name) + '</span>' +
        tag +
        '<span class="x">✕</span>' +
      '</button>';
    }).join('');

    html += '<button type="button" class="ichip add" data-act="addIng" aria-label="재료 추가">＋ 재료</button>';
    return html;
  }

  /* 재료 g → 미니 그래프용 객체 */
  function macrosObj(c, p, f, kcal) {
    var k = (c || 0) * 4 + (p || 0) * 4 + (f || 0) * 9;
    var pct = { c: 0, p: 0, f: 0 };
    if (k > 0) {
      var pP = Math.round((p || 0) * 4 / k * 100);
      var cP = Math.round((c || 0) * 4 / k * 100);
      if (pP + cP > 100) { pP = Math.min(pP, 97); cP = Math.min(cP, 100 - pP); }
      pct = { c: cP, p: pP, f: Math.max(0, 100 - cP - pP) };
    }
    return { c: c || 0, p: p || 0, f: f || 0, kcal: kcal || Math.round(k), pct: pct };
  }

  function outsideOf(day, meal) {
    return (state.outside || {})[slotKey(day, meal)] || null;
  }

  /* ── 끼니 카드 ── */
  function mealCard(day, meal) {
    var k = slotKey(day, meal);
    var r = mealRecipe(day, meal);
    if (!r) return '';
    var mine = !!r.custom;
    var skipped = !!state.skips[k];
    var eaten = !!state.eaten[k];
    var out = outsideOf(day, meal);
    var mealName = meal === 'lunch' ? '점심' : '저녁';
    var dateStr = shortDate(day === 'tomorrow' ? 1 : 0);
    var gone = goneUses(r.uses);
    var titleName = out ? out.name : r.name;

    /* 먹은·외식 끼니는 작은 아코디언으로 접어 둔다 — 메뉴명 + 탄단지 미니 그래프만 */
    var accordion = eaten || skipped;
    if (accordion && !(ui.openMeal && ui.openMeal[k])) {
      var mdata = null;
      if (out) mdata = macrosObj(out.c, out.p, out.f, out.kcal);
      else if (!skipped) mdata = (checkHtml(day, meal, { noCross: true }) || {}).data;
      return '<article class="meal-card is-compact' + (eaten ? ' is-eaten' : ' is-skip') + (out ? ' is-out' : '') + '" data-day="' + day + '" data-meal="' + meal + '">' +
        '<button type="button" class="mcc" data-act="expand" aria-expanded="false" aria-label="' + esc(titleName) + ' 펼쳐 보기">' +
          '<span class="mcc-top">' +
            '<span class="mc-meal">' + mealName + '</span>' +
            '<i class="mc-dot">·</i>' +
            '<span class="mc-date">' + dateStr + '</span>' +
            (eaten ? '<span class="mc-badge eaten">✅ 먹음</span>' : '<span class="mc-badge skip">🍗 외식</span>') +
            '<span class="mcc-caret">⌄</span>' +
          '</span>' +
          '<span class="mcc-title">' + esc(titleName) + '</span>' +
          (mdata ? miniMacroHtml(mdata) : '') +
        '</button>' +
      '</article>';
    }

    var cls = 'meal-card' + (mine ? ' is-mine' : '') + (skipped ? ' is-skip' : '') +
      (out ? ' is-out' : '') + (eaten ? ' is-eaten' : '') +
      (gone.length && !eaten && !skipped ? ' has-gone' : '');

    var badges = '';
    if (mine && !out) badges += '<span class="mc-badge mine">내가 정한 메뉴</span>';
    if (out) badges += '<span class="mc-badge skip">🍗 외식</span>';
    if (eaten) badges += '<span class="mc-badge eaten">✅ 먹음</span>';
    if (skipped && !out) badges += '<span class="mc-badge skip">🍗 외식</span>';

    var head = '<div class="mc-top">' +
      '<div class="mc-label">' +
        '<span class="mc-meal">' + mealName + '</span>' +
        '<i class="mc-dot">·</i>' +
        '<span class="mc-date">' + dateStr + '</span>' +
        badges +
      '</div>' +
      (accordion ? '<button type="button" class="mc-collapse" data-act="expand" aria-label="접기">접기 ⌃</button>' : '') +
    '</div>';

    var title = '<div class="mc-title"><h3 class="meal-name">' + esc(titleName) + '</h3></div>';

    var metaBits = [];
    if (out) {
      /* 외식 카드는 배지와 탄단지 한 줄로 충분하다 */
    } else if (mine) {
      metaBits.push('✏️ 직접 등록한 메뉴');
    } else {
      if (r.time) metaBits.push('⏱ ' + esc(r.time));
      if (r.method || r.tag) metaBits.push(esc(r.method || r.tag));
      if (r.level) metaBits.push('난이도 ' + esc(r.level));
    }
    var meta = metaBits.length
      ? '<div class="mc-meta">' + metaBits.map(function (t) { return esc(t); }).join('<em>·</em>') + '</div>'
      : '';

    var tools = '';
    if (!eaten && !skipped) {
      tools = '<div class="mc-tools">' +
        '<button class="mc-edit" data-act="' + (mine ? 'editCustom' : 'custom') + '">' +
          (mine ? '✏️ 수정' : '✏️ 직접 입력') + '</button>' +
        '<button class="mc-edit" data-act="swap">🔄 ' + (mine ? '레시피로' : '다른 메뉴') + '</button>' +
      '</div>';
    }

    var steps = '';
    if (mine && !skipped && r.steps) {
      steps = '<p class="steps">' + esc(r.steps) + '</p>';
    }

    /* 탄단지 한 줄 + 한 줄 경고 (먹은 끼니는 경고 생략) */
    var macroHtml = '', warnHtml = '';
    if (out) {
      macroHtml = macroLineHtml(macrosObj(out.c, out.p, out.f, out.kcal));
    } else if (!skipped) {
      var chk = checkHtml(day, meal, { noCross: eaten });
      macroHtml = chk.macro;
      warnHtml = eaten ? '' : chk.compact;
    }

    var usesHtml = '';
    if (!skipped && !out) {
      if (!r.uses.length) {
        usesHtml = mine
          ? '<p class="mine-empty">쓸 재료를 고르지 않았어요 · <b>수정</b>에서 골라두면 먹을 때 한 번에 처리돼요</p>'
          : '<div class="use-chips"><button type="button" class="ichip add" data-act="addIng">＋ 재료</button></div>';
      } else {
        usesHtml = '<div class="use-chips">' + ingChips(r, day, meal) + '</div>';
      }
    }

    var outDetail = '';
    if (out) {
      outDetail = '<div class="out-detail">' +
        (out.photo ? '<button type="button" class="out-detail-photo" data-photo="' + esc(k) + '" aria-label="외식 사진 크게 보기"><img src="' + out.photo + '" alt="외식 사진"></button>' : '') +
        (out.portion && Math.abs(out.portion - 1) > 0.01
          ? '<div class="od"><b>먹은 양</b><span>' + outX(out.portion) + ' · ' + outPortionName(out.portion) + '</span></div>'
          : '') +
        (out.items || []).map(function (x) {
          var q = x.qty ? String(x.qty).replace(/\.0$/, '') + (x.unit || '') : '';
          return '<div class="od"><b>' + esc(x.label) + '</b>' +
            '<span>' + esc((q ? q + ' · ' : '') + Math.round((x.kcal || 0) * (out.portion || 1)) + 'kcal') + '</span></div>';
        }).join('') +
      '</div>';
    }

    var goneBar = '';
    if (gone.length && !eaten && !skipped) {
      goneBar = '<div class="gone-bar">' +
        '<span>⚠️ <strong>' + esc(gone.map(function (it) { return it.name; }).join(' · ')) + '</strong> 소진됨 — 지금은 이대로 못 만들어요</span>' +
        '<button data-act="' + (mine ? 'trimGone' : 'fixGone') + '">' +
          (mine ? '소진 재료 빼기' : '다른 레시피로 바꾸기') + '</button>' +
      '</div>';
    }

    var recipeBtn = (skipped || out) ? '' :
      '<button class="recipe-btn" data-act="recipe">' +
        (mine ? '📖 내 메뉴 보기' : '📖 레시피 보기') +
      '</button>';

    var skipNote = (skipped && !out) ? '<div class="skip-note">🍗 이 끼니는 외식으로 비웠어요</div>' : '';

    var actions = '<div class="mc-actions">';
    if (eaten) actions += '<button class="act undo" data-act="uneat">↩︎ 먹은 기록 되돌리기</button>';
    else if (skipped) actions += '<button class="act undo" data-act="unskip">↩︎ 외식 기록 되돌리기</button>';
    else actions += '<button class="act out" data-act="skip">🍗 외식</button>' +
      '<button class="act solid" data-act="eat">✅ 먹었음</button>';
    actions += '</div>';

    return '<article class="' + cls + '" data-day="' + day + '" data-meal="' + meal + '">' +
      head + title + meta + tools + macroHtml + warnHtml + steps +
      usesHtml +
      goneBar +
      outDetail +
      skipNote +
      recipeBtn +
      actions +
    '</article>';
  }

  /* ── 보고 있는 날의 레시피에 안 쓰인 급한 재료 사인 ── */
  function urgentCallout(day) {
    var used = {};
    ['lunch', 'dinner'].forEach(function (m) {
      if (state.skips[slotKey(day, m)]) return;
      var r = mealRecipe(day, m);
      if (r) (r.uses || []).forEach(function (id) { used[id] = true; });
    });

    var list = state.ingredients.filter(function (it) {
      if (isDepleted(it)) return false;
      if (it.urg !== 'urgent' && it.urg !== 'soon') return false;
      return !used[it.id];
    });
    list.sort(function (a, b) {
      var d = URG[a.urg].order - URG[b.urg].order;
      if (d !== 0) return d;
      return LOCS[a.loc].order - LOCS[b.loc].order;
    });
    if (!list.length) return '';

    var shown = list.slice(0, 4);
    var rest = list.length - shown.length;

    /* 카드 사이를 차지하지 않게 한 줄 띠로 접는다 */
    var chips = shown.map(function (it) {
      return '<span class="uc-chip">' + emojiOf(it) + ' ' + esc(it.name) + '</span>';
    }).join('') +
      (rest > 0 ? '<span class="uc-chip more">+' + rest + '</span>' : '');

    return '<button type="button" class="uc-strip" data-uc="' + esc(shown[0].id) + '" aria-label="급한 재료 정리하러 가기">' +
      '<span class="uc-strip-head">🚨 ' + (day === 'today' ? '오늘' : '내일') + ' 안에 정리</span>' +
      '<span class="uc-strip-chips">' + chips + '</span>' +
      '<span class="uc-strip-go">›</span>' +
    '</button>';
  }

  /* ── 오늘 / 내일 세그먼트 ── */
  function dayTabs() {
    var day = ui.day === 'tomorrow' ? 'tomorrow' : 'today';
    function tab(id, label, offset) {
      return '<button class="daytab' + (day === id ? ' is-on' : '') + '" data-daytab="' + id + '" role="tab" aria-selected="' + (day === id) + '">' +
        label + '<em>' + shortDate(offset) + '</em></button>';
    }
    return '<div class="daytabs" role="tablist">' + tab('today', '오늘', 0) + tab('tomorrow', '내일', 1) + '</div>';
  }

  /* ── 추가 섭취: 보충 음식·간식을 칩으로 담고 ✕로 바로 빼는 영역 ── */
  function extrasBox(day) {
    var dk = dateKey(day);
    var ids = (state.snacks[dk] || []).filter(function (id) { return !!byId(id); });
    var kcal = 0, p = 0;
    var chips = ids.map(function (id) {
      var it = byId(id);
      if (!it) return '';
      var n = nutriOf(it);
      kcal += n.c * 4 + n.p * 4 + n.f * 9;
      p += n.p;
      return '<button type="button" class="exchip" data-extradel="' + esc(id) + '" aria-label="' + esc(it.name) + ' 빼기">' +
        '<span>' + emojiOf(it) + ' ' + esc(it.name) + '</span><span class="x">✕</span></button>';
    }).join('');

    var quick = SNACKS.map(function (sn) {
      var on = ids.indexOf(sn.id) !== -1;
      return '<button type="button" class="exq' + (on ? ' is-on' : '') + '" data-snack="' + sn.id + '" data-snackday="' + day + '">' +
        sn.emo + ' ' + sn.label + '</button>';
    }).join('');

    return '<section class="extra" data-extraday="' + day + '">' +
      '<div class="extra-head">🍪 추가 섭취' +
        '<span>' + (ids.length ? ids.length + '개 · ' + Math.round(kcal) + 'kcal · 단 ' + Math.round(p) + 'g' : '') + '</span>' +
      '</div>' +
      (chips ? '<div class="extra-chips">' + chips + '</div>'
             : '<p class="extra-empty">간식이나 모자란 영양을 여기에 담으면 오늘 목표에 바로 더해져요.</p>') +
      '<div class="extra-quick">' + quick + '</div>' +
    '</section>';
  }

  function addExtra(day, id) {
    var it = byId(id);
    if (!it) return;
    var dk = dateKey(day);
    var arr = state.snacks[dk] || [];
    if (arr.indexOf(id) !== -1) {
      toast(emojiOf(it) + ' ' + it.name + '은 이미 담겨 있어요');
      return;
    }
    arr.push(id);
    state.snacks[dk] = arr;
    save();
    renderMeals();
    toast(emojiOf(it) + ' ' + it.name + ' 추가 섭취에 넣었어요', {
      label: '취소',
      fn: function () { removeExtra(day, id, true); }
    });
  }

  function removeExtra(day, id, silent) {
    var dk = dateKey(day);
    var arr = state.snacks[dk] || [];
    var idx = arr.indexOf(id);
    if (idx === -1) return;
    arr.splice(idx, 1);
    state.snacks[dk] = arr;
    save();
    renderMeals();
    if (!silent) {
      var it = byId(id);
      toast((it ? emojiOf(it) + ' ' + it.name + ' ' : '') + '뺐어요', {
        label: '되돌리기',
        fn: function () {
          var a2 = state.snacks[dk] || [];
          if (a2.indexOf(id) === -1) a2.push(id);
          state.snacks[dk] = a2;
          save();
          renderMeals();
        }
      });
    }
  }

  function renderMeals() {
    var day = ui.day === 'tomorrow' ? 'tomorrow' : 'today';

    mealsEl.innerHTML =
      '<div class="meals-head">' +
        '<h2>' + (day === 'today' ? '오늘' : '내일') + ' 뭐 먹지</h2>' +
        '<button class="mini-btn" id="replanBtn">🔄 다시 짜기</button>' +
      '</div>' +
      dayTabs() +
      goalBox(day) +
      extrasBox(day) +
      mealCard(day, 'lunch') +
      urgentCallout(day) +
      mealCard(day, 'dinner');
  }

  /* =========================================================
     지난 기록 — 날짜별 식단·탄단지 아카이브
     ========================================================= */

  /* 그 날짜의 한 끼 기록 (메뉴·쓴 재료·먹었음/외식 여부·영양) */
  function mealRecord(key, meal) {
    var k = key + '-' + meal;
    var p = (state.plans && state.plans[key]) || {};
    var cm = (state.customMeals || {})[k];
    var out = (state.outside || {})[k];
    var rec;
    if (out) {
      rec = { name: out.name, uses: [], custom: false, outside: true };
    } else if (cm) {
      rec = { name: cm.name || '직접 등록', uses: (cm.uses || []).slice(), custom: true, outside: false };
    } else {
      var r = recipeById(p[meal]);
      if (!r) return null;
      rec = { name: r.name, uses: (r.uses || []).slice(), custom: false, outside: false };
    }
    var ov = state.mealUses && state.mealUses[k];
    if (!out && ov && ov.length) rec.uses = ov.slice();
    var eaten = !!state.eaten[k];
    var skip = !!state.skips[k];
    var nut = { c: 0, p: 0, f: 0, kcal: 0 };
    if (out) nut = { c: out.c || 0, p: out.p || 0, f: out.f || 0, kcal: out.kcal || 0 };
    else if (eaten && !skip) nut = sumMacros(rec.uses);
    return { meal: meal, key: k, name: rec.name, uses: rec.uses, custom: rec.custom,
      outside: !!out, eaten: eaten, skip: skip, nut: nut,
      photo: out && out.photo ? String(out.photo) : '' };
  }

  function dayRecord(key) {
    var out = { key: key, meals: [], snacks: [], c: 0, p: 0, f: 0, kcal: 0, eatenCount: 0, has: false, pct: 0 };
    ['lunch', 'dinner'].forEach(function (m) {
      var r = mealRecord(key, m);
      if (!r) return;
      out.meals.push(r);
      if (r.eaten && !r.skip) {
        out.eatenCount++;
        out.c += r.nut.c; out.p += r.nut.p; out.f += r.nut.f;
        out.has = true;
      } else if (r.skip) {
        /* 외식으로 기록한 끼니는 그 메뉴의 추정 영양을 합산한다 */
        if (r.outside) {
          out.c += r.nut.c; out.p += r.nut.p; out.f += r.nut.f;
          out.extraKcal = (out.extraKcal || 0) + (r.nut.kcal - (r.nut.c * 4 + r.nut.p * 4 + r.nut.f * 9));
        }
        out.has = true;
      }
    });
    (state.snacks[key] || []).forEach(function (sid) {
      var it = byId(sid);
      if (!it) return;
      var n = nutriOf(it);
      out.snacks.push({ id: sid, name: it.name, emoji: emojiOf(it) });
      out.c += n.c; out.p += n.p; out.f += n.f;
      out.has = true;
    });
    out.kcal = Math.round(out.c * 4 + out.p * 4 + out.f * 9 + (out.extraKcal || 0));
    out.pct = goalPct(out.kcal, goals().kcal);
    return out;
  }

  /* 기록이 있는 지난 날짜 — 오래된 순서 정리 후 최신순으로 */
  function historyKeys() {
    var t = todayKey();
    var set = {};
    function add(k) {
      var s = String(k || '');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return;
      if (s < t) set[s] = true;
    }
    Object.keys(state.plans || {}).forEach(function (k) {
      var p = state.plans[k];
      if (p && (p.lunch || p.dinner)) add(k);
    });
    Object.keys(state.eaten || {}).forEach(function (k) { add(String(k).slice(0, 10)); });
    Object.keys(state.skips || {}).forEach(function (k) { add(String(k).slice(0, 10)); });
    Object.keys(state.customMeals || {}).forEach(function (k) { add(String(k).slice(0, 10)); });
    Object.keys(state.snacks || {}).forEach(function (k) { if ((state.snacks[k] || []).length) add(k); });
    return Object.keys(set).sort().reverse();
  }

  function histTag(mm, key) {
    if (mm.eaten && !mm.skip) return '<span class="htag eat">✅ 먹음</span>';
    if (mm.skip) return '<span class="htag out">🍗 외식</span>';
    if (key < todayKey()) return '<span class="htag none">미기록</span>';
    return '';
  }

  function histDetailHtml(key, opts) {
    var rec = dayRecord(key);
    var g = goals();
    var showRetro = !(opts && opts.noRetro) && key < todayKey();

    var head = '<div class="hd-head">' +
      '<span class="hd-date">' + koDate(key, true) + '</span>' +
      (rec.kcal > 0
        ? '<span class="hd-pct' + (rec.pct >= 90 ? ' good' : '') + '">목표 ' + rec.pct + '%</span>'
        : '<span class="hd-pct none">기록 없음</span>') +
      '</div>';

    var sum = '<div class="hd-sum"><b>' + rec.kcal + 'kcal</b> · 탄 ' + g1(rec.c) + ' · 단 ' + g1(rec.p) + ' · 지 ' + g1(rec.f) + 'g</div>';

    var bars = '<div class="hd-bars">' + ['c', 'p', 'f'].map(function (k) {
      var pct = Math.max(0, Math.min(100, goalPct(rec[k], goals()[k])));
      return '<span class="hb"><i class="' + k + '" style="width:' + pct + '%"></i></span>';
    }).join('') + '</div>';

    var rows = rec.meals.map(function (mm) {
      var cls = mm.eaten && !mm.skip ? '' : (mm.skip ? ' is-off' : ' is-none');
      var num = (mm.eaten && !mm.skip) || (mm.skip && mm.nut.kcal > 0)
        ? '<div class="hd-mnum">' + mm.nut.kcal + 'kcal · 탄 ' + g1(mm.nut.c) + ' 단 ' + g1(mm.nut.p) + ' 지 ' + g1(mm.nut.f) + 'g</div>'
        : '';
      var retro = (showRetro && !mm.eaten && !mm.skip)
        ? '<div class="hd-retro">' +
            '<button type="button" data-histeat="' + mm.key + '">✅ 먹었음</button>' +
            '<button type="button" data-histskip="' + mm.key + '">🍗 외식</button>' +
          '</div>'
        : '';
      return '<div class="hd-meal' + cls + '">' +
        '<div class="hd-mrow">' +
          (mm.photo ? '<button type="button" class="hd-photo" data-photo="' + esc(mm.key) + '" aria-label="외식 사진 크게 보기"><img src="' + mm.photo + '" alt="외식 사진"></button>' : '') +
          '<span class="hd-mlabel">' + (mm.meal === 'lunch' ? '점심' : '저녁') + '</span>' +
          '<span class="hd-mname">' + esc(mm.name) + '</span>' +
          histTag(mm, key) +
        '</div>' + num + retro +
      '</div>';
    }).join('');

    var snacks = rec.snacks.length
      ? '<div class="hd-snacks"><span class="hd-uses-label">간식</span>' + rec.snacks.map(function (s) { return s.emoji + ' ' + esc(s.name); }).join(' · ') + '</div>'
      : '';

    var seen = {}, names = [];
    rec.meals.forEach(function (mm) {
      if (!mm.eaten || mm.skip) return;
      (mm.uses || []).forEach(function (id) {
        var it = byId(id);
        if (!it || seen[id]) return;
        seen[id] = true;
        names.push(emojiOf(it) + ' ' + esc(it.name));
      });
    });
    var uses = names.length
      ? '<div class="hd-uses"><span class="hd-uses-label">쓴 재료</span>' + names.join(' · ') + '</div>'
      : '';

    var body = rec.meals.length || rec.snacks.length
      ? head + sum + bars + '<div class="hd-meals">' + rows + '</div>' + snacks + uses
      : head + '<p class="hd-sum">이 날은 남긴 기록이 없어요</p>';

    return '<div class="hd">' + body + '</div>';
  }

  function calHtml() {
    var mp = String(histUI.month).split('-');
    var y = +mp[0], m = +mp[1];
    var first = new Date(y, m - 1, 1).getDay();
    var days = new Date(y, m, 0).getDate();
    var t = todayKey();
    var thisMonth = t.slice(0, 7);
    var curMonth = y + '-' + pad2(m);

    var cells = '';
    for (var i = 0; i < first; i++) cells += '<span class="cal-cell is-blank"></span>';
    for (var d = 1; d <= days; d++) {
      var key = y + '-' + pad2(m) + '-' + pad2(d);
      var rec = dayRecord(key);
      var future = key > t;
      var dots = '';
      if (rec.has) {
        rec.meals.forEach(function (mm) {
          if (mm.eaten && !mm.skip) dots += '<i class="dot eat"></i>';
          else if (mm.skip) dots += '<i class="dot out"></i>';
          else dots += '<i class="dot none"></i>';
        });
        if (rec.snacks.length) dots += '<i class="dot snk"></i>';
      }
      var cls = 'cal-cell';
      if (key === t) cls += ' is-today';
      if (future) cls += ' is-future';
      if (rec.has && rec.pct >= 90) cls += ' is-good';
      if (histUI.day === key) cls += ' is-sel';
      cells += '<button type="button" class="' + cls + '" data-calday="' + key + '"' +
        (future ? ' disabled' : '') + ' aria-label="' + koDate(key, true) + (rec.has ? '' : ' 기록 없음') + '">' +
        '<span class="cal-num">' + d + '</span>' +
        (dots ? '<span class="cal-dots">' + dots + '</span>' : '') +
      '</button>';
    }

    var nextDisabled = curMonth >= thisMonth ? ' disabled' : '';

    return '<div class="calbox">' +
      '<div class="cal-head">' +
        '<button type="button" class="cal-nav" data-calnav="-1" aria-label="이전 달">‹</button>' +
        '<span>' + y + '년 ' + m + '월</span>' +
        '<button type="button" class="cal-nav" data-calnav="1" aria-label="다음 달"' + nextDisabled + '>›</button>' +
      '</div>' +
      '<div class="cal-dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>' +
      '<div class="cal-grid">' + cells + '</div>' +
      '<div class="cal-legend">' +
        '<span><i class="dot eat"></i>먹음</span>' +
        '<span><i class="dot out"></i>외식</span>' +
        '<span><i class="dot none"></i>미기록</span>' +
        '<span><i class="dot snk"></i>간식</span>' +
      '</div>' +
    '</div>';
  }

  function renderHistory() {
    if (!histEl) return;
    syncDay();
    var keys = historyKeys();
    if (!histUI.month || !/^\d{4}-\d{2}$/.test(String(histUI.month))) {
      histUI.month = (keys[0] || todayKey()).slice(0, 7);
    }
    var month = histUI.month;
    var monthKeys = keys.filter(function (k) { return k.slice(0, 7) === month; });
    var mp = month.split('-');

    var head = '<div class="hist-head">' +
      '<div>' +
        '<h2>지난 기록</h2>' +
        '<p>' + (keys.length ? '지금까지 ' + keys.length + '일 기록 · 날짜를 누르면 그날 탄단지를 봐요' : '먹은 끼니가 날짜별로 쌓여요') + '</p>' +
      '</div>' +
      '<button type="button" class="mini-btn" data-act="goalopen">🎯 목표</button>' +
    '</div>';

    var toggle = '<div class="views-toggle">' +
      '<button type="button" data-hview="calendar"' + (histUI.view === 'calendar' ? ' class="is-on"' : '') + '>📅 캘린더</button>' +
      '<button type="button" data-hview="list"' + (histUI.view === 'list' ? ' class="is-on"' : '') + '>📋 리스트</button>' +
    '</div>';

    if (!keys.length) {
      histEl.innerHTML = head + toggle +
        '<div class="empty"><span class="emo">📭</span><p>아직 지난 기록이 없어요.<br>오늘·내일 탭에서 끼니를 먹은 뒤 <b>✅ 먹었음</b>을 누르면<br>그 날짜의 메뉴와 탄단지가 여기에 쌓여요.</p></div>';
      return;
    }

    if (histUI.view === 'list') {
      var avgKcal = 0, avgP = 0, n = 0;
      monthKeys.forEach(function (k) { var r = dayRecord(k); if (r.kcal > 0) { avgKcal += r.kcal; avgP += r.p; n++; } });
      var stat = '<div class="hist-stat">' + (+mp[0]) + '년 ' + (+mp[1]) + '월 · ' + monthKeys.length + '일 기록' +
        (n ? ' · 하루 평균 ' + Math.round(avgKcal / n) + 'kcal · 단백질 ' + Math.round(avgP / n) + 'g' : '') + '</div>';
      var cards = monthKeys.map(function (k) {
        return '<article class="hist-card">' + histDetailHtml(k) + '</article>';
      }).join('');
      histEl.innerHTML = head + toggle + stat +
        (monthKeys.length ? cards : '<div class="empty"><span class="emo">📭</span><p>이 달에는 기록이 없어요.<br>다른 달은 캘린더에서 넘겨 볼 수 있어요.</p></div>') +
        '<div class="section-note">✅ <b>먹었음</b>으로 남긴 끼니의 탄단지와 쓴 재료를 그대로 모아 둬요. 예전 날짜 카드에서 <b>먹었음·외식</b>을 늦게 표시할 수도 있어요. 재료 차감은 소진 체크 탭에서 해요.</div>';
      return;
    }

    /* 캘린더 뷰 */
    var dayKey = histUI.day && histUI.day.slice(0, 7) === month ? histUI.day : (monthKeys[0] || null);
    var detail = dayKey
      ? histDetailHtml(dayKey)
      : '<div class="empty"><span class="emo">👆</span><p>날짜를 누르면 그날 먹은 끼니와<br>탄단지 합계를 보여줘요.</p></div>';
    histEl.innerHTML = head + toggle + calHtml() + detail;
  }

  /* =========================================================
     레시피 팝업(바텀시트)
     ========================================================= */
  function ingStateOf(it) {
    if (!it) return { text: '냉장고에 없음', cls: 'none' };
    if (isDepleted(it)) return { text: '소진됨 · 다시 사야 해요', cls: 'none' };
    if (isPctItem(it)) {
      var p = pctOf(it);
      if (p >= 100) return { text: isCountable(it) ? countText(it) + ' 남음' : (it.qty || '있음'), cls: 'ok' };
      return { text: p + '% 남음', cls: 'warn' };
    }
    if (isCountable(it)) return { text: countText(it) + ' 남음', cls: hasPartial(it) ? 'warn' : 'ok' };
    return { text: '있음', cls: 'ok' };
  }

  function ingRow(it) {
    var st = ingStateOf(it);
    return '<div class="rs-ing">' +
      '<span class="emo">' + emojiOf(it) + '</span>' +
      '<span class="rs-ing-name">' + esc(it.name) + '</span>' +
      '<span class="rs-ing-state ' + st.cls + '">' + esc(st.text) + '</span>' +
    '</div>';
  }

  function buyRow(name) {
    return '<div class="rs-ing buy">' +
      '<span class="emo">' + emojiFor(name) + '</span>' +
      '<span class="rs-ing-name">' + esc(name) + '</span>' +
      '<span class="rs-ing-state warn">사와야 해요</span>' +
    '</div>';
  }

  function openRecipe(day, meal) {
    var r = mealRecipe(day, meal);
    if (!r) return;
    var mine = !!r.custom;
    var mealName = meal === 'lunch' ? '점심' : '저녁';
    var dayName = day === 'today' ? '오늘' : '내일';
    var base = mine ? null : recipeById(planOf(day)[meal]);

    var have = [], buy = [];
    (r.uses || []).forEach(function (id) {
      var it = byId(id);
      if (!it) return;
      if (isDepleted(it)) buy.push({ name: it.name, it: it });
      else have.push(it);
    });
    if (base && base.extra) {
      base.extra.forEach(function (n) {
        var dup = false;
        buy.forEach(function (b) { if (b.name === n) dup = true; });
        if (!dup) buy.push({ name: n, it: null });
      });
    }

    var html = '<p class="rs-kicker">' + dayName + ' ' + mealName + ' · ' + shortDate(day === 'tomorrow' ? 1 : 0) + '</p>' +
      '<h2 class="rs-title" id="recipeTitle">' + esc(r.name) + '</h2>';

    var metaBits = [];
    if (mine) {
      metaBits.push('✏️ 직접 등록한 메뉴');
    } else {
      if (r.time) metaBits.push('⏱ ' + r.time);
      if (r.method || r.tag) metaBits.push('🍳 ' + (r.method || r.tag));
      if (r.level) metaBits.push('난이도 ' + r.level);
    }
    if (metaBits.length) {
      html += '<div class="rs-meta">' + metaBits.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</div>';
    }

    /* ⓵ 탄단지 균형 + 영양·속 경고 */
    var chk = checkHtml(day, meal, { noCross: true });
    if (chk.macro) {
      html += '<section class="rs-block"><h3>탄단지 균형 <span class="rs-h3sub">1인분 추정</span></h3>' +
        chk.macro + chk.warns + '</section>';
    }

    /* ① 재료: 냉장고에 있는 것 / 사와야 하는 것 */
    html += '<section class="rs-block"><h3>필요한 재료</h3>';
    if (!have.length && !buy.length) {
      html += '<div class="rs-empty" style="margin-top:14px">연결된 재료가 없어요. 카드의 ＋ 재료로 이 끼니에 쓸 재료를 골라둘 수 있어요.</div>';
    } else {
      if (have.length) {
        html += '<p class="rs-sublabel">✓ 냉장고에 있어요 <span>· ' + have.length + '개</span></p>' +
          have.map(ingRow).join('');
      }
      if (buy.length) {
        html += '<p class="rs-sublabel buy">🛒 사와야 해요 <span>· ' + buy.length + '개</span></p>' +
          buy.map(function (b) {
            return b.it ? ingRow(b.it) : buyRow(b.name);
          }).join('');
      } else if (have.length) {
        html += '<p class="rs-sublabel buy">🛒 사와야 해요</p>' +
          '<div class="rs-empty">지금 냉장고에 있는 재료로 다 만들 수 있어요. 따로 사 올 건 없어요.</div>';
      }
    }
    html += '</section>';

    /* ② 조리 순서 */
    if (mine) {
      html += '<section class="rs-block"><h3>내가 적어둔 메모</h3>' +
        (r.steps
          ? '<div class="rs-note" style="margin-top:14px">' + esc(r.steps) + '</div>'
          : '<div class="rs-empty" style="margin-top:14px">메모가 비어 있어요. 카드의 <b>✏️ 수정</b>에서 조리법을 적어두면 여기 나와요.</div>') +
        '</section>';
    } else {
      var detail = (base && base.detail && base.detail.length)
        ? base.detail
        : (r.steps ? [r.steps] : []);
      html += '<section class="rs-block"><h3>조리 순서</h3>' +
        (detail.length
          ? '<ol class="rs-steps">' + detail.map(function (t, i) {
              return '<li><b>STEP ' + (i + 1) + '</b><p>' + esc(t) + '</p></li>';
            }).join('') + '</ol>'
          : '<div class="rs-empty" style="margin-top:14px">조리법이 등록되지 않았어요.</div>') +
        '</section>';
    }

    /* ③ 팁 */
    var tip = mine
      ? '직접 등록한 메뉴라 조리법은 메모에 적어둔 내용이 중심이에요. 카드의 ✏️ 수정에서 재료와 메모를 다듬을 수 있어요.'
      : (base && base.tip ? base.tip : '');
    if (tip) {
      html += '<div class="rs-tip">💡 <b>이렇게 하면 더 좋아요</b><br>' + esc(tip) + '</div>';
    }

    html += '<div class="rs-actions"><button class="btn ghost" data-rclose="1">닫기</button></div>';

    recipeBody.innerHTML = html;
    openSheet(recipeSheet);
    recipeSheet.scrollTop = 0;
  }

  /* =========================================================
     렌더
     ========================================================= */
  function renderAll() {
    renderDash();
    renderFilters();
    renderLeftover();
    renderList();
    renderMeals();
    renderHistory();
  }

  function setTab(tab) {
    ui.tab = tab;
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle('is-active', tabs[i].getAttribute('data-tab') === tab);
    }
    $('view-pantry').classList.toggle('is-hidden', tab !== 'pantry');
    $('view-meals').classList.toggle('is-hidden', tab !== 'meals');
    $('view-history').classList.toggle('is-hidden', tab !== 'history');
    $('fabAdd').classList.toggle('is-hidden-tab', tab !== 'pantry');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* =========================================================
     시트 열기 / 닫기
     ========================================================= */
  function openSheet(el) {
    closeSheets(true);
    scrim.classList.add('is-open');
    el.classList.add('is-open');
  }

  function closeSheets(keepScrim) {
    [ingSheet, eatSheet, customSheet, pickSheet, menuSheet, recipeSheet, goalSheet, outSheet].forEach(function (el) { el.classList.remove('is-open'); });
    if (!keepScrim) scrim.classList.remove('is-open');
    resetArmed = false;
  }

  /* ── 재료 추가/수정 ── */
  function segSet(container, val) {
    var btns = container.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('is-on', btns[i].getAttribute('data-val') === val);
    }
  }

  function openEditor(mode, id) {
    editor.mode = mode;
    editor.id = id || null;
    editor.emoji = null;

    if (mode === 'edit') {
      var it = byId(id);
      if (!it) return;
      ingSheetTitle.textContent = '재료 수정';
      ingSheetSub.textContent = '수량·메모·급한 정도를 고치거나 삭제할 수 있어요.';
      fName.value = it.name;
      fQty.value = it.qty;
      fNote.value = it.note;
      editor.loc = it.loc;
      editor.urg = it.urg;
      editor.emoji = it.emoji || null;
      editor.origQty = it.qty;
      ingDelete.classList.remove('is-hidden');
      quickAdd.style.display = 'none';
    } else {
      ingSheetTitle.textContent = '재료 추가';
      ingSheetSub.textContent = '장 본 재료를 바로 넣고 급한 정도를 정해두세요.';
      fName.value = '';
      fQty.value = '';
      fNote.value = '';
      editor.loc = 'fridge';
      editor.urg = 'normal';
      editor.origQty = '';
      ingDelete.classList.add('is-hidden');
      quickAdd.style.display = '';
    }

    segSet(segLoc, editor.loc);
    segSet(segUrg, editor.urg);
    renderEmoPick();
    openSheet(ingSheet);
    setTimeout(function () { fName.focus(); }, 260);
  }

  function renderEmoPick() {
    var autoEmo = emojiFor(fName.value.trim());
    var cur = editor.emoji || autoEmo;
    var seen = {};
    fEmo.innerHTML = [autoEmo].concat(EMOJI_PICKS).map(function (e) {
      if (seen[e]) return '';
      seen[e] = true;
      return '<button type="button" data-emo="' + e + '" class="' + (cur === e ? 'is-on' : '') + '">' + e + '</button>';
    }).join('');
  }

  function saveEditor() {
    var name = fName.value.trim();
    if (!name) {
      fName.focus();
      toast('재료 이름을 적어주세요');
      return;
    }
    var qty = fQty.value.trim();
    var note = fNote.value.trim();
    var emoji = editor.emoji || emojiFor(name);

    if (editor.mode === 'edit') {
      var it = byId(editor.id);
      if (!it) { closeSheets(); return; }
      it.name = name;
      it.qty = qty;
      it.note = note;
      it.loc = editor.loc;
      it.urg = editor.urg;
      it.emoji = emoji;
      /* 수량을 새로 적었고 그 안에 숫자가 있으면 남은 개수도 거기에 맞춘다 */
      if (qty !== editor.origQty) {
        var parsedEdit = countFromQty(qty);
        if (parsedEdit) {
          it.count = parsedEdit.count;
          it.unit = parsedEdit.unit;
          it.done = it.count <= 0;
          it.partial = false;
          it.pct = it.count >= 2 ? null : (it.count > 0 ? 100 : 0);
        } else if (it.count !== null && it.count !== undefined && !qty) {
          it.count = null;
          it.partial = false;
          it.pct = 100;
        }
      }
      save();
      closeSheets();
      renderAll();
      toast('재료를 수정했어요');
    } else {
      var id = 'c' + Date.now().toString(36) + Math.floor(Math.random() * 1000).toString(36);
      var parsedNew = countFromQty(qty);
      state.ingredients.push({
        id: id, name: name, qty: qty, note: note,
        loc: editor.loc, urg: editor.urg, done: false, custom: true,
        emoji: emoji,
        count: parsedNew ? parsedNew.count : null,
        unit: parsedNew ? parsedNew.unit : '개',
        used: 0,
        partial: false,
        pct: (parsedNew && parsedNew.count >= 2) ? null : 100
      });
      save();
      closeSheets();
      ui.filter = 'all';
      ui.hideDone = false;
      renderAll();
      setTab('pantry');
      toast(emoji + ' ' + name + ' 추가 완료');
    }
  }

  function deleteEditor() {
    if (editor.mode !== 'edit' || !editor.id) return;
    var it = byId(editor.id);
    if (!it) return;
    if (!resetArmed) {
      resetArmed = true;
      ingDelete.textContent = '한 번 더 누르면 삭제돼요';
      return;
    }
    state.ingredients = state.ingredients.filter(function (x) { return x.id !== editor.id; });
    save();
    closeSheets();
    renderAll();
    toast(it.name + ' 삭제했어요');
  }

  /* ── 메뉴 직접 등록 시트 ── */
  function updateCustomCount() {
    var n = 0;
    Object.keys(customSel).forEach(function (id) { if (customSel[id]) n++; });
    cCount.innerHTML = n ? '<b>' + n + '개</b> 선택' : '선택 안 함';
  }

  /* 현재 고른 재료들 → 함께 쓰는 재료 추천 (레시피 공출현 + 내 기록) */
  function recommendItems(selMap) {
    var sel = Object.keys(selMap).filter(function (id) {
      var it = byId(id);
      return selMap[id] && it && !it.done;
    });

    if (!sel.length) {
      var urgent = state.ingredients.filter(function (it) { return !it.done && (it.urg === 'urgent' || it.urg === 'soon'); });
      urgent.sort(function (a, b) { return URG[a.urg].order - URG[b.urg].order; });
      return { picks: urgent.slice(0, 4), base: true };
    }

    var hist = (state.coOccurrence && typeof state.coOccurrence === 'object') ? state.coOccurrence : {};
    var score = {};
    sel.forEach(function (s) {
      var fromRecipe = RECIPE_CO[s] || {};
      Object.keys(fromRecipe).forEach(function (c) {
        score[c] = (score[c] || 0) + fromRecipe[c];
      });
      var fromMine = hist[s] || {};
      Object.keys(fromMine).forEach(function (c) {
        score[c] = (score[c] || 0) + fromMine[c] * 4;
      });
    });

    var ranked = Object.keys(score).map(function (id) {
      var cand = byId(id);
      var bonus = cand ? (cand.urg === 'urgent' ? 1.2 : cand.urg === 'soon' ? 0.6 : 0) : 0;
      return { it: cand, s: score[id] + bonus };
    }).filter(function (o) {
      return o.it && !o.it.done && !selMap[o.it.id] && o.s > 0;
    });
    ranked.sort(function (a, b) { return b.s - a.s; });

    var picks = ranked.slice(0, 8).map(function (o) { return o.it; });

    /* 후보가 적으면 급한 재료로 빈자리를 채운다 */
    if (picks.length < 4) {
      state.ingredients.forEach(function (it) {
        if (picks.length >= 4) return;
        if (it.done || selMap[it.id]) return;
        if (picks.indexOf(it) !== -1) return;
        if (it.urg !== 'urgent' && it.urg !== 'soon') return;
        picks.push(it);
      });
    }

    return { picks: picks, base: false };
  }

  function renderSelBar() {
    var ids = Object.keys(customSel).filter(function (id) { return customSel[id] && byId(id); });

    cTags.innerHTML = ids.length
      ? ids.map(function (id) {
          var it = byId(id);
          return '<button type="button" class="ptag" data-unsel="' + esc(id) + '">' +
            emojiOf(it) + ' ' + esc(it.name) + '<span class="x">✕</span></button>';
        }).join('')
      : '<span class="tag-empty">아래에서 재료를 고르면 여기에 태그로 쌓여요</span>';

    var rec = recommendItems(customSel);
    var chips = rec.picks.map(function (it) {
      return '<button type="button" class="rec" data-pick="' + esc(it.id) + '">' +
        emojiOf(it) + ' ' + esc(it.name) + '&nbsp;＋</button>';
    }).join('');

    cRecs.innerHTML = chips
      ? '<p class="rec-label">' + (rec.base ? '🚨 먼저 챙길 재료' : '✨ 같이 자주 쓰는 재료') + '</p>' +
        '<div class="rec-row">' + chips + '</div>'
      : '';
  }

  function renderCustomList() {
    var q = cSearch.value.trim().toLowerCase();
    var html = '';
    var total = 0;

    ['fridge', 'freezer', 'pantry'].forEach(function (locId) {
      var group = state.ingredients.filter(function (it) {
        if (it.done || it.loc !== locId) return false;
        return !q || it.name.toLowerCase().indexOf(q) !== -1;
      });
      if (!group.length) return;
      total += group.length;
      html += '<div class="cust-group">' + LOCS[locId].icon + ' ' + LOCS[locId].label + '</div>';
      html += group.map(function (it) {
        var on = !!customSel[it.id];
        var badge = (it.urg === 'urgent' || it.urg === 'soon')
          ? '<span class="badge ' + URG[it.urg].cls + '">' + URG[it.urg].short + ' ' + URG[it.urg].label + '</span>'
          : '';
        return '<label class="eat-row">' +
          '<input type="checkbox" value="' + esc(it.id) + '"' + (on ? ' checked' : '') + '>' +
          '<span class="eat-name"><span class="emo">' + emojiOf(it) + '</span>' + esc(it.name) + '</span>' +
          badge +
        '</label>';
      }).join('');
    });

    if (!total) {
      html = '<div class="cust-empty">' + (q ? '검색 결과가 없어요' : '남은 재료가 없어요') + '</div>';
    }
    cList.innerHTML = html;
    updateCustomCount();
    renderSelBar();
  }

  function openCustom(day, meal) {
    var k = slotKey(day, meal);
    customTarget = { day: day, meal: meal, key: k };
    customSel = {};

    var cur = customMeal(day, meal);
    if (cur) {
      (cur.uses || []).forEach(function (id) { customSel[id] = true; });
    }

    customSub.textContent = (day === 'today' ? '오늘 ' : '내일 ') + (meal === 'lunch' ? '점심' : '저녁') +
      ' · ' + dayLabel(day === 'tomorrow' ? 1 : 0) +
      ' — 직접 등록한 끼니는 다시 짜도 그대로 유지돼요.';

    cName.value = cur ? cur.name : '';
    cNote.value = cur ? cur.note : '';
    cSearch.value = '';
    renderCustomList();
    openSheet(customSheet);
    setTimeout(function () { cName.focus(); }, 260);
  }

  function toggleCustomSel(id, on) {
    customSel[id] = on;
    var st = cList.scrollTop;
    renderCustomList();
    cList.scrollTop = st;
  }

  function saveCustom() {
    if (!customTarget) return;
    var name = cName.value.trim();
    if (!name) {
      cName.focus();
      toast('메뉴 이름을 적어주세요');
      return;
    }
    var uses = [];
    state.ingredients.forEach(function (it) { if (customSel[it.id] && !it.done) uses.push(it.id); });

    if (uses.length >= 2) recordHistory(uses);

    state.customMeals = state.customMeals || {};
    state.customMeals[customTarget.key] = { name: name, uses: uses, note: cNote.value.trim() };
    delete state.skips[customTarget.key];
    delete state.eaten[customTarget.key];
    save();
    closeSheets();
    customTarget = null;
    renderAll();
    toast(name + ' 등록 완료 · 이 끼니는 계속 유지돼요');
  }

  /* 함께 고른 재료들을 coOccurrence 기록에 누적 */
  function recordHistory(ids) {
    if (!state.coOccurrence || typeof state.coOccurrence !== 'object') state.coOccurrence = {};
    var u = (ids || []).slice();
    for (var i = 0; i < u.length; i++) {
      for (var j = i + 1; j < u.length; j++) bumpPair(state.coOccurrence, u[i], u[j]);
    }
  }

  /* ── 끼니에 재료 추가 시트 (＋ 재료) ── */
  function openPick(day, meal) {
    var r = mealRecipe(day, meal);
    if (!r) return;
    pickTarget = { day: day, meal: meal, key: slotKey(day, meal), base: (r.uses || []).slice() };
    pickSel = {};
    pickSub.textContent = (day === 'today' ? '오늘 ' : '내일 ') +
      (meal === 'lunch' ? '점심' : '저녁') + ' · ' + dayLabel(day === 'tomorrow' ? 1 : 0) +
      ' — 이 끼니에 쓸 재료를 골라 넣으면 레시피가 그대로 맞춰져요.';
    pSearch.value = '';
    renderPickList();
    openSheet(pickSheet);
  }

  function renderPickList() {
    var q = pSearch.value.trim().toLowerCase();
    var cur = pickTarget ? pickTarget.base : [];
    var html = '';
    var total = 0;

    ['fridge', 'freezer', 'pantry'].forEach(function (locId) {
      var group = state.ingredients.filter(function (it) {
        if (it.done || it.loc !== locId) return false;
        return !q || it.name.toLowerCase().indexOf(q) !== -1;
      });
      if (!group.length) return;
      total += group.length;
      html += '<div class="cust-group">' + LOCS[locId].icon + ' ' + LOCS[locId].label + '</div>';
      html += group.map(function (it) {
        var inMeal = cur.indexOf(it.id) !== -1;
        var on = inMeal || !!pickSel[it.id];
        var badge = inMeal
          ? '<span class="badge done">이미 넣음</span>'
          : (it.urg === 'urgent' || it.urg === 'soon')
            ? '<span class="badge ' + URG[it.urg].cls + '">' + URG[it.urg].short + ' ' + URG[it.urg].label + '</span>'
            : '';
        return '<label class="eat-row' + (inMeal ? ' is-done' : '') + '">' +
          '<input type="checkbox" value="' + esc(it.id) + '"' + (on ? ' checked' : '') + (inMeal ? ' disabled' : '') + '>' +
          '<span class="eat-name"><span class="emo">' + emojiOf(it) + '</span>' + esc(it.name) + '</span>' +
          badge +
        '</label>';
      }).join('');
    });

    if (!total) html = '<div class="cust-empty">' + (q ? '검색 결과가 없어요' : '남은 재료가 없어요') + '</div>';
    pList.innerHTML = html;
    renderPickBar();
  }

  function pickRecSel() {
    var m = {};
    if (pickTarget) (pickTarget.base || []).forEach(function (id) { m[id] = true; });
    Object.keys(pickSel).forEach(function (id) { if (pickSel[id]) m[id] = true; });
    return m;
  }

  function renderPickBar() {
    var ids = Object.keys(pickSel).filter(function (id) { return pickSel[id] && byId(id); });
    pCount.innerHTML = ids.length ? '<b>' + ids.length + '개</b> 추가' : '선택 안 함';

    pTags.innerHTML = ids.length
      ? ids.map(function (id) {
          var it = byId(id);
          return '<button type="button" class="ptag" data-punsel="' + esc(id) + '">' +
            emojiOf(it) + ' ' + esc(it.name) + '<span class="x">✕</span></button>';
        }).join('')
      : '<span class="tag-empty">추가할 재료를 고르면 여기에 쌓여요</span>';

    var rec = recommendItems(pickRecSel());
    var chips = rec.picks.map(function (it) {
      return '<button type="button" class="rec" data-ppick="' + esc(it.id) + '">' +
        emojiOf(it) + ' ' + esc(it.name) + '&nbsp;＋</button>';
    }).join('');

    pRecs.innerHTML = chips
      ? '<p class="rec-label">' + (rec.base ? '🚨 먼저 챙길 재료' : '✨ 같이 자주 쓰는 재료') + '</p>' +
        '<div class="rec-row">' + chips + '</div>'
      : '';
  }

  function togglePick(id, on) {
    if (!id || (pickTarget && pickTarget.base.indexOf(id) !== -1)) return;
    pickSel[id] = !!on;
    var st = pList.scrollTop;
    renderPickList();
    pList.scrollTop = st;
  }

  function savePick() {
    if (!pickTarget) return;
    var t = pickTarget;
    var add = Object.keys(pickSel).filter(function (id) { return pickSel[id] && byId(id); });

        c: outRound(est.c * qty),
        p: outRound(est.p * qty),

  function artPieces(v, sub) {

  /* ── 피자·케이크: 원형에서 먹은 비율만큼 부채꼴 ── */
  function pieSector(cx, cy, r, f, fill) {
    if (f >= 0.999) return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + fill + '"/>';

  }

  function artRound(v, sub) {
    var f = Math.min(1, v), e = Math.max(0, Math.min(1, v - 1));

    var base = cake ? ART.cake : ART.pizza;
    var dark = cake ? ART.cakeDark : ART.pizzaDark;
    var s = '';
    s += '<ellipse cx="60" cy="98" rx="46" ry="7" fill="#EEF2F6"/>';

    if (f > 0.002) s += pieSector(60, 64, 38, f, base);
    if (e > 0.02) {
      var C = 2 * Math.PI * 43.5;
      s += '<circle cx="60" cy="64" r="43.5" fill="none" stroke="#EAEEF2" stroke-width="6"/>';
      s += '<circle cx="60" cy="64" r="43.5" fill="none" stroke="' + base + '" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + (C * e).toFixed(1) + ' ' + (C + 12).toFixed(1) + '" transform="rotate(-90 60 64)"/>';

    for (var i = 0; i < 8; i++) {

      for (var p = 0; p < peps.length; p++) {
        var ang2 = Math.atan2(peps[p][1], peps[p][0]);
        var norm = ((ang2 + Math.PI / 2 + Math.PI * 2) % (Math.PI * 2)) / (Math.PI * 2);

        s += '<circle cx="' + cx2.toFixed(1) + '" cy="' + cy2.toFixed(1) + '" r="3.4" fill="' + ART.cream + '" stroke="' + ART.cakeDark + '" stroke-width="0.8"/>';
      }
    }
    if (f > 0.5) {
      s += '<circle cx="60" cy="30" r="4.6" fill="' + (cake ? ART.cherry : ART.pizzaDark) + '"/>';
    }
    return s;
  }

  /* ── 빵·버거: 반 개·한 개·한 개 반 ── */
  function breadPiece(sub, cx, fill, id, sc) {

      var half = w / 2;
      s += '<path d="M' + (cx - half) + ' 72 q0 ' + (-22 * sc) + ' ' + half + ' ' + (-22 * sc) + ' q' + half + ' 0 ' + half + ' ' + (22 * sc) + ' z" fill="' + ART.bun + '"/>';
      s += '<circle cx="' + (cx - 10 * sc) + '" cy="' + (56 * sc + 44 * (1 - sc) + (sc === 1 ? 6 : 0)) + '" r="1.7" fill="#FFF4DE"/>';
      s += '<circle cx="' + (cx + 4 * sc) + '" cy="' + (54 * sc + 44 * (1 - sc) + (sc === 1 ? 4 : 0)) + '" r="1.7" fill="#FFF4DE"/>';
      s += '<rect x="' + (cx - w / 2 - 1) + '" y="72" width="' + (w + 2) + '" height="5" rx="2.5" fill="' + ART.lettuce + '"/>';
      s += '<rect x="' + (cx - w / 2) + '" y="77" width="' + w + '" height="6" rx="3" fill="' + ART.cheese + '"/>';

      s += '<rect x="' + (cx - w / 2 + 3) + '" y="70" width="' + (w - 6) + '" height="6" rx="3" fill="' + ART.cheese + '"/>';
      s += '<rect x="' + (cx - w / 2 + 3) + '" y="78" width="' + (w - 6) + '" height="7" rx="3.5" fill="' + ART.patty + '"/>';
    }
    s += '</g>';

  function artBread(v, sub) {

  /* ── 음료: 잔에 찬 높이 ── */
  function drinkGlass(cx, sc, f, sub, id) {
    var pal = {
      beer: ['#F3C24F', 'foam'], soju: ['#E9F4F9', ''],
      wine: ['#8E2F4A', ''], cola: ['#5B3A2A', 'ice'],
      cider: ['#F5E6A8', 'ice'], coffee: ['#6B4630', 'crema'],
      latte: ['#D9B18C', 'crema'], etc: ['#E9A94E', '']
    }[sub] || ['#E9A94E', ''];

    s += '<clipPath id="' + id + '"><path d="M' + (cx - w) + ' ' + top + ' L' + (cx - w * 0.78) + ' ' + (bot - 7) + ' Q' + cx + ' ' + bot + ' ' + (cx + w * 0.78) + ' ' + (bot - 7) + ' L' + (cx + w) + ' ' + top + ' Z"/></clipPath>';
    var lvl = bot - 8 - (h - 16) * 0.9 * Math.min(1, f);

      if (pal[1] === 'foam') s += '<ellipse cx="' + cx + '" cy="' + lvl.toFixed(1) + '" rx="' + w.toFixed(1) + '" ry="4.2" fill="#FFFDF6"/>';
      if (pal[1] === 'crema') s += '<ellipse cx="' + cx + '" cy="' + lvl.toFixed(1) + '" rx="' + w.toFixed(1) + '" ry="3.6" fill="#FFF6E8" opacity=".85"/>';
      if (pal[1] === 'ice') {
        s += '<rect x="' + (cx - 10 * sc).toFixed(1) + '" y="' + (lvl + 9).toFixed(1) + '" width="10" height="10" rx="2" transform="rotate(16 ' + (cx - 5).toFixed(1) + ' ' + (lvl + 14).toFixed(1) + ')" fill="#FFFFFF" opacity=".5"/>';

      }
    }
    s += '</g>';
    s += '<path d="M' + (cx - w) + ' ' + top + ' L' + (cx - w * 0.78) + ' ' + (bot - 7) + ' Q' + cx + ' ' + bot + ' ' + (cx + w * 0.78) + ' ' + (bot - 7) + ' L' + (cx + w) + ' ' + top + '" fill="none" stroke="#CBD5DF" stroke-width="2" stroke-linejoin="round"/>';
    s += '<path d="M' + (cx - w + 3.5).toFixed(1) + ' ' + (top + 7).toFixed(1) + ' L' + (cx - w * 0.82 + 2).toFixed(1) + ' ' + (bot - 18).toFixed(1) + '" stroke="#FFFFFF" stroke-width="2.2" opacity=".75" stroke-linecap="round"/>';
    return s;
  }

  function artDrink(v, sub) {

  function artBowl(v, sub, label) {
    var f = Math.min(1, v), e = Math.max(0, Math.min(1, v - 1));
    var salad = sub === 'salad' || /샐러드|포케/.test(label || '');
    var top = 100 - 42 * f;
    var s = '';
    s += '<ellipse cx="60" cy="104" rx="44" ry="6" fill="#EEF2F6"/>';
    s += '<path d="M17 56 Q17 104 60 106 Q103 104 103 56 Z" fill="#FFFFFF" stroke="#E3E8ED" stroke-width="2"/>';
    s += '<ellipse cx="60" cy="56" rx="44" ry="9.5" fill="#F5F8FA" stroke="#E3E8ED" stroke-width="1.5"/>';
    s += '<ellipse cx="60" cy="56" rx="38" ry="7.5" fill="#FBFCFD"/>';

    if (salad) {

        s += '<ellipse cx="' + (60 + leaves[i][0]) + '" cy="' + (top + 8 + leaves[i][1]).toFixed(1) + '" rx="' + leaves[i][2] + '" ry="' + (leaves[i][2] * 0.66).toFixed(1) + '" fill="' + (i % 2 ? '#8CBE6A' : '#A6CD82') + '"/>';
      }
