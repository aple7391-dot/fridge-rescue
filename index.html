<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16251F">
<title>냉장고 구조대 · 한 달 소진 프로젝트</title>
<style>
  :root{
    --bg:#F3F5F1;
    --card:#FFFFFF;
    --ink:#1B231F;
    --ink2:#4C5751;
    --sub:#7D8984;
    --line:#E8ECE7;
    --mint:#0E9F6E;
    --mint-deep:#0A7A54;
    --mint-soft:#E6F6EF;
    --red:#E5484D;
    --red-soft:#FDEDEE;
    --amber:#C07608;
    --amber-soft:#FFF5E2;
    --grey-soft:#F1F4F0;
    --shadow:0 2px 12px rgba(22,45,33,.055);
    --shadow-lg:0 14px 40px rgba(18,35,26,.16);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  html,body{height:100%}

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
  }

  button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;font-size:inherit}
  input{font-family:inherit;font-size:inherit;color:inherit}

  .app{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
  }

  /* ── 상단 바 ── */
  .topbar{
    position:sticky;
    top:0;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:14px 18px 10px;
    background:rgba(243,245,241,.92);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }
  .brand{display:flex;align-items:center;gap:9px}
  .brand-mark{
    width:34px;height:34px;border-radius:11px;
    background:#fff;box-shadow:var(--shadow);
    display:grid;place-items:center;font-size:18px;
  }
  .brand-text h1{font-size:16px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
  .brand-text p{font-size:11px;color:var(--sub);font-weight:500;margin-top:2px}
  .ghost-btn{
    width:34px;height:34px;border-radius:11px;background:#fff;
    box-shadow:var(--shadow);color:var(--ink2);
    font-size:16px;font-weight:700;line-height:1;display:grid;place-items:center;
  }
  .ghost-btn:active{transform:scale(.95)}

  /* ── 대시보드 ── */
  .dash{
    margin:4px 18px 0;
    border-radius:22px;
    padding:16px 16px 14px;
    flex:0 0 auto;
    background:linear-gradient(148deg,#15241E 0%,#213C31 62%,#28493B 100%);
    color:#fff;
    box-shadow:0 12px 28px rgba(21,38,30,.22);
    position:relative;
    overflow:hidden;
  }
  .dash::after{
    content:"";position:absolute;right:-46px;top:-58px;width:150px;height:150px;
    border-radius:50%;background:radial-gradient(circle,rgba(52,211,153,.26),transparent 70%);
    pointer-events:none;
  }
  .dash-top{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
  .ring-wrap{position:relative;width:62px;height:62px;flex:0 0 auto}
  .ring{width:62px;height:62px;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:5.5;stroke-linecap:round}
  .ring .ring-bg{stroke:rgba(255,255,255,.14)}
  .ring .ring-fg{stroke:#3EE0A6;transition:stroke-dashoffset .5s ease}
  .ring-label{
    position:absolute;inset:0;display:grid;place-items:center;
    font-size:14.5px;font-weight:800;letter-spacing:-.04em;
  }
  .ring-label small{font-size:9px;font-weight:700;opacity:.7;margin-left:1px}
  .dash-main{flex:1;min-width:0}
  .dash-eyebrow{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.62);letter-spacing:.06em}
  .dash-num{display:flex;align-items:baseline;gap:5px;margin-top:3px}
  .dash-num strong{font-size:25px;font-weight:800;letter-spacing:-.05em;line-height:1}
  .dash-num span{font-size:12px;color:rgba(255,255,255,.6);font-weight:600}
  .dash-sub{font-size:11.5px;color:rgba(255,255,255,.72);margin-top:6px;font-weight:500}

  .bar{
    margin-top:13px;height:6px;border-radius:99px;background:rgba(255,255,255,.14);
    overflow:hidden;position:relative;z-index:1;
  }
  .bar i{
    display:block;height:100%;border-radius:99px;
    background:linear-gradient(90deg,#34D399,#7EF0C4);
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }

  .alert-row{
    margin-top:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    position:relative;z-index:1;
  }
  .alert-pill{
    display:inline-flex;align-items:center;gap:5px;
    font-size:12px;font-weight:800;letter-spacing:-.02em;
    padding:6px 10px;border-radius:99px;
    background:rgba(255,255,255,.13);color:#fff;
  }
  .alert-pill.hot{background:rgba(255,107,107,.22);color:#FFC9C9}
  .alert-pill.cool{background:rgba(62,224,166,.16);color:#9DF3D0}
  .urgent-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;position:relative;z-index:1}
  .urgent-chip{
    font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:8px;
    background:rgba(255,255,255,.1);color:#EAF7F1;border:1px solid rgba(255,255,255,.09);
  }
  .urgent-chip:active{background:rgba(255,255,255,.2)}

  /* ── 탭 ── */
  .tabs{
    margin:14px 18px 0;
    display:flex;gap:4px;
    background:#E7EBE5;
    padding:4px;border-radius:14px;
  }
  .tab{
    flex:1;padding:9px 6px;border-radius:11px;
    font-size:13px;font-weight:700;color:var(--ink2);
    transition:background .18s,color .18s,box-shadow .18s;
  }
  .tab.is-active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(20,40,30,.1)}
  .tab:active{transform:scale(.985)}

  .main{padding:16px 18px 8px;flex:1}
  .view.is-hidden{display:none}

  /* ── 필터 ── */
  .filters{
    display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .filters::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;padding:8px 12px;border-radius:10px;
    background:#fff;color:var(--ink2);
    font-size:12.5px;font-weight:700;white-space:nowrap;
    box-shadow:var(--shadow);border:1px solid transparent;
    transition:background .15s,color .15s,border-color .15s;
  }
  .chip.is-on{background:#1D2F27;color:#fff;border-color:#1D2F27}
  .chip:active{transform:scale(.97)}
  .chip.toggle{display:inline-flex;align-items:center;gap:6px}
  .mini-switch{
    width:26px;height:15px;border-radius:99px;background:#D7DDD6;
    position:relative;display:inline-block;transition:background .2s;
  }
  .mini-switch i{
    position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;
    background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.15);
  }
  .chip.toggle.is-on .mini-switch{background:#3EE0A6}
  .chip.toggle.is-on .mini-switch i{transform:translateX(11px)}

  /* ── 재료 리스트 ── */
  .group-head{
    display:flex;align-items:center;justify-content:space-between;
    margin:18px 2px 8px;
  }
  .group-head:first-child{margin-top:6px}
  .group-title{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ink2);letter-spacing:.01em}
  .group-title .cnt{font-size:11px;font-weight:700;color:var(--sub)}
  .group-title .cnt b{color:var(--mint-deep)}
  .group-hint{font-size:10.5px;color:var(--sub);font-weight:600}

  .item{
    display:flex;align-items:center;gap:10px;
    background:#fff;border-radius:15px;
    padding:12px 13px;margin-bottom:9px;
    box-shadow:var(--shadow);
    transition:opacity .2s,background .2s;
  }
  .item.is-done{opacity:.52;background:#FBFCFA}
  .item-main{flex:1;min-width:0;text-align:left;display:block}
  .item-name{
    display:flex;align-items:Center;gap:6px;flex-wrap:wrap;
    font-size:14px;font-weight:700;letter-spacing:-.02em;line-height:1.35;
  }
  .item.is-done .item-name{text-decoration:line-through;color:var(--sub);text-decoration-thickness:1.5px}
  .item-meta{
    display:flex;align-items:center;gap:5px;flex-wrap:wrap;
    margin-top:4px;font-size:11.5px;color:var(--sub);font-weight:500;line-height:1.4;
  }
  .item-meta .warn{color:#C2410C;font-weight:700}
  .item-meta .dot{width:3px;height:3px;border-radius:50%;background:#C9D0CB}
  .mine{
    font-size:9.5px;font-weight:800;color:var(--mint-deep);
    background:var(--mint-soft);padding:1.5px 5px;border-radius:5px;letter-spacing:.02em;
  }

  .emo{font-size:14.5px;line-height:1;margin-right:1px;flex:0 0 auto}

  /* ── 개수 차감 스테퍼 ── */
  .step{
    flex:0 0 auto;display:flex;align-items:center;gap:1px;
    background:#F1F5F0;border-radius:11px;padding:2px;
  }
  .step button{
    width:27px;height:27px;border-radius:9px;
    display:grid;place-items:center;
    font-size:15px;font-weight:800;line-height:1;color:var(--ink2);
    background:#fff;box-shadow:0 1px 2px rgba(20,40,30,.09);
  }
  .step button:active{transform:scale(.92)}
  .step button:disabled{opacity:.3;box-shadow:none;background:transparent}
  .step-num{
    min-width:36px;text-align:center;font-size:12.5px;font-weight:800;
    letter-spacing:-.03em;color:var(--ink);white-space:nowrap;
  }
  .step-num small{font-size:9px;font-weight:700;color:var(--sub);margin-left:1px}

  /* ── 아직 많이 남았나요? ── */
  .leftover{
    margin:2px 0 13px;border-radius:16px;padding:12px 13px 11px;
    background:linear-gradient(142deg,#FFFAEC,#FFF3D9);
    border:1px solid #F1E0B6;
    box-shadow:0 2px 10px rgba(150,110,20,.08);
  }
  .leftover-head{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;color:#7A5A0C;letter-spacing:-.02em}
  .leftover-sub{font-size:11px;color:#9A7B3C;font-weight:600;margin-top:4px;line-height:1.5}
  .leftover-row{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    margin-top:8px;padding-top:8px;border-top:1px solid rgba(180,140,40,.16);
  }
  .leftover-row:first-of-type{border-top:0;padding-top:7px}
  .leftover-name{flex:1 1 100%;min-width:0;font-size:12px;font-weight:800;color:#5E4A11;display:flex;align-items:center;gap:5px}
  .leftover-name em{font-style:normal;font-size:10.5px;font-weight:700;color:#A98A42}
  .lo-btn{
    flex:1 1 0;font-size:10.5px;font-weight:800;padding:7px 6px;border-radius:9px;
    background:#fff;color:#7A5A0C;border:1px solid #EBD9AC;white-space:nowrap;
  }
  .lo-btn.solid{background:#8A6210;color:#fff;border-color:#8A6210}
  .lo-btn:active{transform:scale(.97)}

  /* ── 직접 입력: 고정 선택 태그 + 추천 칩 ── */
  .selbar{
    position:sticky;top:-10px;z-index:5;
    margin:12px -18px 0;padding:10px 18px 9px;
    background:#fff;border-bottom:1px solid var(--line);
    box-shadow:0 6px 12px -10px rgba(20,40,30,.25);
  }
  .tagrow{
    display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .tagrow::-webkit-scrollbar{display:none}
  .ptag{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;
    font-size:11.5px;font-weight:800;padding:6px 10px;border-radius:99px;
    background:var(--mint-soft);color:var(--mint-deep);border:1px solid #BDE9D7;
    letter-spacing:-.02em;white-space:nowrap;
  }
  .ptag .x{font-size:9.5px;font-weight:800;color:#79BCA1;margin-left:1px}
  .ptag:active{transform:scale(.96)}
  .tag-empty{font-size:11px;font-weight:600;color:var(--sub);padding:6px 2px}
  .recbox{margin-top:9px}
  .rec-label{font-size:10.5px;font-weight:800;color:var(--sub);letter-spacing:.02em;margin-bottom:5px}
  .rec-row{
    display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .rec-row::-webkit-scrollbar{display:none}
  .rec{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;
    font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:99px;
    background:#FFF8E8;color:#8A6210;border:1px solid #F0DFB6;white-space:nowrap;
  }
  .rec:active{transform:scale(.96)}

  .eat-sub{font-size:10.5px;font-weight:700;color:var(--sub);white-space:nowrap}
  .eat-row .step{margin-left:auto}

  /* ── 이모지 선택 ── */
  .emopick{display:flex;gap:6px;flex-wrap:wrap}
  .emopick button{
    width:36px;height:35px;border-radius:10px;font-size:17px;
    background:#F5F7F4;border:1px solid #E8ECE7;display:grid;place-items:center;
  }
  .emopick button.is-on{background:var(--mint-soft);border-color:#8FD9BE}
  .emopick button:active{transform:scale(.94)}

  .badge{
    flex:0 0 auto;
    font-size:10px;font-weight:800;letter-spacing:-.01em;
    padding:2.5px 6px;border-radius:6px;white-space:nowrap;
  }
  .badge.urgent{background:var(--red-soft);color:var(--red)}
  .badge.soon{background:var(--amber-soft);color:var(--amber)}
  .badge.normal{background:#EEF2EE;color:#5F6B65}
  .badge.safe{background:var(--mint-soft);color:var(--mint-deep)}
  .badge.pantry{background:#F2F3F0;color:#8A948E}

  .switch{
    flex:0 0 auto;width:46px;height:27px;border-radius:99px;
    background:#DDE3DC;position:relative;transition:background .22s ease;
  }
  .switch span{
    position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);
    transition:transform .22s cubic-bezier(.4,0,.2,1);
    display:grid;place-items:center;font-size:11px;color:transparent;
  }
  .switch.on{background:var(--mint)}
  .switch.on span{transform:translateX(19px)}
  .switch.on span::after{content:"✓";color:var(--mint);font-weight:900;font-size:11px}
  .switch:active{transform:scale(.94)}

  .empty{
    text-align:center;padding:42px 16px;color:var(--sub);
  }
  .empty .emo{font-size:30px;display:block;margin-bottom:10px;opacity:.8}
  .empty p{font-size:12.5px;font-weight:600;line-height:1.6}

  .section-note{
    display:block;
    margin:14px 2px 2px;padding:10px 12px;
    background:#EFF4EF;border-radius:12px;
    font-size:11.5px;color:#5A675F;line-height:1.55;font-weight:500;
  }
  .section-note b{font-weight:800;color:#2F4139}

  /* ── 식단 탭 ── */
  .meals-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:2px 2px 12px}
  .meals-head h2{font-size:15px;font-weight:800;letter-spacing:-.03em}
  .meals-head p{font-size:11.5px;color:var(--sub);font-weight:500;margin-top:4px}
  .mini-btn{
    flex:0 0 auto;font-size:11.5px;font-weight:800;
    padding:8px 11px;border-radius:10px;background:#fff;color:var(--ink2);
    box-shadow:var(--shadow);
  }
  .mini-btn:active{transform:scale(.96)}

  .day{
    background:#fff;border-radius:20px;padding:15px 14px 6px;
    margin-bottom:14px;box-shadow:var(--shadow);
  }
  .day-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
  .day-left{display:flex;align-items:center;gap:8px}
  .day-tag{
    font-size:11.5px;font-weight:800;color:#fff;background:#1D2F27;
    padding:4px 8px;border-radius:7px;letter-spacing:-.01em;
  }
  .day-tag.tomorrow{background:#94A39B}
  .day-date{font-size:11.5px;color:var(--sub);font-weight:600}
  .day-count{font-size:11px;font-weight:800;color:var(--mint-deep);background:var(--mint-soft);padding:3px 7px;border-radius:6px}
  .day-count.zero{color:var(--sub);background:#F2F4F1}

  .snacks{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:11px 0 3px}
  .snacks-label{font-size:10.5px;font-weight:800;color:var(--sub);letter-spacing:.03em;margin-right:1px}
  .snack{
    font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:8px;
    background:#F4F6F3;color:#68746D;border:1px solid transparent;
    transition:background .15s,color .15s,border-color .15s;
  }
  .snack.is-on{background:var(--mint-soft);color:var(--mint-deep);border-color:#B8E8D4}
  .snack:active{transform:scale(.96)}

  .meal-card{
    border-radius:15px;background:#FAFBF9;
    border:1px solid #EDF0EC;
    padding:13px 13px 12px;margin:10px 0 10px;
    transition:opacity .2s;
  }
  .meal-card.is-skip{background:#F7F7F5;border-style:dashed;border-color:#DFE4DF}
  .meal-card.is-eaten{background:#F3FAF6;border-color:#CDEBDD}
  .meal-card.is-mine{background:#F7FCF9;border-color:#C6E9D8}
  .mine-tag{
    font-size:10px;font-weight:800;color:#0B7B57;background:#DDF3E8;
    padding:2.5px 6px;border-radius:6px;letter-spacing:-.01em;
  }

  .meal-top{display:flex;align-items:center;gap:6px;margin-bottom:7px}
  .slot-pill{
    font-size:10.5px;font-weight:800;padding:2.5px 7px;border-radius:6px;
    background:#E9EEE8;color:#4F5B55;letter-spacing:-.01em;
  }
  .slot-pill.dinner{background:#E8EDF6;color:#465A79}
  .meal-meta{font-size:10.5px;color:var(--sub);font-weight:600}
  .eat-stamp{
    margin-left:auto;font-size:10.5px;font-weight:800;color:var(--mint-deep);
    background:#DFF5EA;padding:2.5px 7px;border-radius:6px;
  }
  .meal-name{font-size:15px;font-weight:800;letter-spacing:-.035em;line-height:1.35}
  .meal-card.is-skip .meal-name{color:var(--sub);text-decoration:line-through;text-decoration-thickness:1.5px;font-size:13.5px}

  .use-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
  .use{
    display:inline-flex;align-items:center;gap:4px;
    font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px;
    background:#EFF2EE;color:#63706A;
  }
  .use::before{content:"";width:4px;height:4px;border-radius:50%;background:#B3BDB6}
  .use.urgent{background:var(--red-soft);color:#C3363B}
  .use.urgent::before{background:var(--red)}
  .use.soon{background:var(--amber-soft);color:#9A6007}
  .use.soon::before{background:#E0A02A}
  .use.done{color:#AAB3AD;text-decoration:line-through;background:#F2F4F1}

  .steps{
    margin-top:9px;font-size:11.5px;line-height:1.62;color:#59655E;font-weight:500;
    background:#fff;border-radius:9px;padding:8px 10px;
  }
  .steps.warn{background:#FFF6EC;color:#9A4C10}
  .mine-empty{
    margin-top:9px;font-size:11px;font-weight:600;color:var(--sub);
    background:#fff;border:1px dashed #DCE4DD;border-radius:9px;padding:8px 10px;
  }
  .mine-empty b{color:var(--mint-deep)}

  .meal-actions{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
  .meal-actions.four{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .meal-actions.four .act.solid{grid-column:1 / -1}
  .act{
    flex:1 1 0;min-width:0;
    padding:9px 6px;border-radius:10px;
    background:#fff;border:1px solid #E4E9E4;
    font-size:11.5px;font-weight:700;color:#57645D;white-space:nowrap;
    transition:background .15s,transform .12s;
  }
  .act:active{transform:scale(.97)}
  .act.solid{
    flex:1 1 100%;
    background:#1D2F27;border-color:#1D2F27;color:#fff;
    font-weight:800;padding:11px 8px;
  }
  .act.solid:active{background:#2A4438}
  .act.undo{flex:1 1 100%;background:#fff;color:var(--ink2)}

<div class="app">
  <header class="topbar">

    <button class="tab is-active" data-tab="pantry" role="tab">🧺 소진 체크</button>

  </nav>

  <main class="main">

</div>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="ingSheet" role="dialog" aria-modal="true">

</div>

    if (!Array.isArray(s.snacks.today)) s.snacks.today = [];
    if (!Array.isArray(s.snacks.tomorrow)) s.snacks.tomorrow = [];
    if (!s.plan || !s.plan.today || !s.plan.tomorrow || !s.plan.today.lunch || !s.plan.today.dinner ||
        !s.plan.tomorrow.lunch || !s.plan.tomorrow.dinner) {
      s.plan = buildPlan(s);
    }
    return s;
  }

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  /* =========================================================
     유틸
     ========================================================= */
  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function indexItems() {
    var map = {};
    state.ingredients.forEach(function (it) { map[it.id] = it; });
    return map;
  }

  function byId(id) {
    for (var i = 0; i < state.ingredients.length; i++) {
      if (state.ingredients[i].id === id) return state.ingredients[i];
    }
    return null;
  }

  function recipeById(id) {
    for (var i = 0; i < RECIPES.length; i++) if (RECIPES[i].id === id) return RECIPES[i];
    return null;
  }

  /* 직접 등록한 끼니가 있으면 그걸, 없으면 추천 레시피를 돌려준다 */
  function customMeal(day, meal) {
    return (state.customMeals || {})[slotKey(day, meal)] || null;
  }

  function mealRecipe(day, meal) {
    var c = customMeal(day, meal);
    if (c) {
      return { id: 'custom:' + slotKey(day, meal), name: c.name, uses: c.uses || [], steps: c.note || '', custom: true };
    }
    return recipeById(state.plan[day] && state.plan[day][meal]);
  }

  function slotKey(day, meal) { return day + '-' + meal; }

  function dayLabel(offset) {
    var d = new Date();
    d.setDate(d.getDate() + offset);
    var wd = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + wd + ')';
  }

  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('is-open');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('is-open'); }, 1900);
  }

  /* =========================================================
     식단 배치 알고리즘
     ========================================================= */
  function weightsFor(urg) {
    return (URG[urg] || URG.normal).weight;
  }

  function recipeScore(r, itemsById, usedSet, prevKey, keyCount, avoid) {
    var s = 0, urgent = 0, soon = 0;
    r.uses.forEach(function (id) {
      var it = itemsById[id];
      if (!it || it.done) return;
      s += weightsFor(it.urg);
      if (it.urg === 'urgent') urgent++;
      else if (it.urg === 'soon') soon++;
    });
    s += urgent * 3 + soon * 1;
    if (usedSet && usedSet[r.id]) s -= 16;
    if (prevKey && r.key === prevKey) s -= 6;
    if (keyCount && keyCount[r.key]) s -= 4 * keyCount[r.key];
    if (avoid && avoid[r.id]) s -= 6;
    return s;
  }

  /* 점수가 비슷한 상위 후보 중에서 골라 매번 같은 네 끼가 나오지 않게 한다 */
  function pickTop(pool) {
    pool.sort(function (a, b) { return b.score - a.score; });
    var top = pool.filter(function (c) { return c.score >= pool[0].score - 3.5; }).slice(0, 3);
    return top[Math.floor(Math.random() * top.length)].r;
  }

  function buildPlan(src, opts) {
    var s = src || state;
    var avoid = (opts && opts.avoid) || null;
    var itemsById = {};
    s.ingredients.forEach(function (it) { itemsById[it.id] = it; });

    var used = {};
    var keyCount = {};
    var plan = { today: {}, tomorrow: {} };
    var slots = [
      ['today', 'lunch'], ['today', 'dinner'],
      ['tomorrow', 'lunch'], ['tomorrow', 'dinner']
    ];
    var prevKey = null;

    slots.forEach(function (pair) {
      var day = pair[0], meal = pair[1];
      var pool = [];
      RECIPES.forEach(function (r) {
        if (r.slots.indexOf(meal) === -1) return;
        pool.push({ r: r, score: recipeScore(r, itemsById, used, prevKey, keyCount, avoid) });
      });
      var best = pool.length ? pickTop(pool) : RECIPES[0];
      plan[day][meal] = best.id;
      used[best.id] = true;
      keyCount[best.key] = (keyCount[best.key] || 0) + 1;
      prevKey = best.key;
    });

    return plan;
  }

  function replanAll() {
    var avoid = {};
    if (state.plan) {
      ['today', 'tomorrow'].forEach(function (d) {
        ['lunch', 'dinner'].forEach(function (m) {
          if (state.plan[d] && state.plan[d][m]) avoid[state.plan[d][m]] = true;
        });
      });
    }
    /* 직접 등록한 끼니는 그대로 유지하고, 그 끼니의 스킵·먹음 기록도 살린다 */
    var keepSkips = {}, keepEaten = {}, mineCount = 0;
    ['today', 'tomorrow'].forEach(function (d) {
      ['lunch', 'dinner'].forEach(function (m) {
        var k = slotKey(d, m);
        if (!customMeal(d, m)) return;
        mineCount++;
        if (state.skips[k]) keepSkips[k] = true;
        if (state.eaten[k]) keepEaten[k] = true;
      });
    });

    state.plan = buildPlan(state, { avoid: avoid });
    state.skips = keepSkips;
    state.eaten = keepEaten;
    save();
    renderAll();
    toast(mineCount
      ? '네 끼를 다시 짰어요 · 직접 등록한 ' + mineCount + '끼는 그대로 뒀어요'
      : '남은 재료 기준으로 네 끼를 다시 짰어요');
  }

  function swapMeal(day, meal) {
    var k = slotKey(day, meal);
    var itemsById = indexItems();
    var others = {};
    ['today', 'tomorrow'].forEach(function (d) {
      ['lunch', 'dinner'].forEach(function (m) {
        if (d === day && m === meal) return;
        var id = state.plan[d] && state.plan[d][m];
        if (id) others[id] = true;
      });
    });

    var current = state.plan[day][meal];
    var cands = RECIPES.filter(function (r) { return r.slots.indexOf(meal) !== -1; })
      .map(function (r) { return { r: r, score: recipeScore(r, itemsById, {}, null) }; })
      .sort(function (a, b) { return b.score - a.score; });

    var start = 0;
    for (var i = 0; i < cands.length; i++) {
      if (cands[i].r.id === current) { start = i; break; }
    }

    var pick = null;
    for (var step = 1; step <= cands.length; step++) {
      var cand = cands[(start + step) % cands.length];
      if (cand.r.id === current) continue;
      if (others[cand.r.id]) continue;
      pick = cand.r;
      break;
    }
    if (!pick) {
      for (var step2 = 1; step2 <= cands.length; step2++) {
        var c2 = cands[(start + step2) % cands.length];
        if (c2.r.id !== current) { pick = c2.r; break; }
      }
    }
    if (!pick) { toast('바꿀 메뉴가 없어요'); return; }

    state.plan[day][meal] = pick.id;
    delete state.skips[k];
    delete state.eaten[k];
    save();
    renderAll();
    toast('메뉴를 바꿨어요');
  }

  /* =========================================================
     대시보드
     ========================================================= */
  function renderDash() {
    var total = state.ingredients.length;
    var done = state.ingredients.filter(function (i) { return i.done; }).length;
    var pct = total ? Math.round((done / total) * 100) : 0;
    var urgentLeft = state.ingredients.filter(function (i) { return !i.done && i.urg === 'urgent'; });
    var soonLeft = state.ingredients.filter(function (i) { return !i.done && i.urg === 'soon'; }).length;
    var circumference = 2 * Math.PI * 26;

    var chips = urgentLeft.slice(0, 5).map(function (it) {
      return '<button class="urgent-chip" data-jump="' + esc(it.id) + '">' + emojiOf(it) + ' ' + esc(it.name) + '</button>';
    }).join('');
    if (urgentLeft.length > 5) {
      chips += '<span class="urgent-chip">+' + (urgentLeft.length - 5) + '</span>';
    }

    dashEl.innerHTML =
      '<div class="dash-top">' +
        '<div class="ring-wrap">' +
          '<svg class="ring" viewBox="0 0 62 62" aria-hidden="true">' +
            '<circle class="ring-bg" cx="31" cy="31" r="26"></circle>' +
            '<circle class="ring-fg" cx="31" cy="31" r="26" stroke-dasharray="' + circumference.toFixed(1) + '" ' +
              'stroke-dashoffset="' + (circumference * (1 - pct / 100)).toFixed(1) + '"></circle>' +
          '</svg>' +
          '<span class="ring-label">' + pct + '<small>%</small></span>' +
        '</div>' +
        '<div class="dash-main">' +
          '<p class="dash-eyebrow">소진 진행률</p>' +
          '<p class="dash-num"><strong>' + done + '</strong><span>/ ' + total + '개 처리</span></p>' +
          '<p class="dash-sub">' + (total - done) + '개 남음 · 곧 소진 ' + soonLeft + '개</p>' +
        '</div>' +
      '</div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="alert-row">' +
        (urgentLeft.length
          ? '<span class="alert-pill hot">🚨 급하게 처리할 재료 <b>&nbsp;' + urgentLeft.length + '개</b></span>'
          : '<span class="alert-pill cool">🎉 급하게 처리할 재료 없음</span>') +
        (soonLeft ? '<span class="alert-pill">⏳ 곧 소진 ' + soonLeft + '개</span>' : '') +
      '</div>' +
      (chips ? '<div class="urgent-chips">' + chips + '</div>' : '');
  }

  /* =========================================================
     필터 & 재료 리스트
     ========================================================= */
  function renderFilters() {
    var html = FILTERS.map(function (f) {
      return '<button class="chip' + (ui.filter === f.id ? ' is-on' : '') + '" data-filter="' + f.id + '">' + f.label + '</button>';
    }).join('');
    html += '<button class="chip toggle' + (ui.hideDone ? ' is-on' : '') + '" data-hide="1">미처리만' +
      '<span class="mini-switch"><i></i></span></button>';
    filtersEl.innerHTML = html;
  }

  function itemRow(it) {
    var meta = [];
    if (isCountable(it)) {
      if (!it.done) meta.push('<span>' + it.count + esc(unitOf(it)) + ' 남음</span>');
    } else if (it.qty) {
      meta.push('<span>' + esc(it.qty) + '</span>');
    }
    if (!isCountable(it) && it.used) {
      if (meta.length) meta.push('<span class="dot"></span>');
      meta.push('<span>🍽️ ' + it.used + '번 먹음</span>');
    }
    if (it.note) {
      if (meta.length) meta.push('<span class="dot"></span>');
      var isWarn = it.note.indexOf('⚠️') === 0;
      meta.push('<span class="' + (isWarn ? 'warn' : '') + '">' + esc(it.note) + '</span>');
    }
    if (it.custom) meta.push('<span class="mine">내가 추가</span>');

    var control;
    if (isCountable(it)) {
      control = '<div class="step">' +
        '<button data-act="dec" data-id="' + esc(it.id) + '" aria-label="' + esc(it.name) + ' 하나 차감"' +
          (it.count <= 0 ? ' disabled' : '') + '>−</button>' +
        '<span class="step-num">' + it.count + '<small>' + esc(unitOf(it)) + '</small></span>' +
        '<button data-act="inc" data-id="' + esc(it.id) + '" aria-label="' + esc(it.name) + ' 하나 더">+</button>' +
      '</div>';
    } else {
      control = '<button class="switch' + (it.done ? ' on' : '') + '" role="switch" aria-checked="' + it.done + '" ' +
        'aria-label="' + esc(it.name) + ' 처리 완료" data-act="toggle" data-id="' + esc(it.id) + '"><span></span></button>';
    }

    return '<div class="item' + (it.done ? ' is-done' : '') + '" data-row="' + esc(it.id) + '">' +
      '<button class="item-main" data-act="edit" data-id="' + esc(it.id) + '">' +
        '<span class="item-name"><span class="emo">' + emojiOf(it) + '</span>' + esc(it.name) +
          '<span class="badge ' + URG[it.urg].cls + '">' + URG[it.urg].short + ' ' + URG[it.urg].label + '</span>' +
        '</span>' +
        (meta.length ? '<span class="item-meta">' + meta.join('') + '</span>' : '') +
      '</button>' +
      control +
    '</div>';
  }

  function renderList() {
    var items = state.ingredients.slice();

    if (ui.hideDone) items = items.filter(function (i) { return !i.done; });

    if (ui.filter === 'urgent') {
      items = items.filter(function (i) { return i.urg === 'urgent' || i.urg === 'soon'; });
      items.sort(function (a, b) {
        var d = URG[a.urg].order - URG[b.urg].order;
        if (d !== 0) return d;
        return LOCS[a.loc].order - LOCS[b.loc].order;
      });
      listEl.innerHTML = items.length
        ? sectionHead('🚨 급한 재료부터', items.length + '개', '남은 것만 모았어요') +
          items.map(itemRow).join('')
        : emptyBox('🌿', '급하게 처리할 재료가 없어요.<br>이 페이스면 한 달 소진 충분해요.');
      return;
    }

    if (ui.filter !== 'all') {
      items = items.filter(function (i) { return i.loc === ui.filter; });
      var loc = LOCS[ui.filter];
      if (!items.length) {
        listEl.innerHTML = emptyBox(loc.icon, '이 칸은 다 비웠어요.<br>＋ 재료 추가로 새로 넣을 수 있어요.');
        return;
      }
      var doneCnt = items.filter(function (i) { return i.done; }).length;
      listEl.innerHTML = sectionHead(loc.icon + ' ' + loc.label, doneCnt + '/' + items.length + ' 처리', '') +
        items.map(itemRow).join('');
      return;
    }

    /* 전체: 냉장고 → 냉동고 → 기본·상온 */
    var order = ['fridge', 'freezer', 'pantry'];
    var html = '';
    order.forEach(function (locId) {
      var group = items.filter(function (i) { return i.loc === locId; });
      if (!group.length) return;
      var doneCnt = group.filter(function (i) { return i.done; }).length;
      html += sectionHead(LOCS[locId].icon + ' ' + LOCS[locId].label,
        '<b>' + doneCnt + '</b>/' + group.length, '');
      html += group.map(itemRow).join('');
    });

    if (!html) {
      html = emptyBox('🧺', '이 조건에 맞는 재료가 없어요.');
    }

    html += '<div class="section-note">💡 급해요 → 곧 소진 순으로 식단에 먼저 배치돼요. ' +
      '<b>계란·모닝빵</b>처럼 개수가 있는 재료는 <b>−/+</b>로 하나씩 차감하고 0이 되면 자동으로 처리 완료돼요. ' +
      '개수 없는 재료(버터·파스타면 등)는 오른쪽 스위치로 직접 처리해요.</div>';

    listEl.innerHTML = html;
  }

  function sectionHead(title, right, hint) {
    return '<div class="group-head">' +
      '<span class="group-title">' + title + ' <span class="cnt">' + right + '</span></span>' +
      (hint ? '<span class="group-hint">' + hint + '</span>' : '') +
    '</div>';
  }

  function emptyBox(emo, text) {
    return '<div class="empty"><span class="emo">' + emo + '</span><p>' + text + '</p></div>';
  }

  /* =========================================================
     "아직 많이 남았나요?" 확인 카드
     ========================================================= */
  function leftoverItems() {
    return state.ingredients.filter(function (it) {
      return !it.done && !isCountable(it) && (it.used || 0) >= 2;
    });
  }

  function renderLeftover() {
    var rows = leftoverItems();
    var html = '';
    if (rows.length) {
      html = '<div class="leftover">' +
        '<p class="leftover-head">🤔 아직 많이 남았나요?</p>' +
        '<p class="leftover-sub">두 번 이상 먹은 재료예요. 남은 양에 맞게 정리하면 소진 기록이 정확해져요.</p>' +
        rows.map(function (it) {
          return '<div class="leftover-row">' +
            '<span class="leftover-name">' + emojiOf(it) + ' ' + esc(it.name) +
              ' <em>' + (it.used || 0) + '번 먹음</em></span>' +
            '<button class="lo-btn" data-left="keep" data-id="' + esc(it.id) + '">아직 꽤 남음</button>' +
            '<button class="lo-btn solid" data-left="done" data-id="' + esc(it.id) + '">거의 다 씀 · 소진</button>' +
          '</div>';
        }).join('') +
      '</div>';
    }
    leftoverCard.innerHTML = html;
    leftoverCardMeals.innerHTML = html;
  }

  /* =========================================================
     식단 탭
     ========================================================= */
  function useChips(r) {
    return r.uses.map(function (id) {
      var it = byId(id);
      if (!it) return '';
      var cls = 'use';
      if (it.done) cls += ' done';
      else if (it.urg === 'urgent') cls += ' urgent';
      else if (it.urg === 'soon') cls += ' soon';
      return '<span class="' + cls + '">' + emojiOf(it) + ' ' + esc(it.name) + '</span>';
    }).join('');
  }

  function mealCard(day, meal) {
    var k = slotKey(day, meal);
    var r = mealRecipe(day, meal);
    if (!r) return '';
    var mine = !!r.custom;
    var skipped = !!state.skips[k];
    var eaten = !!state.eaten[k];
    var slotName = meal === 'lunch' ? '점심' : '저녁';

    var cls = 'meal-card' + (mine ? ' is-mine' : '') + (skipped ? ' is-skip' : '') + (eaten ? ' is-eaten' : '');
    var head = '<div class="meal-top">' +
      '<span class="slot-pill ' + meal + '">' + slotName + '</span>' +
      (mine
        ? '<span class="mine-tag">내가 정한 메뉴</span>'
        : '<span class="meal-meta">' + esc(r.time) + ' · ' + esc(r.tag) + '</span>') +
      (eaten ? '<span class="eat-stamp">✅ 먹음</span>' : '') +
    '</div>';

    var body = '<h3 class="meal-name">' + esc(r.name) + '</h3>';

    if (skipped) {
      return '<article class="' + cls + '" data-day="' + day + '" data-meal="' + meal + '">' +
        head + body +
        '<div class="skip-note">🍗 이 끼니는 배달·외식으로 패스했어요</div>' +
        '<div class="meal-actions"><button class="act undo" data-act="unskip">되돌리기</button></div>' +
      '</article>';
    }

    var steps;
    if (mine) {
      steps = r.steps ? '<p class="steps">' + esc(r.steps) + '</p>' : '';
    } else {
      var warnNote = r.uses.indexOf('spam') !== -1;
      steps = '<p class="steps' + (warnNote ? ' warn' : '') + '">' +
        (warnNote ? '⚠️ 스팸은 끓는 물에 3분 데쳐 염분부터 빼세요. ' : '') + esc(r.steps) + '</p>';
    }

    var usesHtml = r.uses.length
      ? '<div class="use-chips">' + useChips(r) + '</div>'
      : (mine ? '<p class="mine-empty">쓸 재료를 고르지 않았어요 · <b>수정</b>에서 골라두면 먹을 때 한 번에 처리돼요</p>'
              : '<div class="use-chips"></div>');

    var actions;
    if (eaten) {
      actions = '<div class="meal-actions"><button class="act undo" data-act="uneat">기록 되돌리기</button></div>';
    } else if (mine) {
      actions = '<div class="meal-actions four">' +
          '<button class="act" data-act="editCustom">✏️ 수정</button>' +
          '<button class="act" data-act="swap">🔄 레시피로</button>' +
          '<button class="act" data-act="skip">🍗 배달·외식</button>' +
          '<button class="act solid" data-act="eat">✅ 먹었음</button>' +
        '</div>';
    } else {
      actions = '<div class="meal-actions four">' +
          '<button class="act" data-act="custom">✏️ 직접 입력</button>' +
          '<button class="act" data-act="swap">🔄 다른 메뉴</button>' +
          '<button class="act" data-act="skip">🍗 배달·외식</button>' +
          '<button class="act solid" data-act="eat">✅ 먹었음</button>' +
        '</div>';
    }

    return '<article class="' + cls + '" data-day="' + day + '" data-meal="' + meal + '">' +
      head + body +
      usesHtml +
      (eaten ? '' : steps) +
      actions +
    '</article>';
  }

  function dayBlock(day, offset) {
    var snacks = state.snacks[day] || [];
    var eatenCount = (state.eaten[day + '-lunch'] ? 1 : 0) + (state.eaten[day + '-dinner'] ? 1 : 0);
    var snackHtml = SNACKS.map(function (sn) {
      var on = snacks.indexOf(sn.id) !== -1;
      return '<button class="snack' + (on ? ' is-on' : '') + '" data-snack="' + sn.id + '" data-snackday="' + day + '">' +
        sn.emo + ' ' + sn.label + '</button>';
    }).join('');

    return '<section class="day">' +
      '<div class="day-head">' +
        '<div class="day-left">' +
          '<span class="day-tag' + (day === 'tomorrow' ? ' tomorrow' : '') + '">' + (day === 'today' ? '오늘' : '내일') + '</span>' +
          '<span class="day-date">' + dayLabel(offset) + '</span>' +
        '</div>' +
        '<span class="day-count' + (eatenCount ? '' : ' zero') + '">' + eatenCount + '/2 끼</span>' +
      '</div>' +
      '<div class="snacks"><span class="snacks-label">간식</span>' + snackHtml + '</div>' +
      mealCard(day, 'lunch') +
      mealCard(day, 'dinner') +
    '</section>';
  }

  function renderMeals() {
    var urgentLeft = state.ingredients.filter(function (i) { return !i.done && i.urg === 'urgent'; }).length;
    mealsEl.innerHTML =
      '<div class="meals-head">' +
        '<div>' +
          '<h2>오늘·내일 네 끼</h2>' +
          '<p>' + (urgentLeft
            ? '🚨 급한 재료 ' + urgentLeft + '개를 먼저 쓰는 순서로 배치했어요'
            : '급한 재료는 다 정리됐어요 · 여유 재료로 골랐어요') + '</p>' +
        '</div>' +
        '<button class="mini-btn" id="replanBtn">🔄 다시 짜기</button>' +
      '</div>' +
      dayBlock('today', 0) +
      dayBlock('tomorrow', 1) +
      '<div class="section-note">🍽️ 점심·저녁 두 끼만 제안해요. 취향에 안 맞으면 <b>다른 메뉴</b>로 바로 교체하고, ' +
      '먹은 뒤 <b>먹었음</b>을 누르면 그 레시피 재료가 한 번에 정리돼요. ' +
      '먹고 싶은 메뉴가 따로 있으면 <b>✏️ 직접 입력</b>으로 이름·쓸 재료를 등록해 두세요 — 다시 짜도 그 끼니는 그대로 남아요.</div>';
  }

  /* =========================================================
     렌더
     ========================================================= */
  function renderAll() {
    renderDash();
    renderFilters();
    renderLeftover();
    renderList();
    renderMeals();
  }

  function setTab(tab) {
    ui.tab = tab;
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle('is-active', tabs[i].getAttribute('data-tab') === tab);
    }
    $('view-pantry').classList.toggle('is-hidden', tab !== 'pantry');
    $('view-meals').classList.toggle('is-hidden', tab !== 'meals');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* =========================================================
     시트 열기 / 닫기
     ========================================================= */
  function openSheet(el) {
    closeSheets(true);
    scrim.classList.add('is-open');
    el.classList.add('is-open');
  }

  function closeSheets(keepScrim) {
    [ingSheet, eatSheet, customSheet, menuSheet].forEach(function (el) { el.classList.remove('is-open'); });
    if (!keepScrim) scrim.classList.remove('is-open');
    resetArmed = false;
  }

  /* ── 재료 추가/수정 ── */
  function segSet(container, val) {
    var btns = container.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('is-on', btns[i].getAttribute('data-val') === val);
    }
  }

  function openEditor(mode, id) {
    editor.mode = mode;
    editor.id = id || null;
    editor.emoji = null;

    if (mode === 'edit') {
      var it = byId(id);
      if (!it) return;
      ingSheetTitle.textContent = '재료 수정';
      ingSheetSub.textContent = '수량·메모·급한 정도를 고치거나 삭제할 수 있어요.';
      fName.value = it.name;
      fQty.value = it.qty;
      fNote.value = it.note;
      editor.loc = it.loc;
      editor.urg = it.urg;
      editor.emoji = it.emoji || null;
      editor.origQty = it.qty;
      ingDelete.classList.remove('is-hidden');
      quickAdd.style.display = 'none';
    } else {
      ingSheetTitle.textContent = '재료 추가';
      ingSheetSub.textContent = '장 본 재료를 바로 넣고 급한 정도를 정해두세요.';
      fName.value = '';
      fQty.value = '';
      fNote.value = '';
      editor.loc = 'fridge';
      editor.urg = 'normal';
      editor.origQty = '';
      ingDelete.classList.add('is-hidden');
      quickAdd.style.display = '';
    }

    segSet(segLoc, editor.loc);
    segSet(segUrg, editor.urg);
    renderEmoPick();
    openSheet(ingSheet);
    setTimeout(function () { fName.focus(); }, 260);
  }

  function renderEmoPick() {
    var autoEmo = emojiFor(fName.value.trim());
    var cur = editor.emoji || autoEmo;
    var seen = {};
    fEmo.innerHTML = [autoEmo].concat(EMOJI_PICKS).map(function (e) {
      if (seen[e]) return '';
      seen[e] = true;
      return '<button type="button" data-emo="' + e + '" class="' + (cur === e ? 'is-on' : '') + '">' + e + '</button>';
    }).join('');
  }

  function saveEditor() {
    var name = fName.value.trim();
    if (!name) {
      fName.focus();
      toast('재료 이름을 적어주세요');
      return;
    }
    var qty = fQty.value.trim();
    var note = fNote.value.trim();
    var emoji = editor.emoji || emojiFor(name);

    if (editor.mode === 'edit') {
      var it = byId(editor.id);
      if (!it) { closeSheets(); return; }
      it.name = name;
      it.qty = qty;
      it.note = note;
      it.loc = editor.loc;
      it.urg = editor.urg;
      it.emoji = emoji;
      /* 수량을 새로 적었고 그 안에 숫자가 있으면 남은 개수도 거기에 맞춘다 */
      if (qty !== editor.origQty) {
        var parsedEdit = countFromQty(qty);
        if (parsedEdit) {
          it.count = parsedEdit.count;
          it.unit = parsedEdit.unit;
          it.done = it.count <= 0;
        } else if (it.count !== null && it.count !== undefined && !qty) {
          it.count = null;
        }
      }
      save();
      closeSheets();
      renderAll();
      toast('재료를 수정했어요');
    } else {
      var id = 'c' + Date.now().toString(36) + Math.floor(Math.random() * 1000).toString(36);
      var parsedNew = countFromQty(qty);
      state.ingredients.push({
        id: id, name: name, qty: qty, note: note,
        loc: editor.loc, urg: editor.urg, done: false, custom: true,
        emoji: emoji,
        count: parsedNew ? parsedNew.count : null,
        unit: parsedNew ? parsedNew.unit : '개',
        used: 0
      });
      save();
      closeSheets();
      ui.filter = 'all';
      ui.hideDone = false;
      renderAll();
      setTab('pantry');
      toast(emoji + ' ' + name + ' 추가 완료');
    }
  }

  function deleteEditor() {
    if (editor.mode !== 'edit' || !editor.id) return;
    var it = byId(editor.id);
    if (!it) return;
    if (!resetArmed) {
      resetArmed = true;
      ingDelete.textContent = '한 번 더 누르면 삭제돼요';
      return;
    }
    state.ingredients = state.ingredients.filter(function (x) { return x.id !== editor.id; });
    save();
    closeSheets();
    renderAll();
    toast(it.name + ' 삭제했어요');
  }

  /* ── 메뉴 직접 등록 시트 ── */
  function updateCustomCount() {
    var n = 0;
    Object.keys(customSel).forEach(function (id) { if (customSel[id]) n++; });
    cCount.innerHTML = n ? '<b>' + n + '개</b> 선택' : '선택 안 함';
  }

  /* 현재 고른 재료들 → 함께 쓰는 재료 추천 (레시피 공출현 + 내 기록) */
  function recommendItems(selMap) {
    var sel = Object.keys(selMap).filter(function (id) {
      var it = byId(id);
      return selMap[id] && it && !it.done;
    });

    if (!sel.length) {
      var urgent = state.ingredients.filter(function (it) { return !it.done && (it.urg === 'urgent' || it.urg === 'soon'); });
      urgent.sort(function (a, b) { return URG[a.urg].order - URG[b.urg].order; });
      return { picks: urgent.slice(0, 4), base: true };
    }

    var hist = (state.coOccurrence && typeof state.coOccurrence === 'object') ? state.coOccurrence : {};
    var score = {};
    sel.forEach(function (s) {
      var fromRecipe = RECIPE_CO[s] || {};
      Object.keys(fromRecipe).forEach(function (c) {
        score[c] = (score[c] || 0) + fromRecipe[c];
      });
      var fromMine = hist[s] || {};
      Object.keys(fromMine).forEach(function (c) {
        score[c] = (score[c] || 0) + fromMine[c] * 4;
      });
    });

    var ranked = Object.keys(score).map(function (id) {
      var cand = byId(id);
      var bonus = cand ? (cand.urg === 'urgent' ? 1.2 : cand.urg === 'soon' ? 0.6 : 0) : 0;
      return { it: cand, s: score[id] + bonus };
    }).filter(function (o) {
      return o.it && !o.it.done && !selMap[o.it.id] && o.s > 0;
    });
    ranked.sort(function (a, b) { return b.s - a.s; });

    var picks = ranked.slice(0, 8).map(function (o) { return o.it; });

    /* 후보가 적으면 급한 재료로 빈자리를 채운다 */
    if (picks.length < 4) {
      state.ingredients.forEach(function (it) {
        if (picks.length >= 4) return;
        if (it.done || selMap[it.id]) return;
        if (picks.indexOf(it) !== -1) return;
        if (it.urg !== 'urgent' && it.urg !== 'soon') return;
        picks.push(it);
      });
    }

    return { picks: picks, base: false };
  }

  function renderSelBar() {
    var ids = Object.keys(customSel).filter(function (id) { return customSel[id] && byId(id); });

    cTags.innerHTML = ids.length
      ? ids.map(function (id) {
          var it = byId(id);
          return '<button type="button" class="ptag" data-unsel="' + esc(id) + '">' +
            emojiOf(it) + ' ' + esc(it.name) + '<span class="x">✕</span></button>';
        }).join('')
      : '<span class="tag-empty">아래에서 재료를 고르면 여기에 태그로 쌓여요</span>';

    var rec = recommendItems(customSel);
    var chips = rec.picks.map(function (it) {
      return '<button type="button" class="rec" data-pick="' + esc(it.id) + '">' +
        emojiOf(it) + ' ' + esc(it.name) + '&nbsp;＋</button>';
    }).join('');

    cRecs.innerHTML = chips
      ? '<p class="rec-label">' + (rec.base ? '🚨 먼저 챙길 재료' : '✨ 같이 자주 쓰는 재료') + '</p>' +
        '<div class="rec-row">' + chips + '</div>'
      : '';
  }

  function renderCustomList() {
    var q = cSearch.value.trim().toLowerCase();
    var html = '';
    var total = 0;

    ['fridge', 'freezer', 'pantry'].forEach(function (locId) {
      var group = state.ingredients.filter(function (it) {
        if (it.done || it.loc !== locId) return false;
        return !q || it.name.toLowerCase().indexOf(q) !== -1;
      });
      if (!group.length) return;
      total += group.length;
      html += '<div class="cust-group">' + LOCS[locId].icon + ' ' + LOCS[locId].label + '</div>';
      html += group.map(function (it) {
        var on = !!customSel[it.id];
        var badge = (it.urg === 'urgent' || it.urg === 'soon')
          ? '<span class="badge ' + URG[it.urg].cls + '">' + URG[it.urg].short + ' ' + URG[it.urg].label + '</span>'
          : '';
        return '<label class="eat-row">' +
          '<input type="checkbox" value="' + esc(it.id) + '"' + (on ? ' checked' : '') + '>' +
          '<span class="eat-name"><span class="emo">' + emojiOf(it) + '</span>' + esc(it.name) + '</span>' +
          badge +
        '</label>';
      }).join('');
    });

    if (!total) {
      html = '<div class="cust-empty">' + (q ? '검색 결과가 없어요' : '남은 재료가 없어요') + '</div>';
    }
    cList.innerHTML = html;
    updateCustomCount();
    renderSelBar();
  }

  function openCustom(day, meal) {
    var k = slotKey(day, meal);
    customTarget = { day: day, meal: meal, key: k };
    customSel = {};

    var cur = customMeal(day, meal);
    if (cur) {
      (cur.uses || []).forEach(function (id) { customSel[id] = true; });
    }

    customSub.textContent = (day === 'today' ? '오늘 ' : '내일 ') + (meal === 'lunch' ? '점심' : '저녁') +
      ' · ' + dayLabel(day === 'tomorrow' ? 1 : 0) +
      ' — 직접 등록한 끼니는 다시 짜도 그대로 유지돼요.';

    cName.value = cur ? cur.name : '';
    cNote.value = cur ? cur.note : '';
    cSearch.value = '';
    renderCustomList();
    openSheet(customSheet);
    setTimeout(function () { cName.focus(); }, 260);
  }

  function toggleCustomSel(id, on) {
    customSel[id] = on;
    var st = cList.scrollTop;
    renderCustomList();
    cList.scrollTop = st;
  }

  function saveCustom() {
    if (!customTarget) return;
    var name = cName.value.trim();
    if (!name) {
      cName.focus();
      toast('메뉴 이름을 적어주세요');
      return;
    }
    var uses = [];
    state.ingredients.forEach(function (it) { if (customSel[it.id] && !it.done) uses.push(it.id); });

    if (uses.length >= 2) recordHistory(uses);

    state.customMeals = state.customMeals || {};
    state.customMeals[customTarget.key] = { name: name, uses: uses, note: cNote.value.trim() };
    delete state.skips[customTarget.key];
    delete state.eaten[customTarget.key];
    save();
    closeSheets();
    customTarget = null;
    renderAll();
    toast(name + ' 등록 완료 · 이 끼니는 계속 유지돼요');
  }

  /* 함께 고른 재료들을 coOccurrence 기록에 누적 */
  function recordHistory(ids) {
    if (!state.coOccurrence || typeof state.coOccurrence !== 'object') state.coOccurrence = {};
    var u = (ids || []).slice();
    for (var i = 0; i < u.length; i++) {
      for (var j = i + 1; j < u.length; j++) bumpPair(state.coOccurrence, u[i], u[j]);
    }
  }

  /* ── 먹음 시트 ── */
  function openEat(day, meal) {
    var k = slotKey(day, meal);
    var r = mealRecipe(day, meal);
    if (!r) return;
    eatTarget = { day: day, meal: meal, key: k, recipe: r };
    eatQty = {};

    var rows = r.uses.map(function (id) { return byId(id); }).filter(Boolean);
    rows.sort(function (a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      return URG[a.urg].order - URG[b.urg].order;
    });

    eatSub.textContent = r.name + ' — 개수가 있는 재료는 −/+로 몇 개 먹었는지 정하고, 나머지는 먹음 횟수만 가볍게 남겨요.';

    eatList.innerHTML = rows.map(function (it) {
      var auto = !it.done && (it.urg === 'urgent' || it.urg === 'soon');
      if (it.done) {
        return '<div class="eat-row is-done">' +
          '<span class="eat-check">✓</span>' +
          '<span class="eat-name"><span class="emo">' + emojiOf(it) + '</span>' + esc(it.name) + '</span>' +
          '<span class="badge ' + URG[it.urg].cls + '">이미 처리</span>' +
        '</div>';
      }
      if (isCountable(it)) {
        eatQty[it.id] = 1;
        return '<div class="eat-row" data-eatrow="' + esc(it.id) + '">' +
          '<span class="eat-name"><span class="emo">' + emojiOf(it) + '</span>' + esc(it.name) + '</span>' +
          '<span class="eat-sub">' + it.count + esc(unitOf(it)) + ' 남음</span>' +
          '<div class="step">' +
            '<button data-eat="dec" data-id="' + esc(it.id) + '" aria-label="한 개 적게">−</button>' +
            '<span class="step-num" data-eatnum="' + esc(it.id) + '">1</span>' +
            '<button data-eat="inc" data-id="' + esc(it.id) + '" aria-label="한 개 많게">+</button>' +
          '</div>' +
        '</div>';
      }
      return '<label class="eat-row">' +
        '<input type="checkbox" value="' + esc(it.id) + '"' + (auto ? ' checked' : '') + '>' +
        '<span class="eat-name"><span class="emo">' + emojiOf(it) + '</span>' + esc(it.name) + '</span>' +
        '<span class="eat-sub">먹음 +1</span>' +
      '</label>';
    }).join('');

    if (!rows.length) {
      eatList.innerHTML = '<div class="empty"><p>' + (r.custom ? '고른 재료가 없어요.<br>먹은 기록만 남길 수 있어요.' : '이 레시피에 연결된 재료가 없어요.') + '</p></div>';
    }

    openSheet(eatSheet);
  }

  function confirmEat() {
    if (!eatTarget) return;
    var parts = [];
    var usedIds = [];

    /* 개수 없는 재료: 체크한 만큼 먹음 횟수 +1 */
    var boxes = eatList.querySelectorAll('input[type="checkbox"]');
    for (var i = 0; i < boxes.length; i++) {
      if (!boxes[i].checked) continue;
      var it = byId(boxes[i].value);
      if (!it || it.done || isCountable(it)) continue;
      it.used = (it.used || 0) + 1;
      usedIds.push(it.id);
      parts.push(emojiOf(it) + ' ' + it.name + ' +1회');
    }

    /* 소분·개수 재료: −/+로 정한 개수만큼 차감, 0이면 처리 완료 */
    Object.keys(eatQty).forEach(function (id) {
      var item = byId(id);
      if (!item || item.done || !isCountable(item)) return;
      var n = Math.min(eatQty[id] || 0, item.count);
      if (!n || n <= 0) return;
      item.count -= n;
      usedIds.push(item.id);
      parts.push(emojiOf(item) + ' ' + item.name + ' ' + n + unitOf(item));
      if (item.count <= 0) { item.count = 0; item.done = true; }
    });

    if (usedIds.length >= 2) recordHistory(usedIds);

    state.eaten[eatTarget.key] = true;
    delete state.skips[eatTarget.key];
    save();
    closeSheets();
    eatTarget = null;
    eatQty = {};
    renderAll();
    toast(parts.length ? parts.join(' · ') + ' 기록했어요' : '먹은 기록만 남겼어요');
  }

  /* =========================================================
     이벤트
     ========================================================= */
  document.querySelector('.tabs').addEventListener('click', function (e) {
    var btn = e.target.closest('.tab');
    if (btn) setTab(btn.getAttribute('data-tab'));
  });

  dashEl.addEventListener('click', function (e) {
    var chip = e.target.closest('[data-jump]');
    if (!chip) return;
    ui.filter = 'urgent';
    ui.hideDone = false;
    setTab('pantry');
    renderFilters();
    renderList();
    var row = listEl.querySelector('[data-row="' + chip.getAttribute('data-jump') + '"]');
    if (row) {
      row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      row.classList.add('flash');
      setTimeout(function () { row.classList.remove('flash'); }, 1200);
    }
  });

  filtersEl.addEventListener('click', function (e) {
    var f = e.target.closest('[data-filter]');
    if (f) {
      ui.filter = f.getAttribute('data-filter');
      renderFilters();
      renderList();
      return;
    }
    var h = e.target.closest('[data-hide]');
    if (h) {
      ui.hideDone = !ui.hideDone;
      renderFilters();
      renderList();
    }
  });

  listEl.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var id = btn.getAttribute('data-id');
    var act = btn.getAttribute('data-act');

    if (act === 'dec' || act === 'inc') {
      var cit = byId(id);
      if (!cit || !isCountable(cit)) return;
      if (act === 'dec') {
        if (cit.count <= 0) return;
        cit.count -= 1;
        if (cit.count <= 0) {
          cit.count = 0;
          cit.done = true;
          toast(emojiOf(cit) + ' ' + cit.name + ' 다 씀 · 처리 완료');
        } else {
          toast(emojiOf(cit) + ' ' + cit.name + ' 1' + unitOf(cit) + ' 차감 · ' + cit.count + unitOf(cit) + ' 남음');
        }
      } else {
        if (cit.count <= 0) {
          cit.count = 1;
          cit.done = false;
          toast(emojiOf(cit) + ' ' + cit.name + ' 다시 ' + cit.count + unitOf(cit) + ' 남았어요');
        } else {
          cit.count += 1;
          toast(emojiOf(cit) + ' ' + cit.name + ' +1 · ' + cit.count + unitOf(cit) + ' 남음');
        }
      }
      save();
      renderDash();
      renderLeftover();
      renderList();
      renderMeals();
      return;
    }

    if (act === 'toggle') {
      var it = byId(id);
      if (!it) return;
      it.done = !it.done;
      save();
      renderDash();
      renderList();
      renderMeals();
      if (it.done) toast(emojiOf(it) + ' ' + it.name + ' 처리 완료');
      return;
    }
    if (act === 'edit') openEditor('edit', id);
  });

  /* 먹음 시트의 개수 스테퍼 */
  eatList.addEventListener('click', function (e) {
    var b = e.target.closest('[data-eat]');
    if (!b) return;
    var id = b.getAttribute('data-id');
    var it = byId(id);
    if (!it || !isCountable(it)) return;
    var cur = eatQty[id] == null ? 1 : eatQty[id];
    var next = b.getAttribute('data-eat') === 'inc' ? cur + 1 : cur - 1;
    next = Math.max(0, Math.min(next, it.count));
    eatQty[id] = next;
    var num = eatList.querySelector('[data-eatnum="' + id + '"]');
    if (num) num.textContent = String(next);
    var row = eatList.querySelector('[data-eatrow="' + id + '"]');
    if (row) row.classList.toggle('is-done', next === 0);
  });

  /* 아직 많이 남았나요? 카드 */
  function onLeftoverClick(e) {
    var b = e.target.closest('[data-left]');
    if (!b) return;
    var it = byId(b.getAttribute('data-id'));
    if (!it) return;
    if (b.getAttribute('data-left') === 'keep') {
      it.used = 0;
      save();
      renderAll();
      toast(emojiOf(it) + ' ' + it.name + ' · 먹음 횟수를 다시 셀게요');
    } else {
      it.done = true;
      it.used = 0;
      if (isCountable(it)) it.count = 0;
      save();
      renderAll();
      toast(emojiOf(it) + ' ' + it.name + ' 소진 완료로 옮겼어요');
    }
  }
  leftoverCard.addEventListener('click', onLeftoverClick);
  leftoverCardMeals.addEventListener('click', onLeftoverClick);

  mealsEl.addEventListener('click', function (e) {
    if (e.target.closest('#replanBtn')) { replanAll(); return; }

    var snack = e.target.closest('[data-snack]');
    if (snack) {
      var day = snack.getAttribute('data-snackday');
      var sid = snack.getAttribute('data-snack');
      var arr = state.snacks[day] || [];
      var idx = arr.indexOf(sid);
      if (idx === -1) arr.push(sid); else arr.splice(idx, 1);
      state.snacks[day] = arr;
      save();
      renderMeals();
      return;
    }

    var actBtn = e.target.closest('[data-act]');
    if (!actBtn) return;
    var card = actBtn.closest('.meal-card');
    if (!card) return;
    var d = card.getAttribute('data-day');
    var m = card.getAttribute('data-meal');
    var k = slotKey(d, m);
    var act = actBtn.getAttribute('data-act');

    if (act === 'swap') {
      if (customMeal(d, m)) delete state.customMeals[k];
      swapMeal(d, m);
    }
    else if (act === 'custom' || act === 'editCustom') openCustom(d, m);
    else if (act === 'skip') {
      state.skips[k] = true;
      delete state.eaten[k];
      save(); renderAll();
      toast('이 끼니는 배달·외식으로 표시했어요');
    } else if (act === 'unskip') {
      delete state.skips[k];
      save(); renderAll();
      toast('스킵을 되돌렸어요');
    } else if (act === 'eat') {
      openEat(d, m);
    } else if (act === 'uneat') {
      delete state.eaten[k];
      save(); renderAll();
      toast('먹은 기록을 되돌렸어요 · 재료 체크는 소진 탭에서 조정');
    }
  });

  $('fabAdd').addEventListener('click', function () { openEditor('add'); });

  /* 시트 내부 */
  segLoc.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-val]');
    if (!b) return;
    editor.loc = b.getAttribute('data-val');
    segSet(segLoc, editor.loc);
  });

  segUrg.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-val]');
    if (!b) return;
    editor.urg = b.getAttribute('data-val');
    segSet(segUrg, editor.urg);
  });

  quickAdd.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-quick]');
    if (!b) return;
    fName.value = b.getAttribute('data-quick');
    fName.focus();
  });

  ingSave.addEventListener('click', saveEditor);
  $('ingCancel').addEventListener('click', function () { closeSheets(); });
  ingDelete.addEventListener('click', deleteEditor);
  fName.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); saveEditor(); } });
  fName.addEventListener('input', function () { if (!editor.emoji) renderEmoPick(); });

  fEmo.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-emo]');
    if (!b) return;
    var emo = b.getAttribute('data-emo');
    editor.emoji = emo === emojiFor(fName.value.trim()) ? null : emo;
    renderEmoPick();
  });

  eatConfirm.addEventListener('click', confirmEat);
  $('eatCancel').addEventListener('click', function () { closeSheets(); });

  cList.addEventListener('change', function (e) {
    var box = e.target;
    if (!box || box.type !== 'checkbox') return;
    customSel[box.value] = box.checked;
    updateCustomCount();
    renderSelBar();
  });

  /* 선택 태그 ✕ → 바로 해제 */
  cTags.addEventListener('click', function (e) {
    var t = e.target.closest('[data-unsel]');
    if (!t) return;
    toggleCustomSel(t.getAttribute('data-unsel'), false);
  });

  /* 추천 칩 → 즉시 추가 */
  cRecs.addEventListener('click', function (e) {
    var c = e.target.closest('[data-pick]');
    if (!c) return;
    toggleCustomSel(c.getAttribute('data-pick'), true);
  });

  cSearch.addEventListener('input', renderCustomList);
  $('customSave').addEventListener('click', saveCustom);
  $('customCancel').addEventListener('click', function () { closeSheets(); });
  cName.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); saveCustom(); } });

  $('menuBtn').addEventListener('click', function () { openSheet(menuSheet); });

  $('menuReplan').addEventListener('click', function () { closeSheets(); replanAll(); });

  $('menuGoPantry').addEventListener('click', function () {
    closeSheets();
    setTab('pantry');
  });

  $('menuReset').addEventListener('click', function () {
    var btn = $('menuReset');
    if (!resetArmed) {
      resetArmed = true;
      btn.innerHTML = '⚠️ 정말 초기화할까요?<em>한 번 더 누르면 처음 상태로 돌아가요</em>';
      return;
    }
    resetArmed = false;
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    state = freshState();
    state.plan = buildPlan(state);
    save();
    closeSheets();
    ui.filter = 'all';
    ui.hideDone = false;
    setTab('pantry');
    ensurePlan();
    renderAll();
    toast('처음 상태로 초기화했어요');
  });

  scrim.addEventListener('click', function () { closeSheets(); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSheets();
  });

  /* 다른 탭·창에서 상태가 바뀌면 다시 그리기 */
  window.addEventListener('storage', function (e) {
    if (e.key === STORE_KEY) {
      state = loadState();
      renderAll();
    }
  });

  /* 위젯 커맨드(reset / replan) 수신 */
  window.addEventListener('message', function (e) {
    var cmd = '';
    if (typeof e.data === 'string') cmd = e.data.trim();
    else if (e.data && typeof e.data.command === 'string') cmd = e.data.command.trim();
    if (cmd === 'reset') window.fridgeRescue.reset();
    else if (cmd === 'replan') window.fridgeRescue.replan();
  });

  function ensurePlan() {
    if (!state.plan || !state.plan.today || !state.plan.tomorrow) {
      state.plan = buildPlan(state);
      save();
    }
  }

  /* =========================================================
     시작
     ========================================================= */
  quickAdd.innerHTML = '<span class="quick-label">장 본 재료 빠르게 담기</span>' +
    QUICK_ADD.map(function (q) {
      return '<button type="button" data-quick="' + esc(q) + '">' + esc(q) + '</button>';
    }).join('');

  ensurePlan();
  renderAll();
  save();

  /* 위젯 커맨드 훅 (reset / replan) */
  window.fridgeRescue = {
    reset: function () {
      try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      state = freshState();
      state.plan = buildPlan(state);
      save();
      ui.filter = 'all';
      ui.hideDone = false;
      renderAll();
      toast('처음 상태로 초기화했어요');
    },
    replan: function () { replanAll(); }
  };
})();
</script>
</body>
</html>
