  var OUT_ART = {
    meat: artMeat, soup: artSoup, noodle: artNoodle, pieces: artPieces,
    round: artRound, bread: artBread, drink: artDrink,
    salad: artBowl, bowl: artBowl
  };

  function paintFoodArt(info, v) {
    if (!outPlateWrap) return;
    var fn = OUT_ART[info.cat] || artBowl;
    var art = fn(v, info.sub, info.label);
    var name = (info.label || '먹은 양') + ' ' + outX(v);
    outPlateWrap.innerHTML = '<svg class="plate-svg" viewBox="0 0 120 120" role="img" aria-label="' + esc(name) + '"><g class="plate-food">' + art + '</g></svg>';
  }

  /* ── 먹은 양 배율 — 접시 그림과 칼로리 계산을 함께 움직인다 ── */
  var OUT_PORTION_MIN = 0.25, OUT_PORTION_MAX = 2.5;

  function outPortionName(v) {
    v = Number(v) || 1;
    if (v <= 0.4) return '아주 조금';
    if (v < 0.9) return '조금';
    if (v <= 1.1) return '보통';
    if (v < 1.9) return '넉넉히';
    return '많이';
  }

  function outFx(v) {
    var n = Math.round((Number(v) || 1) * 4) / 4;
    return Math.max(OUT_PORTION_MIN, Math.min(OUT_PORTION_MAX, n));
  }

  function outX(v) { return String(Number(v).toFixed(2)).replace(/\.?0+$/, '') + '×'; }

  /* 항목을 지금 배율로 환산한다 (저장은 1× 기준값으로 하고, 보여줄 때만 곱한다) */
  function outScaled(list) {
    var f = outPortion;
    return (list || []).map(function (x) {
      return {
        label: x.label, qty: x.qty, unit: x.unit,
        kcal: Math.round((x.kcal || 0) * f),
        c: outRound((x.c || 0) * f),
        p: outRound((x.p || 0) * f),
        f: outRound((x.f || 0) * f)
      };
    });
  }

  function paintPortion() {
    var v = outPortion;
    var info = outFoodCategory();
    var guide = FOOD_GUIDE[info.cat] || FOOD_GUIDE.bowl;
    var meta = info.item ? outFoodMeta(info.item.label) : null;
    var words = outItems.length ? guide.words : ['조금', '보통', '넉넉히', '많이'];
    var steps = [0.5, 1, 1.5, 2];
    var si = steps.indexOf(v);
    var word = si >= 0 && outItems.length ? words[si] : outPortionName(v);
    if (outPortionVal) outPortionVal.textContent = word + ' · ' + outX(v);
    if (outPortionRange) {
      outPortionRange.value = v;
      var p = Math.round((v - OUT_PORTION_MIN) / (OUT_PORTION_MAX - OUT_PORTION_MIN) * 100);
      outPortionRange.style.setProperty('--p', p + '%');
    }
    if (outPortionPct) outPortionPct.innerHTML = outX(v) + '<small>' + outPortionName(v) + '</small>';
    if (outPortionChips) {
      var btns = outPortionChips.querySelectorAll('[data-portion]');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('is-on', Math.abs(+btns[i].getAttribute('data-portion') - v) < 0.01);
        var wb = btns[i].querySelector('b'), we = btns[i].querySelector('em');
        if (wb && words[i]) wb.textContent = words[i];
        if (we) we.textContent = outX(steps[i]);
      }
    }
    if (outPortionHint) {
      outPortionHint.innerHTML = outItems.length
        ? '보통 1인분(<b>' + esc(guide.one(info.label, meta)) + '</b>) 기준이에요. 그림에서 진하게 칠한 만큼이 드신 양이에요.'
        : '메뉴를 적으면 그 음식의 1인분 모양이 여기 떠요. 그림에서 먹은 만큼을 고르면 칼로리도 함께 줄어요.';
    }
    if (outPlateWrap) outPlateWrap.classList.toggle('is-empty', !outItems.length);
    paintFoodArt(info, v);
  }

  function setPortion(v) {
    outPortion = outFx(v);
    renderOut();
  }

  function renderOut() {
    if (!outItems.length) {
      outList.innerHTML = '<p class="out-none">메뉴를 적으면 항목별 칼로리·탄단지를 바로 계산해요.</p>';
      outTotal.hidden = true;
      outSave.disabled = true;
      paintPortion();
      return;
    }
    var view = outScaled(outItems);
    outList.innerHTML = view.map(function (x, i) {
      return '<div class="out-item">' +
        '<div class="out-name"><b>' + esc(x.label) + '</b>' +
          '<em>' + esc(String(x.qty).replace(/\.0$/, '') + x.unit) + ' · ' + x.kcal + 'kcal · 단 ' + g1(x.p) + 'g</em>' +
        '</div>' +
        '<div class="step">' +
          '<button type="button" data-outq="-1" data-oi="' + i + '" aria-label="한 단위 줄이기">−</button>' +
          '<span class="step-num">' + esc(String(x.qty).replace(/\.0$/, '')) + '</span>' +
          '<button type="button" data-outq="1" data-oi="' + i + '" aria-label="한 단위 늘리기">+</button>' +
        '</div>' +
        '<button type="button" class="out-x" data-outdel="' + i + '" aria-label="' + esc(x.label) + ' 빼기">✕</button>' +
      '</div>';
    }).join('');

    var t = outTotals(view);
    outTotal.hidden = false;
    outKcal.textContent = fmtN(t.kcal) + 'kcal';
    outMacro.textContent = '탄 ' + g1(t.c) + 'g · 단 ' + g1(t.p) + 'g · 지 ' + g1(t.f) + 'g';

    var day = outTarget ? outTarget.day : 'today';
    var dm = dayMacros(day);
    var g = goals();
    var leftP = Math.round(g.p - (dm.p + t.p));
    var leftC = Math.round(dm.kcal + t.kcal);
    outGap.textContent = leftP > 0
      ? '이 끼니까지 넣으면 단백질 ' + leftP + 'g 더 필요해요'
      : '이 끼니까지 넣으면 ' + fmtN(leftC) + 'kcal · 단백질은 다 채워요';
    outSave.disabled = false;
    paintPortion();
  }

  function openOutside(day, meal) {
    outTarget = { day: day, meal: meal, key: slotKey(day, meal) };
    var ex = outsideOf(day, meal);
    outSub.textContent = (meal === 'lunch' ? '점심' : '저녁') + '에 먹은 외식을 적으면 메뉴별 칼로리·탄단지를 계산해서 오늘 목표에 더해요.';
    outText.value = '';
    outPortion = ex && ex.portion ? outFx(ex.portion) : 1;
    outPhotoData = ex && ex.photo ? String(ex.photo) : '';
    paintPhoto();
    outItems = ex && ex.items ? ex.items.map(function (x) {
      return { label: x.label, qty: x.qty, unit: x.unit, kcal: x.kcal, c: x.c, p: x.p, f: x.f, guess: false };
    }) : [];
    renderOut();
    openSheet(outSheet);
    setTimeout(function () { if (outText && outText.focus) outText.focus(); }, 320);
  }

  function saveOutside() {
    if (!outTarget || !outItems.length) return;
    var key = outTarget.key;
    var t = outTotals(outScaled(outItems));
    var names = outItems.map(function (x) { return x.label; });
    var name = names.slice(0, 2).join(' · ') + (names.length > 2 ? ' 외 ' + (names.length - 2) : '');
    if (!state.outside) state.outside = {};
    state.outside[key] = {
      name: name,
      items: outItems.map(function (x) { return { label: x.label, qty: x.qty, unit: x.unit, kcal: x.kcal, c: x.c, p: x.p, f: x.f }; }),
      kcal: t.kcal, c: t.c, p: t.p, f: t.f,
      portion: outPortion
    };
    if (outPhotoData) state.outside[key].photo = outPhotoData;
    state.skips[key] = true;
    delete state.eaten[key];
    save();
    var kept = !!(state.outside && state.outside[key] && (!outPhotoData || state.outside[key].photo));
    closeSheets();
    outTarget = null;
    outItems = [];
    outPhotoData = '';
    renderAll();
    toast('외식 ' + fmtN(t.kcal) + 'kcal · 단 ' + g1(t.p) + 'g 기록했어요');
    if (!kept) setTimeout(function () { toast('사진은 저장 공간이 부족해 남기지 못했어요'); }, 1900);
  }

  /* ── 외식 사진: 폰에서 고른 사진을 480px JPEG로 줄여 기기에만 보관한다 ── */
  function compressPhoto(file, done) {
    if (!file) { done(null); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        try {
          var w = img.naturalWidth || img.width || 0;
          var h = img.naturalHeight || img.height || 0;
          if (!w || !h) { done(null); return; }
          var sc = Math.min(1, 480 / w);
          var cw = Math.max(1, Math.round(w * sc));
          var ch = Math.max(1, Math.round(h * sc));
          var cv = document.createElement('canvas');
          cv.width = cw; cv.height = ch;
          var ctx = cv.getContext('2d');
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, cw, ch);
          ctx.drawImage(img, 0, 0, cw, ch);
          done(cv.toDataURL('image/jpeg', 0.65));
        } catch (err) { done(null); }
      };
      img.onerror = function () { done(null); };
      img.src = String(reader.result);
    };
    reader.onerror = function () { done(null); };
    reader.readAsDataURL(file);
  }

  function paintPhoto() {
    var has = !!outPhotoData;
    if (outPhotoPrev) outPhotoPrev.hidden = !has;
    if (outPhotoImg && has) outPhotoImg.src = outPhotoData;
    if (outPhotoPickTxt) outPhotoPickTxt.textContent = has ? '📷 사진 바꾸기' : '📷 사진 남기기';
  }

  function openPhotoModal(src) {

    photoModal.classList.add('is-open');

  /* ── 먹음 시트 ── */
  /* 남은 양을 퍼센트로 보여주는 한 줄 */
  function pctEatText(it, next) {
    var cur = it.done ? 0 : pctOf(it);
    return cur + '% 남음 → ' + (next <= 0 ? '다 씀' : next + '% 남아요');
  }

  function openEat(day, meal) {
    var k = slotKey(day, meal);
    var r = mealRecipe(day, meal);
    if (!r) return;
    eatTarget = { day: day, meal: meal, key: k, recipe: r };
    eatQty = {};
    eatMode = {};
    eatPct = {};

    var rows = r.uses.map(function (id) { return byId(id); }).filter(Boolean);
    rows.sort(function (a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      return URG[a.urg].order - URG[b.urg].order;
    });

    eatSub.textContent = r.name + ' — 먹은 만큼 남은 양을 맞춰주세요. 그대로 두면 안 쓴 걸로 남아요.';

    eatList.innerHTML = rows.map(function (it) {
      if (it.done) {
        return '<div class="eat-row is-done">' +
          '<span class="eat-check">✓</span>' +
          '<span class="eat-name"><span class="emo">' + emojiOf(it) + '</span>' + esc(it.name) + '</span>' +
          '<span class="badge ' + URG[it.urg].cls + '">이미 처리</span>' +
        '</div>';
      }
      if (isPctItem(it)) {
        var cur = pctOf(it);
        var def = cur >= 100 ? 50 : Math.max(0, Math.round(cur / 2 / 5) * 5);
        eatPct[it.id] = def;
        var quick = [100, 75, 50, 25, 0].map(function (v) {
          return '<button type="button" class="eq' + (v === def ? ' is-on' : '') + '" data-eatp="' + esc(it.id) + '" data-v="' + v + '">' + v + '%</button>';
        }).join('');
        return '<div class="eat-row eat-pct" data-eatrow="' + esc(it.id) + '">' +
          '<div class="eat-top">' +
            '<span class="eat-name"><span class="emo">' + emojiOf(it) + '</span>' + esc(it.name) + '</span>' +
            '<span class="eat-sub" data-eatstate="' + esc(it.id) + '">' + esc(pctEatText(it, def)) + '</span>' +
          '</div>' +
          '<div class="pctrow">' +
            '<input type="range" min="0" max="100" step="5" value="' + def + '" style="--p:' + def + '%"' +
              ' data-eatpct="' + esc(it.id) + '" aria-label="' + esc(it.name) + ' 남은 양">' +
            '<span class="pctval" data-eatpctv="' + esc(it.id) + '">' + def + '%<small>' + pctLabel(def) + '</small></span>' +
          '</div>' +
          '<div class="eat-quick">' + quick + '</div>' +
        '</div>';
      }
      eatQty[it.id] = 1;
      return '<div class="eat-row eat-qty" data-eatrow="' + esc(it.id) + '">' +
        '<div class="eat-top">' +
          '<span class="eat-name"><span class="emo">' + emojiOf(it) + '</span>' + esc(it.name) + '</span>' +
          '<span class="eat-sub" data-eatstate="' + esc(it.id) + '">' + esc(countText(it) + ' 남음') + '</span>' +
        '</div>' +
        '<div class="eat-ctrl">' +
          '<div class="step">' +
            '<button data-eat="dec" data-id="' + esc(it.id) + '" aria-label="' + esc(it.name) + ' 한 번 덜 쓰기">−</button>' +
            '<span class="step-num" data-eatnum="' + esc(it.id) + '">1<small>' + esc(unitOf(it)) + '</small></span>' +
            '<button data-eat="inc" data-id="' + esc(it.id) + '" aria-label="' + esc(it.name) + ' 한 개 더 쓰기">+</button>' +
          '</div>' +
          '<button type="button" class="emode some" data-eat="some" data-id="' + esc(it.id) + '">반 개 <em>먹음</em></button>' +
          '<button type="button" class="emode all finish-all" data-eat="all" data-id="' + esc(it.id) + '">다 먹음</button>' +
        '</div>' +
      '</div>';
    }).join('');

    if (!rows.length) {
      eatList.innerHTML = '<div class="empty"><p>' + (r.custom ? '고른 재료가 없어요.<br>먹은 기록만 남길 수 있어요.' : '이 레시피에 연결된 재료가 없어요.') + '</p></div>';
    }

    openSheet(eatSheet);
  }

  /* 퍼센트 행 다시 칠하기 */
  function paintEatPct(id) {
    var it = byId(id);
    if (!it) return;
    var v = eatPct[id] == null ? pctOf(it) : eatPct[id];
    var row = eatList.querySelector('[data-eatrow="' + id + '"]');
    if (!row) return;
    var slider = row.querySelector('[data-eatpct]');
    if (slider) { slider.value = v; slider.style.setProperty('--p', v + '%'); }
    var lab = row.querySelector('[data-eatpctv]');
    if (lab) lab.innerHTML = v + '%<small>' + pctLabel(v) + '</small>';
    var sub = row.querySelector('[data-eatstate="' + id + '"]');
    if (sub) sub.textContent = pctEatText(it, v);
    var qb = row.querySelectorAll('[data-eatp]');
    for (var i = 0; i < qb.length; i++) {
      qb[i].classList.toggle('is-on', +qb[i].getAttribute('data-v') === v);
    }
  }

  function confirmEat() {
    if (!eatTarget) return;
    var parts = [];
    var usedIds = [];
    var finished = [];
    var shareCount = 0;

    /* 퍼센트 재료: 슬라이더로 남긴 양만큼만 차감 */
    Object.keys(eatPct).forEach(function (id) {
      var it = byId(id);
      if (!it || it.done) return;
      var cur = pctOf(it);
      var next = eatPct[id];
      if (next == null || next >= cur) return;
      setPct(it, next);
      it.used = (it.used || 0) + 1;
      usedIds.push(it.id);
      if (it.done) {
        finished.push(it);
        parts.push(emojiOf(it) + ' ' + it.name + ' 다 씀');
      } else {
        shareCount++;
        parts.push(emojiOf(it) + ' ' + it.name + ' ' + next + '% 남김');
      }
    });

    /* 개수 재료: −/+로 정한 양(0.5 단위)만큼 차감, 0이면 처리 완료 */
    Object.keys(eatQty).forEach(function (id) {
      var item = byId(id);
      if (!item || item.done || !isCountable(item)) return;
      var n = Math.min(eatQty[id] || 0, item.count);
      if (!n || n <= 0) return;
      item.count = Math.round((item.count - n) * 2) / 2;
      usedIds.push(item.id);
      parts.push(emojiOf(item) + ' ' + item.name + ' ' + (n < 1 ? '소량' : amountText(n, unitOf(item))));
      if (item.count <= 0) {
        item.count = 0;
        item.done = true;
        if (item.pct != null) item.pct = 0;
        finished.push(item);
        parts[parts.length - 1] = emojiOf(item) + ' ' + item.name + ' 다 먹음';
      }
    });

    if (usedIds.length >= 2) recordHistory(usedIds);

    state.eaten[eatTarget.key] = true;
    delete state.skips[eatTarget.key];
    if (state.outside) delete state.outside[eatTarget.key];

    /* 이 끼니에서 소진 처리한 재료 → 아직 안 먹은 다른 끼니는 대체 레시피로 자동 교체 */
    var swapped = 0;
    finished.forEach(function (it) { swapped += swapOutIngredient(it.id).swapped; });

    save();
    closeSheets();
    eatTarget = null;
    eatQty = {};
    eatMode = {};
    eatPct = {};
    renderAll();

    var msg = parts.length ? parts.join(' · ') + ' 기록했어요' : '먹은 기록만 남겼어요';
    if (finished.length) {
      var names = finished.map(function (it) { return emojiOf(it) + ' ' + it.name; }).join(' · ');
      msg = names + ' 소진 완료' + (swapped ? ' · 안 먹은 끼니 ' + swapped + '개 자동 교체' : '');
      if (shareCount) msg += ' · 일부 남긴 재료 ' + shareCount + '개';
    }
    toast(msg);
  }

  /* =========================================================
     하루 영양 목표 — 목적별 프리셋 + 직접 조정(칼로리·비율)
     ========================================================= */
  var GOAL_PRESETS = [
    { id: 'balance', title: '균형 유지', sub: '두 끼로 무난하게', kcal: 1800, c: 225, p: 90, f: 60 },
    { id: 'lean', title: '단백질 집중·감량', sub: '칼로리는 낮추고 단백질을 올려요', kcal: 1500, c: 150, p: 105, f: 53 },
    { id: 'active', title: '활동량 많음·유지', sub: '운동하거나 많이 움직이는 날', kcal: 2000, c: 250, p: 100, f: 67 }
  ];

  function goalDraft() {
    var kcal = Math.round(+gKcal.value || 0) || 1800;
    kcal = Math.max(1000, Math.min(4000, kcal));
    return {
      kcal: kcal,
      c: Math.round(kcal * goalRatio.c / 100 / 4),
      p: Math.round(kcal * goalRatio.p / 100 / 4),
      f: Math.round(kcal * goalRatio.f / 100 / 9)
    };
  }

  function paintGoalSheet() {
    if (rC) rC.value = goalRatio.c;
    if (rP) rP.value = goalRatio.p;
    if (rF) rF.value = goalRatio.f;
    var d = goalDraft();
    vC.innerHTML = '<b>' + goalRatio.c + '%</b>' + d.c + 'g';
    vP.innerHTML = '<b>' + goalRatio.p + '%</b>' + d.p + 'g';
    vF.innerHTML = '<b>' + goalRatio.f + '%</b>' + d.f + 'g';
    gCalc.innerHTML = '하루 <b>' + fmtN(d.kcal) + 'kcal</b> · 탄수화물 ' + d.c + 'g · 단백질 ' + d.p + 'g · 지방 ' + d.f + 'g';
    if (gPresets) {
      var cur = goals();
      var btns = gPresets.querySelectorAll('[data-preset]');
      for (var i = 0; i < btns.length; i++) {
        var pid = btns[i].getAttribute('data-preset');
        var pre = null;
        GOAL_PRESETS.forEach(function (x) { if (x.id === pid) pre = x; });
        btns[i].classList.toggle('is-on', !!pre && pre.kcal === cur.kcal && pre.c === cur.c && pre.p === cur.p && pre.f === cur.f);
      }
    }
  }

  function setGoalRatio(key, val) {
    var others = ['c', 'p', 'f'].filter(function (k) { return k !== key; });
    val = Math.max(10, Math.min(70, Math.round(val)));
    var rest = 100 - val;
    var sum = (goalRatio[others[0]] + goalRatio[others[1]]) || 1;
    var a = Math.round(rest * goalRatio[others[0]] / sum);
    a = Math.max(10, Math.min(rest - 10, a));
    goalRatio[key] = val;
    goalRatio[others[0]] = a;
    goalRatio[others[1]] = rest - a;
    paintGoalSheet();
  }

  function openGoal() {
    if (!goalSheet) return;
    var g = goals();
    gKcal.value = g.kcal;
    var kc = g.c * 4 + g.p * 4 + g.f * 9;
    if (kc > 0) {
      var c = Math.round(g.c * 4 / kc * 100);
      var p = Math.round(g.p * 4 / kc * 100);
      goalRatio = { c: c, p: p, f: Math.max(10, 100 - c - p) };
    } else {
      goalRatio = { c: 50, p: 20, f: 30 };
    }
    gPresets.innerHTML = GOAL_PRESETS.map(function (x) {
      return '<button type="button" class="preset" data-preset="' + x.id + '">' +
        '<span class="preset-t">' + esc(x.title) + '</span>' +
        '<span class="preset-m">' + esc(x.sub) + '</span>' +
        '<span class="preset-g"><b>' + fmtN(x.kcal) + 'kcal</b> · 탄 ' + x.c + 'g · 단 ' + x.p + 'g · 지 ' + x.f + 'g</span>' +
      '</button>';
    }).join('');
    gAcc.classList.remove('is-open');
    $('gAccHead').setAttribute('aria-expanded', 'false');
    paintGoalSheet();
    openSheet(goalSheet);
  }

  function applyGoalPreset(id) {
    var pre = null;
    GOAL_PRESETS.forEach(function (x) { if (x.id === id) pre = x; });
    if (!pre) return;
    state.goals = normalizeGoals({ kcal: pre.kcal, c: pre.c, p: pre.p, f: pre.f });
    save();
    closeSheets();
    renderAll();
    toast(pre.title + ' 목표로 바꿨어요 · ' + fmtN(pre.kcal) + 'kcal');
  }

  function saveGoal() {
    var d = goalDraft();
    state.goals = normalizeGoals({ kcal: d.kcal, c: d.c, p: d.p, f: d.f });
    save();
    closeSheets();
    renderAll();
    toast('하루 목표를 ' + fmtN(d.kcal) + 'kcal · 탄 ' + d.c + ' · 단 ' + d.p + ' · 지 ' + d.f + 'g으로 저장했어요');
  }

  /* 잔량 슬라이더 — 끄는 동안에는 그 행만 갱신하고, 놓으면 목록을 다시 그린다 */
  listEl.addEventListener('input', function (e) {
    var s = e.target.closest('[data-pct]');
    if (!s) return;
    var it = byId(s.getAttribute('data-pct'));
    if (!it) return;
    setPct(it, +s.value);
    save();
    var p = pctOf(it);
    var lab = listEl.querySelector('[data-pctv="' + it.id + '"]');
    if (lab) lab.innerHTML = p + '%<small>' + pctLabel(p) + '</small>';
    var row = s.closest('.item');
    if (row) {
      row.classList.toggle('is-done', it.done);
      /* 일부만 남았을 때만 '다 먹음' 버튼을 붙인다 (행을 다시 그리지 않아 드래그가 끊기지 않게) */
      var fin = row.querySelector('.finish-btn');
      var need = !it.done && p > 0 && p < 100;
      if (need && !fin) {
        var btn = document.createElement('button');
        btn.className = 'finish-btn';
        btn.setAttribute('data-act', 'finish');
        btn.setAttribute('data-id', it.id);
        btn.setAttribute('aria-label', it.name + ' 다 먹음 처리');
        btn.textContent = '다 먹음';
        var top = row.querySelector('.item-top');
        if (top) top.appendChild(btn);
      } else if (!need && fin) {
        fin.parentNode.removeChild(fin);
      }
    }
    var lab2 = listEl.querySelector('[data-pctv="' + it.id + '"]');
    if (lab2) lab2.classList.toggle('dim', p === 0);
    renderDash();
    renderMeals();
    renderLeftover();
  });

  listEl.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var id = btn.getAttribute('data-id');
    var act = btn.getAttribute('data-act');

    /* 개수 스테퍼: 2개 → 1개 → 소량 → 다 씀, 숫자를 누르면 반 개(소량) 표시를 켜고 끈다 */
    if (act === 'dec' || act === 'inc' || act === 'part') {
      var cit = byId(id);
      if (!cit || !isCountable(cit)) return;
      var cem = emojiOf(cit), cnm = cit.name, cun = unitOf(cit);
      var chalf = hasPartial(cit);

      if (act === 'part') {
        if (cit.done) return;
        if (chalf) {
          if (cit.count <= 0.5) {
            cit.count = 1;
            toast(cem + ' ' + cnm + ' 1' + cun + roParticle(cun) + ' 되돌렸어요');
          } else {
            cit.count = Math.round((cit.count - 0.5) * 2) / 2;
            toast(cem + ' ' + cnm + ' ' + amountText(cit.count, cun) + ' 남음 · 소량 표시를 뺐어요');
          }
        } else {
          cit.count = Math.round((cit.count + 0.5) * 2) / 2;
          toast(cem + ' ' + cnm + ' ' + amountText(cit.count, cun) + ' 남음 · 반 ' + cun + '까지 표시했어요');
        }
      } else if (act === 'dec') {
        if (cit.done || cit.count <= 0) return;
        if (chalf) {
          cit.count = Math.round((cit.count - 0.5) * 2) / 2;
          if (cit.count <= 0) {
            cit.count = 0;
            cit.done = true;
            toast(cem + ' ' + cnm + ' 다 씀 · 처리 완료');
          } else {
            toast(cem + ' ' + cnm + ' ' + amountText(cit.count, cun) + ' 남음');
          }
        } else if (cit.count > 1) {
          cit.count -= 1;
          toast(cem + ' ' + cnm + ' 1' + cun + ' 차감 · ' + amountText(cit.count, cun) + ' 남음');
        } else {
          cit.count = 0.5;
          toast(cem + ' ' + cnm + ' 소량 남음 · 한 번 더 − 하면 다 씀');
        }
      } else {
        if (chalf) {
          cit.count = Math.round((cit.count + 0.5) * 2) / 2;
          toast(cem + ' ' + cnm + ' ' + amountText(cit.count, cun) + ' 남았어요');
        } else if (cit.done || cit.count <= 0) {
          cit.count = 1;
          cit.done = false;
          toast(cem + ' ' + cnm + ' 다시 ' + amountText(1, cun) + ' 남았어요');
        } else {
          cit.count += 1;
          toast(cem + ' ' + cnm + ' +1 · ' + amountText(cit.count, cun) + ' 남음');
        }
      }
      save();
      renderDash();
      renderLeftover();
      renderList();
      renderMeals();
      return;
    }

    if (act === 'finish') {
      /* 소량 → 다 먹음(소진) */

      if (!fit) return;
      var fem = emojiOf(fit), fnm = fit.name;
      fit.done = true;
      fit.used = 0;
      fit.pct = 0;
      if (isCountable(fit)) { fit.count = 0; fit.partial = false; }
      var fres = swapOutIngredient(fit.id);
      save();
      renderAll();
      if (fres.swapped) toast(fem + ' ' + fnm + ' 소진 완료! 안 먹은 끼니 ' + fres.swapped + '개를 다른 메뉴로 바꿨어요');
      else toast(fem + ' ' + fnm + ' 소진 완료로 옮겼어요');
      return;
    }

    if (act === 'toggle') {
      var it = byId(id);
      if (!it) return;
      it.done = !it.done;
      save();
      renderDash();
      renderList();
      renderMeals();
      if (it.done) toast(emojiOf(it) + ' ' + it.name + ' 처리 완료');
      return;
    }
    if (act === 'edit') openEditor('edit', id);
  });

  /* 먹음 시트 개수 재료 줄 — 고른 양(0.5 단위)을 화면에 반영 */
  function paintEatRow(id) {
    var it = byId(id);
    if (!it || !isCountable(it)) return;
    var qty = eatQty[id] == null ? 0 : eatQty[id];
    var row = eatList.querySelector('[data-eatrow="' + id + '"]');
    if (!row) return;
    var half = Math.abs(qty - Math.round(qty)) > 0.001;
    var isPart = qty > 0 && qty < 1;
    var num = row.querySelector('[data-eatnum="' + id + '"]');
    if (num) {
      num.innerHTML = qty <= 0
        ? '0'
        : (isPart ? '소량' : Math.floor(qty + 0.001) + '<small>' + esc(unitOf(it)) + '</small>' + (half ? ' 반' : ''));
      num.classList.toggle('is-partial', qty > 0 && (isPart || half));
    }
    var step = row.querySelector('.step');
    if (step) step.classList.toggle('is-partial', qty > 0 && (isPart || half));
    var some = row.querySelector('[data-eat="some"]');
    if (some) some.classList.toggle('is-on', Math.abs(qty - 0.5) < 0.001);
    var all = row.querySelector('[data-eat="all"]');
    if (all) all.classList.toggle('is-on', Math.abs(qty - it.count) < 0.001);
    row.classList.toggle('is-done', qty <= 0);
    var sub = row.querySelector('[data-eatstate="' + id + '"]');
    if (sub) {
      var left = Math.round((it.count - qty) * 2) / 2;
      sub.textContent = countText(it) + ' 남음 → ' + (left > 0 ? amountText(left, unitOf(it)) + ' 남아요' : '다 씀');
    }
  }

  /* 먹음 시트 안의 퍼센트 슬라이더·빠른 버튼과 개수 스테퍼 */
  eatList.addEventListener('input', function (e) {
    var s = e.target.closest('[data-eatpct]');
    if (!s) return;
    var id = s.getAttribute('data-eatpct');
    eatPct[id] = Math.max(0, Math.min(100, Math.round(+s.value / 5) * 5));
    paintEatPct(id);
  });
  eatList.addEventListener('click', function (e) {
    var q = e.target.closest('[data-eatp]');
    if (q) {
      var qid = q.getAttribute('data-eatp');
      eatPct[qid] = +q.getAttribute('data-v');
      paintEatPct(qid);
      return;
    }

    var b = e.target.closest('[data-eat]');
    if (!b) return;
    var id = b.getAttribute('data-id');
    var it = byId(id);
    if (!it || !isCountable(it)) return;
    var act = b.getAttribute('data-eat');

    /* 다 먹음 → 남은 양 전부 소진 */
    if (act === 'all') {
      eatQty[id] = it.count;
      paintEatRow(id);
      toast(emojiOf(it) + ' ' + it.name + ' ' + amountText(it.count, unitOf(it)) + ' 전부 소진으로 잡았어요');
      return;
    }

    var cur = eatQty[id] == null ? 1 : eatQty[id];
    var next;
    if (act === 'some') {
      next = 0.5;
    } else if (act === 'inc') {
      next = cur < 1 ? 1 : cur + 1;
    } else {
      if (cur <= 0.5) next = 0;
      else if (cur <= 1) next = 0.5;
      else if (Math.abs(cur - Math.round(cur)) > 0.001) next = Math.floor(cur);
      else next = cur - 1;
    }
    next = Math.max(0, Math.min(Math.round(next * 2) / 2, it.count));
    eatQty[id] = next;
    paintEatRow(id);
  });

    var actBtn = e.target.closest('[data-act]');
    if (!actBtn) return;
    var card = actBtn.closest('.meal-card');
    if (!card) return;
    var d = card.getAttribute('data-day');
    var m = card.getAttribute('data-meal');
    var k = slotKey(d, m);
    var act = actBtn.getAttribute('data-act');

    if (act === 'warn') {
      var wbox = actBtn.closest('[data-wsum]');
      if (!wbox) return;
      var wOpen = !(ui.warnOpen[k]);
      ui.warnOpen[k] = wOpen;
      wbox.classList.toggle('is-open', wOpen);
      actBtn.classList.toggle('is-open', wOpen);
      actBtn.setAttribute('aria-expanded', wOpen ? 'true' : 'false');
      var wDet = wbox.querySelector('.wsum-detail');
      if (wDet) wDet.hidden = !wOpen;
      return;
    }
    if (act === 'expand') {
      ui.openMeal[k] = !ui.openMeal[k];
      renderMeals();
      return;
    }
    if (act === 'swap') {
      if (customMeal(d, m)) delete state.customMeals[k];
      swapMeal(d, m);
    }
    else if (act === 'recipe') openRecipe(d, m);
    else if (act === 'addIng') openPick(d, m);
    else if (act === 'trimGone') trimGoneFrom(d, m);
    else if (act === 'fixGone') {
      var rep = pickReplacement(d, m);
      if (!rep) { toast('소진된 재료 없이 만들 수 있는 메뉴가 없어요'); return; }
      planOf(d)[m] = rep.id;
      clearMealUses(d, m);
      save();
      renderAll();
      toast('소진된 재료 없이 만드는 메뉴로 바꿨어요');
    }
    else if (act === 'custom' || act === 'editCustom') openCustom(d, m);
    else if (act === 'skip') {
      openOutside(d, m);
    } else if (act === 'unskip') {
      delete state.skips[k];
      if (state.outside) delete state.outside[k];
      save(); renderAll();

  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeSheets(); closeDeplete(); }
  });

  /* 다른 탭·창에서 상태가 바뀌면 다시 그리기 */
  window.addEventListener('storage', function (e) {
    if (e.key === STORE_KEY) {
      state = loadState();
      syncDay();
      ensurePlans();
      renderAll();
    }
  });

  /* 위젯 커맨드(reset / replan) 수신 */
  window.addEventListener('message', function (e) {
    var cmd = '';
    if (typeof e.data === 'string') cmd = e.data.trim();
    else if (e.data && typeof e.data.command === 'string') cmd = e.data.command.trim();
    if (cmd === 'reset') window.fridgeRescue.reset();
    else if (cmd === 'replan') window.fridgeRescue.replan();
  });

  function ensurePlan() {
    ensurePlans();
    save();
  }

  /* =========================================================
     시작
     ========================================================= */
  quickAdd.innerHTML = '<span class="quick-label">장 본 재료 빠르게 담기</span>' +
    QUICK_ADD.map(function (q) {
      return '<button type="button" data-quick="' + esc(q) + '">' + esc(q) + '</button>';
    }).join('');

  syncDay();
  ensurePlans();
  renderAll();
  save();

  /* 앱을 켜 둔 채 자정이 지나거나, 다음 날 다시 열었을 때
     오늘/내일 탭이 그 날짜로 넘어가고 어제 기록은 지난 기록으로 자동 이동 */
  setInterval(function () {
    if (!syncDay()) return;
    ensurePlans();
    renderAll();
    save();
  }, 30000);

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (syncDay()) {
      ensurePlans();
      renderAll();
      save();
      toast('날짜가 바뀌었어요 · 어제 기록은 📅 지난 기록에 쌓였어요');
    }
  });

  /* 위젯 커맨드 훅 (reset / replan) */
  window.fridgeRescue = {
    reset: function () {
      try { localStorage.removeItem(STORE_KEY); } catch (e) {}
      state = freshState();
      save();
      ui.filter = 'all';
      ui.hideDone = false;
      ui.day = 'today';
      histUI.view = 'calendar';
      histUI.month = null;
      histUI.day = null;
      renderAll();
      toast('처음 상태로 초기화했어요');
    },
    replan: function () { replanAll(); }
  };
})();
</script>
</body>
</html>
