<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16251F">
<title>냉장고 구조대 · 한 달 소진 프로젝트</title>
<style>
  :root{
    --bg:#F3F5F1;
    --card:#FFFFFF;
    --ink:#1B231F;
    --ink2:#4C5751;
    --sub:#7D8984;
    --line:#E8ECE7;
    --mint:#0E9F6E;
    --mint-deep:#0A7A54;
    --mint-soft:#E6F6EF;
    --red:#E5484D;
    --red-soft:#FDEDEE;
    --amber:#C07608;
    --amber-soft:#FFF5E2;
    --grey-soft:#F1F4F0;
    --shadow:0 2px 12px rgba(22,45,33,.055);
    --shadow-lg:0 14px 40px rgba(18,35,26,.16);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  html,body{height:100%}

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
  }

  button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;font-size:inherit}
  input{font-family:inherit;font-size:inherit;color:inherit}

  .app{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
  }

  /* ── 상단 바 ── */
  .topbar{
    position:sticky;
    top:0;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:14px 18px 10px;
    background:rgba(243,245,241,.92);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }
  .brand{display:flex;align-items:center;gap:9px}
  .brand-mark{
    width:34px;height:34px;border-radius:11px;
    background:#fff;box-shadow:var(--shadow);
    display:grid;place-items:center;font-size:18px;
  }
  .brand-text h1{font-size:16px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
  .brand-text p{font-size:11px;color:var(--sub);font-weight:500;margin-top:2px}
  .ghost-btn{
    width:34px;height:34px;border-radius:11px;background:#fff;
    box-shadow:var(--shadow);color:var(--ink2);
    font-size:16px;font-weight:700;line-height:1;display:grid;place-items:center;
  }
  .ghost-btn:active{transform:scale(.95)}

  /* ── 대시보드 ── */
  .dash{
    margin:4px 18px 0;
    border-radius:22px;
    padding:16px 16px 14px;
    flex:0 0 auto;
    background:linear-gradient(148deg,#15241E 0%,#213C31 62%,#28493B 100%);
    color:#fff;
    box-shadow:0 12px 28px rgba(21,38,30,.22);
    position:relative;
    overflow:hidden;
  }
  .dash::after{
    content:"";position:absolute;right:-46px;top:-58px;width:150px;height:150px;
    border-radius:50%;background:radial-gradient(circle,rgba(52,211,153,.26),transparent 70%);
    pointer-events:none;
  }
  .dash-top{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
  .ring-wrap{position:relative;width:62px;height:62px;flex:0 0 auto}
  .ring{width:62px;height:62px;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:5.5;stroke-linecap:round}
  .ring .ring-bg{stroke:rgba(255,255,255,.14)}
  .ring .ring-fg{stroke:#3EE0A6;transition:stroke-dashoffset .5s ease}
  .ring-label{
    position:absolute;inset:0;display:grid;place-items:center;
    font-size:14.5px;font-weight:800;letter-spacing:-.04em;
  }
  .ring-label small{font-size:9px;font-weight:700;opacity:.7;margin-left:1px}
  .dash-main{flex:1;min-width:0}
  .dash-eyebrow{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.62);letter-spacing:.06em}
  .dash-num{display:flex;align-items:baseline;gap:5px;margin-top:3px}
  .dash-num strong{font-size:25px;font-weight:800;letter-spacing:-.05em;line-height:1}
  .dash-num span{font-size:12px;color:rgba(255,255,255,.6);font-weight:600}
  .dash-sub{font-size:11.5px;color:rgba(255,255,255,.72);margin-top:6px;font-weight:500}

  .bar{
    margin-top:13px;height:6px;border-radius:99px;background:rgba(255,255,255,.14);
    overflow:hidden;position:relative;z-index:1;
  }
  .bar i{
    display:block;height:100%;border-radius:99px;
    background:linear-gradient(90deg,#34D399,#7EF0C4);
    transition:width .45s cubic-bezier(.4,0,.2,1);
  }

  .alert-row{
    margin-top:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    position:relative;z-index:1;
  }
  .alert-pill{
    display:inline-flex;align-items:center;gap:5px;
    font-size:12px;font-weight:800;letter-spacing:-.02em;
    padding:6px 10px;border-radius:99px;
    background:rgba(255,255,255,.13);color:#fff;
  }
  .alert-pill.hot{background:rgba(255,107,107,.22);color:#FFC9C9}
  .alert-pill.cool{background:rgba(62,224,166,.16);color:#9DF3D0}
  .urgent-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;position:relative;z-index:1}
  .urgent-chip{
    font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:8px;
    background:rgba(255,255,255,.1);color:#EAF7F1;border:1px solid rgba(255,255,255,.09);
  }
  .urgent-chip:active{background:rgba(255,255,255,.2)}

  /* ── 탭 ── */
  .tabs{
    margin:14px 18px 0;
    display:flex;gap:4px;
    background:#E7EBE5;
    padding:4px;border-radius:14px;
  }
  .tab{
    flex:1;padding:9px 6px;border-radius:11px;
    font-size:13px;font-weight:700;color:var(--ink2);
    transition:background .18s,color .18s,box-shadow .18s;
  }
  .tab.is-active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(20,40,30,.1)}
  .tab:active{transform:scale(.985)}

  .main{padding:16px 18px 8px;flex:1}
  .view.is-hidden{display:none}

  /* ── 필터 ── */
  .filters{
    display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .filters::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;padding:8px 12px;border-radius:10px;
    background:#fff;color:var(--ink2);
    font-size:12.5px;font-weight:700;white-space:nowrap;
    box-shadow:var(--shadow);border:1px solid transparent;
    transition:background .15s,color .15s,border-color .15s;
  }
  .chip.is-on{background:#1D2F27;color:#fff;border-color:#1D2F27}
  .chip:active{transform:scale(.97)}
  .chip.toggle{display:inline-flex;align-items:center;gap:6px}
  .mini-switch{
    width:26px;height:15px;border-radius:99px;background:#D7DDD6;
    position:relative;display:inline-block;transition:background .2s;
  }
  .mini-switch i{
    position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;
    background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.15);
  }
  .chip.toggle.is-on .mini-switch{background:#3EE0A6}
  .chip.toggle.is-on .mini-switch i{transform:translateX(11px)}

  /* ── 재료 리스트 ── */
  .group-head{
    display:flex;align-items:center;justify-content:space-between;
    margin:18px 2px 8px;
  }
  .group-head:first-child{margin-top:6px}
  .group-title{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ink2);letter-spacing:.01em}
  .group-title .cnt{font-size:11px;font-weight:700;color:var(--sub)}
  .group-title .cnt b{color:var(--mint-deep)}
  .group-hint{font-size:10.5px;color:var(--sub);font-weight:600}

  .item{
    display:flex;align-items:center;gap:10px;
    background:#fff;border-radius:15px;
    padding:12px 13px;margin-bottom:9px;
    box-shadow:var(--shadow);
    transition:opacity .2s,background .2s;
  }
  .item.is-done{opacity:.52;background:#FBFCFA}
  .item-main{flex:1;min-width:0;text-align:left;display:block}
  .item-name{
    display:flex;align-items:Center;gap:6px;flex-wrap:wrap;
    font-size:14px;font-weight:700;letter-spacing:-.02em;line-height:1.35;
  }
  .item.is-done .item-name{text-decoration:line-through;color:var(--sub);text-decoration-thickness:1.5px}
  .item-meta{
    display:flex;align-items:center;gap:5px;flex-wrap:wrap;
    margin-top:4px;font-size:11.5px;color:var(--sub);font-weight:500;line-height:1.4;
  }
  .item-meta .warn{color:#C2410C;font-weight:700}
  .item-meta .dot{width:3px;height:3px;border-radius:50%;background:#C9D0CB}
  .share-pill{
    display:inline-flex;align-items:center;gap:3px;
    font-size:10.5px;font-weight:800;letter-spacing:-.015em;
    color:var(--mint-deep);background:var(--mint-soft);
    border:1px solid #CDEDDE;padding:1.5px 6px;border-radius:6px;
  }
  .finish-btn{
    flex:0 0 auto;font-size:10.5px;font-weight:800;letter-spacing:-.015em;
    padding:7px 9px;border-radius:9px;white-space:nowrap;
    background:var(--mint-soft);color:var(--mint-deep);border:1px solid #BDE9D7;
    transition:background .15s,transform .12s;
  }
  .finish-btn:active{background:#D5F2E6;transform:scale(.96)}
  .mine{
    font-size:9.5px;font-weight:800;color:var(--mint-deep);
    background:var(--mint-soft);padding:1.5px 5px;border-radius:5px;letter-spacing:.02em;
  }

  .emo{font-size:14.5px;line-height:1;margin-right:1px;flex:0 0 auto}

  /* ── 개수 차감 스테퍼 ── */
  .step{
    flex:0 0 auto;display:flex;align-items:center;gap:1px;
    background:#F1F5F0;border-radius:11px;padding:2px;
  }
  .step button{
    width:27px;height:27px;border-radius:9px;
    display:grid;place-items:center;
    font-size:15px;font-weight:800;line-height:1;color:var(--ink2);
    background:#fff;box-shadow:0 1px 2px rgba(20,40,30,.09);
  }
  .step button:active{transform:scale(.92)}
  .step button:disabled{opacity:.3;box-shadow:none;background:transparent}
  .step-num{
    min-width:36px;text-align:center;font-size:12.5px;font-weight:800;
    letter-spacing:-.03em;color:var(--ink);white-space:nowrap;
  }
  .step-num small{font-size:9px;font-weight:700;color:var(--sub);margin-left:1px}

  /* ── 아직 많이 남았나요? ── */
  .leftover{
    margin:2px 0 13px;border-radius:16px;padding:12px 13px 11px;
    background:linear-gradient(142deg,#FFFAEC,#FFF3D9);
    border:1px solid #F1E0B6;
    box-shadow:0 2px 10px rgba(150,110,20,.08);
  }
  .leftover-head{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;color:#7A5A0C;letter-spacing:-.02em}
  .leftover-sub{font-size:11px;color:#9A7B3C;font-weight:600;margin-top:4px;line-height:1.5}
  .leftover-row{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    margin-top:8px;padding-top:8px;border-top:1px solid rgba(180,140,40,.16);
  }
  .leftover-row:first-of-type{border-top:0;padding-top:7px}
  .leftover-name{flex:1 1 100%;min-width:0;font-size:12px;font-weight:800;color:#5E4A11;display:flex;align-items:center;gap:5px}
  .leftover-name em{font-style:normal;font-size:10.5px;font-weight:700;color:#A98A42}
  .lo-btn{
    flex:1 1 0;font-size:10.5px;font-weight:800;padding:7px 6px;border-radius:9px;
    background:#fff;color:#7A5A0C;border:1px solid #EBD9AC;white-space:nowrap;
  }
  .lo-btn.solid{background:#8A6210;color:#fff;border-color:#8A6210}
  .lo-btn:active{transform:scale(.97)}

  /* ── 직접 입력: 고정 선택 태그 + 추천 칩 ── */
  .selbar{
    position:sticky;top:-10px;z-index:5;
    margin:12px -18px 0;padding:10px 18px 9px;
    background:#fff;border-bottom:1px solid var(--line);
    box-shadow:0 6px 12px -10px rgba(20,40,30,.25);
  }
  .tagrow{
    display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .tagrow::-webkit-scrollbar{display:none}
  .ptag{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;
    font-size:11.5px;font-weight:800;padding:6px 10px;border-radius:99px;
    background:var(--mint-soft);color:var(--mint-deep);border:1px solid #BDE9D7;
    letter-spacing:-.02em;white-space:nowrap;
  }
  .ptag .x{font-size:9.5px;font-weight:800;color:#79BCA1;margin-left:1px}
  .ptag:active{transform:scale(.96)}
  .tag-empty{font-size:11px;font-weight:600;color:var(--sub);padding:6px 2px}
  .recbox{margin-top:9px}
  .rec-label{font-size:10.5px;font-weight:800;color:var(--sub);letter-spacing:.02em;margin-bottom:5px}
  .rec-row{
    display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .rec-row::-webkit-scrollbar{display:none}
  .rec{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;
    font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:99px;
    background:#FFF8E8;color:#8A6210;border:1px solid #F0DFB6;white-space:nowrap;
  }
  .rec:active{transform:scale(.96)}

  .eat-sub{font-size:10.5px;font-weight:700;color:var(--sub);white-space:nowrap}
  .eat-row .step{margin-left:auto}

  /* 먹음 방식 선택 — 조금 먹음(남음) / 다 먹음(소진) */
  .eat-row.eat-bulk{display:block;padding:11px 2px}
  .eat-bulk .eat-top{display:flex;align-items:center;gap:8px}
  .eat-bulk .eat-name{flex:1;min-width:0}
  .eat-bulk .eat-sub{flex:0 1 auto;max-width:56%;overflow:hidden;text-overflow:ellipsis;padding-top:1px}
  .eat-modes{display:flex;gap:5px;margin-top:8px}
  .emode{
    flex:1;padding:8px 4px;border-radius:10px;
    background:#F5F7F4;border:1px solid #E8ECE7;
    font-size:11.5px;font-weight:700;color:#68746D;white-space:nowrap;
    transition:background .15s,color .15s,border-color .15s;
  }
  .emode em{font-style:normal;font-size:10px;font-weight:700;opacity:.66;margin-left:1px}
  .emode.is-on{background:var(--mint-soft);border-color:#8FD9BE;color:var(--mint-deep);font-weight:800}
  .emode.all.is-on{background:#1D2F27;border-color:#1D2F27;color:#fff}
  .emode.all.is-on em{opacity:.68}
  .emode.none{flex:0 0 34px;font-size:12px;font-weight:800;color:#AEB6AF}
  .emode.none.is-on{background:#F1F3F1;border-color:#DDE3DD;color:#7D8984}
  .emode:active{transform:scale(.97)}
  .eat-row .emode.finish-all{flex:0 0 auto;padding:7px 8px;font-size:10px;border-radius:8px;border-color:#E1E7E1;color:#68746D}
  .eat-row .emode.finish-all.is-on{background:#1D2F27;border-color:#1D2F27;color:#fff}
  .eat-row.eat-bulk.is-none{opacity:.5}
  .eat-row.is-done .eat-sub{color:#B4BDB6}

  /* ── 이모지 선택 ── */
  .emopick{display:flex;gap:6px;flex-wrap:wrap}
  .emopick button{
    width:36px;height:35px;border-radius:10px;font-size:17px;
    background:#F5F7F4;border:1px solid #E8ECE7;display:grid;place-items:center;
  }
  .emopick button.is-on{background:var(--mint-soft);border-color:#8FD9BE}
  .emopick button:active{transform:scale(.94)}

  .badge{
    flex:0 0 auto;
    font-size:10px;font-weight:800;letter-spacing:-.01em;
    padding:2.5px 6px;border-radius:6px;white-space:nowrap;
  }
  .badge.urgent{background:var(--red-soft);color:var(--red)}
  .badge.soon{background:var(--amber-soft);color:var(--amber)}
  .badge.normal{background:#EEF2EE;color:#5F6B65}
  .badge.safe{background:var(--mint-soft);color:var(--mint-deep)}
  .badge.pantry{background:#F2F3F0;color:#8A948E}
  .badge.done{background:#EEF2EE;color:#98A29B}

  .switch{
    flex:0 0 auto;width:46px;height:27px;border-radius:99px;
    background:#DDE3DC;position:relative;transition:background .22s ease;
  }
  .switch span{
    position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);
    transition:transform .22s cubic-bezier(.4,0,.2,1);
    display:grid;place-items:center;font-size:11px;color:transparent;
  }
  .switch.on{background:var(--mint)}
  .switch.on span{transform:translateX(19px)}
  .switch.on span::after{content:"✓";color:var(--mint);font-weight:900;font-size:11px}
  .switch:active{transform:scale(.94)}

  .empty{
    text-align:center;padding:42px 16px;color:var(--sub);
  }
  .empty .emo{font-size:30px;display:block;margin-bottom:10px;opacity:.8}
  .empty p{font-size:12.5px;font-weight:600;line-height:1.6}

  .section-note{
    display:block;
    margin:14px 2px 2px;padding:10px 12px;
    background:#EFF4EF;border-radius:12px;
    font-size:11.5px;color:#5A675F;line-height:1.55;font-weight:500;
  }
  .section-note b{font-weight:800;color:#2F4139}

  /* ── 식단 탭 ── */
  .meals-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:2px 2px 12px}
  .meals-head h2{font-size:15px;font-weight:800;letter-spacing:-.03em}
  .meals-head p{font-size:11.5px;color:var(--sub);font-weight:500;margin-top:4px}
  .mini-btn{
    flex:0 0 auto;font-size:11.5px;font-weight:800;
    padding:8px 11px;border-radius:10px;background:#fff;color:var(--ink2);
    box-shadow:var(--shadow);
  }
  .mini-btn:active{transform:scale(.96)}

  .day{
    background:#fff;border-radius:20px;padding:15px 14px 6px;
    margin-bottom:14px;box-shadow:var(--shadow);
  }
  .day-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
  .day-left{display:flex;align-items:center;gap:8px}
  .day-tag{
    font-size:11.5px;font-weight:800;color:#fff;background:#1D2F27;
    padding:4px 8px;border-radius:7px;letter-spacing:-.01em;
  }
  .day-tag.tomorrow{background:#94A39B}
  .day-date{font-size:11.5px;color:var(--sub);font-weight:600}
  .day-count{font-size:11px;font-weight:800;color:var(--mint-deep);background:var(--mint-soft);padding:3px 7px;border-radius:6px}
  .day-count.zero{color:var(--sub);background:#F2F4F1}

  .snacks{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:11px 0 3px}
  .snacks-label{font-size:10.5px;font-weight:800;color:var(--sub);letter-spacing:.03em;margin-right:1px}
  .snack{
    font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:8px;
    background:#F4F6F3;color:#68746D;border:1px solid transparent;
    transition:background .15s,color .15s,border-color .15s;
  }
  .snack.is-on{background:var(--mint-soft);color:var(--mint-deep);border-color:#B8E8D4}
  .snack:active{transform:scale(.96)}

  .meal-card{
    position:relative;
    border-radius:16px;background:#FBFCFA;
    border:1px solid #EAEEE9;
    padding:12px 13px 12px;margin:9px 0;
    transition:background .18s,border-color .18s,opacity .2s;
  }
  .meal-card.is-skip{background:#F8F8F6;border-style:dashed;border-color:#E2E6E1}
  .meal-card.is-eaten{background:#F5FBF7;border-color:#D6EEE2}
  .meal-card.is-mine{background:#F8FCFA;border-color:#D3ECDF}
  .meal-card.has-gone{background:#FDFBF6;border-color:#F0E4CF}

  /* 카드 상단: 끼니 라벨 + 상태 배지 · 우측 교체 버튼 */
  .mc-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .mc-label{flex:1;min-width:0;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .mc-meal{font-size:11px;font-weight:800;color:#3F4C45;letter-spacing:-.015em;white-space:nowrap}
  .mc-dot{font-style:normal;font-size:10px;font-weight:700;color:#C3CAC4;line-height:1}
  .mc-date{font-size:10.5px;font-weight:600;color:#98A29B;white-space:nowrap}
  .mc-badge{
    font-size:9.5px;font-weight:800;letter-spacing:-.01em;
    padding:2.5px 6px;border-radius:5px;
    background:#EDF1EC;color:#6E7A73;white-space:nowrap;
  }
  .mc-badge.mine{background:#DCF3E8;color:#0B7B57}
  .mc-badge.eaten{background:#DFF5EA;color:#0A7A54}
  .mc-badge.skip{background:#EFEFED;color:#8B938D}
  .mc-swap{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:3px;
    font-size:10.5px;font-weight:800;letter-spacing:-.015em;color:#5C6A62;
    padding:5px 9px;border-radius:99px;background:#fff;border:1px solid #E4E9E4;
    white-space:nowrap;transition:background .15s,transform .12s;
  }
  .mc-swap:active{background:#EFF3EE;transform:scale(.97)}

  /* 제목 줄 + 인라인 편집 버튼 */
  .mc-title{display:flex;align-items:flex-start;gap:8px}
  .meal-name{
    flex:1;min-width:0;font-size:15px;font-weight:800;letter-spacing:-.04em;line-height:1.36;color:#1B231F;
  }
  .meal-card.is-skip .meal-name{color:#8B958F;text-decoration:line-through;text-decoration-thickness:1.5px;font-size:13.5px}
  .mc-edit{
    flex:0 0 auto;margin-top:0;
    font-size:10.5px;font-weight:800;letter-spacing:-.015em;line-height:1.35;
    color:#0A7A54;background:#EDF8F2;border:1px solid #D2EBE0;
    padding:3px 8px;border-radius:8px;white-space:nowrap;
    transition:background .15s;
  }
  .mc-edit:active{background:#DCF1E7}

  /* 조리 시간·태그 */
  .mc-meta{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:10.5px;font-weight:600;color:#939D96}
  .mc-meta em{font-style:normal;color:#CDD4CE}

  /* 조리 한 줄 */
  .steps{margin-top:8px;font-size:11.5px;line-height:1.65;color:#5A675F;font-weight:500;letter-spacing:-.005em}
  .steps.warn{
    margin-top:8px;padding:8px 10px;border-radius:9px;
    background:#FFF7EC;color:#8F4E14;font-weight:600;
  }
  .mine-empty{
    margin-top:9px;font-size:11px;font-weight:600;color:var(--sub);
    background:#fff;border:1px dashed #DCE4DD;border-radius:9px;padding:8px 10px;
  }
  .mine-empty b{color:var(--mint-deep)}

  /* 재료 칩 */
  .use-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
  .ichip{
    display:inline-flex;align-items:center;gap:4px;
    min-height:29px;padding:3px 4px 3px 8px;border-radius:8px;
    background:#F1F4F0;border:1px solid #E6ECE5;
    font-size:10.5px;font-weight:700;letter-spacing:-.01em;color:#5E6B64;
    transition:background .15s;
  }
  .ichip .nm{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
  .ichip .x{
    width:19px;height:19px;border-radius:6px;display:grid;place-items:center;
    font-size:8.5px;font-weight:900;color:#9FAAA3;background:#E5EAE4;line-height:1;
  }
  .ichip:active{background:#E9EEE8}
  .ichip:active .x{background:#D8E0D8}
  .ichip.urgent{background:#FDEEEF;border-color:#F8DADC;color:#C0393E}
  .ichip.urgent .x{background:#F7DCDD;color:#C77F81}
  .ichip.soon{background:#FFF6E5;border-color:#F7E4C3;color:#94600A}
  .ichip.soon .x{background:#F8E7C9;color:#B58C4A}
  .ichip.is-depleted{background:#F4F5F2;border-color:#EAEBE7;color:#A9B1AA}
  .ichip.is-depleted .nm{text-decoration:line-through;text-decoration-thickness:1px}
  .ichip.is-depleted .x{background:#EDEEEA;color:#C0C6C1}
  .ichip .gone{
    font-size:8px;font-weight:800;letter-spacing:-.01em;
    padding:1px 3px;border-radius:4px;background:#F1EDE5;color:#A07B3C;
  }
  .ichip .state{
    font-size:8px;font-weight:800;letter-spacing:-.01em;
    padding:1px 3px;border-radius:4px;background:var(--mint-soft);color:#0A7A54;
  }
  .ichip.is-sharing{background:#F0FAF5;border-color:#CFEBDD;color:#0B7A57}
  .ichip.is-finished{background:#F4F5F2;border-color:#E9EBE7;color:#9BA49C}
  .ichip.is-finished .state{background:#EDEFEA;color:#8B948D}
  .ichip.is-finished .x{background:#EDEEEA;color:#C0C6C1}
  .ichip.add{
    padding:3px 9px;background:#fff;border:1px dashed #CBDCCF;
    color:#0A7A54;font-weight:800;
  }
  .ichip.add:active{background:#F0FAF5}

  /* 소진 알림 바 */
  .gone-bar{
    margin-top:9px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;
    padding:7px 9px;border-radius:10px;
    background:#FFF8EC;border:1px solid #F5E3C5;
    font-size:10.5px;font-weight:700;letter-spacing:-.01em;color:#95610A;line-height:1.45;
  }
  .gone-bar strong{font-weight:800}
  .gone-bar button{
    margin-left:auto;flex:0 0 auto;
    font-size:10.5px;font-weight:800;color:#8A5305;
    background:#fff;border:1px solid #EED9B6;border-radius:7px;padding:4px 8px;
    white-space:nowrap;
  }
  .gone-bar button:active{background:#FDF0DC}

  /* 하단 메인 액션: 외식 | 먹었음 한 열 */
  .mc-actions{display:grid;grid-template-columns:1fr 1.35fr;gap:7px;margin-top:11px}
  .act{
    min-width:0;padding:10px 6px;border-radius:11px;
    font-size:12px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;
    background:#fff;border:1px solid #E4E9E4;color:#57645D;
    transition:background .15s,transform .12s;
  }
  .act:active{transform:scale(.975)}
  .act.out{background:#fff;color:#5A675F}
  .act.out:active{background:#F2F5F1}
  .act.solid{
    background:#1D2F27;border-color:#1D2F27;color:#fff;
    box-shadow:0 4px 12px rgba(21,38,30,.16);
  }
  .act.solid:active{background:#2A4438}
  .act.undo{grid-column:1 / -1;background:#fff;color:var(--ink2);font-weight:700}

  .skip-note{
    margin-top:10px;display:flex;align-items:center;gap:7px;
    font-size:11.5px;font-weight:700;color:#7A857E;
  }

  /* ── FAB ── */
  .fab{
    position:fixed;z-index:40;
    bottom:calc(20px + env(safe-area-inset-bottom));
    right:max(18px,calc(50% - 215px + 18px));
    display:inline-flex;align-items:center;gap:6px;
    padding:13px 18px;border-radius:99px;
    background:#1D2F27;color:#fff;
    font-size:13px;font-weight:800;letter-spacing:-.02em;
    box-shadow:0 10px 24px rgba(21,38,30,.3);
    transition:transform .12s;
  }
  .fab:active{transform:scale(.96)}

  /* ── 시트 ── */
  .scrim{
    position:fixed;inset:0;background:rgba(18,28,23,.42);
    opacity:0;pointer-events:none;transition:opacity .24s ease;z-index:50;
    backdrop-filter:blur(1px);
  }
  .scrim.is-open{opacity:1;pointer-events:auto}

  .sheet{
    position:fixed;z-index:60;
    left:50%;bottom:0;width:100%;max-width:430px;
    transform:translate(-50%,104%);
    transition:transform .3s cubic-bezier(.32,.72,.3,1);
    background:#fff;
    border-radius:24px 24px 0 0;
    padding:10px 18px calc(22px + env(safe-area-inset-bottom));
    max-height:88vh;overflow-y:auto;
    box-shadow:0 -10px 40px rgba(18,35,26,.18);
  }
  .sheet.is-open{transform:translate(-50%,0)}
  .sheet-grip{
    width:38px;height:4px;border-radius:99px;background:#E1E6E0;
    margin:2px auto 14px;
  }
  .sheet h2{font-size:17px;font-weight:800;letter-spacing:-.035em}
  .sheet-sub{font-size:12px;color:var(--sub);font-weight:500;margin-top:5px;line-height:1.5}

  .field{margin-top:14px;flex:1;min-width:0}
  .field label{display:block;font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.02em;margin-bottom:6px}
  .field input{
    width:100%;padding:12px 13px;border-radius:12px;
    background:#F5F7F4;border:1px solid #E8ECE7;
    font-size:14px;font-weight:600;outline:none;
    transition:border-color .15s,background .15s;
  }
  .field input:focus{border-color:var(--mint);background:#fff}
  .field input::placeholder{color:#B4BDB6;font-weight:500}
  .field-row{display:flex;gap:10px}
  .field textarea{
    width:100%;padding:12px 13px;border-radius:12px;
    background:#F5F7F4;border:1px solid #E8ECE7;
    font:inherit;font-size:13px;font-weight:600;line-height:1.55;
    outline:none;resize:vertical;min-height:66px;
    transition:border-color .15s,background .15s;
  }
  .field textarea:focus{border-color:var(--mint);background:#fff}
  .field textarea::placeholder{color:#B4BDB6;font-weight:500}
  .field .hint-inline{font-size:10.5px;font-weight:600;color:var(--sub);margin-left:5px;letter-spacing:0}
  .field .hint-inline b{color:var(--mint-deep);font-weight:800}

  .seg{display:flex;gap:6px}
  .seg button{
    flex:1;padding:10px 4px;border-radius:11px;
    background:#F5F7F4;border:1px solid #E8ECE7;
    font-size:11.5px;font-weight:700;color:#68746D;
    white-space:nowrap;
  }
  .seg button.is-on{background:#1D2F27;border-color:#1D2F27;color:#fff}
  .seg button:active{transform:scale(.97)}

  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .quick-label{width:100%;font-size:10.5px;font-weight:700;color:var(--sub);margin-bottom:1px}
  .quick button{
    font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:8px;
    background:#F2F6F2;color:#5C6A62;border:1px solid #E6ECE6;
  }
  .quick button:active{background:#E6F6EF;color:var(--mint-deep)}

  .sheet-actions{display:flex;gap:8px;margin-top:20px}
  .btn{
    flex:1;padding:13px 10px;border-radius:13px;
    font-size:14px;font-weight:800;letter-spacing:-.02em;
  }
  .btn.primary{flex:1.6;background:#1D2F27;color:#fff}
  .btn.primary:active{background:#2A4438}
  .btn.ghost{background:#F2F5F1;color:#5C6A62}
  .btn.ghost:active{background:#E9EEE8}
  .danger-link{
    width:100%;margin-top:12px;padding:10px;border-radius:10px;
    font-size:12px;font-weight:700;color:#C3363B;background:var(--red-soft);
  }
  .danger-link.is-hidden{display:none}

  .eat-list{margin-top:6px}
  .cust-list{
    margin-top:9px;max-height:33vh;overflow-y:auto;
    border-radius:12px;background:#FBFCFA;border:1px solid #F0F3EF;padding:0 10px 4px;
  }
  .cust-group{
    display:flex;align-items:center;gap:5px;
    padding:9px 2px 3px;font-size:10.5px;font-weight:800;color:var(--sub);letter-spacing:.02em;
    position:sticky;top:0;background:#FBFCFA;z-index:1;
  }
  .cust-empty{padding:18px 2px;text-align:center;font-size:11.5px;font-weight:600;color:var(--sub)}
  .eat-row{
    display:flex;align-items:center;gap:10px;
    padding:12px 2px;border-bottom:1px solid #F0F3EF;
  }
  .eat-row:last-child{border-bottom:0}
  .eat-row input{
    appearance:none;-webkit-appearance:none;
    width:22px;height:22px;border-radius:7px;flex:0 0 auto;
    border:1.5px solid #D5DDD6;background:#fff;position:relative;
    transition:background .15s,border-color .15s;
  }
  .eat-row input:checked{background:var(--mint);border-color:var(--mint)}
  .eat-row input:checked::after{
    content:"✓";position:absolute;inset:0;display:grid;place-items:center;
    color:#fff;font-size:13px;font-weight:900;
  }
  .eat-row.is-done{opacity:.45}
  .eat-name{flex:1;font-size:13.5px;font-weight:700;letter-spacing:-.02em}
  .eat-row.is-done .eat-name{text-decoration:line-through}
  .eat-check{font-size:11px;font-weight:800;color:var(--mint-deep)}

  .menu-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .menu-list button{
    text-align:left;padding:14px;border-radius:13px;background:#F5F7F4;
    font-size:13.5px;font-weight:800;letter-spacing:-.02em;
    display:flex;flex-direction:column;gap:4px;
  }
  .menu-list button em{font-style:normal;font-size:11.5px;font-weight:500;color:var(--sub)}
  .menu-list button.danger{color:#C3363B}
  .menu-list button.danger em{color:#B47576}

  /* ── 토스트 ── */
  .toast{
    position:fixed;z-index:70;
    left:50%;bottom:calc(90px + env(safe-area-inset-bottom));
    transform:translate(-50%,14px);
    background:rgba(23,36,29,.94);color:#fff;
    font-size:12.5px;font-weight:700;letter-spacing:-.01em;
    padding:11px 16px;border-radius:12px;
    opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
    max-width:calc(100% - 48px);text-align:center;
    box-shadow:0 8px 22px rgba(18,35,26,.24);
  }
  .toast.is-open{opacity:1;transform:translate(-50%,0)}

  /* ── 소진 확인 모달 ── */
  .modal{
    position:fixed;inset:0;z-index:85;
    display:flex;align-items:center;justify-content:center;
    padding:0 26px;
    background:rgba(17,27,22,.46);
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .modal.is-open{opacity:1;pointer-events:auto}
  .modal-card{
    position:relative;width:100%;max-width:330px;
    background:#fff;border-radius:22px;padding:22px 20px 18px;
    box-shadow:0 24px 60px rgba(15,30,23,.3);
    transform:translateY(12px) scale(.97);
    transition:transform .24s cubic-bezier(.32,.72,.3,1);
  }
  .modal.is-open .modal-card{transform:none}
  .modal-emo{font-size:30px;line-height:1;text-align:center;margin-bottom:9px}
  .modal-card h2{font-size:15.5px;font-weight:800;letter-spacing:-.035em;text-align:center;line-height:1.4}
  .modal-sub{margin-top:7px;font-size:11.5px;line-height:1.6;color:#7D8984;font-weight:500;text-align:center}
  .modal-actions{margin-top:16px;display:flex;flex-direction:column;gap:7px}
  .modal-actions .btn{padding:13px 10px;border-radius:13px;font-size:13.5px;font-weight:800}
  .modal-actions .btn.hint{font-size:12px;font-weight:700;padding:11px 10px}
  .modal-close{
    position:absolute;top:9px;right:9px;width:28px;height:28px;border-radius:9px;
    background:#F3F5F2;color:#98A29B;font-size:11px;font-weight:800;display:grid;place-items:center;
  }

  /* ── 끼니 재료 추가 시트 ── */
  .pick-head{
    display:flex;align-items:center;gap:7px;
    margin-top:12px;padding:8px 10px;border-radius:10px;
    background:#F4F8F4;font-size:10.5px;font-weight:700;color:#6C7972;
  }
  .pick-head b{color:#0A7A54;font-weight:800}

  .flash{animation:flash 1.1s ease}
  @keyframes flash{
    0%{box-shadow:0 0 0 0 rgba(14,159,110,.4)}
    40%{box-shadow:0 0 0 4px rgba(14,159,110,.22)}
    100%{box-shadow:var(--shadow)}
  }

  @media (min-width:431px){
    body{background:#E9EDE7}
    .app{box-shadow:0 0 46px rgba(20,40,30,.1);min-height:100vh}
  }

  @media (max-width:359px){
    .mc-edit,.mc-swap{font-size:10px;padding:4px 7px}
    .act{font-size:11.5px;padding:9px 4px}
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🧊</span>
      <div class="brand-text">
        <h1>냉장고 구조대</h1>
        <p>한 달 소진 프로젝트</p>
      </div>
    </div>
    <button class="ghost-btn" id="menuBtn" aria-label="더보기">⋯</button>
  </header>

  <section class="dash" id="dash"></section>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-tab="pantry" role="tab">🧺 소진 체크</button>
    <button class="tab" data-tab="meals" role="tab">🍽️ 오늘·내일</button>
  </nav>

  <main class="main">
    <section class="view" id="view-pantry">
      <div id="leftoverCard"></div>
      <div class="filters" id="filters"></div>
      <div id="pantryList"></div>
    </section>
    <section class="view is-hidden" id="view-meals">
      <div id="leftoverCardMeals"></div>
      <div id="mealsWrap"></div>
    </section>
  </main>

  <button class="fab" id="fabAdd">＋ 재료 추가</button>
</div>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="ingSheet" role="dialog" aria-modal="true">
  <div class="sheet-grip"></div>
  <h2 id="ingSheetTitle">재료 추가</h2>
  <p class="sheet-sub" id="ingSheetSub">장 본 재료를 바로 넣고 급한 정도를 정해두세요.</p>

  <div class="field">
    <label for="fName">이름</label>
    <input id="fName" type="text" placeholder="예: 대파" maxlength="24" autocomplete="off">
  </div>

  <div class="field">
    <label>보관 위치</label>
    <div class="seg" id="segLoc">
      <button type="button" data-val="fridge">🧊 냉장고</button>
      <button type="button" data-val="freezer">❄️ 냉동고</button>
      <button type="button" data-val="pantry">🧺 기본·상온</button>
    </div>
  </div>

  <div class="field">
    <label>급한 정도</label>
    <div class="seg" id="segUrg">
      <button type="button" data-val="urgent">🚨 급해요</button>
      <button type="button" data-val="soon">⏳ 곧 소진</button>
      <button type="button" data-val="normal">보통</button>
      <button type="button" data-val="safe">여유</button>
    </div>
  </div>

  <div class="field-row">
    <div class="field">
      <label for="fQty">수량</label>
      <input id="fQty" type="text" placeholder="예: 1단" maxlength="20" autocomplete="off">
    </div>
    <div class="field">
      <label for="fNote">메모</label>
      <input id="fNote" type="text" placeholder="예: 11/25까지" maxlength="30" autocomplete="off">
    </div>
  </div>

  <div class="field">
    <label>이모지 <span class="hint-inline">누르면 바뀌어요</span></label>
    <div class="emopick" id="fEmo"></div>
  </div>

  <div class="quick" id="quickAdd"></div>

  <div class="sheet-actions">
    <button class="btn ghost" id="ingCancel">취소</button>
    <button class="btn primary" id="ingSave">저장</button>
  </div>
  <button class="danger-link is-hidden" id="ingDelete">이 재료 삭제</button>
</div>

<div class="sheet" id="eatSheet" role="dialog" aria-modal="true">
  <div class="sheet-grip"></div>
  <h2>먹었어요</h2>
  <p class="sheet-sub" id="eatSub"></p>
  <div class="eat-list" id="eatList"></div>
  <div class="sheet-actions">
    <button class="btn ghost" id="eatCancel">취소</button>
    <button class="btn primary" id="eatConfirm">먹음 기록하기</button>
  </div>
</div>

<div class="sheet" id="customSheet" role="dialog" aria-modal="true">
  <div class="sheet-grip"></div>
  <h2>메뉴 직접 등록</h2>
  <p class="sheet-sub" id="customSub"></p>

  <div class="field">
    <label for="cName">메뉴 이름</label>
    <input id="cName" type="text" placeholder="예: 에그 스크램블 파스타" maxlength="30" autocomplete="off">
  </div>

  <div class="selbar" id="cSelBar">
    <div class="tagrow" id="cTags"></div>
    <div class="recbox" id="cRecs"></div>
  </div>

  <div class="field">
    <label for="cSearch">사용할 내 재료 <span class="hint-inline" id="cCount">선택 안 함</span></label>
    <input id="cSearch" type="text" placeholder="재료 검색 (예: 계란)" maxlength="16" autocomplete="off">
    <div class="cust-list" id="cList"></div>
  </div>

  <div class="field">
